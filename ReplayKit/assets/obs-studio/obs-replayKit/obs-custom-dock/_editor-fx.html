<script>
(function () {
  "use strict";
  // everything this puts on the window or the document goes when the clips page unloads the editor

  // the colour settings of the color tab, at rest, and how far each goes
  function defaultColor() { return { r: 1, g: 1, b: 1, a: 1, sat: 1, hue: 0, vib: 0, bright: 1, contrast: 1, gamma: 1 }; }
  var COLOR_RANGES = { r: [0, 2], g: [0, 2], b: [0, 2], a: [0, 1], sat: [0, 2], hue: [-180, 180], vib: [-2, 2], bright: [0, 2], contrast: [0, 3], gamma: [0.2, 3] };

  var SEPIA = [0.393, 0.769, 0.189, 0.349, 0.686, 0.168, 0.272, 0.534, 0.131];

  // 3x3 matrices, rows first
  function mul(a, b) {
    var o = [];
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) o.push(a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]);
    return o;
  }
  function identity() { return [1, 0, 0, 0, 1, 0, 0, 0, 1]; }
  function lerpM(a, b, t) { return a.map(function (v, i) { return v + (b[i] - v) * t; }); }
  // a turn of the hue about the grey axis, the matrix of the hue-rotate of css
  function hueM(deg) {
    var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);

    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) o.push(LUMA[j] * (1 - s) + (i === j ? s : 0));

  function look(m, off, gamma, contrast, mo) { return { m: m, off: off || [0, 0, 0], gamma: gamma || 1, contrast: contrast || 1, mo: mo || [0, 0, 0] }; }
  var LOOKS = [
    ["vivid", "Vivid", look(satM(1.45), [0, 0, 0], 1, 1.12)],
    ["warm", "Warm", look(gainM(1.12, 1.02, 0.86), [0.02, 0.01, 0], 1, 1.04)],
    ["cool", "Cool", look(gainM(0.88, 1.0, 1.14), [0, 0.01, 0.03], 1, 1.04)],
    ["cinematic", "Cinematic", look(mul([1.05, 0, 0, 0, 1.0, 0.02, 0, 0.04, 1.08], satM(0.82)), [0.01, 0.01, 0.03], 0.95, 1.18)],
    ["tealorange", "Teal & Orange", look([1.15, 0.05, -0.1, -0.05, 1.05, 0.02, -0.1, 0.05, 1.12], [0, 0, 0.02], 1, 1.12)],
    ["vintage", "Vintage", look(mul(gainM(1.06, 0.98, 0.82), satM(0.7)), [0.06, 0.04, 0.02], 1.08, 0.86)],
    ["sepia", "Sepia", look(SEPIA, [0, 0, 0], 1, 1)],
    ["bw", "Black & White", look(satM(0), [0, 0, 0], 1, 1.05)],
    ["noir", "Noir", look(satM(0), [-0.03, -0.03, -0.03], 0.9, 1.45)],
    ["faded", "Faded", look(satM(0.75), [0.09, 0.09, 0.1], 1.05, 0.8)],
    ["cross", "Cross Process", look([1.1, 0, -0.05, -0.02, 1.08, 0, 0.05, -0.05, 0.8], [0, 0.02, 0.06], 1.05, 1.15)],
    ["sunset", "Sunset", look(gainM(1.2, 0.95, 0.8), [0.04, 0.0, 0.02], 1.02, 1.08)],
    ["golden", "Golden Hour", look(mul(gainM(1.15, 1.05, 0.78), satM(1.1)), [0.04, 0.02, 0], 1.05, 1.05)],
    ["arctic", "Arctic", look(mul(gainM(0.9, 1.02, 1.18), satM(0.7)), [0.02, 0.04, 0.07], 1.08, 0.95)],
    ["neon", "Neon", look(mul([1.05, -0.05, 0.1, -0.05, 1.0, 0.1, 0.1, -0.05, 1.15], satM(1.6)), [0, 0, 0.02], 0.95, 1.2)],
    ["pastel", "Pastel", look(satM(0.6), [0.08, 0.07, 0.09], 1.15, 0.85)],
    ["moody", "Moody", look(mul(gainM(0.95, 0.98, 1.05), satM(0.65)), [-0.02, -0.01, 0.01], 0.85, 1.25)],
    ["matrix", "Retro Green", look([0.8, 0.1, 0, 0.15, 1.1, 0.05, 0, 0.1, 0.75], [0, 0.02, 0], 1, 1.1)],
    ["rose", "Rose", look(mul(gainM(1.1, 0.94, 1.02), satM(0.9)), [0.04, 0.01, 0.03], 1.04, 0.95)],
    ["punch", "Punch", look(satM(1.25), [-0.02, -0.02, -0.02], 0.95, 1.3)],
    ["dramatic", "Dramatic", look(satM(0.85), [-0.02, -0.02, -0.02], 0.92, 1.35)],
    ["bright", "Bright", look(identity(), [0.05, 0.05, 0.05], 1.15, 1)],
    ["bluehour", "Blue Hour", look(mul(gainM(0.86, 0.95, 1.18), satM(0.9)), [0, 0.01, 0.05], 1.02, 1.06)],
    ["lush", "Lush Green", look(mul([1, 0, 0, -0.06, 1.16, -0.06, 0, 0, 1], satM(1.2)), [0, 0.01, 0], 1.02, 1.06)],
    ["natural", "Natural", look(mul(gainM(1.03, 1, 0.97), satM(1.08)), [0, 0, 0], 1, 1.06)],
    ["orange", "Orange", look(gainM(1.18, 1, 0.75), [0.03, 0.01, 0], 1, 1.05)],
    ["magic", "Magic", look(mul(gainM(1.08, 0.9, 1.15), satM(1.15)), [0.02, 0, 0.04], 1, 1.08)],
    ["shadow", "Shadow", look(satM(0.35), [-0.03, -0.03, -0.03], 0.82, 1.2)],

    ["polaroid", "Polaroid", look([1.438, -0.062, -0.062, -0.122, 1.378, -0.122, -0.016, -0.016, 1.483])],
    ["kodachrome", "Kodachrome", look([1.1285582, -0.3967382, -0.0399256, -0.1640434, 1.0835252, -0.0549881, -0.1678601, -0.5603416, 1.6014851], null, 1, 1, [0.24992, 0.09699, 0.139725])],
    ["technicolor", "Technicolor", look([1.9125278, -0.8545345, -0.0915551, -0.3087833, 1.7658909, -0.1060174, -0.2311034, -0.7501899, 1.8475978], null, 1, 1, [0.046249, -0.27589, 0.121376])],
    ["brownie", "Brownie", look([0.5997023, 0.3455324, -0.2708299, -0.0377032, 0.8609578, 0.1505955, 0.2411364, -0.0744104, 0.4497218], null, 1, 1, [0.186008, -0.144974, -0.029655])],
  ];

  // the effects: each sets some of the steps from its strength (0 to 1), and effects that share a step take the stronger value. lengths are pixels of a 1080p picture
  var EFFECTS = [
    ["pixelate", "Pixelate", true, function (s, a) { s.pixel = Math.max(s.pixel, Math.round(4 + 60 * a)); }],
    ["blur", "Blur", true, function (s, a) { s.blur = Math.max(s.blur, 1 + 19 * a); }],
    ["sharpen", "Sharpen", true, function (s, a) { s.sharp = Math.max(s.sharp, 0.2 + 2.3 * a); }],
    ["vignette", "Vignette", true, function (s, a) { s.vignette = Math.max(s.vignette, 0.3 + 1.2 * a); }],
    ["grain", "Grain", true, function (s, a) { s.noise = Math.max(s.noise, Math.round(10 + 50 * a)); }],
    ["rgbsplit", "RGB Split", true, function (s, a) { s.shift = Math.max(s.shift, Math.round(2 + 18 * a)); }],
    ["invert", "Invert", false, function (s) { s.invert = 1; }],
    ["posterize", "Posterize", true, function (s, a) { var l = Math.round(16 - 13 * a); s.poster = s.poster ? Math.min(s.poster, l) : l; }],
    ["thermal", "Thermal", false, function (s) { s.thermal = 1; }],
    ["scanlines", "Scanlines", true, function (s, a) { s.scanP = 4; s.scanA = Math.max(s.scanA, 0.15 + 0.5 * a); }],
    ["vhs", "VHS", true, function (s, a) { s.shift = Math.max(s.shift, Math.round(2 + 4 * a)); s.blur = Math.max(s.blur, 1); s.noise = Math.max(s.noise, Math.round(8 + 16 * a)); s.scanP = s.scanP || 3; s.scanA = Math.max(s.scanA, 0.1 + 0.3 * a); }],
    ["oldfilm", "Old Film", true, function (s, a) { s.sepia = Math.max(s.sepia, 0.6 + 0.4 * a); s.noise = Math.max(s.noise, Math.round(10 + 20 * a)); s.vignette = Math.max(s.vignette, 0.6 + 0.5 * a); }],
    ["emboss", "Emboss", false, function (s) { s.emboss = 1; }],
    ["sketch", "Sketch", false, function (s) { s.sketch = 1; }],
    ["zoom", "Zoom", true, function (s, a) { s.zoom = Math.max(s.zoom, 1 + a); }],
    ["fisheye", "Fisheye", true, function (s, a) { s.lens = Math.max(s.lens, 0.1 + 0.5 * a); }],
    ["mirror", "Mirror", false, function (s) { s.flip = 1; }],
    // the bloom filter of pixi.js: a blurred copy laid over the picture as a screen
    ["glow", "Glow", true, function (s, a) { s.glow = Math.max(s.glow, 0.3 + 0.6 * a); s.glowS = Math.max(s.glowS, 6 + 10 * a); }],
    // the advanced bloom of pixi.js: the part of each colour over a threshold, blurred and added to the picture

    ["motionblur", "Motion Blur", true, function (s, a) { s.motion = Math.max(s.motion, 3 + 22 * a); }],

    ["edges", "Neon Edges", false, function (s) { s.edges = 1; }],
    // the top half again, upside down, in the bottom half
    ["reflection", "Reflection", false, function (s) { s.reflect = 1; }],
    // the fisheye turned the other way; a fisheye that is also on wins

    // the tiles of a pane in two grids, the favorites first, each in the order the list defines; a search hides tiles and a heading with nothing left under it
    function tileGroups(box, kind, list) {
      var favHead = groupHead("toggle/star", "Favorites");
      var favGrid = el("div", "ed-fx-grid");

      function visible(grid) { return Array.prototype.some.call(grid.children, function (t) { return !t.hidden; }); }

      }
      function layout() {
        list.forEach(function (t) {
          var fav = !!t.favId && favorites[kind].indexOf(t.favId) >= 0;

    function starred(kind, id, layout) {

      layout();

    // a search over the tiles of a pane by their names, and a line in place of the grids when nothing matches
    function searchBox(tiles, kind, after) {

    // a filter is picked by its tile and let go of by the same tile; the edit button picks it as well and opens its intensity
    function buildFilters(box) {
      var list = [];
      var layout = null;
      var none = tile("None", function () { var next = fx(); next.look = null; write(next, true); });
      els.lookTiles[""] = none;
      list.push(none);
      LOOKS.forEach(function (l) {
        var t = tile(l[1], function () {
          var next = fx();
          next.look = next.look && next.look.id === l[0] ? null : { id: l[0], amount: 100 };
          write(next, true);
        }, function () { openEdit("filter", l[0]); }, function () { starred("filters", l[0], layout); });

    function buildEffects(box) {

    // the page of one filter or effect: its name over its setting in a box, and a reset to how it starts

    // writes the amount of what is being edited into a state, false when it is not on in that state
    function setAmount(state, v) {

        state.look.amount = v;
        return true;

      var hit = state.effects.find(function (x) { return x.id === ed.id; });
      if (!hit) return false;
      hit.amount = v;
      return true;
    }

    function amountOf(state) {
      var ed = els.editing;

      var hit = state.effects.find(function (x) { return x.id === ed.id; });

    // the edit button turns the filter or effect on when it was off, then opens its page
    function openEdit(kind, id) {

        next.effects.push({ id: id, amount: EFFECT_START });

    }

    function closeEdit() {

    function slideIn(node) {

    function build() {

      els.resetTab.addEventListener("click", function () {

      window.addEventListener("keydown", function (e) {

    function setPane(name) {
      if (name !== pane) els.editing = null;
      pane = name;
      paint();
      lanes.refreshProps();
    }

    function setSubPane(name) {
      if (name === subPane) return;
      subPane = name;
      paint();
      if (o.onSubtitlePane) o.onSubtitlePane();
    }

    function paint() {
      // a panel closed with its x leaves its tabs in the bar with none of them lit
      var closed = lanes.panelClosed();
      Object.keys(els.tabs).forEach(function (k) { els.tabs[k].classList.toggle("is-active", !closed && k === pane); els.tabs[k].hidden = !shown; });
      Object.keys(els.kindTabs).forEach(function (k) { els.kindTabs[k].hidden = k !== kind; els.kindTabs[k].classList.toggle("is-active", !closed && (k !== "subtitle" || subPane === "edit")); });
      els.subPresetsTab.hidden = kind !== "subtitle";
      els.resetTab.hidden = ["video", "audio", "subtitle"].indexOf(kind) < 0;
      els.resetTab.dataset.tooltip = { video: "Reset the video to default", audio: "Reset this audio to default", subtitle: "Reset these subtitles to default" }[kind] || "";
      els.subPresetsTab.classList.toggle("is-active", !closed && subPane === "presets");
      var toCheck = kind === "subtitle" ? unsureCues() : [];
      els.checkTab.hidden = !toCheck.length;
      // once nothing is left to check its card gives way to the subtitle
      if (subPane === "check" && !toCheck.length) { subPane = "edit"; if (o.onSubtitlePane) o.onSubtitlePane(); }
      els.checkTab.classList.toggle("is-active", !closed && subPane === "check");
      // the bar stays while nothing is selected, empty, so the editor keeps its shape
      o.rail.hidden = false;
      var subPresets = kind === "subtitle" && subPane === "presets" && !closed;
      var subCheck = kind === "subtitle" && subPane === "check" && !closed;
      var open = (shown && pane !== "general" && !closed) || subPresets || subCheck;
      var wasOpen = !els.card.hidden;
      els.card.hidden = !open;
      if (!open) { els.editing = null; els.lastPane = ""; return; }
      if (subCheck) {
        els.editing = null;
        els.back.hidden = true;
        els.title.textContent = "Might be misheard";
        els.support.textContent = "";
        Object.keys(els.panes).forEach(function (k) { els.panes[k].hidden = k !== "check"; });
        els.editView.hidden = true;
        if (wasOpen && els.lastPane && els.lastPane !== "subtitle-check") slideIn(els.panes.check);
        els.lastPane = "subtitle-check";
        paintCheck(toCheck);
        return;
      }
      if (subPresets) {
        els.editing = null;
        els.back.hidden = true;
        els.title.textContent = "Subtitle presets";
        els.support.textContent = "";
        Object.keys(els.panes).forEach(function (k) { els.panes[k].hidden = k !== "presets"; });
        els.editView.hidden = true;
        if (wasOpen && els.lastPane && els.lastPane !== "subtitle-presets") slideIn(els.panes.presets);
        els.lastPane = "subtitle-presets";
        paintPresets("subtitle");
        return;
      }
      var state = fx();
      // the page of a filter or effect closes once it is turned off, by undo or anything else
      var ed = els.editing;
      if (ed && (ed.kind !== { filters: "filter", effects: "effect" }[pane] || amountOf(state) == null)) ed = els.editing = null;
      var view = ed ? "edit:" + ed.kind + ":" + ed.id : pane;
      var def = ed ? (ed.kind === "filter" ? lookById(ed.id) : effectById(ed.id)) : null;
      els.back.hidden = !ed;
      els.title.textContent = ed ? def[1] : { color: "Color", filters: "Filters", effects: "Effects", presets: "Video presets" }[pane];
      Object.keys(els.panes).forEach(function (k) { els.panes[k].hidden = !!ed || k !== pane; });
      els.editView.hidden = !ed;
      // the card comes in by itself when it was not showing; a switch inside it, to another tab or a page and back, brings the new view in the same way
      var shownNode = ed ? els.editView : els.panes[pane];
      Object.keys(els.panes).concat("edit").forEach(function (k) {
        var node = k === "edit" ? els.editView : els.panes[k];
        if (node !== shownNode || !wasOpen) node.classList.remove("is-in");
      });
      if (wasOpen && els.lastPane && els.lastPane !== view) slideIn(shownNode);
      els.lastPane = view;
      els.support.textContent = !isIdentity(resolve(lanes.fx.main())) && !preview.supported() ? "This computer cannot show the look on the preview. The saved copy still gets it." : "";
      if (ed) {
        els.editName.textContent = def[1];
        els.editLabel.textContent = ed.kind === "filter" ? "Intensity" : "Strength";
        els.editField.show(amountOf(state));
        return;
      }
      if (pane === "presets") { paintPresets("video"); return; }
      Object.keys(els.color).forEach(function (k) { els.color[k].show(state.color[k]); });
      var lookId = state.look ? state.look.id : "";
      Object.keys(els.lookTiles).forEach(function (k) { els.lookTiles[k].classList.toggle("is-active", k === lookId); });
      Object.keys(els.effectTiles).forEach(function (k) { els.effectTiles[k].classList.toggle("is-active", state.effects.some(function (e) { return e.id === k; })); });
      queueThumbs();
    }

    // presets. a preset of the video is its whole look; a preset of subtitles is the style of a row without where it was dragged to, since that belongs to the clip. the helper keeps the lists, the page sends a whole list back after every change
    function canon(v) {
      if (Array.isArray(v)) return "[" + v.map(canon).join(",") + "]";
      if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ":" + canon(v[k]); }).join(",") + "}";
      return JSON.stringify(v);
    }
    function subRow() {
      var subs = lanes.subtitles;
      var id = subs.selected();
      var rowId = id ? subs.rowOf(id) : "";
      return subs.rows().find(function (r) { return r.id === rowId; }) || null;
    }
    function withoutPlace(style) {
      var s = JSON.parse(JSON.stringify(style || {}));
      delete s.x;
      delete s.y;
      return s;
    }
    // what a preset of the kind would hold right now, or null when there is nothing to take it from
    function current(k) {
      if (k === "video") return fx();
      var row = subRow();
      return row ? withoutPlace(row.style) : null;
    }
    function matches(k, p) {
      var now = current(k);
      if (!now) return false;
      return k === "video" ? canon(cleanFx(p.data)) === canon(now) : canon(withoutPlace(Object.assign(lanes.subtitles.defaultStyle(), p.data))) === canon(now);
    }
    function findPreset(k, id) { return presets[k].find(function (p) { return p.id === id; }) || null; }

    function loadPresets() {
      if (!o.helper) return;
      fetch(o.helper + "/editor-presets", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.message) || "The presets could not be read");
        presets.subtitle = Array.isArray(j.subtitle) ? j.subtitle : [];
        presets.video = Array.isArray(j.video) ? j.video : [];
        presetsKey = "";
        paint();
      }).catch(function (err) { if (o.notify) o.notify(err.message || "The presets could not be read", "bad", "Presets"); });
    }

    // the list shows the change at once; one the helper refuses is taken back
    function storePresets(k, list) {
      var before = presets[k];
      presets[k] = list;
      presetsKey = "";
      paint();
      presetsSaving = presetsSaving.then(function () {
        return fetch(o.helper + "/editor-presets/save?kind=" + k, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ presets: list }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j || !j.ok) throw new Error((j && j.message) || "The presets could not be saved"); });
      }).catch(function (err) {
        if (presets[k] === list) { presets[k] = before; presetsKey = ""; paint(); }
        if (o.notify) o.notify(err.message || "The presets could not be saved", "bad", "Presets");
      });
    }

    function applyPreset(k, p) {
      chosen[k] = p.id;
      if (k === "video") {
        lanes.fx.set(cleanFx(p.data), true);
      } else {
        var subs = lanes.subtitles;
        var rows = [];
        subs.picked().forEach(function (id) { var r = subs.rowOf(id); if (r && rows.indexOf(r) < 0) rows.push(r); });
        var patch = withoutPlace(p.data);
        rows.forEach(function (r, i) { subs.setRowStyle(r, patch, i === rows.length - 1); });
      }
      presetsKey = "";
      paint();
    }

    // a click picks a preset without using it, so the look on screen can still be written over it with overwrite; apply or a double click uses it
    function selectPreset(k, id) {
      if (chosen[k] === id) return;
      chosen[k] = id;
      presetsKey = "";
      paint();
    }

    // save as new takes the name typed beside it, or the next free preset number when the field is empty, the way settings names an unnamed theme
    function saveNewPreset(k) {
      var data = current(k);
      if (!data) return;
      var name = els.presetName.value.replace(/[\u0000-\u001f]/g, "").trim().slice(0, 40);
      if (!name) {
        var names = presets[k].map(function (p) { return p.name; });
        var n = presets[k].length + 1;
        while (names.indexOf("Preset " + n) >= 0) n++;
        name = "Preset " + n;
      }
      var p = { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name: name, data: data };
      chosen[k] = p.id;
      els.presetName.value = "";
      storePresets(k, presets[k].concat([p]));
    }

    function overwritePreset(k) {
      var target = findPreset(k, chosen[k]);
      var data = current(k);
      if (!target || !data) return;
      storePresets(k, presets[k].map(function (p) { return p.id === target.id ? { id: p.id, name: p.name, data: data } : p; }));
    }

    function renamePreset(k, id, typed) {
      var target = findPreset(k, id);
      var name = String(typed || "").replace(/[\u0000-\u001f]/g, "").trim().slice(0, 40);
      if (!target || !name || name === target.name) return false;
      storePresets(k, presets[k].map(function (p) { return p.id === target.id ? { id: p.id, name: name, data: p.data } : p; }));
      return true;
    }

    // the name of a row turns into a field in place, the way a clip card, a screenshot and the title of the editor are renamed: the buttons beside it glide aside and the field fades in. enter or leaving it keeps the name, escape puts the old one back
    function startRename(k, p, row) {
      var name = row.querySelector(".ed-preset-name");
      if (!name || row.querySelector(".name-edit-input")) return;
      renaming = { kind: k, id: p.id };
      var flipTargets = [row.querySelector(".ed-preset-use"), row.querySelector(".edit-btn"), row.querySelector(".delete-btn")];
      var input = el("input", "name-edit-input");
      input.type = "text";
      input.maxLength = 40;
      input.spellcheck = false;
      input.value = p.name;
      input.setAttribute("aria-label", "Preset name");
      var swap = function (from, to) { if (typeof rkFlip === "function") rkFlip(flipTargets, function () { from.replaceWith(to); }); else from.replaceWith(to); };
      swap(name, input);
      try { input.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "ease-out" }); } catch (_) {}
      input.focus();
      input.select();
      var settled = false;
      var finish = function (keep) {
        if (settled) return;
        settled = true;
        renaming = null;
        if (keep && renamePreset(k, p.id, input.value)) return;
        swap(input, name);
        presetsKey = "";
        paint();
      };
      input.addEventListener("keydown", function (e) {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        if (e.key === "Escape") { e.preventDefault(); finish(false); }
      });
      input.addEventListener("blur", function () { finish(true); });
      input.addEventListener("click", function (e) { e.stopPropagation(); });
      input.addEventListener("dblclick", function (e) { e.stopPropagation(); });
    }

    function deletePreset(k, id) {
      if (chosen[k] === id) chosen[k] = "";
      if (renaming && renaming.id === id) renaming = null;
      storePresets(k, presets[k].filter(function (p) { return p.id !== id; }));
    }

    function presetButton(text, cls) {
      var b = el("button", "btn" + (cls ? " " + cls : ""), text);
      b.type = "button";
      return b;
    }

    function buildPresets(box) {
      var sec = section("Saved presets");
      els.presetNote = el("p", "ed-fx-note", "");
      sec.appendChild(els.presetNote);
      els.presetList = el("div", "ed-preset-table");
      sec.appendChild(els.presetList);
      var use = el("div", "ed-btns");
      els.presetApply = presetButton("Apply", "primary");
      els.presetOverwrite = presetButton("Overwrite");
      use.appendChild(els.presetApply);
      use.appendChild(els.presetOverwrite);
      sec.appendChild(use);
      var named = el("div", "ed-preset-name-row");
      els.presetName = el("input", "ed-text-input");
      els.presetName.type = "text";
      els.presetName.maxLength = 40;
      els.presetName.spellcheck = false;
      els.presetName.placeholder = "Name this preset";
      els.presetName.setAttribute("aria-label", "Preset name");
      els.presetSave = presetButton("Save as new");
      named.appendChild(els.presetName);
      named.appendChild(els.presetSave);
      sec.appendChild(named);
      box.appendChild(sec);
      els.presetApply.addEventListener("click", function () { var p = findPreset(els.presetKind, chosen[els.presetKind]); if (p) applyPreset(els.presetKind, p); });
      els.presetOverwrite.addEventListener("click", function () { overwritePreset(els.presetKind); });
      els.presetSave.addEventListener("click", function () { saveNewPreset(els.presetKind); });
      els.presetName.addEventListener("keydown", function (e) {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); els.presetSave.click(); }
      });
      if (window.RKHover) RKHover.apply(sec, { control: ".btn" });
    }

    // the buttons follow every paint; the table is drawn again only when what it shows changed
    function paintPresets(k) {
      els.presetKind = k;
      var list = presets[k];
      var data = current(k);
      if (chosen[k] && !findPreset(k, chosen[k])) chosen[k] = "";
      var target = findPreset(k, chosen[k]);
      var inUse = list.filter(function (p) { return matches(k, p); }).map(function (p) { return p.id; });
      els.presetApply.disabled = !target;
      els.presetOverwrite.disabled = !target || !data;
      els.presetOverwrite.dataset.tooltip = target ? "Replace " + target.name + " with " + PRESET_KINDS[k] : "Pick a preset to overwrite";
      els.presetSave.disabled = !data;
      // a name being typed into a row is never drawn over; the list catches up once it is done
      if (renaming && renaming.kind === k && findPreset(k, renaming.id)) return;
      renaming = null;
      var key = canon([k, list.map(function (p) { return [p.id, p.name]; }), inUse, chosen[k]]);
      if (key === presetsKey) return;
      presetsKey = key;
      els.presetNote.textContent = list.length ? "Pick a preset, then apply it, or overwrite it with " + PRESET_KINDS[k] + "." : "No presets yet. Name " + PRESET_KINDS[k] + " below and save it to use it on any clip.";
      els.presetList.textContent = "";
      list.forEach(function (p) {
        var row = el("div", "ed-preset" + (p.id === chosen[k] ? " is-selected" : ""));
        row.tabIndex = 0;
        row.setAttribute("role", "option");
        row.setAttribute("aria-selected", p.id === chosen[k] ? "true" : "false");
        row.appendChild(el("span", "ed-preset-name", p.name));
        // the preset that matches what is on screen says so, picked or not
        row.appendChild(el("span", "ed-preset-use", inUse.indexOf(p.id) >= 0 ? "In use" : ""));
        var edit = el("button", "icon-mini-btn edit-btn");
        edit.type = "button";
        edit.dataset.tooltip = "Rename";
        edit.setAttribute("aria-label", "Rename " + p.name);
        edit.innerHTML = icon("action/edit");
        edit.addEventListener("click", function (e) { e.stopPropagation(); startRename(k, p, row); });
        row.appendChild(edit);
        // the bin of a clip card: the first click turns it into a delete? button, the second deletes
        var bin = el("button", "icon-mini-btn delete-btn");
        bin.type = "button";
        bin.dataset.deleteLabel = "Delete preset";
        bin.dataset.tooltip = "Delete preset";
        bin.setAttribute("aria-label", "Delete " + p.name);
        bin.innerHTML = icon("action/trash");
        bin.appendChild(el("span", "delete-confirm-text", "Delete?"));
        bin.addEventListener("click", function (e) {
          e.stopPropagation();
          if (bin.classList.contains("is-armed")) { deletePreset(k, p.id); return; }
          if (typeof armDeleteButton === "function") armDeleteButton(bin);
          else bin.classList.add("is-armed");
        });
        row.appendChild(bin);
        row.addEventListener("click", function () { selectPreset(k, p.id); });
        row.addEventListener("dblclick", function () { applyPreset(k, p); });
        row.addEventListener("keydown", function (e) {
          if (e.key === " ") { e.preventDefault(); selectPreset(k, p.id); }
          if (e.key === "Enter") { e.preventDefault(); applyPreset(k, p); }
        });
        els.presetList.appendChild(row);
      });
      if (window.RKHover) RKHover.apply(els.presetList, { control: ".icon-mini-btn" });
    }


    // the selected subtitles the speech engine was unsure of, in the order of the clip
    function unsureCues() {
      var subs = lanes.subtitles;
      var picked = subs.picked();
      return subs.list().filter(function (c) { return c.unsure && picked.indexOf(c.id) >= 0; });
    }

    function clockOf(t) {
      t = Math.max(0, t || 0);
      var m = Math.floor(t / 60), s = t - m * 60;
      return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
    }

    function buildCheck(box) {
      var sec = section("Check these subtitles");
      els.checkNote = el("p", "ed-fx-note", "");
      sec.appendChild(els.checkNote);
      els.checkList = el("div", "ed-preset-table");
      sec.appendChild(els.checkList);
      var all = el("div", "ed-btns");
      els.checkKeepAll = iconButton("action/select", "Keep all as they are");
      els.checkKeepAll.addEventListener("click", function () { lanes.subtitles.markChecked(unsureCues().map(function (c) { return c.id; })); });
      all.appendChild(els.checkKeepAll);
      sec.appendChild(all);
      box.appendChild(sec);
      if (window.RKHover) RKHover.apply(sec, { control: ".btn" });
    }

    var checkKey = "";
    // a button with the icon of the action in front of its text, the way every button of this card is drawn
    function iconButton(name, text) {
      var b = el("button", "btn");
      b.type = "button";
      b.innerHTML = icon(name);
      b.appendChild(document.createTextNode(text));
      return b;
    }
    function paintCheck(cues) {
      els.checkKeepAll.parentNode.hidden = cues.length < 2;
      var key = canon(cues.map(function (c) { return [c.id, c.text, c.at, c.alts || []]; }));
      if (key === checkKey) return;
      checkKey = key;
      els.checkNote.textContent = (cues.length === 1 ? "This subtitle was" : "These " + cues.length + " subtitles were") + " hard to make out. Pick or type what was said, keep it, or delete it.";
      els.checkList.textContent = "";
      var subs = lanes.subtitles;
      cues.forEach(function (c) {
        var item = el("div", "ed-check-item");
        var head = el("div", "ed-check-head");
        // the app tooltip sits on the text alone, so the bin beside it keeps its own
        var said = el("span", "ed-check-text", c.text);
        said.dataset.tooltip = "Go to this subtitle";
        head.appendChild(said);
        head.appendChild(el("span", "ed-check-time", clockOf(c.at)));
        head.addEventListener("click", function () { subs.seek(c.at + 0.01); });
        // the bin of a clip card: a click turns it into delete?, a second one deletes, and undo brings the subtitle back
        var del = el("button", "icon-mini-btn delete-btn");
        del.type = "button";
        del.dataset.deleteLabel = "Delete subtitle";
        del.dataset.tooltip = "Delete subtitle";
        del.setAttribute("aria-label", "Delete subtitle");
        del.innerHTML = icon("action/trash");
        del.appendChild(el("span", "delete-confirm-text", "Delete?"));
        del.addEventListener("click", function (e) {
          e.stopPropagation();
          if (del.classList.contains("is-armed")) { subs.remove(c.id); return; }
          if (typeof armDeleteButton === "function") armDeleteButton(del);
          else del.classList.add("is-armed");
        });
        head.appendChild(del);
        item.appendChild(head);
        var alts = Array.isArray(c.alts) ? c.alts : [];
        if (alts.length) {
          item.appendChild(el("div", "ed-check-label", "Might have been"));
          var row = el("div", "tl-speeds");
          alts.forEach(function (text) {
            var b = el("button", "btn tl-mini", text);
            b.type = "button";
            b.addEventListener("click", function () { subs.pickAlternative(c.id, text); });
            row.appendChild(b);
          });
          item.appendChild(row);
        }
        // what was said, typed by hand: it replaces the text and the subtitle counts as checked
        var typed = el("div", "ed-check-type");
        var field = el("input", "ed-text-input");
        field.type = "text";
        field.maxLength = 300;
        field.spellcheck = false;
        field.placeholder = "What was said";
        field.setAttribute("aria-label", "What was said");
        var use = iconButton("action/edit", "Use text");
        use.disabled = true;
        var apply = function () {
          var text = field.value.trim();
          if (!text) return;
          subs.setText(c.id, text);
          subs.checkpoint();
        };
        field.addEventListener("input", function () { use.disabled = !field.value.trim(); });
        field.addEventListener("keydown", function (e) { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); apply(); } });
        use.addEventListener("click", apply);
        typed.appendChild(field);
        typed.appendChild(use);
        item.appendChild(typed);
        var keep = el("div", "ed-btns");
        var k = iconButton("action/select", "Keep as it is");
        k.addEventListener("click", function () { subs.markChecked([c.id]); });
        keep.appendChild(k);
        item.appendChild(keep);
        els.checkList.appendChild(item);
      });
      if (window.RKHover) RKHover.apply(els.checkList, { control: ".btn" });
    }

    // the tiles show the frame under the playhead with the colour settings as they are, the filters each with their own look, the effects on top of the filter that is set
    function queueThumbs() {
      if (document.hidden || thumbQueued || !shown || els.editing || (pane !== "filters" && pane !== "effects")) return;
      thumbQueued = requestAnimationFrame(function () {
        thumbQueued = 0;
        // a clip row that is selected shows its own frames in the tiles
        var pic = (lanes.fx.picture && lanes.fx.picture()) || video;
        if (document.hidden || !shown || !pic.videoWidth || !thumbs.supported()) return;
        var state = fx();
        var h = Math.max(2, Math.round(THUMB_W * pic.videoHeight / pic.videoWidth));
        var list = [];
        function add(t, f) {
          if (t.canvas.width !== THUMB_W || t.canvas.height !== h) { t.canvas.width = THUMB_W; t.canvas.height = h; }
          list.push({ canvas: t.canvas, resolved: resolve(f) });
        }
        if (pane === "filters") {
          Object.keys(els.lookTiles).forEach(function (k) {
            add(els.lookTiles[k], { color: state.color, look: k ? { id: k, amount: state.look && state.look.id === k ? state.look.amount : 100 } : null, effects: [] });
          });
        } else {
          EFFECTS.forEach(function (e) {
            var on = state.effects.find(function (x) { return x.id === e[0]; });
            add(els.effectTiles[e[0]], { color: state.color, look: state.look, effects: [{ id: e[0], amount: on ? on.amount : 70 }] });
          });
        }
        thumbs.draw(pic, list);
      });
    }

    function clearThumbs() {
      if (thumbQueued) cancelAnimationFrame(thumbQueued);
      thumbQueued = 0;
      thumbs.clear();
      [els.lookTiles, els.effectTiles].forEach(function (tiles) {
        Object.keys(tiles || {}).forEach(function (key) { tiles[key].canvas.width = tiles[key].canvas.height = 1; });
      });
    }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearThumbs(); else queueThumbs();
    }, { signal: EDITOR_SIGNAL });

    build();
    paint();
    loadPresets();
    preview.set(resolve(lanes.fx.main()));
    return {
      reset: function () {
        shown = false; kind = ""; pane = "general"; els.editing = null;
        subPane = "edit"; renaming = null; chosen = { subtitle: "", video: "" }; presetsKey = "";
        if (els.presetName) els.presetName.value = "";
        presetsKey = "";
        clearTimeout(fxTimer);
        preview.set(null); clearThumbs();
        paint();
      },
      // the tab the right panel shows while the video is selected
      pane: function () { return pane; },
      // what the right panel shows while a subtitle is selected: its own card ("edit") or the presets of subtitles ("presets")
      subtitlePane: function () { return kind === "subtitle" && !lanes.panelClosed() ? subPane : "edit"; },
      // the lanes say when the panel of what is selected was closed or opened again
      refresh: function () { paint(); },
      // the lanes say whenever the panel on the right is drawn what is selected: "video", "audio", "subtitle", "layer" or ""
      selected: function (next) {
        // the video and a clip row are both "video" but have looks of their own, so a change between them is drawn again
        if (next === kind && next !== "video") return;
        kind = next;
        shown = kind === "video";
        paint();
        if (o.onLayout) o.onLayout();
      },
      // the look changed, by an edit, an undo, a draft or a clip being closed
      changed: function () {
        preview.set(resolve(lanes.fx.main()));
        if (shown) paint();
      },
    };
  }

  window.RKEditorFx = {
    // a look canvas for another video element, which the editor gives each clip row
    preview: attachPreview,
    LOOKS: LOOKS.map(function (l) { return { id: l[0], label: l[1] }; }),
    EFFECTS: EFFECTS.map(function (e) { return { id: e[0], label: e[1], amount: e[2] }; }),
    defaultFx: defaultFx,
    cleanFx: cleanFx,
    resolve: resolve,
    isIdentity: isIdentity,
    render: render,
    build: build,
    createPanel: createPanel,
  };
})();
</script>
