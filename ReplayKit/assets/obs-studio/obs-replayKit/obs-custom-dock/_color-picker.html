<!-- shared partial (helper #include target: color-picker). colour maths + the floating colour picker every page shares. self-contained: its script runs at parse time and only defines window.RKColor + window.openColorDialog, so include order vs the host script does not matter. openColorDialog(value, title, apply, options) is the single entry point: `apply` fires on every change (live preview) and again with the original value when escape backs out; options.alpha adds the opacity slider and the clear swatch (the value is then #rrggbb or #rrggbbaa), options.anchor is the element it opens beside (the focused button otherwise). a click outside keeps the colour. deliberately not a window.open popup -- CEF sends window.open to the real browser (see dock_window_open_escapes_to_browser). -->
<style>
  .cpick {
    --cp-bg:var(--panel, var(--grey6, #272A33));
    --cp-line:var(--line2, var(--grey3, #464B59));
    --cp-field:var(--field-dark, var(--grey7, #1D1F26));
    --cp-muted:var(--muted, var(--text_muted, #969696));
    --cp-accent:var(--selected2, var(--primary_light, #476BD7));
    --cp-danger:var(--danger, #e33b57);
    position:fixed; z-index:400; width:268px; padding:12px; box-sizing:border-box;
    border:1px solid var(--cp-line); border-radius:8px; background:var(--cp-bg); color:var(--text);
    box-shadow:0 14px 40px rgba(0,0,0,.5); display:grid; grid-template-columns:minmax(0, 1fr); gap:10px;
    animation:cpick-in 150ms var(--ease_pop, ease-out) both;
  }
  @keyframes cpick-in { from { opacity:0; transform:translateY(6px) scale(.98); } to { opacity:1; transform:none; } }
  .cpick[hidden] { display:none; }
  /* the thumbs sit centred on the value, so at an end they hang half over the edge, which lets the very edge be picked */
  .cpick-plane-wrap { position:relative; height:140px; cursor:crosshair; touch-action:none; }
  .cpick-plane { width:100%; height:100%; display:block; border-radius:4px; }
  .cpick-dot, .cpick-knob {
    position:absolute; width:16px; height:16px; box-sizing:border-box; border:2px solid #fff; border-radius:50%;
    background:var(--cp-fill, #000); box-shadow:0 0 0 1px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
    transform:translate(-50%, -50%); pointer-events:none;
  }
  .cpick-slider { position:relative; height:12px; border-radius:6px; background:var(--cp-track); cursor:pointer; touch-action:none; outline:none; }
  .cpick-slider .cpick-knob { top:50%; }
  .cpick-slider:focus-visible .cpick-knob { box-shadow:0 0 0 2px var(--cp-accent); }
  .cpick-hue { --cp-track:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  .cpick-alpha { --cp-track:linear-gradient(to right, rgba(var(--cp-rgb, 0,0,0), 0), rgb(var(--cp-rgb, 0,0,0))), repeating-conic-gradient(#888 0 25%, #ddd 0 50%) 0 0 / 8px 8px; }
  .cpick-row { display:flex; gap:8px; align-items:center; }
  .cpick-eyedrop {
    flex:none; width:32px; height:32px; display:grid; place-items:center; padding:0; cursor:pointer;
    border:0; border-radius:6px; background:transparent; color:var(--text);
  }
  .cpick-eyedrop:hover:not(:disabled) { background:rgba(255,255,255,.08); }
  .cpick-eyedrop:disabled { opacity:.5; cursor:default; }
  .cpick-eyedrop svg { width:20px; height:20px; fill:currentColor; }
  .cpick-field {
    height:32px; min-width:0; box-sizing:border-box; border:1px solid transparent; border-radius:6px; background:var(--cp-field);
    color:var(--text); font:inherit; font-size:13px; padding:0 10px; outline:none;
  }
  .cpick-field:focus { border-color:var(--cp-accent); }
  .cpick-field.is-bad { border-color:var(--cp-danger); }
  /* an input asks for room for about twenty characters, which would push the whole picker wider than its box; it takes what is left instead */
  .cpick-hex { flex:1 1 0; width:0; text-transform:uppercase; }
  /* the number and its percent sign sit together in the middle of the field */
  .cpick-alpha-box { flex:0 0 72px; height:32px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:3px; border:1px solid transparent; border-radius:6px; background:var(--cp-field); cursor:text; }
  .cpick-alpha-box:focus-within { border-color:var(--cp-accent); }
  .cpick-alpha-box.is-bad { border-color:var(--cp-danger); }
  .cpick-alpha-box input { width:3.2ch; padding:0; border:0; background:transparent; color:var(--text); font:inherit; font-size:13px; text-align:right; outline:none; }
  .cpick-alpha-box span { color:var(--cp-muted); font-size:13px; }
  .cpick-swatches { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
  .cpick-sw {
    width:100%; aspect-ratio:1; padding:0; border:0; border-radius:50%; cursor:pointer; background:var(--sw);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); transition:transform 90ms ease;
  }
  .cpick-sw:hover { transform:scale(1.1); }
  .cpick-sw.is-clear { background:repeating-conic-gradient(#777 0 25%, #bbb 0 50%) 0 0 / 8px 8px; }
  .cpick-sw.is-on { box-shadow:0 0 0 2px var(--cp-bg), 0 0 0 3.5px #fff; }
  .cpick-status { color:var(--cp-muted); font-size:11px; line-height:1.3; }
  .cpick-status:empty { display:none; }
  .cpick-status.is-bad { color:var(--cp-danger); }
  .cpick:not(.has-alpha) .cpick-alpha, .cpick:not(.has-alpha) .cpick-alpha-box, .cpick:not(.has-alpha) .cpick-sw.is-clear { display:none; }
</style>
<div class="cpick" id="cpick" hidden role="dialog" aria-label="Choose color">
  <div class="cpick-plane-wrap" id="cpickPlaneWrap" aria-label="Saturation and brightness"><canvas class="cpick-plane" id="cpickPlane" width="244" height="140"></canvas><span class="cpick-dot" id="cpickDot"></span></div>
  <div class="cpick-slider cpick-hue" id="cpickHue" tabindex="0" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="359"><span class="cpick-knob"></span></div>
  <div class="cpick-slider cpick-alpha" id="cpickAlpha" tabindex="0" role="slider" aria-label="Opacity" aria-valuemin="0" aria-valuemax="100"><span class="cpick-knob"></span></div>
  <div class="cpick-row">
    <button class="cpick-eyedrop" type="button" id="cpickEyedrop" data-tooltip="Pick a color from anywhere on screen" aria-label="Pick a color from anywhere on screen"><svg data-i="action/color-picker" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
    <input class="cpick-field cpick-hex" id="cpickHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color">
    <div class="cpick-alpha-box" id="cpickAlphaBox"><input id="cpickAlphaNum" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Opacity percent"><span>%</span></div>
  </div>
  <div class="cpick-swatches" id="cpickSwatches"></div>
  <div class="cpick-status" id="cpickStatus"></div>
</div>
<script>
(function () {
  var HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";

  function cleanHexColor(value, fallback) {
    var text = String(value || "").trim().toLowerCase();
    if (/^#[0-9a-f]{6}$/.test(text)) return text;
    return fallback;
  }
  // a colour with its opacity: #rrggbb is opaque, #rrggbbaa carries the opacity in its last byte
  function cleanAlphaColor(value, fallback) {
    var text = String(value || "").trim().toLowerCase();
    if (/^#[0-9a-f]{6}$/.test(text)) return text;
    if (/^#[0-9a-f]{8}$/.test(text)) return text.slice(7) === "ff" ? text.slice(0, 7) : text;
    return fallback;
  }
  function setColorButton(button, value, fallback) {
    var color = cleanHexColor(value, fallback || "#000000");
    button.dataset.value = color;
    button.style.setProperty("--color", color);
    button.dataset.tooltip = color;
    return color;
  }
  function rgbToHex(red, green, blue) {
    var byte = function (value) { return Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, "0"); };
    return "#" + byte(red) + byte(green) + byte(blue);
  }
  function hexToRgb(hex) {
    var value = cleanAlphaColor(hex, "#000000");
    return { red:parseInt(value.slice(1, 3), 16), green:parseInt(value.slice(3, 5), 16), blue:parseInt(value.slice(5, 7), 16) };
  }
  function alphaOf(hex) {
    var value = cleanAlphaColor(hex, "#000000");
    return value.length === 9 ? parseInt(value.slice(7, 9), 16) / 255 : 1;
  }
  function withAlpha(hex, alpha) {
    var base = cleanAlphaColor(hex, "#000000").slice(0, 7);
    var a = Math.max(0, Math.min(255, Math.round(alpha * 255)));
    return a === 255 ? base : base + a.toString(16).padStart(2, "0");
  }
  // the css form of a colour that may carry an opacity
  function toCss(hex) {
    var rgb = hexToRgb(hex);
    return "rgba(" + rgb.red + "," + rgb.green + "," + rgb.blue + "," + (Math.round(alphaOf(hex) * 1000) / 1000) + ")";
  }
  function rgbToHsv(red, green, blue) {
    red /= 255; green /= 255; blue /= 255;
    var max = Math.max(red, green, blue), min = Math.min(red, green, blue), delta = max - min;
    var hue = 0;
    if (delta) {
      if (max === red) hue = ((green - blue) / delta) % 6;
      else if (max === green) hue = ((blue - red) / delta) + 2;
      else hue = ((red - green) / delta) + 4;
      hue *= 60;
      if (hue < 0) hue += 360;
    }
    return { hue:hue, saturation:max === 0 ? 0 : delta / max, value:max };
  }
  function hsvToHex(hue, saturation, value) {
    var chroma = value * saturation;
    var section = (((hue % 360) + 360) % 360) / 60;
    var x = chroma * (1 - Math.abs((section % 2) - 1));
    var red = 0, green = 0, blue = 0;
    if (section < 1) { red = chroma; green = x; }
    else if (section < 2) { red = x; green = chroma; }
    else if (section < 3) { green = chroma; blue = x; }
    else if (section < 4) { green = x; blue = chroma; }
    else if (section < 5) { red = x; blue = chroma; }
    else { red = chroma; blue = x; }
    var match = value - chroma;
    return rgbToHex((red + match) * 255, (green + match) * 255, (blue + match) * 255);
  }
  window.RKColor = { cleanHexColor:cleanHexColor, cleanAlphaColor:cleanAlphaColor, setColorButton:setColorButton, rgbToHex:rgbToHex, hexToRgb:hexToRgb, alphaOf:alphaOf, withAlpha:withAlpha, toCss:toCss, rgbToHsv:rgbToHsv, hsvToHex:hsvToHex };

  var SWATCHES = [
    "clear", "#ffffff", "#e0e0e0", "#bdbdbd", "#9e9e9e", "#757575", "#424242", "#000000",
    "#f44336", "#ff9800", "#ffeb3b", "#4caf50", "#00bcd4", "#2196f3", "#9c27b0", "#e91e63",
    "#ffcdd2", "#ffe0b2", "#fff9c4", "#c8e6c9", "#b2ebf2", "#bbdefb", "#e1bee7", "#f8bbd0",
  ];
  var cp = {
    root:document.getElementById("cpick"), plane:document.getElementById("cpickPlane"), planeWrap:document.getElementById("cpickPlaneWrap"), dot:document.getElementById("cpickDot"),
    alphaBox:document.getElementById("cpickAlphaBox"), hue:document.getElementById("cpickHue"),
    alpha:document.getElementById("cpickAlpha"), alphaNum:document.getElementById("cpickAlphaNum"), hex:document.getElementById("cpickHex"),
    eyedrop:document.getElementById("cpickEyedrop"), swatches:document.getElementById("cpickSwatches"), status:document.getElementById("cpickStatus"),
  };
  var cpState = { hue:0, saturation:0, value:0, alpha:1 };
  var cpRequest = null;
  var cpPicking = false;
  // a press on the button that opened the picker closes it, and the click that follows must not open it again
  var cpSwallowClick = null;

  SWATCHES.forEach(function (value) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "cpick-sw" + (value === "clear" ? " is-clear" : "");
    b.dataset.value = value;
    b.setAttribute("aria-label", value === "clear" ? "No color" : value);
    if (value !== "clear") b.style.setProperty("--sw", value);
    b.addEventListener("click", function () {
      if (value === "clear") { cpState.alpha = 0; cpSync(true); return; }
      var rgb = hexToRgb(value);
      var hsv = rgbToHsv(rgb.red, rgb.green, rgb.blue);
      cpState = { hue:hsv.saturation ? hsv.hue : cpState.hue, saturation:hsv.saturation, value:hsv.value, alpha:cpRequest && cpRequest.alpha && cpState.alpha === 0 ? 1 : cpState.alpha };
      cpSync(true);
    });
    cp.swatches.appendChild(b);
  });

  function cpSetStatus(text, bad) { cp.status.textContent = text || ""; cp.status.classList.toggle("is-bad", !!bad); }
  function cpColor() {
    var hex = hsvToHex(cpState.hue, cpState.saturation, cpState.value);
    return cpRequest && cpRequest.alpha ? withAlpha(hex, cpState.alpha) : hex;
  }

  function cpDraw() {
    var ctx = cp.plane.getContext("2d"), w = cp.plane.width, h = cp.plane.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = hsvToHex(cpState.hue, 1, 1);
    ctx.fillRect(0, 0, w, h);
    var white = ctx.createLinearGradient(0, 0, w, 0);
    white.addColorStop(0, "#fff"); white.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = white; ctx.fillRect(0, 0, w, h);
    var black = ctx.createLinearGradient(0, 0, 0, h);
    black.addColorStop(0, "rgba(0,0,0,0)"); black.addColorStop(1, "#000");
    ctx.fillStyle = black; ctx.fillRect(0, 0, w, h);
  }
  function cpKnob(slider, fraction, fill) {
    var knob = slider.firstElementChild;
    knob.style.left = (Math.max(0, Math.min(1, fraction)) * 100) + "%";
    knob.style.setProperty("--cp-fill", fill);
  }
  function cpPaint(skip) {
    var hex = hsvToHex(cpState.hue, cpState.saturation, cpState.value);
    var rgb = hexToRgb(hex);
    if (skip !== "hex") { cp.hex.value = hex.toUpperCase(); cp.hex.classList.remove("is-bad"); }
    if (skip !== "alpha") cp.alphaNum.value = String(Math.round(cpState.alpha * 100));
    cpKnob(cp.hue, cpState.hue / 359, hsvToHex(cpState.hue, 1, 1));
    cpKnob(cp.alpha, cpState.alpha, toCss(withAlpha(hex, cpState.alpha)));
    cp.hue.setAttribute("aria-valuenow", String(Math.round(cpState.hue)));
    cp.alpha.setAttribute("aria-valuenow", String(Math.round(cpState.alpha * 100)));
    cp.alpha.style.setProperty("--cp-rgb", rgb.red + "," + rgb.green + "," + rgb.blue);
    cp.dot.style.left = (cpState.saturation * 100) + "%";
    cp.dot.style.top = ((1 - cpState.value) * 100) + "%";
    cp.dot.style.setProperty("--cp-fill", hex);
    var current = cpColor();
    Array.prototype.forEach.call(cp.swatches.children, function (b) {
      var v = b.dataset.value;
      b.classList.toggle("is-on", v === "clear" ? cpState.alpha === 0 : cpState.alpha > 0 && v === hex);
    });
    cpDraw();
    return current;
  }
  function cpSync(preview, skip) {
    var color = cpPaint(skip);
    if (preview && cpRequest) cpRequest.apply(color);
    return color;
  }
  function cpLoad(value) {
    var color = cleanAlphaColor(value, "#000000");
    var rgb = hexToRgb(color);
    var hsv = rgbToHsv(rgb.red, rgb.green, rgb.blue);
    cpState = { hue:hsv.hue, saturation:hsv.saturation, value:hsv.value, alpha:cpRequest && cpRequest.alpha ? alphaOf(color) : 1 };
    cpPaint();
  }

  // the size is the laid out one (offset), since the opening animation scales the box down for a moment and a measured rect would come out short; the room is the visible page, without its scrollbar
  function cpPlace(anchor) {
    var box = { width:cp.root.offsetWidth, height:cp.root.offsetHeight };
    var roomW = document.documentElement.clientWidth || window.innerWidth;
    var roomH = document.documentElement.clientHeight || window.innerHeight;
    var left = roomW - box.width - 16, top = 96;
    if (anchor && anchor.getBoundingClientRect && anchor !== document.body) {
      var a = anchor.getBoundingClientRect();
      // beside the button when there is room on its left, which keeps the field it changes in view; below it otherwise
      if (a.left - box.width - 8 >= 8) { left = a.left - box.width - 8; top = a.top + a.height / 2 - box.height / 2; }
      else { left = a.left; top = a.bottom + 6; if (top + box.height > roomH - 8) top = a.top - box.height - 6; }
    }
    cp.root.style.left = Math.max(8, Math.min(left, roomW - box.width - 8)) + "px";
    cp.root.style.top = Math.max(8, Math.min(top, roomH - box.height - 8)) + "px";
  }
  function cpClose(restore) {
    if (!cpRequest) return;
    var request = cpRequest;
    cpRequest = null;
    if (restore) request.apply(request.original);
    cp.root.hidden = true;
    cpSetStatus("");
    document.removeEventListener("pointerdown", cpOutside, true);
  }
  function cpOutside(event) {
    if (cp.root.contains(event.target)) return;
    var anchor = cpRequest && cpRequest.anchor;
    if (anchor && anchor.contains && anchor.contains(event.target)) cpSwallowClick = anchor;
    cpClose(false);
  }
  document.addEventListener("click", function (event) {
    if (!cpSwallowClick) return;
    var anchor = cpSwallowClick;
    cpSwallowClick = null;
    if (anchor.contains(event.target)) { event.stopImmediatePropagation(); event.preventDefault(); }
  }, true);

  window.openColorDialog = function (value, title, apply, options) {
    options = options || {};
    if (cpRequest) cpClose(false);
    var anchor = options.anchor || (document.activeElement !== document.body ? document.activeElement : null);
    var alpha = !!options.alpha;
    var original = alpha ? cleanAlphaColor(value, "#000000") : cleanHexColor(cleanAlphaColor(value, "#000000").slice(0, 7), "#000000");
    cpRequest = { original:original, apply:apply, alpha:alpha, anchor:anchor };
    cp.root.setAttribute("aria-label", title || "Choose color");
    cp.root.classList.toggle("has-alpha", alpha);
    cp.root.hidden = false;
    cpSetStatus("");
    cpLoad(original);
    cpPlace(anchor);
    document.addEventListener("pointerdown", cpOutside, true);
  };

  function cpPlanePointer(event) {
    var rect = cp.planeWrap.getBoundingClientRect();
    cpState.saturation = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    cpState.value = 1 - Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
    if (cpRequest && cpRequest.alpha && cpState.alpha === 0) cpState.alpha = 1;
    cpSync(true);
  }
  cp.planeWrap.addEventListener("pointerdown", function (event) { cp.planeWrap.setPointerCapture(event.pointerId); cpPlanePointer(event); });
  cp.planeWrap.addEventListener("pointermove", function (event) { if (cp.planeWrap.hasPointerCapture(event.pointerId)) cpPlanePointer(event); });
  // a slider is dragged anywhere along it, and the arrow keys step it
  function cpSlider(slider, set, step) {
    var at = function (event) {
      var rect = slider.getBoundingClientRect();
      set(Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)));
      cpSync(true);
    };
    slider.addEventListener("pointerdown", function (event) { slider.setPointerCapture(event.pointerId); slider.focus(); at(event); });
    slider.addEventListener("pointermove", function (event) { if (slider.hasPointerCapture(event.pointerId)) at(event); });
    slider.addEventListener("keydown", function (event) {
      var d = event.key === "ArrowRight" || event.key === "ArrowUp" ? 1 : event.key === "ArrowLeft" || event.key === "ArrowDown" ? -1 : 0;
      if (!d) return;
      event.preventDefault();
      step(d * (event.shiftKey ? 10 : 1));
      cpSync(true);
    });
  }
  cpSlider(cp.hue, function (f) { cpState.hue = f * 359; }, function (d) { cpState.hue = Math.max(0, Math.min(359, Math.round(cpState.hue) + d)); });
  cpSlider(cp.alpha, function (f) { cpState.alpha = Math.round(f * 100) / 100; }, function (d) { cpState.alpha = Math.max(0, Math.min(100, Math.round(cpState.alpha * 100) + d)) / 100; });
  cp.alphaBox.addEventListener("pointerdown", function (event) { if (event.target !== cp.alphaNum) { event.preventDefault(); cp.alphaNum.focus(); cp.alphaNum.select(); } });
  cp.hex.addEventListener("input", function () {
    var text = cp.hex.value.trim();
    var color = cleanHexColor(text.charAt(0) === "#" ? text : "#" + text, null);
    if (!color) { cp.hex.classList.add("is-bad"); return; }
    cp.hex.classList.remove("is-bad");
    var rgb = hexToRgb(color);
    var hsv = rgbToHsv(rgb.red, rgb.green, rgb.blue);
    cpState = { hue:hsv.saturation ? hsv.hue : cpState.hue, saturation:hsv.saturation, value:hsv.value, alpha:cpState.alpha };
    cpSync(true, "hex");
  });
  cp.alphaNum.addEventListener("input", function () {
    var n = parseInt(cp.alphaNum.value, 10);
    if (!isFinite(n) || n < 0 || n > 100) { cp.alphaBox.classList.add("is-bad"); return; }
    cp.alphaBox.classList.remove("is-bad");
    cpState.alpha = n / 100;
    cpSync(true, "alpha");
  });
  cp.alphaNum.addEventListener("blur", function () { cp.alphaBox.classList.remove("is-bad"); cpPaint(); });
  cp.hex.addEventListener("blur", function () { cpPaint(); });
  cp.eyedrop.addEventListener("click", async function () {
    if (cpPicking) return;
    cpPicking = true;
    cp.eyedrop.disabled = true;
    cpSetStatus("Click anywhere on any monitor. Esc or right-click cancels.");
    try {
      var res = await fetch(HELPER + "/appearance/pick-color", { method:"POST", cache:"no-store" });
      var data = await res.json();
      if (!res.ok || (data && data.ok === false)) throw new Error((data && data.message) || ("HTTP " + res.status));
      if (!data.cancelled && data.color && cpRequest) {
        var color = cleanHexColor(data.color, null);
        if (color) {
          var rgb = hexToRgb(color);
          var hsv = rgbToHsv(rgb.red, rgb.green, rgb.blue);
          cpState = { hue:hsv.hue, saturation:hsv.saturation, value:hsv.value, alpha:cpState.alpha || 1 };
          cpSync(true);
        }
      }
      cpSetStatus(data.cancelled ? "Cancelled." : "");
    } catch (error) {
      cpSetStatus(error.message || String(error), true);
    } finally {
      cpPicking = false;
      cp.eyedrop.disabled = false;
    }
  });
  window.addEventListener("keydown", function (event) {
    if (cp.root.hidden) return;
    // the page listens for escape on the document too (the editor lets go of its selection on it), so this listens on the window first and ends it here
    if (event.key === "Escape") { event.stopPropagation(); event.preventDefault(); cpClose(true); }
    else if (event.key === "Enter" && cp.root.contains(document.activeElement)) { event.preventDefault(); cpClose(false); }
  }, true);
  window.addEventListener("resize", function () { if (!cp.root.hidden && cpRequest) cpPlace(cpRequest.anchor); });
})();
</script>
