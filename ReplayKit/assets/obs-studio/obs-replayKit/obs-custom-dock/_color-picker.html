<!-- shared partial (helper #include target: color-picker). colour maths + the floating non-modal colour picker. self-contained: its script runs at parse time and only defines window.RKColor + window.openColorDialog, so include order vs the host script does not matter. openColorDialog(value, title, apply) is the single entry point; `apply` fires on every change (live preview) and again with the original value on cancel. deliberately not a window.open popup -- CEF sends window.open to the real browser (see dock_window_open_escapes_to_browser). -->
<style>
  .cpick {
    position:fixed; z-index:400; width:288px; border:1px solid var(--line2); border-radius:7px;
    background:var(--panel); box-shadow:0 14px 40px rgba(0,0,0,.5); overflow:hidden;
    animation:cpick-in 150ms var(--ease_pop) both;
  }
  @keyframes cpick-in { from { opacity:0; transform:translateY(6px) scale(.98); } to { opacity:1; transform:none; } }
  .cpick[hidden] { display:none; }
  .cpick-head {
    display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 8px 7px 11px;
    background:var(--field); border-bottom:1px solid var(--line); cursor:grab; user-select:none;
  }
  .cpick.is-dragging .cpick-head { cursor:grabbing; }
  .cpick-title { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cpick-x {
    flex:none; width:20px; height:20px; display:grid; place-items:center; padding:0; line-height:1;
    border:0; border-radius:3px; background:transparent; color:var(--muted); font-size:15px; cursor:pointer;
  }
  .cpick-x:hover { background:var(--line2); color:var(--text); }
  .cpick-body { padding:10px; display:grid; gap:9px; }
  .cpick-plane { width:100%; height:140px; display:block; border:1px solid var(--line2); border-radius:5px; cursor:crosshair; touch-action:none; }
  .cpick-hue {
    width:100%; height:10px; margin:0; padding:0; appearance:none; -webkit-appearance:none;
    border-radius:5px; border:0; outline:none; cursor:pointer;
    background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
  }
  .cpick-hue::-webkit-slider-runnable-track { height:10px; background:transparent; border:0; }
  .cpick-hue::-webkit-slider-thumb {
    appearance:none; -webkit-appearance:none; width:21px; height:10px; margin-top:0;
    border:0; border-radius:5px; background:var(--text); cursor:pointer;
    box-shadow:0 0 0 1px rgba(var(--bg-rgb),.25);
  }
  .cpick-hue:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 2px var(--selected2); }
  .cpick-row { display:grid; grid-template-columns:26px 1fr 30px; gap:7px; align-items:center; }
  .cpick-swatch { width:26px; height:26px; border:1px solid var(--line2); border-radius:4px; background:var(--color,#000); }
  .cpick-hex {
    height:26px; min-width:0; border:1px solid var(--line); border-radius:4px; background:var(--field-dark);
    color:var(--text); font:inherit; font-size:12px; padding:0 7px; text-transform:lowercase; outline:none;
  }
  .cpick-hex:focus { border-color:var(--selected2); }
  .cpick-hex.is-bad { border-color:var(--danger); }
  .cpick-eyedrop {
    width:30px; height:26px; display:grid; place-items:center; padding:0; cursor:pointer;
    border:1px solid var(--line); border-radius:4px; background:var(--field); color:var(--text);
  }
  .cpick-eyedrop:hover:not(:disabled) { background:var(--line2); }
  .cpick-eyedrop:disabled { opacity:.5; cursor:default; }
  .cpick-eyedrop svg { width:20px; height:20px; fill:currentColor; }
  .cpick-status { min-height:14px; color:var(--muted); font-size:11px; line-height:1.3; }
  .cpick-status.is-bad { color:var(--danger); }
  .cpick-foot { display:flex; justify-content:flex-end; gap:7px; padding:0 10px 10px; }
  .cpick-foot .btn { height:28px; padding:0 12px; font-size:12px; }
</style>
<div class="cpick" id="cpick" hidden role="dialog" aria-label="Choose color">
  <div class="cpick-head" id="cpickHead">
    <span class="cpick-title" id="cpickTitle">Choose color</span>
    <button class="cpick-x" type="button" id="cpickClose" aria-label="Close color picker">&#215;</button>
  </div>
  <div class="cpick-body">
    <canvas class="cpick-plane" id="cpickPlane" width="252" height="140"></canvas>
    <input class="cpick-hue" id="cpickHue" type="range" min="0" max="359" step="1" aria-label="Hue">
    <div class="cpick-row">
      <span class="cpick-swatch" id="cpickSwatch"></span>
      <input class="cpick-hex" id="cpickHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color">
      <button class="cpick-eyedrop" type="button" id="cpickEyedrop" data-tooltip="Pick a color from anywhere on screen" aria-label="Pick a color from anywhere on screen"><svg data-i="action/color-picker" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
    </div>
    <div class="cpick-status" id="cpickStatus"></div>
  </div>
  <div class="cpick-foot">
    <button class="btn" type="button" id="cpickCancel">Cancel</button>
    <button class="btn is-primary" type="button" id="cpickApply">Apply</button>
  </div>
</div>
<script>
(function () {
  var HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";

  function cleanHexColor(value, fallback) {
    var text = String(value || "").trim().toLowerCase();
    if (/^#[0-9a-f]{6}$/.test(text)) return text;
    return fallback;
  }
  function setColorButton(button, value, fallback) {
    var color = cleanHexColor(value, fallback || "#000000");
    button.dataset.value = color;
    button.style.setProperty("--color", color);
    button.dataset.tooltip = color;
    return color;
  }
  function rgbToHex(red, green, blue) {
    var byte = function (value) { return Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, "0"); };
    return "#" + byte(red) + byte(green) + byte(blue);
  }
  function hexToRgb(hex) {
    var value = cleanHexColor(hex, "#000000");
    return { red:parseInt(value.slice(1, 3), 16), green:parseInt(value.slice(3, 5), 16), blue:parseInt(value.slice(5, 7), 16) };
  }
  function rgbToHsv(red, green, blue) {
    red /= 255; green /= 255; blue /= 255;
    var max = Math.max(red, green, blue), min = Math.min(red, green, blue), delta = max - min;
    var hue = 0;
    if (delta) {
      if (max === red) hue = ((green - blue) / delta) % 6;
      else if (max === green) hue = ((blue - red) / delta) + 2;
      else hue = ((red - green) / delta) + 4;
      hue *= 60;
      if (hue < 0) hue += 360;
    }
    return { hue:hue, saturation:max === 0 ? 0 : delta / max, value:max };
  }
  function hsvToHex(hue, saturation, value) {
    var chroma = value * saturation;
    var section = (((hue % 360) + 360) % 360) / 60;
    var x = chroma * (1 - Math.abs((section % 2) - 1));
    var red = 0, green = 0, blue = 0;
    if (section < 1) { red = chroma; green = x; }
    else if (section < 2) { red = x; green = chroma; }
    else if (section < 3) { green = chroma; blue = x; }
    else if (section < 4) { green = x; blue = chroma; }
    else if (section < 5) { red = x; blue = chroma; }
    else { red = chroma; blue = x; }
    var match = value - chroma;
    return rgbToHex((red + match) * 255, (green + match) * 255, (blue + match) * 255);
  }
  window.RKColor = { cleanHexColor:cleanHexColor, setColorButton:setColorButton, rgbToHex:rgbToHex, hexToRgb:hexToRgb, rgbToHsv:rgbToHsv, hsvToHex:hsvToHex };

  var cp = {
    root:document.getElementById("cpick"), head:document.getElementById("cpickHead"), title:document.getElementById("cpickTitle"),
    close:document.getElementById("cpickClose"), plane:document.getElementById("cpickPlane"), hue:document.getElementById("cpickHue"),
    swatch:document.getElementById("cpickSwatch"), hex:document.getElementById("cpickHex"), eyedrop:document.getElementById("cpickEyedrop"),
    status:document.getElementById("cpickStatus"), cancel:document.getElementById("cpickCancel"), apply:document.getElementById("cpickApply"),
  };
  var CPICK_POS_KEY = "replaykit-color-picker-pos";
  var cpState = { hue:0, saturation:0, value:0 };
  var cpRequest = null;
  var cpPicking = false;

  function cpSetStatus(text, bad) { cp.status.textContent = text || ""; cp.status.classList.toggle("is-bad", !!bad); }

  function cpDraw() {
    var ctx = cp.plane.getContext("2d"), w = cp.plane.width, h = cp.plane.height;
    ctx.fillStyle = hsvToHex(cpState.hue, 1, 1);
    ctx.fillRect(0, 0, w, h);
    var white = ctx.createLinearGradient(0, 0, w, 0);
    white.addColorStop(0, "#fff"); white.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = white; ctx.fillRect(0, 0, w, h);
    var black = ctx.createLinearGradient(0, 0, 0, h);
    black.addColorStop(0, "rgba(0,0,0,0)"); black.addColorStop(1, "#000");
    ctx.fillStyle = black; ctx.fillRect(0, 0, w, h);
    ctx.beginPath();
    ctx.arc(cpState.saturation * w, (1 - cpState.value) * h, 5.5, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = cpState.value > .55 ? "#111" : "#fff"; ctx.stroke();
  }
  function cpSync(preview) {
    var color = hsvToHex(cpState.hue, cpState.saturation, cpState.value);
    cp.hex.value = color;
    cp.hex.classList.remove("is-bad");
    cp.swatch.style.setProperty("--color", color);
    cp.hue.value = String(Math.round(cpState.hue));
    cpDraw();
    if (preview && cpRequest) cpRequest.apply(color);
    return color;
  }
  function cpSetHex(value, preview) {
    var color = cleanHexColor(value, null);
    if (!color) return false;
    var rgb = hexToRgb(color);
    cpState = rgbToHsv(rgb.red, rgb.green, rgb.blue);
    cpSync(preview);
    return true;
  }
  function cpClampInto(left, top) {
    var rect = cp.root.getBoundingClientRect();
    var maxLeft = Math.max(8, window.innerWidth - rect.width - 8);
    var maxTop = Math.max(8, window.innerHeight - rect.height - 8);
    return { left:Math.max(8, Math.min(left, maxLeft)), top:Math.max(8, Math.min(top, maxTop)) };
  }
  function cpPlace() {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(CPICK_POS_KEY) || "null"); } catch (_) {}
    var start = stored && Number.isFinite(stored.left) && Number.isFinite(stored.top) ? stored : { left:window.innerWidth - 320, top:96 };
    var at = cpClampInto(start.left, start.top);
    cp.root.style.left = at.left + "px";
    cp.root.style.top = at.top + "px";
  }
  function cpClose(restore) {
    if (!cpRequest) return;
    var request = cpRequest;
    cpRequest = null;
    if (restore) request.apply(request.original);
    cp.root.hidden = true;
    cpSetStatus("");
  }
  window.openColorDialog = function (value, title, apply) {
    var original = cleanHexColor(value, "#000000");
    cpRequest = { original:original, apply:apply };
    cp.title.textContent = title || "Choose color";
    cp.root.hidden = false;
    cpPlace();
    cpSetStatus("");
    cpSetHex(original, false);
    cp.hex.focus({ preventScroll:true });
    cp.hex.select();
  };

  cp.head.addEventListener("pointerdown", function (event) {
    if (event.target.closest(".cpick-x")) return;
    var rect = cp.root.getBoundingClientRect();
    var grabX = event.clientX - rect.left, grabY = event.clientY - rect.top;
    cp.root.classList.add("is-dragging");
    cp.head.setPointerCapture(event.pointerId);
    var move = function (moveEvent) {
      var at = cpClampInto(moveEvent.clientX - grabX, moveEvent.clientY - grabY);
      cp.root.style.left = at.left + "px";
      cp.root.style.top = at.top + "px";
    };
    var up = function () {
      cp.head.removeEventListener("pointermove", move);
      cp.head.removeEventListener("pointerup", up);
      cp.root.classList.remove("is-dragging");
      var rectNow = cp.root.getBoundingClientRect();
      try { localStorage.setItem(CPICK_POS_KEY, JSON.stringify({ left:Math.round(rectNow.left), top:Math.round(rectNow.top) })); } catch (_) {}
    };
    cp.head.addEventListener("pointermove", move);
    cp.head.addEventListener("pointerup", up);
  });

  function cpPlanePointer(event) {
    var rect = cp.plane.getBoundingClientRect();
    cpState.saturation = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    cpState.value = 1 - Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
    cpSync(true);
  }
  cp.plane.addEventListener("pointerdown", function (event) { cp.plane.setPointerCapture(event.pointerId); cpPlanePointer(event); });
  cp.plane.addEventListener("pointermove", function (event) { if (cp.plane.hasPointerCapture(event.pointerId)) cpPlanePointer(event); });
  cp.hue.addEventListener("input", function () { cpState.hue = parseInt(cp.hue.value, 10) || 0; cpSync(true); });
  cp.hex.addEventListener("input", function () {
    var color = cleanHexColor(cp.hex.value, null);
    if (!color) { cp.hex.classList.add("is-bad"); return; }
    cp.hex.classList.remove("is-bad");
    var rgb = hexToRgb(color);
    cpState = rgbToHsv(rgb.red, rgb.green, rgb.blue);
    cp.swatch.style.setProperty("--color", color);
    cp.hue.value = String(Math.round(cpState.hue));
    cpDraw();
    if (cpRequest) cpRequest.apply(color);
  });
  cp.eyedrop.addEventListener("click", async function () {
    if (cpPicking) return;
    cpPicking = true;
    cp.eyedrop.disabled = true;
    cpSetStatus("Click anywhere on any monitor. Esc or right-click cancels.");
    try {
      var res = await fetch(HELPER + "/appearance/pick-color", { method:"POST", cache:"no-store" });
      var data = await res.json();
      if (!res.ok || (data && data.ok === false)) throw new Error((data && data.message) || ("HTTP " + res.status));
      if (!data.cancelled && data.color) cpSetHex(data.color, true);
      cpSetStatus(data.cancelled ? "Cancelled." : "");
    } catch (error) {
      cpSetStatus(error.message || String(error), true);
    } finally {
      cpPicking = false;
      cp.eyedrop.disabled = false;
    }
  });
  cp.apply.addEventListener("click", function () {
    if (!cleanHexColor(cp.hex.value, null)) { cp.hex.classList.add("is-bad"); cp.hex.focus(); return; }
    cpClose(false);
  });
  cp.cancel.addEventListener("click", function () { cpClose(true); });
  cp.close.addEventListener("click", function () { cpClose(true); });
  document.addEventListener("keydown", function (event) {
    if (cp.root.hidden) return;
    if (event.key === "Escape") { event.stopPropagation(); cpClose(true); }
    else if (event.key === "Enter" && cp.root.contains(document.activeElement)) cp.apply.click();
  }, true);
  window.addEventListener("resize", function () {
    if (cp.root.hidden) return;
    var rect = cp.root.getBoundingClientRect();
    var at = cpClampInto(rect.left, rect.top);
    cp.root.style.left = at.left + "px";
    cp.root.style.top = at.top + "px";
  });
})();
</script>
