<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit Update</title>
  <link rel="icon" type="image/svg+xml" href="http://127.0.0.1:8767/obs-icon.svg?v=3" />
<style>
  :root {
    --window:#1D1F26;
    --field:#3C404D;
    --card:#2F323C;
    --line:#3C404D;
    --line2:#5B6273;
    --selected2:#476BD7;
    --text:#ffffff;
    --muted:#969696;
    --danger:#e33b57;
    --success:#37D247;
    --text-rgb:255, 255, 255;
    --font:"Segoe UI",system-ui,sans-serif;
    --ease_smooth:cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing:border-box; }
  html,body {
    width:100%; height:100%; margin:0; overflow:hidden;
    background:var(--window); color:var(--text); font:13px var(--font);
    user-select:none; -webkit-user-select:none;
  }
  button { font:inherit; }

  /* the host window (UpdatePromptWindow.cs) is borderless; dwm rounds + borders + shadows it and clips this surface
     to the win11 ~8px radius, so the page just matches that so no square corner shows behind the clip */
  .shell {
    width:100%; height:100%; display:grid; grid-template-rows:1fr 70px;
    background:var(--window); overflow:hidden; border-radius:8px;
  }

  /* hero: artwork fills the left, copy sits on the right -- the medal updater shape */
  .hero { position:relative; overflow:hidden; display:flex; align-items:center; }
  .hero-art {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:left center; pointer-events:none;
    /* dissolve the board before it reaches the copy, so no keys run through the text */
    -webkit-mask-image:linear-gradient(to right, #000 0%, #000 34%, transparent 60%);
            mask-image:linear-gradient(to right, #000 0%, #000 34%, transparent 60%);
  }
  .hero-copy { position:relative; margin-left:240px; padding:0 26px 0 0; max-width:100%; }
  .hero-title {
    font-size:20px; font-weight:700; letter-spacing:-.2px; line-height:1.4; margin:0 0 8px;
    animation:rk-rise 420ms var(--ease_smooth) both;
  }
  .hero-line { color:var(--muted); font-size:12.5px; line-height:1.5; animation:rk-rise 420ms var(--ease_smooth) both 60ms; }
  .hero-line + .hero-line { animation-delay:110ms; }
  .hero-title.is-bad { color:var(--danger); }
  @keyframes rk-rise { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }

  /* brand left, live status right; the thin fill along the top edge is the progress bar. same surface + hairline as a clip card footer, so it reads as one of ours. */
  .foot {
    position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; background:var(--card); border-top:1px solid var(--line);
  }
  .foot-fill {
    position:absolute; left:0; top:-1px; height:2px; width:0%;
    background:var(--selected2); transition:width 220ms var(--ease_smooth);
  }
  .foot-fill.is-done { background:var(--success); }
  .foot-fill.is-bad { background:var(--danger); }
  .brand { display:flex; align-items:center; gap:9px; min-width:0; }
  .brand img { width:24px; height:24px; flex:none; }
  .brand span { font-size:17px; font-weight:600; letter-spacing:-.2px; }
  .stat { display:flex; align-items:center; gap:16px; min-width:0; }
  .stat-text { text-align:right; min-width:0; }
  .stat-line { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-detail { font-size:12px; color:var(--muted); white-space:nowrap; margin-top:2px; }
  .stat-detail:empty { display:none; }
  .stat-pct { min-width:42px; text-align:right; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat-pct:empty { display:none; }
  .spinner {
    width:20px; height:20px; flex:none; border-radius:50%;
    border:3px solid rgba(var(--text-rgb),.2); border-top-color:var(--text);
    animation:rk-spin .75s linear infinite;
  }
  .spinner[hidden] { display:none; }
  @keyframes rk-spin { to { transform:rotate(360deg); } }

  /* only ever shown when the update could not be applied -- the normal path has no buttons at all */
  .retry {
    height:32px; padding:0 15px; border:1px solid var(--line2); border-radius:4px;
    background:var(--field); color:var(--text); cursor:pointer;
    transition:background 90ms linear, transform 130ms var(--ease_smooth);
  }
  .retry:hover { background:var(--line); }
  .retry:active { transform:scale(.97); }
  .retry[hidden] { display:none; }
</style>
</head>
<body>
<div class="shell">
  <main class="hero">
    <img class="hero-art" id="heroArt" src="http://127.0.0.1:8767/update-art" alt="" />
    <div class="hero-copy">
      <h1 class="hero-title" id="title">Updating ReplayKit</h1>
      <div class="hero-line" id="line1">Sit tight.</div>
      <div class="hero-line" id="line2">OBS restarts when it is done.</div>
    </div>
  </main>
  <footer class="foot">
    <div class="foot-fill" id="fill"></div>
    <div class="brand">
      <img src="http://127.0.0.1:8767/obs-icon.svg?v=3" alt="" />
      <span>ReplayKit</span>
    </div>
    <div class="stat">
      <div class="stat-text">
        <div class="stat-line" id="statLine">Checking for updates...</div>
        <div class="stat-detail" id="statDetail"></div>
      </div>
      <div class="stat-pct" id="statPct"></div>
      <button class="retry" type="button" id="retryBtn" hidden>Try again</button>
      <button class="retry" type="button" id="closeBtn" hidden>Close</button>
      <div class="spinner" id="spinner"></div>
    </div>
  </footer>
</div>
<script>
  (function lockdown() {
    const blockedCommandKeys = new Set(["+", "=", "-", "_", "0", "r", "R", "f", "F", "l", "L", "o", "O", "p", "P", "s", "S", "u", "U"]);
    const blockedCommandCodes = new Set(["Equal", "Minus", "Digit0", "NumpadAdd", "NumpadSubtract", "Numpad0"]);
    const blockedDevToolsCodes = new Set(["KeyI", "KeyJ", "KeyC"]);
    document.addEventListener("contextmenu", (e) => e.preventDefault(), true);
    document.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive:false, capture:true });
    document.addEventListener("keydown", (e) => {
      const command = e.ctrlKey || e.metaKey;
      if (command && (blockedCommandKeys.has(e.key) || blockedCommandCodes.has(e.code) || (e.shiftKey && blockedDevToolsCodes.has(e.code)))) { e.preventDefault(); return; }
      if (e.key === "F5" || e.code === "F5" || e.key === "F12" || e.code === "F12") { e.preventDefault(); return; }
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) e.preventDefault();
      if (e.key === "BrowserBack" || e.key === "BrowserForward") e.preventDefault();
    }, true);
  })();

  // DEV PREVIEW -- set to true to watch this whole screen (hero, progress bar, live speed/size, every stage, the
  // completion state) without downloading or installing anything. nothing else in the product reads it, and the page
  // is a static asset, so flipping it needs no rebuild: edit, copy to the live obs-custom-dock, reopen the window.
  // leave it false for real use, or the updater will never actually update.
  const PREVIEW_ONLY = false;

  const HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";
  const els = {
    title: document.getElementById("title"),
    line1: document.getElementById("line1"),
    line2: document.getElementById("line2"),
    fill: document.getElementById("fill"),
    statLine: document.getElementById("statLine"),
    statDetail: document.getElementById("statDetail"),
    statPct: document.getElementById("statPct"),
    spinner: document.getElementById("spinner"),
    retryBtn: document.getElementById("retryBtn"),
    closeBtn: document.getElementById("closeBtn"),
  };
  let latest = null;

  // the host (UpdatePromptWindow.cs) is a borderless webview2 form, so there is no title bar to grab and
  // -webkit-app-region does nothing here -- post a message on mousedown and the host starts the window move.
  if (window.chrome && window.chrome.webview) {
    document.addEventListener("mousedown", (e) => {
      if (e.button === 0 && !e.target.closest("button, a, input")) window.chrome.webview.postMessage("drag");
    });
  }

  async function helperJson(path, options) {
    const res = await fetch(HELPER + "/" + path, { cache:"no-store", ...(options || {}) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) {
      const error = new Error(body.message || body.error || ("HTTP " + res.status));
      error.data = body;
      throw error;
    }
    return body;
  }

  function closeWindow() {
    fetch(HELPER + "/close-window?title=ReplayKit%20Update&t=" + Date.now(), { method:"POST", cache:"no-store" }).catch(() => {});
    window.close();
    setTimeout(() => {
      try { window.open("", "_self"); } catch (_) {}
      try { window.close(); } catch (_) {}
    }, 25);
  }

  function setHero(title, first, second, bad) {
    els.title.textContent = title;
    els.title.classList.toggle("is-bad", !!bad);
    els.line1.textContent = first || "";
    els.line2.textContent = second || "";
  }

  // percent < 0 leaves the bar where it is -- used by the stages that have no measurable total
  function setStatus(line, detail, percent, kind) {
    els.statLine.textContent = line || "";
    els.statDetail.textContent = detail || "";
    if (typeof percent === "number" && percent >= 0) {
      els.fill.style.width = Math.max(0, Math.min(100, percent)) + "%";
      els.statPct.textContent = Math.round(percent) + "%";
    }
    els.fill.classList.toggle("is-done", kind === "done");
    els.fill.classList.toggle("is-bad", kind === "bad");
    els.spinner.hidden = kind === "done" || kind === "bad";
  }

  function formatBytes(n) {
    if (!(n > 0)) return "0 MB";
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
    return (n / (1024 * 1024)).toFixed(n < 10 * 1024 * 1024 ? 1 : 0) + " MB";
  }

  // download owns 0-70% of the bar, verify 70-80, install 80-100. real byte counts come from /update/progress.
  let progressTimer = 0;
  function startProgressPolling() {
    clearInterval(progressTimer);
    progressTimer = setInterval(async () => {
      try {
        const p = await helperJson("update/progress?t=" + Date.now());
        if (p.stage === "download") {
          const pct = p.total > 0 ? (p.done / p.total) * 70 : -1;
          const speed = p.bytesPerSecond > 0 ? (p.bytesPerSecond / (1024 * 1024)).toFixed(1) + " MB/s" : "";
          const size = p.total > 0 ? formatBytes(p.done) + " of " + formatBytes(p.total) : formatBytes(p.done);
          setStatus("Downloading ReplayKit update", speed ? speed + " (" + size + ")" : size, pct);
        } else if (p.stage === "verify") {
          setStatus("Verifying download", "", 76);
        } else if (p.stage === "install") {
          setStatus("Installing update", "", 82);
        }
      } catch (_) {}
    }, 400);
  }
  function stopProgressPolling() { clearInterval(progressTimer); progressTimer = 0; }

  // the installer runs detached and takes obs (and this helper) down with it, so "helper stopped answering" is an
  // expected stage here, not a failure. done when the new helper is back up and reports a verdict.
  function watchInstall(onComplete, onFail) {
    const started = Date.now();
    let percent = 82;
    let seenHelperDown = false;
    const timer = setInterval(async () => {
      try {
        const r = await fetch(HELPER + "/update/install-result?t=" + Date.now(), { cache:"no-store" });
        const body = await r.json().catch(() => ({}));
        if (body && body.present) {
          clearInterval(timer);
          if (body.installOk) onComplete();
          else onFail(body.message || "The installer reported a failure.");
          return;
        }
        percent = Math.min(percent + 0.7, seenHelperDown ? 97 : 90);
        setStatus(seenHelperDown ? "Copying ReplayKit files" : "Installing update", "", percent);
      } catch (_) {
        seenHelperDown = true;
        percent = Math.min(percent + 0.7, 97);
        setStatus("Closing OBS to apply files", "", percent);
      }
      if (Date.now() - started > 180000) {
        clearInterval(timer);
        onFail("The installer did not finish within 3 minutes.");
      }
    }, 1500);
  }

  // every failure lands here, so a stuck-looking bar is never the end state and there is always a way forward
  function failUpdate(message) {
    stopProgressPolling();
    setHero("Update failed", message || "The update could not be applied.", "OBS was left running.", true);
    setStatus("Update failed", "", 100, "bad");
    els.retryBtn.hidden = false;
    els.closeBtn.hidden = false;
  }

  async function installUpdate() {
    els.retryBtn.hidden = true;
    els.closeBtn.hidden = true;
    setStatus("Preparing download", "", 2);
    startProgressPolling();
    try {
      const data = await helperJson("update/apply", { method:"POST" });
      stopProgressPolling();
      if (data.updateAvailable === false) {
        setHero("ReplayKit is up to date", "You are on the latest version.", "");
        setStatus("Up to date", "", 100, "done");
        setTimeout(closeWindow, 1400);
        return;
      }
      setStatus("Installing update", "", 82);
      watchInstall(() => {
        setHero("Update complete", "ReplayKit " + (latest && latest.latestVersion ? latest.latestVersion : "") + " is installed.", "OBS is back up.");
        setStatus("Done", "", 100, "done");
        setTimeout(closeWindow, 1500);
      }, failUpdate);
    } catch (e) {
      stopProgressPolling();
      failUpdate(e.message || String(e));
    }
  }

  // walks the real setHero/setStatus paths on a timer so the preview exercises the same visuals as a live install,
  // just with invented numbers. deliberately does not auto-close at the end, so the finished state can be looked at.
  async function runPreview() {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const total = 24 * 1024 * 1024;
    setHero("ReplayKit 9.9.9", "Installing version 9.9.9.", "OBS restarts when it is done.");
    setStatus("Preparing download", "", 2);
    await wait(700);
    for (let done = 0; done <= total; done += total / 28) {
      const speed = (7 + Math.random() * 4).toFixed(1) + " MB/s";
      setStatus("Downloading ReplayKit update", speed + " (" + formatBytes(done) + " of " + formatBytes(total) + ")",
                (done / total) * 70);
      await wait(110);
    }
    setStatus("Verifying download", "", 76);
    await wait(900);
    setStatus("Installing update", "", 82);
    await wait(900);
    setStatus("Closing OBS to apply files", "", 90);
    await wait(1100);
    setStatus("Copying ReplayKit files", "", 97);
    await wait(900);
    setHero("Update complete", "ReplayKit 9.9.9 is installed.", "OBS is back up.");
    setStatus("Done", "", 100, "done");
  }

  async function start() {
    if (PREVIEW_ONLY) { runPreview(); return; }
    // a verdict written while no window was open (X'd out mid-install, or the watchdog aborted) is reported once
    try {
      const prev = await helperJson("update/install-result?t=" + Date.now());
      if (prev.present && !prev.seen) {
        await helperJson("update/install-result/ack", { method:"POST" }).catch(() => {});
        if (!prev.installOk) {
          setHero("The last update did not finish", prev.message || "The update stopped before it was applied.", "Trying again now.", true);
        }
      }
    } catch (_) {}

    try {
      const data = await helperJson("update/check?t=" + Date.now());
      latest = data;
      if (!data.updateAvailable) {
        setHero("ReplayKit is up to date", data.message || ("Version " + (data.installedVersion || "") + " is the latest."), "");
        setStatus("Up to date", "", 100, "done");
        setTimeout(closeWindow, 1600);
        return;
      }
      // no prompt: the update installs itself, the window only reports what is happening
      setHero(data.releaseName || ("ReplayKit " + data.latestVersion), "Installing version " + data.latestVersion + ".", "OBS restarts when it is done.");
      installUpdate();
    } catch (e) {
      failUpdate(e.message || String(e));
    }
  }

  els.retryBtn.addEventListener("click", installUpdate);
  els.closeBtn.addEventListener("click", closeWindow);
  start();
</script>
</body>
</html>
