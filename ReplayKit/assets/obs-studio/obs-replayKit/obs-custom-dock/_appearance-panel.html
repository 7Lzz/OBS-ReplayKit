<style>
  /* when this partial is dropped inside a host that already uses .box as a scroll container (the setup wizard), neutralise the nesting */
  .box .box { height:auto; overflow:visible; background:transparent; padding:0; margin:0 8px 12px 0; }
  .box .box + .box { border-top:1px solid var(--line); padding-top:10px; }
  /* setup.html has no stacked-field rules, so the theme grid + its buttons collapse onto one line there */

  .form-row[hidden] { display:none; }
  .volume-control {
    width:100%;
    display:grid;
    grid-template-columns:72px minmax(180px,1fr);
    align-items:center;
    gap:8px;

  .volume-value {
    background:transparent;
    border-color:var(--field-solid,var(--field));

    padding:0 8px;

  .volume-slider-wrap {
    position:relative;
    height:32px;
    min-width:0;
  }
  .volume-slider-wrap::before {
    content:"";
    position:absolute;
    z-index:0;
    left:0;
    right:0;
    top:50%;
    height:16px;
    transform:translateY(-50%);
    background:
      linear-gradient(to right, transparent 0, transparent calc(25% - .5px), rgba(var(--text-rgb),.34) calc(25% - .5px), rgba(var(--text-rgb),.34) calc(25% + .5px), transparent calc(25% + .5px)),
      linear-gradient(to right, transparent 0, transparent calc(50% - .5px), rgba(var(--text-rgb),.34) calc(50% - .5px), rgba(var(--text-rgb),.34) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(to right, transparent 0, transparent calc(75% - .5px), rgba(var(--text-rgb),.34) calc(75% - .5px), rgba(var(--text-rgb),.34) calc(75% + .5px), transparent calc(75% + .5px));
    background-repeat:no-repeat;
    background-size:100% 16px;
    background-position:center;
    pointer-events:none;
  }
  .volume-slider {
    position:relative;
    z-index:1;
    width:100%;
    height:32px;
    margin:0;
    appearance:none;
    -webkit-appearance:none;
    background:linear-gradient(to right, var(--selected2) var(--fill, 100%), var(--line2) var(--fill, 100%));
    background-repeat:no-repeat;
    background-size:100% 4px;
    background-position:center;
    border:0;
    outline:none;
  }
  .volume-slider::-webkit-slider-runnable-track {
    height:32px;
    background:transparent;
    border:0;
  }
  .volume-slider::-webkit-slider-thumb {
    appearance:none;
    -webkit-appearance:none;
    width:21px;
    height:10px;
    border:0;
    border-radius:5px;
    background:var(--text);
    margin-top:11px;
    box-shadow:0 0 0 1px rgba(var(--bg-rgb),.25);
    cursor:pointer;
  }
  .volume-slider:focus-visible::-webkit-slider-thumb {
    box-shadow:0 0 0 2px var(--selected2);
  }
  .color-control {
    width:100%;
    display:grid;
    grid-template-columns:42px minmax(120px, 180px);
    align-items:center;
    gap:8px;
  }
  .color-picker {
    width:42px;
    height:32px;
    border:1px solid var(--field-solid,var(--field));
    border-radius:4px;
    background:var(--color, var(--field));
    padding:3px;
    cursor:pointer;
    box-shadow:inset 0 0 0 3px var(--field-dark);
  }
  .color-picker:hover { border-color:var(--line2); }
  .color-value {
    width:100%;
    text-transform:lowercase;
  }
  .theme-section { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:transparent; }
  .theme-section + .theme-section { margin-top:9px; }
  .theme-section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:12px; font-weight:600; }
  .theme-section-hint { color:var(--muted); font-size:10px; font-weight:400; }
  .theme-editor { display:flex; flex-wrap:wrap; gap:8px; }
  .theme-preview-row { margin-top:8px; }

  .gradient-editor[hidden] { display:none; }
  .gradient-top { display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:center; }
  .gradient-preview { height:34px; border:1px solid var(--line2); border-radius:5px; background:var(--gradient-preview,var(--field)); }
  .gradient-control { display:grid; grid-template-columns:88px minmax(120px,1fr) 58px; align-items:center; gap:8px; margin-top:8px; }

  .gradient-number { width:58px; text-align:right; }

  .gradient-stop-list { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .gradient-stop-row { display:grid; grid-template-columns:42px minmax(120px,1fr) 58px 28px; align-items:center; gap:7px; }
  .gradient-stop-remove { min-width:28px; width:28px; padding:0; }

  .grad-targets { display:flex; gap:4px; flex-wrap:wrap; }
  .grad-target {
    display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; cursor:pointer;
    border:1px solid var(--line); border-radius:4px; background:var(--field); color:var(--text);
    font:inherit; font-size:12px;
  }
  .grad-target:hover { background:var(--line2); }
  .grad-target.is-active { border-color:var(--selected2); background:var(--selected); color:var(--on-accent,#fff); }
  /* filled only while that surface actually has a gradient, so the row doubles as an at-a-glance summary */
  .grad-target-dot { width:7px; height:7px; border-radius:50%; background:transparent; box-shadow:inset 0 0 0 1px currentColor; }
  .grad-target.has-gradient .grad-target-dot { background:currentColor; }

  /* gradient stop ramp -- stops are dragged directly on the ramp that shows them, rather than edited as a list of number fields. --ramp is the left-to-right colour run, set from js. */
  .grad-ramp {
    position:relative; height:38px; margin:2px 0 0; border:1px solid var(--line2); border-radius:5px;
    background-image:var(--ramp,none); background-color:var(--field-dark); cursor:copy;
  }
  /* handles borrow the trim bar's endcap language from clips.html -- same 12px full-height cap, 5px radius and
     shadow. the white body becomes an inset ring instead, so the stop's colour reads through the middle; the
     trim grip stroke is dropped rather than layered under the colour, where it would only show on pale stops. */
  .grad-ramp-handle {
    position:absolute; top:-1px; bottom:-1px; left:0; width:12px; margin-left:-6px; padding:0;
    border:0; border-radius:5px; cursor:grab; background:var(--color,#000);
    box-shadow:inset 0 0 0 2px var(--text), 0 0 0 1px rgba(0,0,0,.35), 0 1px 6px rgba(0,0,0,.45);
  }
  .grad-ramp-handle.is-selected { box-shadow:inset 0 0 0 2px var(--text), 0 0 0 2px var(--selected2), 0 1px 6px rgba(0,0,0,.45); z-index:2; }
  .grad-ramp-handle.is-dragging { cursor:grabbing; }
  .grad-ramp-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:7px; }
  .grad-ramp-foot .btn { flex:none; height:26px; padding:0 10px; font-size:12px; }

  /* the floating colour picker lives in the shared _color-picker partial now */

  /* small "i" that reveals an item's note in the shared tooltip on hover, keyboard focus or click. */
  .info-dot {
    flex:none; margin-left:4px; padding:0; width:15px; height:15px;
    display:inline-flex; vertical-align:middle;
    border:0; background:transparent; color:var(--muted);
    cursor:help; -webkit-user-select:none; user-select:none;
    transition:transform var(--anim_press) var(--ease_pop), color 90ms ease;
  }
  .info-dot::before {
    content:""; width:100%; height:100%; background-color:currentColor;
    -webkit-mask:url(/icons/ui/info.svg) center / contain no-repeat;
    mask:url(/icons/ui/info.svg) center / contain no-repeat;
  }
  .info-dot:hover { color:var(--text); transform:scale(1.12); }
  .info-dot:active { transform:scale(.94); }
  .info-dot:focus { outline:none; }
  .info-dot:focus-visible { color:var(--text); border-radius:50%; box-shadow:0 0 0 2px var(--selected2,#476BD7); }
  .theme-preview-row { margin-top:8px; }
  .theme-preview-row .btn { height:26px; padding:0 10px; font-size:12px; }
  .theme-section-hint { color:var(--muted); font-size:10px; font-weight:400; }
  .icon-tile-del { position:absolute; top:3px; right:3px; display:flex; align-items:center; justify-content:center; width:16px; height:16px; padding:0; border:0; border-radius:4px; background:var(--field); color:var(--muted); cursor:pointer; opacity:0; transition:opacity 120ms; }
  .icon-tile:hover .icon-tile-del { opacity:1; }
  .icon-tile-del:hover { background:var(--field-dark); color:var(--danger); }
  .icon-tile-del svg { width:8px; height:8px; fill:currentColor; }
  .icon-tile-edit { position:absolute; top:3px; left:3px; display:flex; align-items:center; justify-content:center; width:18px; height:18px; padding:0; border:0; border-radius:4px; background:var(--field); color:var(--muted); cursor:pointer; opacity:0; transition:opacity 120ms; }
  .icon-tile:hover .icon-tile-edit { opacity:1; }
  .icon-tile-edit:hover { background:var(--field-dark); color:var(--text); }
  .icon-tile-edit svg { width:10px; height:10px; fill:currentColor; }
</style>

<script>
(function () {
  var HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";

  var originalState = null;
  var host = { get: function () {}, set: function () {}, onChange: function () {}, setStatus: function () {} };

    var body = await res.json().catch(function () { return {}; });
    if (!res.ok || body.ok === false) throw new Error(body.message || body.error || ("HTTP " + res.status));

    var pct = Math.max(0, Math.min(100, ((value - min) / span) * 100));
    slider.style.setProperty("--fill", pct + "%");
  }
  var cleanHexColor = window.RKColor.cleanHexColor, setColorButton = window.RKColor.setColorButton;
  var rgbToHex = window.RKColor.rgbToHex, hexToRgb = window.RKColor.hexToRgb, rgbToHsv = window.RKColor.rgbToHsv, hsvToHex = window.RKColor.hsvToHex;
  var openColorDialog = window.openColorDialog;

  function comboValue(c) { return c.dataset.value || ""; }
  function renderCombo(c) {
    var opts = c._opts || [];
    var v = c.dataset.value;
    var cur = opts.find(function (o) { return o.value === v; }) || opts[0] || { label: "" };
    var lbl = c.querySelector(".combo-label"); if (lbl) lbl.textContent = cur.label || "";
    var menu = c.querySelector(".combo-menu");
    if (menu) menu.innerHTML = opts.map(function (o) {
      return '<div class="combo-option' + (o.value === v ? " is-selected" : "") + '" data-value="' + o.value + '">' + o.label + '</div>';
    }).join("");
  }
  function fillCombo(c, opts) {
    c._opts = opts || [];
    if (!c.dataset.value && opts && opts[0]) c.dataset.value = opts[0].value;

      if (open) document.querySelectorAll(".combo.is-open").forEach(function (o) { if (o !== c) { o.classList.remove("is-open"); o.setAttribute("aria-expanded", "false"); } });

   "themeGradientAngle", "themeGradientAngleValue", "themeGradientCenterX", "themeGradientCenterXValue", "themeGradientCenterY",
   "themeGradientCenterYValue", "themeGradientRamp", "removeGradientStopBtn", "themeCustomDark", "themeName", "cancelThemeEditBtn",
   "saveThemeBtn", "openThemeClipsBtn", "appIconGrid", "appIconCustomRow", "appIconCustomPath", "browseAppIcon", "appIconRecordingDot"
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  function unquote(s) {

    return s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"' ? s.slice(1, -1).trim() : s;

      del.title = "Remove";
      del.innerHTML = APPICON_X_SVG;
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteUserIcon(id); });
      tile.appendChild(del);
    }
    return tile;
  }
  async function deleteUserIcon(id) {
    let data;
    try { data = await helperJson("appearance/delete-icon?file=" + encodeURIComponent(id), { method: "POST" }); }
    catch (e) { setStatus("Could not remove icon", "bad"); return; }
    if (!data || !data.ok) { setStatus((data && data.message) || "Could not remove icon", "bad"); return; }
    if (state.appIcon === id) {
      state.appIcon = "default";
      if (originalState) originalState.appIcon = "default";
    }
    await renderAppIconGrid();
  }
  async function renderAppIconGrid() {
    let data;
    try { data = await helperJson("appearance/icons"); } catch (e) { return; }
    els.appIconGrid.innerHTML = "";
    for (const ic of (data.icons || []))
      els.appIconGrid.appendChild(appIconTile(ic.id, ic.label || ic.id, ic.url || "", ic.id === "default" ? "OBS" : "", !!ic.deletable));
    els.appIconGrid.appendChild(appIconTile("custom", "Custom…", "", "＋", false));
    paintAppIconSelection();
  }
  /* renderAppIconGrid -> boot() */
  els.appIconCustomPath.addEventListener("input", () => {
    state.appIconCustomPath = unquote(els.appIconCustomPath.value);
    if (state.appIconCustomPath && state.appIcon !== "custom") { state.appIcon = "custom"; paintAppIconSelection(); }
    markDirty();
  });

  function boot() {
    fillCombo(els.themeGradientType, [{ value: "linear", label: "Linear" }, { value: "radial", label: "Radial" }]);
    wireCombo(els.themeGradientType);
    renderThemeGrid();
    renderAppIconGrid();
    if (els.appIconRecordingDot) {
      els.appIconRecordingDot.checked = state.appIconRecordingDot !== false;
      els.appIconRecordingDot.addEventListener("change", function () { state.appIconRecordingDot = els.appIconRecordingDot.checked; markDirty(); });
    }
    if (els.browseAppIcon) {
      els.browseAppIcon.addEventListener("click", async function () {
        els.browseAppIcon.disabled = true;
        var p = await browsePathHelper("browse-file", els.appIconCustomPath.value.trim());
        els.browseAppIcon.disabled = false;
        if (p) { els.appIconCustomPath.value = p; els.appIconCustomPath.dispatchEvent(new Event("input")); }
      });
    }
  }

  window.RKAppearance = {
    init: function (h) {
      if (h) host = Object.assign(host, h);
      ["theme", "themeCustom", "appIcon", "appIconCustomPath", "appIconRecordingDot"].forEach(function (k) {
        var v = host.get(k);
        if (v !== undefined && v !== null) state[k] = v;
      });
      if (!state.theme) state.theme = "default";
      boot();
    },
    collect: function () {
      return {
        theme: state.theme,
        themeCustom: state.theme === "custom" ? themeCustomState() : (state.themeCustom || undefined),
        appIcon: state.appIcon || "default",
        appIconCustomPath: state.appIconCustomPath || "",
        appIconRecordingDot: state.appIconRecordingDot !== false,
      };
    },
  };
})();
</script>
