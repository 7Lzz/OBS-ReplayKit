      var seen = dom.frame.scrollLeft - axisLeft();
      // the pieces that were moved past an end of the clip are drawn too, in the room the timeline made for them
      var from = Math.max(-st.extL, seen - CANVAS_MARGIN);
      var to = Math.min(aw + st.extR, seen + vw + CANVAS_MARGIN);
      var w = Math.max(1, Math.ceil(to - from));
      var h = rec.el.clientHeight || 40;
      var dpr = window.devicePixelRatio || 1;
      var cv = rec.canvas;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
      }
      cv.style.left = from + "px";
      var ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.save();
      if (prefs.trimAudioWithVideo) {
        var cut = windowT();
        roundRect(ctx, cut.start * pxPerSec() - from, 0, (cut.end - cut.start) * pxPerSec(), h, 5);
        ctx.clip();
      }
      var pal = palette();
      lane.segments.forEach(function (seg) { drawSeg(ctx, seg, from, w, h, pal, lane.segments); });
      ctx.restore();
      rec.from = from;
      rec.to = to;
    }

    // the frame of the clip nearest to a place on the timeline, as a fraction of its length; frames that have not been captured yet are not in the running
    function frameAt(frac) {
      var best = null;
      var bestD = Infinity;
      film.frames.forEach(function (f) {
        if (!f.ok) return;
        var d = Math.abs(f.t / st.Dsrc - frac);
        if (d < bestD) { bestD = d; best = f; }
      });
      return best;
    }

    // the frames of the clip along the video row. every cell is as wide as the row is tall times the aspect of the video and shows the captured frame nearest to the middle of the cell, so a zoomed timeline repeats a frame and never stretches one. like the lanes, only the part in view is drawn
    function drawFilm() {
      var host = dom.strip;
      if (!host) return;
      if (!film || !(st.Dsrc > 0) || !(axisW() > 0)) {
        if (filmCanvas) { filmCanvas.remove(); filmCanvas = null; }
        return;
      }
      var aw = axisW();
      var vw = dom.frame.clientWidth;
      var seen = dom.frame.scrollLeft - axisLeft();
      // the room past the ends of the video is drawn too, for the pieces that lie there
      var from = Math.max(-st.extL, seen - CANVAS_MARGIN);
      var to = Math.min(aw + st.extR, seen + vw + CANVAS_MARGIN);
      var w = Math.max(1, Math.ceil(to - from));
      var h = host.clientHeight || 40;
      var dpr = window.devicePixelRatio || 1;
      if (!filmCanvas) filmCanvas = el("canvas", "tl-film");
      if (filmCanvas.parentNode !== host) host.appendChild(filmCanvas);
      var cv = filmCanvas;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
      }
      cv.style.left = from + "px";
      var ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var pps = pxPerSec();
      // the saved clip is black where no piece of the video is, but the row stays empty there like the audio rows do, so a clip added past the end does not paint a black block over it
      var cell = Math.max(24, h * film.aspect);
      st.vsegs.forEach(function (v) {
        var x0 = v.at * pps - from;
        var span = vLen(v) * pps;
        if (x0 + span < -2 || x0 > w + 2) return;
        var edges = touches(v, st.vsegs, vEnd);
        if (!piecePath(ctx, x0, span, h, edges)) return;
        ctx.save();
        ctx.clip();
        var pic = v.ref ? refThumb(v.ref) : null;
        // the cells start at the left edge of the piece, and each one shows the frame nearest to the middle of the cell
        for (var k = Math.max(0, Math.floor(-x0 / cell)); k * cell < span; k++) {
          var x = x0 + k * cell;
          if (x > w) break;
          var cw = Math.min(cell, span - k * cell);
          if (v.ref) {
            if (pic) drawCover(ctx, pic, x, 0, cell, h);
          } else {
            var f = frameAt(clamp((v.srcStart + (k * cell + cw / 2) / pps * vSpeed(v)) / st.Dsrc, 0, 1));
            if (f) ctx.drawImage(f.canvas, x, 0, cell, h);
          }
          ctx.fillStyle = "rgba(0, 0, 0, .6)";
          ctx.fillRect(x + cw - 1, 0, 1, h);
        }
        ctx.restore();
      });
    }

    // the picture of another clip for its pieces on the video row, loaded once
    var refThumbs = {};
    function refThumb(ref) {
      var img = refThumbs[ref];
      if (!img) {
        img = refThumbs[ref] = new Image();
        img.onload = drawSoon;
        img.src = opts.helper + "/thumb/" + encodeURIComponent(ref);
      }
      return img.complete && img.naturalWidth ? img : null;
    }
    // drawn over the whole cell and cut to it, so a clip of another shape is never stretched
    function drawCover(ctx, img, x, y, w, h) {
      var k = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      var sw = w / k, sh = h / k;
      ctx.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
    }

    function drawNow() {
      frameQueued = 0;
      drawFilm();
      if (!st.ready) return;
      st.lanes.forEach(drawLane);
    }
    function drawSoon() {
      if (!frameQueued) frameQueued = requestAnimationFrame(drawNow);
    }

    // the ruler is made for the part of the timeline in view and again when the view moves
    function renderRuler() {
      rulerQueued = 0;
      var ruler = dom.ruler;
      var pps = pxPerSec();
      if (!ruler || !(pps > 0)) return;
      var vw = dom.frame.clientWidth;
      var seen = dom.frame.scrollLeft - axisLeft();
      // the marks go on into the room past the ends of the video, where the times before the start are negative
      var from = Math.max(-st.extL, seen - 200);
      var to = Math.min(axisW() + st.extR, seen + vw + 200);
      var step = niceStep(pps);
      var decimals = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
      var frag = document.createDocumentFragment();
      var k0 = Math.floor(from / pps / step);
      var t1 = to / pps;
      for (var k = k0; k * step <= t1 + 1e-9; k++) {
        var t = k * step;
        // the mark at the very end of the timeline stands left of its line, so the number stays inside the frame, unless there is room past it
        var atEnd = k > 0 && st.extR === 0 && t * pps > axisW() - 14;
        var mark = el("span", "trim-time-mark" + (k === 0 && st.extL === 0 ? " is-zero" : atEnd ? " is-end" : ""));
        mark.style.left = (t * pps) + "px";
        mark.textContent = fmt(t, decimals);
        frag.appendChild(mark);
      }
      var minor = step / 5;
      if (minor * pps >= 7) {
        var m0 = Math.floor(from / pps / minor);
        for (var m = m0; m * minor <= t1 + 1e-9; m++) {
          if (m % 5 === 0) continue;
          var tick = el("span", "trim-time-minor");
          tick.style.left = (m * minor * pps) + "px";
          frag.appendChild(tick);
        }
      }
      ruler.replaceChildren(frag);
    }
    function rulerSoon() {
      if (!rulerQueued) rulerQueued = requestAnimationFrame(renderRuler);
    }

    function layout() {
      applyZoomWidth();
      renderRuler();
      drawSoon();
      refreshToolbar();
      paintHandles();
      barUpdates.forEach(function (fn) { fn(); });
    }

    function setZoom(z, anchorClientX) {
      var frame = dom.frame;
      z = clamp(z, minZoom(), maxZoom());
      var rect = frame.getBoundingClientRect();
      var ax = anchorClientX != null ? anchorClientX - rect.left : frame.clientWidth / 2;
      var before = pxPerSec();
      var tAnchor = before > 0 ? (frame.scrollLeft + ax - axisLeft()) / before : 0;
      st.zoom = z;
      applyZoomWidth();
      applyOverflow();
      frame.scrollLeft = Math.max(0, tAnchor * pxPerSec() + axisLeft() - ax);
      layout();
    }

    // the playhead, the dimmed parts outside the cut and the guide of a snap, all in percent so a zoom never has to move them. the host gives seconds of the video
    function setPlayhead(tv) {
      if (!D()) return;
      // while the timeline plays by itself the playhead may be past the ends of the video, in the room made for the pieces there
      var t = vt.on ? vt.T : tv / st.vspeed;
      var pct = (vt.on ? t / D() : clamp(t / D(), 0, 1)) * 100;
      if (els.playline) els.playline.style.left = pct + "%";
      paintOverlay();
      paintLayers();
      if (els.time) els.time.firstChild.textContent = fmt(t, 1) + " ";
      var pps = pxPerSec();
      if (pps > 0 && st.zoom > 1 && opts.isPlaying()) {
        // playing past the edge of what is in view brings the next page of the timeline in
        var x = t * pps + axisLeft();
        var frame = dom.frame;
        if (x > frame.scrollLeft + frame.clientWidth - 40 || x < frame.scrollLeft) frame.scrollLeft = Math.max(0, x - 40);
      }
    }

    function setBoundsUi(startV, endV) {
      if (!st.Dsrc || !els.dimStart) return;
      // a cut that is only a few pixels short of an end of the clip is no cut, and the sliver of dimming it would leave reads as a dark bar at the end of the tracks
      var pxPerSrc = axisW() / st.Dsrc;
      var a = startV * pxPerSrc < 3 ? 0 : clamp(startV / st.Dsrc, 0, 1);
      var b = (st.Dsrc - endV) * pxPerSrc < 3 ? 0 : clamp(1 - endV / st.Dsrc, 0, 1);
      // a cut that is drawn in from a side also leaves out what lies in the room past that end of the video
      els.dimStart.style.left = a > 0 ? "calc(-1 * var(--tl-ext-l, 0px))" : "0";
      els.dimStart.style.width = a > 0 ? "calc(" + a * 100 + "% + var(--tl-ext-l, 0px))" : "0%";
      // the blank room past everything is not part of the clip, so the dimming stops where the last piece does
      els.dimEnd.style.right = b > 0 ? "calc(-1 * var(--tl-reach-r, 0px))" : "0";
      els.dimEnd.style.width = b > 0 ? "calc(" + b * 100 + "% + var(--tl-reach-r, 0px))" : "0%";
      var cut = prefs.trimAudioWithVideo ? windowT() : null;
      allSegs().forEach(function (h) { if (segEls[h.seg.id]) positionSeg(h.seg, segEls[h.seg.id], cut); });
      // the cut decides how far the saved clip reaches past the video, so it decides whether the timeline plays by itself
      syncVmode();
      paintHandles();
      drawSoon();
    }

    // scrollbars. the frame scrolls by itself with its own bars hidden, and these follow it from outside the frame
    function makeBar(barEl, axis) {
      var thumb = el("div", "tl-thumb");
      barEl.appendChild(thumb);
      var horizontal = axis === "x";
      function metrics() {
        var f = dom.frame;
        return horizontal
          ? { view: f.clientWidth, total: f.scrollWidth, pos: f.scrollLeft, track: barEl.clientWidth }
          : { view: f.clientHeight, total: f.scrollHeight, pos: f.scrollTop, track: barEl.clientHeight };
      }
      function thumbLength(m) { return Math.max(30, m.track * m.view / m.total); }
      function update() {
        var m = metrics();
        if (m.total <= m.view + 1 || m.track <= 0) { barEl.classList.remove("is-active"); return; }
        barEl.classList.add("is-active");
        var len = thumbLength(m);
        var off = (m.track - len) * (m.pos / Math.max(1, m.total - m.view));
        thumb.style[horizontal ? "width" : "height"] = len + "px";
        thumb.style.transform = horizontal ? "translateX(" + off + "px)" : "translateY(" + off + "px)";
      }
      thumb.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        e.stopPropagation();
        thumb.setPointerCapture(e.pointerId);
        thumb.classList.add("is-dragging");
        var m0 = metrics();
        var start = horizontal ? e.clientX : e.clientY;
        var ratio = (m0.total - m0.view) / Math.max(1, m0.track - thumbLength(m0));
        var move = function (ev) {
          var d = (horizontal ? ev.clientX : ev.clientY) - start;
          if (horizontal) dom.frame.scrollLeft = m0.pos + d * ratio;
          else dom.frame.scrollTop = m0.pos + d * ratio;
        };
        var up = function () {
          thumb.classList.remove("is-dragging");
          thumb.removeEventListener("pointermove", move);
          thumb.removeEventListener("pointerup", up);
          thumb.removeEventListener("pointercancel", up);
        };
        thumb.addEventListener("pointermove", move);
        thumb.addEventListener("pointerup", up);
        thumb.addEventListener("pointercancel", up);
      });
      // a press in the gutter next to the thumb moves the view by a page
      barEl.addEventListener("pointerdown", function (e) {
        if (e.target === thumb) return;
        var r = thumb.getBoundingClientRect();
        var before = horizontal ? e.clientX < r.left : e.clientY < r.top;
        var m = metrics();
        var step = m.view * 0.9 * (before ? -1 : 1);
        if (horizontal) dom.frame.scrollLeft += step;
        else dom.frame.scrollTop += step;
      });
      return update;
    }

    // toolbar

    function button(name, iconName, tip, handler) {
      var b = el("button", "tl-btn");
      b.type = "button";
      b.dataset.tooltip = tip;
      b.setAttribute("aria-label", tip.replace(/\s*\(.*\)$/, ""));
      b.innerHTML = icon(iconName);
      b.addEventListener("click", function (e) { e.stopPropagation(); handler(); });
      els[name] = b;
      return b;
    }
    function group() {
      var g = el("div", "tl-group");
      for (var i = 0; i < arguments.length; i++) g.appendChild(arguments[i]);
      return g;
    }

    function buildToolbar() {
      var tb = dom.toolbar;
      tb.textContent = "";
      var left = el("div", "tl-side");
      left.appendChild(group(
        button("split", "action/content-cut", "Split at the playhead (S)", doSplit),
        button("del", "action/trash", "Delete (Backspace)", doDelete),
        button("deselect", "editor/deselect", "Deselect (Esc)", function () { select(""); }),
        button("markIn", "editor/mark-in", "Start the cut here ([)", markIn),
        button("markOut", "editor/mark-out", "End the cut here (])", markOut),
        button("waves", "editor/waveform", "Show the waveforms", function () { prefs.waves = !prefs.waves; savePrefs(); refreshToolbar(); drawSoon(); })
      ));
      els.del.classList.add("tl-delete");
      els.deselect.classList.add("tl-deselect");
      els.busy = el("div", "tl-busy");
      els.busy.textContent = "Importing audio";
      left.appendChild(els.busy);
      tb.appendChild(left);
      var time = el("div", "tl-time");
      time.appendChild(document.createTextNode("0:00.0 "));
      var total = el("span");
      total.textContent = "/ 0:00.0";
      time.appendChild(total);
      els.time = time;
      els.total = total;
      // the host adds its volume and fullscreen buttons to this group
      var playGroup = group(
        button("stop", "editor/stop", "Stop", function () { opts.stop(); }),
        button("play", "editor/play", "Play and pause (Space)", function () { opts.togglePlay(); }),
        time
      );
      playGroup.classList.add("tl-play-group");
      tb.appendChild(playGroup);
      var right = el("div", "tl-side tl-side-end");
      right.appendChild(group(
        button("undo", "editor/undo", "Undo (Ctrl+Z)", undo),
        button("redo", "editor/redo", "Redo (Ctrl+Shift+Z)", redo)
      ));
      right.appendChild(el("span", "tl-sep"));
      right.appendChild(group(
        button("snap", "editor/magnet", "Snap to edges and the playhead", function () { prefs.snap = !prefs.snap; savePrefs(); refreshToolbar(); }),
        button("trimAudioWithVideo", "editor/trim-audio", "Trim the audio with the video", toggleTrimAudioWithVideo),
        button("fit", "editor/fit-timeline", "Fit to zoom (0)", fitView),
        button("zoomOut", "editor/zoom-out", "Zoom out (-)", function () { setZoom(st.zoom / ZOOM_STEP); }),
        button("zoomIn", "editor/zoom-in", "Zoom in (+)", function () { setZoom(st.zoom * ZOOM_STEP); })
      ));
      tb.appendChild(right);
    }

    // the whole timeline in view, from its start, with nothing left to scroll
    function fitView() {
      setZoom(minZoom());
      dom.frame.scrollLeft = 0;
    }

    function savePrefs() {
      try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* the choice lasts until the editor is closed */ }
    }

    function canSplitAt(seg, t) { return t > seg.at + MIN_LEN && t < segEnd(seg) - MIN_LEN; }
    function canSplitV(v, t) { return t > v.at + MIN_LEN && t < vEnd(v) - MIN_LEN; }

    function refreshToolbar() {
      if (!els.split) return;
      var hit = selected();
      var pickV = selectedV();
      var t = nowT();
      var lanes = st.ready && st.lanes.length > 0;
      var underV = st.vsegs.some(function (v) { return canSplitV(v, t); });
      var underPlayhead = (lanes && allSegs().some(function (h) { return canSplitAt(h.seg, t); })) || underV;
      var pickL = findLayer(st.selected);
      var cuttable = pickL ? t > pickL.at + LAYER_MIN && t < pickL.end - LAYER_MIN : pickV ? canSplitV(pickV.seg, t) : hit ? canSplitAt(hit.seg, t) : st.selected === "video" ? underV : underPlayhead;
      els.split.disabled = !(lanes || st.vsegs.length || pickL) || !cuttable;
      els.del.disabled = !selectedGap && !hit && !pickV && !findSub(st.selected) && !findLayer(st.selected);
      els.deselect.disabled = !st.selected && !selectedGap && !subPicked.length;
      els.waves.disabled = !lanes;
      if (opts.onSubtitles) opts.onSubtitles();
      els.waves.classList.toggle("is-active", prefs.waves);
      els.snap.classList.toggle("is-active", prefs.snap);
      els.trimAudioWithVideo.classList.toggle("is-active", prefs.trimAudioWithVideo);
      els.trimAudioWithVideo.setAttribute("aria-pressed", prefs.trimAudioWithVideo ? "true" : "false");
      if (dom.tracks) dom.tracks.classList.toggle("is-trimming-audio", prefs.trimAudioWithVideo);
      els.undo.disabled = st.history.length < 2;
      els.redo.disabled = st.future.length === 0;
      if (opts.onHistory) opts.onHistory();
      var lowest = minZoom();
      els.zoomOut.disabled = st.zoom <= lowest + 0.001;
      els.fit.disabled = st.zoom <= lowest + 0.001;
      els.zoomIn.disabled = st.zoom >= maxZoom() - 0.001;
      var playing = !!opts.isPlaying();
      if (playing !== playShown) {
        playShown = playing;
        els.play.innerHTML = icon(playing ? "editor/pause" : "editor/play");
      }
      // the total is where the saved clip ends on the ruler, which is past the end of the video where pieces reach past it
      if (els.total) els.total.textContent = "/ " + fmt(vt.on ? windowT().end : D(), 1);
      st.vsegs.forEach(function (v) {
        var chip = !v.ref && vsegEls[v.id] && vsegEls[v.id].querySelector(".tl-chip-label");
        if (chip && chip.textContent !== videoLabel(v)) chip.textContent = videoLabel(v);
      });
    }

    // properties panel

    // a slider drawn like the sliders of the settings, whose filled part follows its value
    function paintFill(input) {
      var min = Number(input.min);
      var max = Number(input.max);
      var pct = max > min ? clamp((Number(input.value) - min) / (max - min), 0, 1) * 100 : 0;
      input.style.setProperty("--fill", pct + "%");
    }

    // one setting of the panel: the name with its reset button, then the slider and the value field; cfg holds the range, how a value is shown, how it maps to the slider and back, what a change writes, what the reset writes, and what goes between the name and the slider
    function makeRow(box, cfg) {
      var row = el("div", "tl-field");
      var label = el("span", "tl-label");
      label.textContent = cfg.label;
      var value = el("input", "tl-value");
      value.type = "text";
      value.inputMode = "decimal";
      value.autocomplete = "off";
      value.setAttribute("aria-label", cfg.label);
      var wrap = el("div", "tl-slider-wrap");
      var slide = el("input", "tl-slider rk-range");
      slide.type = "range";
      slide.min = String(cfg.min);
      slide.max = String(cfg.max);
      slide.step = String(cfg.step);
      slide.setAttribute("aria-label", cfg.label + " slider");
      wrap.appendChild(slide);
      var reset = el("button", "tl-reset");
      reset.type = "button";
      reset.setAttribute("aria-label", "Reset " + cfg.label.toLowerCase());
      reset.dataset.tooltip = "Reset to default";
      reset.innerHTML = icon("action/reset");
      var head = el("div", "tl-field-head");
      head.appendChild(label);
      head.appendChild(reset);
      row.appendChild(head);
      if (cfg.before) row.appendChild(cfg.before);
      var line = el("div", "tl-field-line");
      line.appendChild(wrap);
      line.appendChild(value);
      row.appendChild(line);
      box.appendChild(row);
      slide.addEventListener("input", function () { paintFill(slide); cfg.write(cfg.fromSlide(Number(slide.value))); });
      slide.addEventListener("change", function () { commit(); });
      value.addEventListener("change", function () {
        var v = parseFloat(String(value.value).replace(",", "."));
        if (isFinite(v)) { cfg.write(v); commit(); } else renderProps();
      });
      value.addEventListener("keydown", function (e) { if (e.key === "Enter") value.blur(); e.stopPropagation(); });
      reset.addEventListener("click", function () { cfg.write(cfg.reset); commit(); });
      return {
        slide: slide,
        // what the slider and the field show for a value of the model
        show: function (number) { slide.value = String(cfg.toSlide(number)); value.value = cfg.format(number); paintFill(slide); },
      };
    }

    // the speed of a piece and the speed of the video are the same kind of setting: the marks for the usual speeds under the name, then the slider
    function makeSpeedRow(box, write) {
      var strip = el("div", "tl-speeds");
      var list = SPEEDS.map(function (v) {
        var b = el("button", "btn tl-mini");
        b.type = "button";
        b.textContent = v + "x";
        b.addEventListener("click", function () { write(v); commit(); });
        strip.appendChild(b);
        return { v: v, b: b };
      });
      var row = makeRow(box, {
        label: "Speed", min: SPEED_MIN, max: SPEED_MAX, step: SPEED_STEP, before: strip,
        format: function (v) { return r3(v) + "x"; },
        toSlide: function (v) { return v; },
        fromSlide: function (x) { return x; },
        write: write, reset: 1,
      });
      return {
        show: function (speed) {
          row.show(speed);
          list.forEach(function (x) { x.b.classList.toggle("is-active", Math.abs(x.v - speed) < 0.001); });
        },
      };
    }

    // Keep the explanation beneath the switch label.
    function checkRow(box, text, onChange, tip) {
      var label = el("div", "trim-mode-row");
      var input = el("input", "rk-switch");
      input.type = "checkbox";
      input.setAttribute("aria-label", text);
      var span = el("span");
      span.textContent = text;
      label.appendChild(input);
      label.appendChild(span);
      if (tip) {
        span.appendChild(el("span", "control-note", tip));
      }
      input.addEventListener("change", function () { onChange(input.checked); });
      box.appendChild(label);
      return input;
    }

    function buildProps() {
      var root = dom.props;
      root.textContent = "";
      root.className = "editor-card tl-props";
      root.hidden = true;
      var head = el("div", "tl-props-head");
      els.propsTitle = el("div", "editor-card-title");
      els.source = el("div", "tl-source");
      var close = el("button", "tl-x");
      close.type = "button";
      close.setAttribute("aria-label", "Close");
      close.innerHTML = icon("editor/close");
      close.addEventListener("click", function () { setPanelClosed(true); });
      head.appendChild(els.propsTitle);
      head.appendChild(els.source);
      head.appendChild(close);
      root.appendChild(head);

      // the properties of a piece of audio
      var audio = el("div", "tl-box");
      els.audioBox = audio;
      root.appendChild(audio);
      els.vol = makeRow(audio, {
        label: "Volume", min: 0, max: 200, step: 1,
        format: function (v) { return Math.round(v) + "%"; },
        toSlide: function (v) { return v; },
        fromSlide: function (x) { return x; },
        write: function (v) { editPiece(function (s) { s.volume = r3(clamp(v / 100, 0, 4)); }); },
        reset: 100,
      });
      var fadeFormat = function (v) { return r3(v) + "s"; };
      var same = function (v) { return v; };
      els.fin = makeRow(audio, {
        label: "Fade in", min: 0, max: 10, step: 0.1, format: fadeFormat, toSlide: same, fromSlide: same,
        write: function (v) { editPiece(function (s) { s.fadeIn = r3(clamp(v, 0, 3600)); clampFades(s); }); },
        reset: 0,
      });
      els.fout = makeRow(audio, {
        label: "Fade out", min: 0, max: 10, step: 0.1, format: fadeFormat, toSlide: same, fromSlide: same,
        write: function (v) { editPiece(function (s) { s.fadeOut = r3(clamp(v, 0, 3600)); clampFades(s); }); },
        reset: 0,
      });
      els.speed = makeSpeedRow(audio, function (v) { editPiece(function (s) { setSpeed(s, v); }); });
      els.pitch = checkRow(audio, "Preserve pitch", function (on) { editPiece(function (s) { s.pitch = on; }); commit(); }, "Keeps the sound at its normal pitch when you change the speed, so faster parts don't sound high and squeaky.");

      // the properties of a layer
      var lay = el("div", "tl-box");
      els.layerBox = lay;
      lay.hidden = true;
      root.appendChild(lay);
      var pct = function (v) { return Math.round(v) + "%"; };
      var same = function (v) { return v; };
      els.lsize = makeRow(lay, {
        label: "Size", min: 2, max: 200, step: 1, format: pct, toSlide: same, fromSlide: same,
        write: function (v) { editLayer(function (l) { l.w = clamp(v / 100, LAYER_RANGES.w[0], LAYER_RANGES.w[1]); }); },
        reset: 100,
      });
      els.llen = makeRow(lay, {
        label: "Length", min: LAYER_MIN, max: 60, step: 0.1, format: function (v) { return r3(v) + "s"; }, toSlide: same, fromSlide: same,
        write: function (v) { editLayer(function (l) { l.end = r3(clamp(l.at + v, l.at + LAYER_MIN, layerEndMax(l))); }); syncLayers(); },
        reset: 5,
      });
      els.lrotate = makeRow(lay, {
        label: "Rotation", min: -180, max: 180, step: 1, format: function (v) { return Math.round(v) + "\u00b0"; }, toSlide: same, fromSlide: same,
        write: function (v) { editLayer(function (l) { l.rotate = Math.round(clamp(v, -180, 180)); }); },
        reset: 0,
      });
      els.lopacity = makeRow(lay, {
        label: "Opacity", min: 0, max: 100, step: 1, format: pct, toSlide: same, fromSlide: same,
        write: function (v) { editLayer(function (l) { l.opacity = clamp(v / 100, 0, 1); }); },
        reset: 100,
      });
      var centre = el("button", "btn tl-wide");
      centre.type = "button";
      centre.textContent = "Center on the video";
      centre.addEventListener("click", function () { editLayer(function (l) { l.x = 0.5; l.y = 0.5; }); commit(); });
      lay.appendChild(centre);
      var drop = el("button", "btn tl-wide");
      drop.type = "button";
      drop.textContent = "Remove layer";
      drop.addEventListener("click", function () { doDelete(); });
      lay.appendChild(drop);

      // the properties of the video
      var vid = el("div", "tl-box");
      els.videoBox = vid;
      vid.hidden = true;
      root.appendChild(vid);
      els.vspeed = makeSpeedRow(vid, function (v) { setVideoSpeed(v); });
      els.vpitchRow = checkRow(vid, "Preserve pitch", function (on) {
        var pick = localVideo();
        if (pick) {
          pick.pitch = on;
          if (pick.audioLink == null ? st.vlink : pick.audioLink) audioForVideo(pick).forEach(function (h) { h.seg.pitch = on; });
          done();
          return;
        }
        st.vpitch = on;
        st.vsegs.forEach(function (v) { if (v.pitch != null) v.pitch = on; });
        // a piece follows the video only while the video is sped up or slowed down
        if (st.vspeed !== 1 && st.vlink) allSegs().forEach(function (h) { h.seg.pitch = on; });
        commit();
        tick(true);
      }, "Keeps the sound at its normal pitch when the video speeds up, so voices don't sound high and squeaky.");
      els.vlinkRow = checkRow(vid, "Change the audio speed too", function (on) { relink(on); }, "Changes the sound's speed along with the video, so the sound stays lined up with the picture. Saving takes about as long as the clip when you change the speed, cut the video into pieces, or let the audio run past the video.");
    }

    // the furthest a layer may reach: the end of the timeline, and for a clip the end of its file
    function layerEndMax(l) { return l.kind === "clip" && l.dur > 0 ? Math.min(D(), l.at + l.dur - l.src) : D(); }

    // a change to the selected layer shows at once, the history waits for the change to end
    function editLayer(fn) {
      var l = findLayer(st.selected);
      if (!l) return;
      fn(l);
      paintLayers();
      renderProps();
    }

    // a change to the selected piece: what is on screen and what is heard follow it at once, the history waits for the change to end
    // what is selected put back the way it starts, as one step of undo: the video its speed, pitch, link and look; a clip row its look; a piece of audio its volume, fades, speed, pitch and sound; the subtitles the style of their rows, where they were dragged to included. returns the kind that was reset, or ""
    function resetSelected() {
      var hit = selected();
      var row = fxRow();
      var cues = pickedSubs();
      if (videoSelected()) {
        var pick = localVideo();
        if (pick) {
          setVideoSpeed(1);
          pick.audioLink = true;
          pick.pitch = true;
          pick.fx = RKEditorFx.defaultFx();
          if (opts.onFx) opts.onFx();
          done();
          return "video";
        }
        if (st.vspeed !== 1) setVideoSpeed(1);
        // at speed 1 the link and the pitch move no piece, so they are just set
        st.vlink = true;
        st.vpitch = true;
        st.fx = RKEditorFx.defaultFx();
        var selectedPiece = selectedV();
        if (selectedPiece) delete selectedPiece.seg.fx;
        else st.vsegs.forEach(function (v) { delete v.fx; v.pitch = true; v.audioLink = true; });
        if (opts.onFx) opts.onFx();
        commit();
        renderProps();
        return "video";
      }
      if (row) {
        row.fx = RKEditorFx.defaultFx();
        paintLayers();
        if (opts.onFx) opts.onFx();
        commit();
        return "video";
      }
      if (hit) {
        editPiece(function (s) {
          s.volume = 1;
          s.fadeIn = 0;
          s.fadeOut = 0;
          setSpeed(s, 1);
          s.pitch = true;
          s.muted = false;
        });
        done();
        return "audio";
      }
      if (cues.length) {
        var rows = [];
        cues.forEach(function (id) { var c = findSub(id); if (c && rows.indexOf(c.row) < 0) rows.push(c.row); });
        rows.forEach(function (id) { var r = findRow(id); if (r) r.style = defaultRowStyle(); });
        commit();
        subsChanged();
        return "subtitle";
      }
      return "";
    }

    function editPiece(fn) {
      var hit = selected();
      if (!hit) return;
      fn(hit.seg);
      var node = segEls[hit.seg.id];
      if (node) positionSeg(hit.seg, node);
      drawSoon();
      renderProps();
      refreshToolbar();
      tick(false);
    }

    function renderProps() {
      var root = dom.props;
      var hit = selected();
      var isVideo = videoSelected();
      var layer = findLayer(st.selected);
      reportKind();
      if (panelClosed()) { root.hidden = true; return; }
      // the other tabs of the video have panels of their own
      var general = !opts.videoPane || opts.videoPane() === "general";
      root.hidden = !hit && !layer && !(isVideo && general);
      if (root.hidden) return;
      els.audioBox.hidden = isVideo || !!layer;
      els.videoBox.hidden = !isVideo;
      els.layerBox.hidden = !layer;
      if (layer) {
        els.propsTitle.textContent = layer.kind === "clip" ? "Video" : "Layer";
        els.source.textContent = layer.name;
        els.lsize.show(layer.w * 100);
        els.llen.slide.max = String(r3(Math.max(LAYER_MIN + 0.1, layerEndMax(layer) - layer.at)));
        els.llen.show(layer.end - layer.at);
        els.lrotate.show(layer.rotate || 0);
        els.lopacity.show(layer.opacity * 100);
        return;
      }
      if (isVideo) {
        els.propsTitle.textContent = "Video";
        var pickV = selectedV();
        els.source.textContent = pickV && pickV.seg.ref ? pickV.seg.name : "";
        var local = localVideo();
        els.vspeed.show(local ? vSpeed(local) : st.vspeed);
        els.vpitchRow.checked = local && local.pitch != null ? local.pitch : st.vpitch;
        els.vlinkRow.checked = local && local.audioLink != null ? local.audioLink : st.vlink;
        // a clip without audio tracks has no audio to keep in pitch or to follow the video
        els.vpitchRow.parentNode.hidden = !st.ready;
        els.vlinkRow.parentNode.hidden = !st.ready;
        return;
      }
      var s = hit.seg;
      els.propsTitle.textContent = "Audio";
      els.source.textContent = pieceLabel(s) + (s.muted ? " (muted)" : "");
      var len = segLen(s);
      els.fin.slide.max = String(r3(Math.min(10, Math.max(0.1, len))));
      els.fout.slide.max = String(r3(Math.min(10, Math.max(0.1, len))));
      els.vol.show(s.volume * 100);
      els.fin.show(s.fadeIn);
      els.fout.show(s.fadeOut);
      els.speed.show(s.speed);
      els.pitch.checked = !!s.pitch;
    }

    // the speed of the video. the whole timeline is stretched by it, and with the audio linked the pieces are stretched with it, so everything stays where it was against the picture. a run of changes (a slider being dragged) is always worked out from the pieces as they were when the run began, so nothing drifts

    function beginSpeedRun() {
      if (st.vsess) return;
      var pieces = {};
      allSegs().forEach(function (h) { pieces[h.seg.id] = clone(h.seg); });
      st.vsess = { v0: st.vspeed, pps: pxPerSec(), pieces: pieces, vsegs: clone(st.vsegs), subs: clone(st.subs) };
    }

    // the size of a second on screen stays what it was, which is what makes a slower video longer than the frame, and the playhead keeps its place on screen
    function afterSpeed(pps, playX) {
      opts.setVideoRate(st.vspeed);
      st.zoom = clamp(zoomFor(pps), 1, maxZoom());
      applyZoomWidth();
      applyOverflow();
      dom.frame.scrollLeft = Math.max(0, nowT() * pxPerSec() + axisLeft() - playX);
      if (opts.onVideoSpeed) opts.onVideoSpeed(st.vspeed);
    }

    function localVideo() {
      var pick = selectedV();
      return pick && (st.vsegs.length > 1 || pick.seg.speed != null) ? pick.seg : null;
    }

    // cut audio at the video piece's edges before changing only that piece's sound
    function audioForVideo(v) {
      var end = vEnd(v);
      [v.at, end].forEach(function (t) {
        allSegs().forEach(function (h) {
          if (!h.seg.link && t > h.seg.at + MIN_LEN && t < segEnd(h.seg) - MIN_LEN) splitPiece(h, t);
        });
      });
      return allSegs().filter(function (h) { return h.seg.link === v.id || !h.seg.link && h.seg.at >= v.at - 0.002 && segEnd(h.seg) <= end + 0.002; });
    }

    function setPieceSpeed(v, speed) {
      var old = vSpeed(v);
      if (Math.abs(old - speed) < 1e-6) { renderProps(); return; }
      var end = vEnd(v), ratio = speed / old;
      var linked = v.audioLink == null ? st.vlink : v.audioLink;
      if (linked && allSegs().some(function (h) { return h.seg.at < end && segEnd(h.seg) > v.at && (h.seg.speed * ratio < 0.0625 || h.seg.speed * ratio > 16); })) {
        opts.notify("This speed would put the linked audio outside its supported range.", "bad", "Video speed");
        renderProps();
        return;
      }
      var audio = linked ? audioForVideo(v) : [];
      v.speed = speed;
      var delta = vEnd(v) - end;
      function retime(t) { return t <= v.at ? t : t < end ? v.at + (t - v.at) / ratio : t + delta; }
      st.vsegs.forEach(function (other) { if (other !== v && other.at >= end - 0.002) other.at = r3(other.at + delta); });
      if (linked) {
        audio.forEach(function (h) {
          h.seg.at = r3(v.at + (h.seg.at - v.at) / ratio);
          h.seg.speed = r3(clamp(h.seg.speed * ratio, 0.0625, 16));
          h.seg.pitch = v.pitch == null ? st.vpitch : v.pitch;
          clampFades(h.seg);
        });
        allSegs().forEach(function (h) { if (!audio.some(function (a) { return a.seg === h.seg; }) && !h.seg.link && h.seg.at >= end - 0.002) h.seg.at = r3(h.seg.at + delta); });
      }
      st.subs.forEach(function (cue) {
        cue.at = r3(retime(cue.at)); cue.end = r3(retime(cue.end));
        if (cue.words) cue.words = cue.words.map(function (word) { return [r3(retime(word[0])), r3(retime(word[1]))]; });
      });
      var bounds = boundsT();
      setBoundsT(retime(bounds.start), retime(bounds.end));
      changed();
      if (opts.onFx) opts.onFx();
    }

    function setVideoSpeed(v) {
      v = r3(clamp(v, SPEED_MIN, SPEED_MAX));
      if (Math.abs(v - 1) < 0.006) v = 1;
      var pick = localVideo();
      if (pick) { setPieceSpeed(pick, v); return; }
      if (Math.abs(v - st.vspeed) < 1e-6) { renderProps(); return; }
      if (st.vsegs.some(function (piece) { var rate = vSpeed(piece) * v / st.vspeed; return rate < SPEED_MIN || rate > SPEED_MAX; })) {
        opts.notify("This speed would put a video piece outside its supported range. Change that piece's speed first.", "bad", "Video speed");
        renderProps();
        return;
      }
      beginSpeedRun();
      var run = st.vsess;
      var playX = nowT() * pxPerSec() + axisLeft() - dom.frame.scrollLeft;
      var ratio = v / run.v0;
      st.vspeed = v;
      allSegs().forEach(function (h) {
        var base = run.pieces[h.seg.id];
        if (!base) return;
        var seg = h.seg;
        seg.parts = clone(base.parts);
        seg.at = base.at;
        seg.speed = base.speed;
        seg.pitch = base.pitch;
        seg.fadeIn = base.fadeIn;
        seg.fadeOut = base.fadeOut;
        if (st.vlink && v !== 1) {
          seg.at = r3(base.at / ratio);
          seg.speed = r3(clamp(base.speed * ratio, 0.0625, 16));
          seg.pitch = st.vpitch;
        } else if (st.vlink) {
          seg.at = r3(base.at / ratio);
          seg.speed = r3(clamp(base.speed * ratio, 0.0625, 16));
        }
        keepVisible(seg);
        clampFades(seg);
      });
      // the pieces of the video are the video, so they keep their place in the picture whatever the link says: a place on the timeline stretches with the speed
      st.vsegs = clone(run.vsegs);
      st.vsegs.forEach(function (v) { v.at = r3(v.at / ratio); if (v.speed != null) v.speed = r3(v.speed * ratio); });
      // subtitles belong to the picture like the pieces of the video do
      st.subs = clone(run.subs);
      st.subs.forEach(function (c) {
        c.at = r3(c.at / ratio);
        c.end = r3(c.end / ratio);
        if (c.words) c.words = c.words.map(function (w) { return [r3(w[0] / ratio), r3(w[1] / ratio)]; });
      });
      syncLinked();
      afterSpeed(run.pps, playX);
      syncDom();
      subsChanged();
      // the layers keep their seconds while the length of the video changes under them, so their rows are placed again
      layersChanged();
      paintSelection();
      layout();
      renderProps();
      drawSoon();
      tick(true);
    }

    // turning the link on or off at a speed other than 1 puts the pieces where they would have been had it been that way all along
    function relink(on) {
      var pick = localVideo();
      if (pick) { pick.audioLink = on; done(); return; }
      if (on === st.vlink) return;
      st.vlink = on;
      st.vsegs.forEach(function (v) { if (v.audioLink != null) v.audioLink = on; });
      var f = st.vspeed;
      if (f !== 1) {
        allSegs().forEach(function (h) {
          var seg = h.seg;
          seg.at = r3(on ? seg.at / f : seg.at * f);
          seg.speed = r3(clamp(on ? seg.speed * f : seg.speed / f, 0.0625, 16));
          keepVisible(seg);
          clampFades(seg);
        });
        syncLinked();
        syncDom();
        layout();
        drawSoon();
        tick(true);
      }
      commit();
      renderProps();
    }

    // context menu

    function closeMenu() {
      if (menu) { menu.remove(); menu = null; }
    }

    function showMenu(x, y, items) {
      closeMenu();
      if (st.selected || selectedGap || subPicked.length) items = items.concat(["-", { label: "Deselect", icon: "editor/deselect", key: "Esc", action: function () { select(""); } }]);
      var box = el("div", "tl-menu");
      items.forEach(function (it) {
        if (it === "-") { box.appendChild(el("div", "menu-separator")); return; }
        var row = el("div", "menu-item" + (it.disabled ? " is-disabled" : "") + (it.danger ? " delete-menu-item" : ""));
        row.innerHTML = icon(it.icon || "");
        var text = el("span");
        text.textContent = it.label;
        row.appendChild(text);
        if (it.key) { var k = el("span", "tl-key"); k.textContent = it.key; row.appendChild(k); }
        row.addEventListener("click", function (e) { e.stopPropagation(); closeMenu(); if (!it.disabled) it.action(); });
        box.appendChild(row);
      });
      document.body.appendChild(box);
      var w = box.offsetWidth;
      var h = box.offsetHeight;
      box.style.left = clamp(x, 4, window.innerWidth - w - 4) + "px";
      box.style.top = clamp(y, 4, window.innerHeight - h - 4) + "px";
      menu = box;
    }

    function onContext(e) {
      if (!st.ready) return;
      e.preventDefault();
      var node = e.target.closest(".tl-seg");
      var laneNode = e.target.closest(".tl-lane");
      var t = timeAtClient(e.clientX);
      if (node) {
        var hit = find(node.dataset.seg);
        if (!hit) return;
        select(hit.seg.id);
        var s = hit.seg;
        var items = [
          { label: "Split at the playhead", icon: "action/content-cut", key: "S", disabled: !canSplitAt(s, nowT()), action: doSplit },
          { label: "Duplicate", icon: "action/duplicate", key: "Ctrl+D", action: doDuplicate },
          { label: "Put in a row of its own", icon: "editor/arrow-down", disabled: hit.lane.segments.length < 2, action: doOwnRow },
          { label: "Copy", icon: "action/content-copy", key: "Ctrl+C", action: doCopy },
          { label: "Paste here", icon: "editor/paste", key: "Ctrl+V", disabled: !st.clipboard, action: function () { doPaste(hit.laneIndex, t); } },
          "-",
          { label: s.muted ? "Unmute" : "Mute", icon: "player/volume-muted", key: "M", action: doMute },
          { label: "Mute the whole row", icon: "player/volume-muted", action: function () { doMuteLane(hit.laneIndex); } },
        ];
        if (s.parts.length > 1) items.push({ label: "Separate the tracks", icon: "editor/unmix", action: doUngroup });
        items.push("-",
          { label: "Move the row up", icon: "editor/arrow-up", disabled: hit.laneIndex === 0, action: function () { doMoveLane(hit.laneIndex, -1); } },
          { label: "Move the row down", icon: "editor/arrow-down", disabled: hit.laneIndex === st.lanes.length - 1, action: function () { doMoveLane(hit.laneIndex, 1); } },
          "-",
          { label: "Delete", icon: "action/trash", key: "Backspace", danger: true, action: doDelete });
        showMenu(e.clientX, e.clientY, items);
        return;
      }
      if (laneNode) {
        var li = st.lanes.findIndex(function (l) { return l.id === laneNode.dataset.lane; });
        select("");
        showMenu(e.clientX, e.clientY, [
          { label: "Paste here", icon: "editor/paste", key: "Ctrl+V", disabled: !st.clipboard, action: function () { doPaste(li, t); } },
          { label: "Mute the whole row", icon: "player/volume-muted", action: function () { doMuteLane(li); } },
          { label: "Move the row up", icon: "editor/arrow-up", disabled: li === 0, action: function () { doMoveLane(li, -1); } },
          { label: "Move the row down", icon: "editor/arrow-down", disabled: li === st.lanes.length - 1, action: function () { doMoveLane(li, 1); } },
        ]);
      }
    }

    // pointer work on the lanes

    function showDrop(lane) {
      st.lanes.forEach(function (l) {
        var rec = laneRecs[l.id];
        if (rec) rec.el.classList.toggle("is-drop", l === lane);
      });
    }

    // the pieces of a row that the dragged piece lies over enough to be combined with
    function mergeCandidates(seg, lane) {
      return lane.segments.filter(function (o) { return o !== seg && overlapWith(o, seg) > MERGE_OVERLAP; });
    }

    function showMergeTargets(list) {
      Object.keys(segEls).forEach(function (id) {
        segEls[id].classList.toggle("is-merge-target", list.some(function (o) { return o.id === id; }));
      });
    }

    // carrying a piece to another row. the piece comes off its row once the drag goes up or down, into a row of its own that floats out of the flow at the end of the model, and the rows around it stay where they are. where the pointer is among them says what the piece asks for: in the strip at the edge of a row, a place above or below that row, with the rows gliding aside to make room; in the middle of another row, to go into it, which only counts after the pointer has rested there a moment (a piece that overlaps pieces of that row is combined with them, else it joins the row); anywhere in its own row, to stay. a quick pass over a row therefore only ever moves the piece in the order of the rows, the way a folder on a phone screen only forms when an icon is held over another

    // the rows as the pointer finds them, in the order of the model: the floating row of the carried piece is not one of them
    function restRows() {
      return st.lanes.filter(function (l) { return !l.floating; });
    }

    function liftPiece(hit) {
      var home = hit.lane;
      var homeEl = laneRecs[home.id].el;
      var float = { id: newId("L"), label: home.label, segments: [hit.seg], floating: true };
      var pos = home.segments.indexOf(hit.seg);
      home.segments.splice(pos, 1);
      st.lanes.push(float);
      syncDom();
      var rec = laneRecs[float.id];
      rec.el.classList.add("is-floating");
      rec.el.style.top = homeEl.offsetTop + "px";
      dom.lanes.classList.add("is-carrying");
      // the places of the rows are read once, from the layout, which the gliding rows do not change
      var rows = restRows().map(function (l) {
        var node = laneRecs[l.id].el;
        return { lane: l, top: node.offsetTop, h: node.offsetHeight };
      });
      var lanesTop = dom.lanes.getBoundingClientRect().top;
      drag.lift = {
        home: home,
        homeIndex: st.lanes.indexOf(home),
        pos: pos,
        solo: home.segments.length === 0,
        float: float,
        rec: rec,
        rows: rows,
        top0: homeEl.offsetTop,
        h: homeEl.offsetHeight,
        grab: drag.y - lanesTop - homeEl.offsetTop,
        slot: rows.length > 1 ? rows[1].top - rows[0].top : homeEl.offsetHeight + 3,
        intent: { kind: "stay" },
        key: "",
        keyY: 0,
        ready: false,
