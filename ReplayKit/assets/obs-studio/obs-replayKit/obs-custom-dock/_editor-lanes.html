<!-- shared partial (helper #include target: editor-lanes). the timeline of the clip editor: the video row and the audio rows under it, a toolbar over it, a properties panel beside the video and an undo history. every audio track is a row made of pieces that can be selected, moved along the timeline, which grows to reach a piece moved past an end of the clip, and carried to other rows (to the edge of a row for a place above or below it, held in the middle of a row to go into it, where a piece lying over pieces of that row combines with them into one piece named after both), cut, copied, faded, sped up and muted; the video row is made of pieces as well, which can be selected, split, moved along the timeline and deleted, and the video can be played at another speed, which stretches the whole timeline. the saved clip reaches over every piece of the video and of the audio, so where one lies past an end of the video the clip is longer than the video and the picture is black where no piece of the video is. audio files from outside the clip can be brought in with the button of the toolbar or by dropping them on the editor, each into a row of its own. the pieces are played next to the muted video so the edits can be heard, and the finished plan is handed to the saved copy. host: RKEditorLanes.create({ video, helper, dom, getBounds, setBounds, getTime, seek, duration, isPlaying, togglePlay, stop, isOpen, master, restore, setVideoRate, onVideoSpeed, onEdit, notify }), where notify(text, kind, title) takes a line or a list of lines and a kind of bad for a refusal that the host tells in a popup -->

<script>
(function () {
  "use strict";

  // the shortest a piece can be cut down to, in seconds

  // how far the audio of a piece may drift from the video before it is set back, in seconds
  var DRIFT = 0.15;

  var EDGE = 0.0101;
  var BAR_PX = 3;
  var CANVAS_MARGIN = 320;
  var MAX_PX_PER_SEC = 400;
  var MAX_HISTORY = 100;
  var ZOOM_STEP = 1.5;
  // how much of a piece has to lie over a piece of another row for the two to be combined
  var MERGE_OVERLAP = 0.05;
  // how far, in pixels, a drag has to go up or down before the piece comes off its row
  var LIFT_PX = 6;
  // the part of the height of a row, at each of its edges, where a carried piece asks for a place above or below the row; the middle asks to go into it, and once it has been taken to mean that, a smaller part holds it so a small slip does not lose it
  var EDGE_FRAC = 0.38;
  var EDGE_HELD = 0.26;
  // how long the pointer has to rest in the middle of a row before the piece is taken to want to go into it, so a quick pass over a row never combines anything
  var DWELL_MS = 450;

  var DWELL_WANDER_PX = 8;
  // the plan the helper accepts holds at most this many parts in one piece, and this many rows
  var MAX_PARTS = 8;
  var MAX_LANES = 8;
  // audio files brought in from outside the clip are numbered from here, above any audio stream a clip can have
  var IMPORT_BASE = 100;
  // the helper takes a file of this size at most, so a bigger one is turned away here without being sent
  var MAX_IMPORT_BYTES = 512 * 1024 * 1024;
  // a piece that is brought in starts at the playhead when at least this much of the cut is left after it, else at the start of the cut
  var IMPORT_ROOM = 1;
  var PREF_KEY = "rk-editor-timeline";
  // the height of the whole timeline area on a profile that never set one, in px
  var DEFAULT_HEIGHT = 343;
  var LANE_ICON = { "PC audio": "audio/desktop", "Discord": "editor/headset", "Microphone": "audio/microphone" };
  var SPEEDS = [0.5, 1, 1.5, 2];
  // the speed of a piece and of the video goes from a tenth of normal to five times normal, in steps of 0.05; the helper accepts the same range
  var SPEED_MIN = 0.1;
  var SPEED_MAX = 5;
  var SPEED_STEP = 0.05;

  function icon(name) { return (window.RK_ICONS && window.RK_ICONS[name]) || ""; }

  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  function fmt(s, decimals) {

  function niceStep(pps) {

    for (var i = 0; i < steps.length; i++) if (steps[i] * pps >= 90) return steps[i];
    return 3600;
  }

  function loadPrefs() {
    var p = { height: DEFAULT_HEIGHT, waves: true, snap: true };

      var raw = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");

        if (typeof raw.waves === "boolean") p.waves = raw.waves;

  }

  function create(opts) {
    var video = opts.video;
    var dom = opts.dom;
    var prefs = loadPrefs();
    var st = fresh();
    var seq = 0;
    var IMPORT_TIP = "Add audio from files (or drop files here)";
    var IMPORT_TITLE = "Audio could not be added";
    var eng = { ctx: null, master: null, pool: {}, busy: {}, timer: 0, off: false };
    var laneRecs = {};
    var segEls = {};
    var vsegEls = {};
    // the clock of the timeline while it plays by itself: on, the time on the timeline, whether it runs, whether it reached the end, when it was last stepped, its timer, the piece of the video the element is on, whether the element has to be placed again, and when the page was last told the time
    var vt = { on: false, T: 0, playing: false, ended: false, since: 0, timer: 0, piece: "", dirty: true, fired: 0 };
    var drag = null;
    var menu = null;
    var frameQueued = 0;
    var rulerQueued = 0;
    var pressOutside = false;
    var playShown = null;
    var els = {};
    var barUpdates = [];
    // the frames of the clip for the video row, handed in by the host while it captures them; they live apart from st, which a load of the audio starts afresh
    var film = null;
    var filmCanvas = null;

    function fresh() {
      return { name: "", key: "", tracks: [], Dsrc: 0, vspeed: 1, vpitch: true, vlink: true, vsess: null, lanes: [], vsegs: [], nextId: 1, nextImport: 0, importing: 0, picking: false, peaks: {}, selected: "", clipboard: null, history: [], future: [], zoom: 1, extL: 0, extR: 0, initial: "", ready: false };
    }

    // time. the pieces live on the timeline of the saved clip, which is the video divided by its speed; the host talks in seconds of the video
    function D() { return st.Dsrc / st.vspeed; }
    function nowT() { return (Number(opts.getTime()) || 0) / st.vspeed; }
    function boundsT() {
      var b = opts.getBounds();
      return { start: b.start / st.vspeed, end: b.end / st.vspeed };
    }
    function setBoundsT(start, end) { opts.setBounds(start * st.vspeed, end * st.vspeed); }
    function seekT(t) { opts.seek(t * st.vspeed); }

    // model. a piece is made of parts, one cut of a source track each starting off seconds into the piece, so a piece that combines several tracks is still one piece

    function newId(prefix) { return prefix + (st.nextId++); }
    function newPart(src, srcStart, srcEnd, off, gain) {
      return { src: src, srcStart: r3(srcStart), srcEnd: r3(srcEnd), off: r3(off || 0), gain: gain == null ? 1 : gain };
    }
    function newSeg(src, srcStart, srcEnd, at) {
      return { id: newId("S"), parts: [newPart(src, srcStart, srcEnd, 0, 1)], at: r3(at), volume: 1, fadeIn: 0, fadeOut: 0, speed: 1, pitch: true, muted: false };
    }
    function partLen(p) { return p.srcEnd - p.srcStart; }
    function localLen(s) {
      var m = 0;
      s.parts.forEach(function (p) { m = Math.max(m, p.off + partLen(p)); });
      return m;
    }
    function segLen(s) { return localLen(s) / s.speed; }
    function segEnd(s) { return s.at + segLen(s); }
    function srcDuration(src) { var p = st.peaks[src]; return p ? p.duration : Infinity; }
    function labelOf(src) {
      for (var i = 0; i < st.tracks.length; i++) if (st.tracks[i].index === src) return st.tracks[i].label;
      return "Audio";
    }
    // the names of the tracks in a set of parts, once each and in the order of the tracks, so the same tracks always give the same name
    function uniqueLabels(parts) {
      var srcs = [];
      parts.forEach(function (p) { if (srcs.indexOf(p.src) < 0) srcs.push(p.src); });
      srcs.sort(function (a, b) { return a - b; });
      var out = [];
      srcs.forEach(function (src) {
        labelOf(src).split(" & ").forEach(function (l) { if (l && out.indexOf(l) < 0) out.push(l); });
      });
      return out;
    }
    function pieceLabel(s) { return uniqueLabels(s.parts).join(" & "); }
    // a row is named after what is in it, so a row that holds two tracks is called after both
    function laneLabel(lane) {
      var all = [];
      lane.segments.forEach(function (s) { uniqueLabels(s.parts).forEach(function (l) { if (all.indexOf(l) < 0) all.push(l); }); });
      return all.length ? all.join(" & ") : lane.label;
    }
    function find(id) {
      if (!id) return null;
      for (var li = 0; li < st.lanes.length; li++) {
        var segs = st.lanes[li].segments;
        for (var i = 0; i < segs.length; i++) if (segs[i].id === id) return { seg: segs[i], lane: st.lanes[li], laneIndex: li };
      }
      return null;
    }
    function allSegs() {
      var out = [];

      return out;
    }
    function selected() { return find(st.selected); }

    // the video is a row of pieces too: each is a cut of the source video put at a place of the timeline, and what no piece covers inside the saved clip is black. the pieces keep their order, so they never lie over each other and the video is only ever read from front to back
    function newVseg(srcStart, srcEnd, at) { return { id: newId("V"), at: r3(at), srcStart: r3(srcStart), srcEnd: r3(srcEnd) }; }
    function vLen(v) { return (v.srcEnd - v.srcStart) / st.vspeed; }
    function vEnd(v) { return v.at + vLen(v); }
    function findV(id) {
      if (!id) return null;

    }
    function selectedV() { return findV(st.selected); }
    function videoSelected() { return st.selected === "video" || !!findV(st.selected); }
    // the video piece that lies over a time, or null atEnd also takes the piece that ends exactly at t, which is the last frame that stays on the screen when the clock stops at the end of the saved clip
    function vAt(t, atEnd) {
      for (var i = 0; i < st.vsegs.length; i++) {
        if (t >= st.vsegs[i].at - 1e-6 && (t < vEnd(st.vsegs[i]) - 1e-6 || (atEnd && t <= vEnd(st.vsegs[i]) + 1e-6))) return st.vsegs[i];

      return null;
    }
    function resetVideo() { st.vsegs = st.Dsrc > 0 ? [newVseg(0, st.Dsrc, 0)] : []; }
    // the video as it was recorded: one piece, all of it, at the start of the timeline
    function naturalV() {

    }

    // the part of the timeline that is the saved clip: the cut, which reaches past the video on a side when pieces of the video or of the audio do, unless the cut was drawn in from that side
    function windowT() {

      var d = D();

    function signature() {

      st.vsegs = clone(snap.vsegs);

    }

    // everything the screen and the sound show follows the model from here

      syncDom();
      syncVmode();
      paintSelection();
      drawSoon();
      renderProps();
      layout();

    }

    // selection

    function paintSelection() {

      Object.keys(vsegEls).forEach(function (vid) { vsegEls[vid].classList.toggle("is-selected", vid === st.selected); });

    }

    // how far apart, in seconds, two pieces of a row may lie and still look as if they touch

        var b = boundsT();
        var w = windowT();
        var edge = EDGE / st.vspeed;

    // a piece cut at the time t of the timeline: the parts that lie after the cut go to a new piece and a part that runs over it is cut in two

    function splitV(v, t) {

      st.selected = first.id;

    }

    function doDelete() {
      var pickV = selectedV();
      if (pickV) {

        done();
        return;
      }
      var hit = selected();
      if (!hit) return;
      hit.lane.segments.splice(hit.lane.segments.indexOf(hit.seg), 1);
      st.selected = "";
      done();
    }

    // whether one more row fits, which the plan of the saved copy limits; a note says so when it does not
    function roomForRow() {

      if (opts.notify) opts.notify("A clip can hold " + MAX_LANES + " rows at most.");

    }

    // the copy lies in a row of its own, right under the piece at the same place, so both can be seen and each can be moved without the other
    function doDuplicate() {

      if (!hit || !roomForRow()) return;
      var c = clone(hit.seg);
      c.id = newId("S");

    }

    // a piece that shares its row with others goes into a row of its own, right under that row
    function doOwnRow() {
      var hit = selected();
      if (!hit || hit.lane.segments.length < 2 || !roomForRow()) return;
      hit.lane.segments.splice(hit.lane.segments.indexOf(hit.seg), 1);

    function doCopy() {

    function markIn() {

    function markOut() {

    function clampFades(s) {

    // a piece may be moved past either end of the timeline, as a clip can in any editor: what is past the end is cut off in the row and in the saved copy, and it is only kept that some of the piece is always in reach, so it can be taken hold of and moved back

    // how far the left edge of a piece may go back, and how far the right edge may go on, before a track runs out or the clip does; a piece that already lies past an end of the clip may not be drawn out any further there
    function leftLimit(o) {

      return Math.max(Math.min(0, o.at), o.at - (isFinite(room) ? room : 0) / o.speed);
    }
    function rightLimit(o) {

      var room = Infinity;
      o.parts.forEach(function (p) { if (p.off + partLen(p) >= oldLocal - 0.0005) room = Math.min(room, srcDuration(p.src) - p.srcEnd); });
      return Math.min(Math.max(D(), segEnd(o)), o.at + (oldLocal + (isFinite(room) ? Math.max(0, room) : 0)) / o.speed);

    // combining. pieces dropped on each other become one piece that plays all their tracks and is named after all of them
    function combineProblem(pieces) {

    function combineInto(target, other) {

      });
      target.parts = parts;

      target.fadeOut = 0;

    }

    function overlapWith(a, b) {

    }

    // geometry. the timeline is the axis: the frame is wider than the view when zoomed, and the axis is what is left of the content after its padding

    function axisW() { return dom.axis.clientWidth; }
    function pxPerSec() { return D() > 0 ? axisW() / D() : 0; }

    function padX() { return parseFloat(getComputedStyle(dom.content).paddingLeft) || 0; }

    function minZoom() {

        after = Math.max(after, segEnd(h.seg) - d);
      });

        before = Math.max(before, -v.at);
        after = Math.max(after, vEnd(v) - d);
      });

      st.extR = right;

      dom.axis.style.marginRight = right + "px";

    function timeAtClient(clientX) {

      var pps = pxPerSec();
      return pps > 0 ? (clientX - rect.left) / pps : 0;
    }

    function seekTimeAtClient(clientX) {

    }

    function snapTo(t, skipId) {

      if (!(pps > 0)) return { t: t, hit: -1 };
      var b = boundsT();
      var cands = [0, D(), nowT(), b.start, b.end];
      allSegs().forEach(function (h) { if (h.seg.id !== skipId) { cands.push(h.seg.at); cands.push(segEnd(h.seg)); } });
      st.vsegs.forEach(function (v) { if (v.id !== skipId) { cands.push(v.at); cands.push(vEnd(v)); } });

      var bestD = SNAP_PX / pps;
      var hit = -1;
      cands.forEach(function (c) {

    }

    function setSnapGuide(t) {
      var line = els.snapline;
      if (!line) return;

      line.style.display = "block";
      line.style.left = (t / D() * 100) + "%";
    }

    // dom of the lanes

    function makeLaneRec(lane) {
      var rec = { el: el("div", "tl-lane"), canvas: el("canvas", "tl-wave"), from: 0, to: 0 };
      rec.el.dataset.lane = lane.id;
      rec.el.appendChild(rec.canvas);
      return rec;
    }

    function chipIcon(seg) {
      var labels = uniqueLabels(seg.parts);
      return labels.length > 1 ? "editor/mix" : (LANE_ICON[labels[0]] || "editor/note");
    }

    function makeSegEl() {
      var node = el("div", "tl-seg");
      var chip = el("span", "tl-chip");
      var iconSlot = el("span");
      iconSlot.style.display = "contents";
      chip.appendChild(iconSlot);
      chip.appendChild(el("span", "tl-chip-label"));
      node.appendChild(chip);
      node.appendChild(el("i", "tl-h l"));
      node.appendChild(el("i", "tl-h r"));
      return node;
    }

    function positionSeg(seg, node) {
      var d = D() || 1;
      node.style.left = (seg.at / d * 100) + "%";
      node.style.width = (segLen(seg) / d * 100) + "%";
      node.classList.toggle("is-selected", seg.id === st.selected);
      node.classList.toggle("is-muted", !!seg.muted);
      var label = pieceLabel(seg);
      var chipLabel = node.firstChild.lastChild;
      if (chipLabel.textContent !== label) {
        chipLabel.textContent = label;
        node.firstChild.firstChild.innerHTML = icon(chipIcon(seg));
      }
    }

    function syncDom() {
      var host = dom.lanes;
      var liveLanes = {};
      var liveSegs = {};
      st.lanes.forEach(function (lane) {
        var rec = laneRecs[lane.id];
        if (!rec) rec = laneRecs[lane.id] = makeLaneRec(lane);
        liveLanes[lane.id] = true;
        // inserting an element that is already there moves it, which puts the rows in the order of the model
        host.insertBefore(rec.el, els.anchor);
        lane.segments.forEach(function (seg) {

      Object.keys(segEls).forEach(function (id) { if (!liveSegs[id]) { segEls[id].remove(); delete segEls[id]; } });

    }

    // the nodes of the pieces of the video, over the row of frames: they carry the outlines and take the presses
    function positionV(v, node) {
      var d = D() || 1;
      node.style.left = (v.at / d * 100) + "%";
      node.style.width = (vLen(v) / d * 100) + "%";
      node.classList.toggle("is-selected", v.id === st.selected);
    }

    function syncV() {
      if (!dom.timeline) return;
      var live = {};
      st.vsegs.forEach(function (v) {
        var node = vsegEls[v.id];
        if (!node) {
          node = vsegEls[v.id] = el("div", "tl-vseg");
          node.dataset.vseg = v.id;
          node.appendChild(el("i", "tl-h l"));
          node.appendChild(el("i", "tl-h r"));
          dom.timeline.appendChild(node);
        }
        positionV(v, node);
        live[v.id] = true;
      });
      Object.keys(vsegEls).forEach(function (id) { if (!live[id]) { vsegEls[id].remove(); delete vsegEls[id]; } });
    }

    // drawing

    function palette() {

      var accent = (cs.getPropertyValue("--accent-rgb") || "88, 101, 242").trim();
      var text = (cs.getPropertyValue("--text-rgb") || "255, 255, 255").trim();

        fillMuted: "rgba(" + text + ", .07)",
        bar: "rgba(" + text + ", .82)",

    function roundRect(ctx, x, y, w, h, r) {

      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();

    // the loudest of the parts of a piece over one bar of its waveform

    // the frame of the clip nearest to a place on the timeline, as a fraction of its length; frames that have not been captured yet are not in the running

    }

    // the frames of the clip along the video row. every cell is as wide as the row is tall times the aspect of the video and shows the captured frame nearest to the middle of the cell, so a zoomed timeline repeats a frame and never stretches one. like the lanes, only the part in view is drawn

        if (filmCanvas) { filmCanvas.remove(); filmCanvas = null; }
        return;
      }
      var aw = axisW();
      var vw = dom.frame.clientWidth;
      var seen = dom.frame.scrollLeft - axisLeft();
      // the room past the ends of the video is drawn too, for the pieces and the black that lie there
      var from = Math.max(-st.extL, seen - CANVAS_MARGIN);
      var to = Math.min(aw + st.extR, seen + vw + CANVAS_MARGIN);
      var w = Math.max(1, Math.ceil(to - from));
      var h = host.clientHeight || 40;
      var dpr = window.devicePixelRatio || 1;
      if (!filmCanvas) filmCanvas = el("canvas", "tl-film");
      if (filmCanvas.parentNode !== host) host.appendChild(filmCanvas);
      var cv = filmCanvas;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
        cv.width = Math.round(w * dpr);
        cv.height = Math.round(h * dpr);
        cv.style.width = w + "px";
        cv.style.height = h + "px";
      }
      cv.style.left = from + "px";
      var ctx = cv.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var pps = pxPerSec();
      // the saved clip is black wherever no piece of the video is
      var win = windowT();
      ctx.fillStyle = "#000";
      ctx.fillRect(win.start * pps - from, 0, (win.end - win.start) * pps, h);
      var cell = Math.max(24, h * film.aspect);
      st.vsegs.forEach(function (v) {
        var x0 = v.at * pps - from;
        var span = vLen(v) * pps;
        if (x0 + span < -2 || x0 > w + 2) return;
        ctx.save();
        roundRect(ctx, x0, 0, span, h, 5);
        ctx.clip();
        // the cells start at the left edge of the piece, and each one shows the frame nearest to the middle of the cell
        for (var k = Math.max(0, Math.floor(-x0 / cell)); k * cell < span; k++) {
          var x = x0 + k * cell;
          if (x > w) break;
          var cw = Math.min(cell, span - k * cell);
          var f = frameAt(clamp((v.srcStart + (k * cell + cw / 2) / pps * st.vspeed) / st.Dsrc, 0, 1));
          if (f) ctx.drawImage(f.canvas, x, 0, cell, h);
          ctx.fillStyle = "rgba(0, 0, 0, .6)";
          ctx.fillRect(x + cw - 1, 0, 1, h);
        }
        ctx.restore();
      });
    }

    function drawNow() {
      frameQueued = 0;
      drawFilm();
      if (!st.ready) return;
      st.lanes.forEach(drawLane);
    }
    function drawSoon() {
      if (!frameQueued) frameQueued = requestAnimationFrame(drawNow);
    }

    // the ruler is made for the part of the timeline in view and again when the view moves
    function renderRuler() {
      rulerQueued = 0;
      var ruler = dom.ruler;
      var pps = pxPerSec();
      if (!ruler || !(pps > 0)) return;
      var vw = dom.frame.clientWidth;
      var seen = dom.frame.scrollLeft - axisLeft();
      // the marks go on into the room past the ends of the video, where the times before the start are negative
      var from = Math.max(-st.extL, seen - 200);
      var to = Math.min(axisW() + st.extR, seen + vw + 200);
      var step = niceStep(pps);
      var decimals = step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
      var frag = document.createDocumentFragment();
      var k0 = Math.floor(from / pps / step);
      var t1 = to / pps;
      for (var k = k0; k * step <= t1 + 1e-9; k++) {
        var t = k * step;
        // the mark at the very end of the timeline stands left of its line, so the number stays inside the frame, unless there is room past it
        var atEnd = k > 0 && st.extR === 0 && t * pps > axisW() - 14;
        var mark = el("span", "trim-time-mark" + (k === 0 && st.extL === 0 ? " is-zero" : atEnd ? " is-end" : ""));
        mark.style.left = (t * pps) + "px";
        mark.textContent = fmt(t, decimals);
        frag.appendChild(mark);
      }
      var minor = step / 5;
      if (minor * pps >= 7) {
        var m0 = Math.floor(from / pps / minor);
        for (var m = m0; m * minor <= t1 + 1e-9; m++) {
          if (m % 5 === 0) continue;
          var tick = el("span", "trim-time-minor");
          tick.style.left = (m * minor * pps) + "px";
          frag.appendChild(tick);
        }
      }
      ruler.replaceChildren(frag);
    }
    function rulerSoon() {
      if (!rulerQueued) rulerQueued = requestAnimationFrame(renderRuler);
    }

    function layout() {
      applyZoomWidth();
      renderRuler();
      drawSoon();
      refreshToolbar();
      paintHandles();
      barUpdates.forEach(function (fn) { fn(); });
    }

    function setZoom(z, anchorClientX) {
      var frame = dom.frame;
      z = clamp(z, minZoom(), maxZoom());
      var rect = frame.getBoundingClientRect();
      var ax = anchorClientX != null ? anchorClientX - rect.left : frame.clientWidth / 2;
      var before = pxPerSec();
      var tAnchor = before > 0 ? (frame.scrollLeft + ax - axisLeft()) / before : 0;
      st.zoom = z;
      applyZoomWidth();
      applyOverflow();
      frame.scrollLeft = Math.max(0, tAnchor * pxPerSec() + axisLeft() - ax);
      layout();
    }

    // the playhead, the dimmed parts outside the cut and the guide of a snap, all in percent so a zoom never has to move them. the host gives seconds of the video
    function setPlayhead(tv) {
      if (!D()) return;
      // while the timeline plays by itself the playhead may be past the ends of the video, in the room made for the pieces there
      var t = vt.on ? vt.T : tv / st.vspeed;
      var pct = (vt.on ? t / D() : clamp(t / D(), 0, 1)) * 100;
      if (els.playline) els.playline.style.left = pct + "%";
      if (els.time) els.time.firstChild.textContent = fmt(t, 1) + " ";
      var pps = pxPerSec();
      if (pps > 0 && st.zoom > 1 && opts.isPlaying()) {
        // playing past the edge of what is in view brings the next page of the timeline in
        var x = t * pps + axisLeft();
        var frame = dom.frame;
        if (x > frame.scrollLeft + frame.clientWidth - 40 || x < frame.scrollLeft) frame.scrollLeft = Math.max(0, x - 40);
      }
    }

    function setBoundsUi(startV, endV) {
      if (!st.Dsrc || !els.dimStart) return;
      // a cut that is only a few pixels short of an end of the clip is no cut, and the sliver of dimming it would leave reads as a dark bar at the end of the tracks
      var pxPerSrc = axisW() / st.Dsrc;
      var a = startV * pxPerSrc < 3 ? 0 : clamp(startV / st.Dsrc, 0, 1);
      var b = (st.Dsrc - endV) * pxPerSrc < 3 ? 0 : clamp(1 - endV / st.Dsrc, 0, 1);
      // a cut that is drawn in from a side also leaves out what lies in the room past that end of the video
      els.dimStart.style.left = a > 0 ? "calc(-1 * var(--tl-ext-l, 0px))" : "0";
      els.dimStart.style.width = a > 0 ? "calc(" + a * 100 + "% + var(--tl-ext-l, 0px))" : "0%";
      els.dimEnd.style.right = b > 0 ? "calc(-1 * var(--tl-ext-r, 0px))" : "0";
      els.dimEnd.style.width = b > 0 ? "calc(" + b * 100 + "% + var(--tl-ext-r, 0px))" : "0%";
      // the cut decides how far the saved clip reaches past the video, so it decides whether the timeline plays by itself
      syncVmode();
      paintHandles();
      drawSoon();
    }

    // scrollbars. the frame scrolls by itself with its own bars hidden, and these follow it from outside the frame
    function makeBar(barEl, axis) {
      var thumb = el("div", "tl-thumb");
      barEl.appendChild(thumb);
      var horizontal = axis === "x";
      function metrics() {
        var f = dom.frame;
        return horizontal
          ? { view: f.clientWidth, total: f.scrollWidth, pos: f.scrollLeft, track: barEl.clientWidth }
          : { view: f.clientHeight, total: f.scrollHeight, pos: f.scrollTop, track: barEl.clientHeight };
      }
      function thumbLength(m) { return Math.max(30, m.track * m.view / m.total); }
      function update() {
        var m = metrics();
        if (m.total <= m.view + 1 || m.track <= 0) { barEl.classList.remove("is-active"); return; }
        barEl.classList.add("is-active");
        var len = thumbLength(m);
        var off = (m.track - len) * (m.pos / Math.max(1, m.total - m.view));
        thumb.style[horizontal ? "width" : "height"] = len + "px";
        thumb.style.transform = horizontal ? "translateX(" + off + "px)" : "translateY(" + off + "px)";
      }
      thumb.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        e.stopPropagation();
        thumb.setPointerCapture(e.pointerId);
        thumb.classList.add("is-dragging");
        var m0 = metrics();
        var start = horizontal ? e.clientX : e.clientY;
        var ratio = (m0.total - m0.view) / Math.max(1, m0.track - thumbLength(m0));
        var move = function (ev) {
          var d = (horizontal ? ev.clientX : ev.clientY) - start;
          if (horizontal) dom.frame.scrollLeft = m0.pos + d * ratio;
          else dom.frame.scrollTop = m0.pos + d * ratio;
        };
        var up = function () {
          thumb.classList.remove("is-dragging");
          thumb.removeEventListener("pointermove", move);
          thumb.removeEventListener("pointerup", up);
          thumb.removeEventListener("pointercancel", up);
        };
        thumb.addEventListener("pointermove", move);
        thumb.addEventListener("pointerup", up);
        thumb.addEventListener("pointercancel", up);
      });
      // a press in the gutter next to the thumb moves the view by a page
      barEl.addEventListener("pointerdown", function (e) {
        if (e.target === thumb) return;
        var r = thumb.getBoundingClientRect();
        var before = horizontal ? e.clientX < r.left : e.clientY < r.top;
        var m = metrics();
        var step = m.view * 0.9 * (before ? -1 : 1);
        if (horizontal) dom.frame.scrollLeft += step;
        else dom.frame.scrollTop += step;
      });
      return update;
    }

    // toolbar

    function button(name, iconName, tip, handler) {
      var b = el("button", "tl-btn");
      b.type = "button";
      b.dataset.tooltip = tip;
      b.setAttribute("aria-label", tip.replace(/\s*\(.*\)$/, ""));
      b.innerHTML = icon(iconName);
      b.addEventListener("click", function (e) { e.stopPropagation(); handler(); });
      els[name] = b;
      return b;
    }
    function group() {
      var g = el("div", "tl-group");
      for (var i = 0; i < arguments.length; i++) g.appendChild(arguments[i]);
      return g;
    }

    function buildToolbar() {
      var tb = dom.toolbar;
      tb.textContent = "";
      tb.appendChild(group(
        button("split", "action/content-cut", "Split at the playhead (S)", doSplit),
        button("del", "action/trash", "Delete (Del)", doDelete),
        button("markIn", "editor/mark-in", "Start the cut here ([)", markIn),
        button("markOut", "editor/mark-out", "End the cut here (])", markOut),
        button("waves", "editor/waveform", "Show the waveforms", function () { prefs.waves = !prefs.waves; savePrefs(); refreshToolbar(); drawSoon(); }),
        button("import", "editor/import-audio", IMPORT_TIP, pickAudio)
      ));
      els.busy = el("div", "tl-busy");
      els.busy.textContent = "Importing audio";
      tb.appendChild(els.busy);
      tb.appendChild(el("span", "tl-fill"));
      var time = el("div", "tl-time");
      time.appendChild(document.createTextNode("0:00.0 "));
      var total = el("span");
      total.textContent = "/ 0:00.0";
      time.appendChild(total);
      els.time = time;
      els.total = total;
      tb.appendChild(group(
        button("stop", "editor/stop", "Stop", function () { opts.stop(); }),
        button("play", "player/play", "Play and pause (Space)", function () { opts.togglePlay(); }),
        time
      ));
      tb.appendChild(el("span", "tl-fill"));
      tb.appendChild(group(
        button("undo", "editor/undo", "Undo (Ctrl+Z)", undo),
        button("redo", "editor/redo", "Redo (Ctrl+Shift+Z)", redo)
      ));
      tb.appendChild(el("span", "tl-sep"));
      tb.appendChild(group(
        button("snap", "editor/magnet", "Snap to edges and the playhead", function () { prefs.snap = !prefs.snap; savePrefs(); refreshToolbar(); }),
        button("fit", "editor/fit-timeline", "Fit to zoom (0)", fitView),
        button("zoomOut", "editor/zoom-out", "Zoom out (-)", function () { setZoom(st.zoom / ZOOM_STEP); }),
        button("zoomIn", "editor/zoom-in", "Zoom in (+)", function () { setZoom(st.zoom * ZOOM_STEP); })
      ));
    }

    // the whole timeline in view, from its start, with nothing left to scroll
    function fitView() {
      setZoom(minZoom());
      dom.frame.scrollLeft = 0;
    }

    function savePrefs() {
      try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* the choice lasts until the editor is closed */ }
    }

    function canSplitAt(seg, t) { return t > seg.at + MIN_LEN && t < segEnd(seg) - MIN_LEN; }
    function canSplitV(v, t) { return t > v.at + MIN_LEN && t < vEnd(v) - MIN_LEN; }

    function refreshToolbar() {
      if (!els.split) return;
      var hit = selected();
      var pickV = selectedV();
      var t = nowT();
      var lanes = st.ready && st.lanes.length > 0;
      var underV = st.vsegs.some(function (v) { return canSplitV(v, t); });
      var underPlayhead = (lanes && allSegs().some(function (h) { return canSplitAt(h.seg, t); })) || underV;
      var cuttable = pickV ? canSplitV(pickV.seg, t) : hit ? canSplitAt(hit.seg, t) : st.selected === "video" ? underV : underPlayhead;
      els.split.disabled = !(lanes || st.vsegs.length) || !cuttable;
      els.del.disabled = !hit && !pickV;
      els.waves.disabled = !lanes;
      els.import.disabled = !st.ready || st.picking;
      els.import.dataset.tooltip = st.ready ? IMPORT_TIP : "Audio cannot be added to this clip";
      els.waves.classList.toggle("is-active", prefs.waves);
      els.snap.classList.toggle("is-active", prefs.snap);
      els.undo.disabled = st.history.length < 2;
      els.redo.disabled = st.future.length === 0;
      var lowest = minZoom();
      els.zoomOut.disabled = st.zoom <= lowest + 0.001;
      els.fit.disabled = st.zoom <= lowest + 0.001;
      els.zoomIn.disabled = st.zoom >= maxZoom() - 0.001;
      var playing = !!opts.isPlaying();
      if (playing !== playShown) {
        playShown = playing;
        els.play.innerHTML = icon(playing ? "player/pause" : "player/play");
      }
      // the total is where the saved clip ends on the ruler, which is past the end of the video where pieces reach past it
      if (els.total) els.total.textContent = "/ " + fmt(vt.on ? windowT().end : D(), 1);
      if (els.vchip) els.vchip.textContent = st.vspeed === 1 ? "Video" : "Video " + r3(st.vspeed) + "x";
    }

    // properties panel

    // a slider drawn like the sliders of the settings, whose filled part follows its value
    function paintFill(input) {
      var min = Number(input.min);
      var max = Number(input.max);
      var pct = max > min ? clamp((Number(input.value) - min) / (max - min), 0, 1) * 100 : 0;
      input.style.setProperty("--fill", pct + "%");
    }

    // one row of the panel: the name, the value field, the slider and the reset button, in the order of the rows of the settings. cfg holds the range, how a value is shown, how it maps to the slider and back, what a change writes and what the reset writes
    function makeRow(box, cfg) {
      var row = el("div", "tl-row");
      var label = el("div", "tl-label");
      label.textContent = cfg.label;
      var value = el("input", "tl-value");
      value.type = "text";
      value.inputMode = "decimal";
      value.autocomplete = "off";
      value.setAttribute("aria-label", cfg.label);
      var wrap = el("div", "tl-slider-wrap");
      var slide = el("input", "tl-slider");
      slide.type = "range";
      slide.min = String(cfg.min);
      slide.max = String(cfg.max);
      slide.step = String(cfg.step);
      slide.setAttribute("aria-label", cfg.label + " slider");
      wrap.appendChild(slide);
      var reset = el("button", "tl-reset");
      reset.type = "button";
      reset.setAttribute("aria-label", "Reset " + cfg.label.toLowerCase());
      reset.dataset.tooltip = "Reset to default";
      reset.innerHTML = icon("action/reset");
      row.appendChild(label);
      row.appendChild(value);
      row.appendChild(wrap);
      row.appendChild(reset);
      box.appendChild(row);
      slide.addEventListener("input", function () { paintFill(slide); cfg.write(cfg.fromSlide(Number(slide.value))); });
      slide.addEventListener("change", function () { commit(); });
      value.addEventListener("change", function () {
        var v = parseFloat(String(value.value).replace(",", "."));
        if (isFinite(v)) { cfg.write(v); commit(); } else renderProps();
      });
      value.addEventListener("keydown", function (e) { if (e.key === "Enter") value.blur(); e.stopPropagation(); });
      reset.addEventListener("click", function () { cfg.write(cfg.reset); commit(); });
      return {
        slide: slide,
        // what the slider and the field show for a value of the model
        show: function (number) { slide.value = String(cfg.toSlide(number)); value.value = cfg.format(number); paintFill(slide); },
      };
    }

    // the speed of a piece and the speed of the video are the same kind of row: the marks for the usual speeds, then the slider
    function makeSpeedRow(box, write) {
      var presets = el("div", "tl-row tl-row-presets");
      presets.appendChild(el("div", "tl-label"));
      var strip = el("div", "tl-speeds");
      var list = SPEEDS.map(function (v) {
        var b = el("button", "btn tl-mini");
        b.type = "button";
        b.textContent = v + "x";
        b.addEventListener("click", function () { write(v); commit(); });
        strip.appendChild(b);
        return { v: v, b: b };
      });
      presets.appendChild(strip);
      box.appendChild(presets);
      var row = makeRow(box, {
        label: "Speed", min: SPEED_MIN, max: SPEED_MAX, step: SPEED_STEP,
        format: function (v) { return r3(v) + "x"; },
        toSlide: function (v) { return v; },
        fromSlide: function (x) { return x; },
        write: write, reset: 1,
      });
      return {
        show: function (speed) {
          row.show(speed);
          list.forEach(function (x) { x.b.classList.toggle("is-active", Math.abs(x.v - speed) < 0.001); });
        },
      };
    }

    // tip is the note of the info icon after the name, which the rows of the settings have in the same place
    function checkRow(box, text, onChange, tip) {
      var label = el("div", "trim-mode-row");
      var input = el("input", "rk-switch");
      input.type = "checkbox";
      input.setAttribute("aria-label", text);
      var span = el("span");
      span.textContent = text;
      label.appendChild(input);
      label.appendChild(span);
      if (tip) {
        var dot = el("button", "info-dot");
        dot.type = "button";
        dot.setAttribute("aria-label", "About " + text.toLowerCase());
        dot.dataset.tooltip = tip;
        label.appendChild(dot);
      }
      input.addEventListener("change", function () { onChange(input.checked); });
      box.appendChild(label);
      return input;
    }

    function buildProps() {
      var root = dom.props;
      root.textContent = "";
      root.className = "editor-card tl-props";
      root.hidden = true;
      var head = el("div", "tl-props-head");
      els.propsTitle = el("div", "editor-card-title");
      els.source = el("div", "tl-source");
      var close = el("button", "tl-x");
      close.type = "button";
      close.setAttribute("aria-label", "Close");
      close.innerHTML = icon("editor/close");
      close.addEventListener("click", function () { select(""); });
      head.appendChild(els.propsTitle);
      head.appendChild(els.source);
      head.appendChild(close);
      root.appendChild(head);

      // the properties of a piece of audio
      var audio = el("div", "tl-box");
      els.audioBox = audio;
      root.appendChild(audio);
      els.vol = makeRow(audio, {
        label: "Volume", min: 0, max: 200, step: 1,
        format: function (v) { return Math.round(v) + "%"; },
        toSlide: function (v) { return v; },
        fromSlide: function (x) { return x; },
        write: function (v) { editPiece(function (s) { s.volume = r3(clamp(v / 100, 0, 4)); }); },
        reset: 100,
      });
      var fadeFormat = function (v) { return r3(v) + "s"; };
      var same = function (v) { return v; };
      els.fin = makeRow(audio, {
        label: "Fade in", min: 0, max: 10, step: 0.1, format: fadeFormat, toSlide: same, fromSlide: same,
        write: function (v) { editPiece(function (s) { s.fadeIn = r3(clamp(v, 0, 3600)); clampFades(s); }); },
        reset: 0,
      });
      els.fout = makeRow(audio, {
        label: "Fade out", min: 0, max: 10, step: 0.1, format: fadeFormat, toSlide: same, fromSlide: same,
        write: function (v) { editPiece(function (s) { s.fadeOut = r3(clamp(v, 0, 3600)); clampFades(s); }); },
        reset: 0,
      });
      els.speed = makeSpeedRow(audio, function (v) { editPiece(function (s) { setSpeed(s, v); }); });
      els.pitch = checkRow(audio, "Preserve pitch", function (on) { editPiece(function (s) { s.pitch = on; }); commit(); }, "Keeps the sound at its normal pitch when you change the speed, so faster parts don't sound high and squeaky.");

      // the properties of the video
      var vid = el("div", "tl-box");
      els.videoBox = vid;
      vid.hidden = true;
      root.appendChild(vid);
      els.vspeed = makeSpeedRow(vid, function (v) { setVideoSpeed(v); });
      els.vpitchRow = checkRow(vid, "Preserve pitch", function (on) {
        st.vpitch = on;
        // a piece follows the video only while the video is sped up or slowed down
        if (st.vspeed !== 1 && st.vlink) allSegs().forEach(function (h) { h.seg.pitch = on; });
        commit();
        tick(true);
      }, "Keeps the sound at its normal pitch when the video speeds up, so voices don't sound high and squeaky.");
      els.vlinkRow = checkRow(vid, "Change the audio speed too", function (on) { relink(on); }, "Changes the sound's speed along with the video, so the sound stays lined up with the picture. Saving takes about as long as the clip when you change the speed, cut the video into pieces, or let the audio run past the video.");
    }

    // a change to the selected piece: what is on screen and what is heard follow it at once, the history waits for the change to end
    function editPiece(fn) {
      var hit = selected();
      if (!hit) return;
      fn(hit.seg);
      var node = segEls[hit.seg.id];
      if (node) positionSeg(hit.seg, node);
      drawSoon();
      renderProps();
      refreshToolbar();
      tick(false);
    }

    function renderProps() {
      var root = dom.props;
      var hit = selected();
      var isVideo = videoSelected();
      root.hidden = !hit && !isVideo;
      if (root.hidden) return;
      els.audioBox.hidden = isVideo;
      els.videoBox.hidden = !isVideo;
      if (isVideo) {
        els.propsTitle.textContent = "Video";
        els.source.textContent = "";
        els.vspeed.show(st.vspeed);
        els.vpitchRow.checked = st.vpitch;
        els.vlinkRow.checked = st.vlink;
        // a clip without audio tracks has no audio to keep in pitch or to follow the video
        els.vpitchRow.parentNode.hidden = !st.ready;
        els.vlinkRow.parentNode.hidden = !st.ready;
        return;
      }
      var s = hit.seg;
      els.propsTitle.textContent = "Audio";
      els.source.textContent = pieceLabel(s) + (s.muted ? " (muted)" : "");
      var len = segLen(s);
      els.fin.slide.max = String(r3(Math.min(10, Math.max(0.1, len))));
      els.fout.slide.max = String(r3(Math.min(10, Math.max(0.1, len))));
      els.vol.show(s.volume * 100);
      els.fin.show(s.fadeIn);
      els.fout.show(s.fadeOut);
      els.speed.show(s.speed);
      els.pitch.checked = !!s.pitch;
    }

    // the speed of the video. the whole timeline is stretched by it, and with the audio linked the pieces are stretched with it, so everything stays where it was against the picture. a run of changes (a slider being dragged) is always worked out from the pieces as they were when the run began, so nothing drifts

    function beginSpeedRun() {
      if (st.vsess) return;
      var pieces = {};
      allSegs().forEach(function (h) { pieces[h.seg.id] = clone(h.seg); });
      st.vsess = { v0: st.vspeed, pps: pxPerSec(), pieces: pieces, vsegs: clone(st.vsegs) };
    }

    // the size of a second on screen stays what it was, which is what makes a slower video longer than the frame, and the playhead keeps its place on screen
    function afterSpeed(pps, playX) {
      opts.setVideoRate(st.vspeed);
      st.zoom = clamp(zoomFor(pps), 1, maxZoom());
      applyZoomWidth();
      applyOverflow();
      dom.frame.scrollLeft = Math.max(0, nowT() * pxPerSec() + axisLeft() - playX);
      if (opts.onVideoSpeed) opts.onVideoSpeed(st.vspeed);
    }

    function setVideoSpeed(v) {
      v = r3(clamp(v, SPEED_MIN, SPEED_MAX));
      if (Math.abs(v - 1) < 0.006) v = 1;
      if (Math.abs(v - st.vspeed) < 1e-6) { renderProps(); return; }
      beginSpeedRun();
      var run = st.vsess;
      var playX = nowT() * pxPerSec() + axisLeft() - dom.frame.scrollLeft;
      var ratio = v / run.v0;
      st.vspeed = v;
      allSegs().forEach(function (h) {
        var base = run.pieces[h.seg.id];
        if (!base) return;
        var seg = h.seg;
        seg.parts = clone(base.parts);
        seg.at = base.at;
        seg.speed = base.speed;
        seg.pitch = base.pitch;
        seg.fadeIn = base.fadeIn;
        seg.fadeOut = base.fadeOut;
        if (st.vlink && v !== 1) {
          seg.at = r3(base.at / ratio);
          seg.speed = r3(clamp(base.speed * ratio, 0.0625, 16));
          seg.pitch = st.vpitch;
        } else if (st.vlink) {
          seg.at = r3(base.at / ratio);
          seg.speed = r3(clamp(base.speed * ratio, 0.0625, 16));
        }
        keepVisible(seg);
        clampFades(seg);
      });
      // the pieces of the video are the video, so they keep their place in the picture whatever the link says: a place on the timeline stretches with the speed
      st.vsegs = clone(run.vsegs);
      st.vsegs.forEach(function (v) { v.at = r3(v.at / ratio); });
      afterSpeed(run.pps, playX);
      syncDom();
      paintSelection();
      layout();
      renderProps();
      drawSoon();
      tick(true);
    }

    // turning the link on or off at a speed other than 1 puts the pieces where they would have been had it been that way all along
    function relink(on) {
      if (on === st.vlink) return;
      st.vlink = on;
      var f = st.vspeed;
      if (f !== 1) {
        allSegs().forEach(function (h) {
          var seg = h.seg;
          seg.at = r3(on ? seg.at / f : seg.at * f);
          seg.speed = r3(clamp(on ? seg.speed * f : seg.speed / f, 0.0625, 16));
          keepVisible(seg);
          clampFades(seg);
        });
        syncDom();
        layout();
        drawSoon();
        tick(true);
      }
      commit();
      renderProps();
    }

    // context menu

    function closeMenu() {
      if (menu) { menu.remove(); menu = null; }
    }

    function showMenu(x, y, items) {
      closeMenu();
      var box = el("div", "tl-menu");
      items.forEach(function (it) {
        if (it === "-") { box.appendChild(el("div", "menu-separator")); return; }
        var row = el("div", "menu-item" + (it.disabled ? " is-disabled" : "") + (it.danger ? " delete-menu-item" : ""));
        row.innerHTML = icon(it.icon || "");
        var text = el("span");
        text.textContent = it.label;
        row.appendChild(text);
        if (it.key) { var k = el("span", "tl-key"); k.textContent = it.key; row.appendChild(k); }
        row.addEventListener("click", function (e) { e.stopPropagation(); closeMenu(); if (!it.disabled) it.action(); });
        box.appendChild(row);
      });
      document.body.appendChild(box);
      var w = box.offsetWidth;
      var h = box.offsetHeight;
      box.style.left = clamp(x, 4, window.innerWidth - w - 4) + "px";
      box.style.top = clamp(y, 4, window.innerHeight - h - 4) + "px";
      menu = box;
    }

    function onContext(e) {
      if (!st.ready) return;
      e.preventDefault();
      var node = e.target.closest(".tl-seg");
      var laneNode = e.target.closest(".tl-lane");
      var t = timeAtClient(e.clientX);
      if (node) {
        var hit = find(node.dataset.seg);
        if (!hit) return;
        select(hit.seg.id);
        var s = hit.seg;
        var items = [
          { label: "Split at the playhead", icon: "action/content-cut", key: "S", disabled: !canSplitAt(s, nowT()), action: doSplit },
          { label: "Duplicate", icon: "action/duplicate", key: "Ctrl+D", action: doDuplicate },
          { label: "Put in a row of its own", icon: "editor/arrow-down", disabled: hit.lane.segments.length < 2, action: doOwnRow },
          { label: "Copy", icon: "action/content-copy", key: "Ctrl+C", action: doCopy },
          { label: "Paste here", icon: "editor/paste", key: "Ctrl+V", disabled: !st.clipboard, action: function () { doPaste(hit.laneIndex, t); } },
          "-",
          { label: s.muted ? "Unmute" : "Mute", icon: "player/volume-muted", key: "M", action: doMute },
          { label: "Mute the whole row", icon: "player/volume-muted", action: function () { doMuteLane(hit.laneIndex); } },
        ];
        if (s.parts.length > 1) items.push({ label: "Separate the tracks", icon: "editor/unmix", action: doUngroup });
        items.push("-",
          { label: "Move the row up", icon: "editor/arrow-up", disabled: hit.laneIndex === 0, action: function () { doMoveLane(hit.laneIndex, -1); } },
          { label: "Move the row down", icon: "editor/arrow-down", disabled: hit.laneIndex === st.lanes.length - 1, action: function () { doMoveLane(hit.laneIndex, 1); } },
          "-",
          { label: "Delete", icon: "action/trash", key: "Del", danger: true, action: doDelete });
        showMenu(e.clientX, e.clientY, items);
        return;
      }
      if (laneNode) {
        var li = st.lanes.findIndex(function (l) { return l.id === laneNode.dataset.lane; });
        select("");
        showMenu(e.clientX, e.clientY, [
          { label: "Paste here", icon: "editor/paste", key: "Ctrl+V", disabled: !st.clipboard, action: function () { doPaste(li, t); } },
          { label: "Mute the whole row", icon: "player/volume-muted", action: function () { doMuteLane(li); } },
          { label: "Move the row up", icon: "editor/arrow-up", disabled: li === 0, action: function () { doMoveLane(li, -1); } },
          { label: "Move the row down", icon: "editor/arrow-down", disabled: li === st.lanes.length - 1, action: function () { doMoveLane(li, 1); } },
        ]);
      }
    }

    // pointer work on the lanes

    function showDrop(lane) {
      st.lanes.forEach(function (l) {
        var rec = laneRecs[l.id];
        if (rec) rec.el.classList.toggle("is-drop", l === lane);
      });
    }

    // the pieces of a row that the dragged piece lies over enough to be combined with
    function mergeCandidates(seg, lane) {
      return lane.segments.filter(function (o) { return o !== seg && overlapWith(o, seg) > MERGE_OVERLAP; });
    }

    function showMergeTargets(list) {
      Object.keys(segEls).forEach(function (id) {
        segEls[id].classList.toggle("is-merge-target", list.some(function (o) { return o.id === id; }));
      });
    }

    // carrying a piece to another row. the piece comes off its row once the drag goes up or down, into a row of its own that floats out of the flow at the end of the model, and the rows around it stay where they are. where the pointer is among them says what the piece asks for: in the strip at the edge of a row, a place above or below that row, with the rows gliding aside to make room; in the middle of another row, to go into it, which only counts after the pointer has rested there a moment (a piece that overlaps pieces of that row is combined with them, else it joins the row); anywhere in its own row, to stay. a quick pass over a row therefore only ever moves the piece in the order of the rows, the way a folder on a phone screen only forms when an icon is held over another

    // the rows as the pointer finds them, in the order of the model: the floating row of the carried piece is not one of them
    function restRows() {
      return st.lanes.filter(function (l) { return !l.floating; });
    }

    function liftPiece(hit) {
      var home = hit.lane;
      var homeEl = laneRecs[home.id].el;
      var float = { id: newId("L"), label: home.label, segments: [hit.seg], floating: true };
      var pos = home.segments.indexOf(hit.seg);
      home.segments.splice(pos, 1);
      st.lanes.push(float);
      syncDom();
      var rec = laneRecs[float.id];
      rec.el.classList.add("is-floating");
      rec.el.style.top = homeEl.offsetTop + "px";
      dom.lanes.classList.add("is-carrying");
      // the places of the rows are read once, from the layout, which the gliding rows do not change
      var rows = restRows().map(function (l) {
        var node = laneRecs[l.id].el;
        return { lane: l, top: node.offsetTop, h: node.offsetHeight };
      });
      var lanesTop = dom.lanes.getBoundingClientRect().top;
      drag.lift = {
        home: home,
        homeIndex: st.lanes.indexOf(home),
        pos: pos,
        solo: home.segments.length === 0,
        float: float,
        rec: rec,
        rows: rows,
        top0: homeEl.offsetTop,
        h: homeEl.offsetHeight,
        grab: drag.y - lanesTop - homeEl.offsetTop,
        slot: rows.length > 1 ? rows[1].top - rows[0].top : homeEl.offsetHeight + 3,
        intent: { kind: "stay" },
        key: "",
        keyY: 0,
        ready: false,
        timer: 0,
        noted: "",
      };
    }

    function zoneAt(y) {
      var L = drag.lift;
      var rows = L.rows;
      var last = rows[rows.length - 1];
      if (y < rows[0].top) return { kind: "gap", gap: 0 };
      if (y >= last.top + last.h) return { kind: "gap", gap: rows.length };
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        // the seam above a row belongs to the place between it and the row before
        if (y < r.top) return { kind: "gap", gap: i };
        if (y >= r.top + r.h) continue;
        if (i === L.homeIndex) return { kind: "stay" };
        var rel = (y - r.top) / r.h;
        var edge = L.key === rows[i].lane.id ? EDGE_HELD : EDGE_FRAC;
        if (rel < edge) return { kind: "gap", gap: i };
        if (rel >= 1 - edge) return { kind: "gap", gap: i + 1 };
        return { kind: "into", lane: rows[i].lane, index: i, rel: rel };
      }
      return { kind: "stay" };
    }

    // a place between rows, where a piece alone in its row has nothing to ask for next to the row it came from
    function gapAsk(gap) {
      var L = drag.lift;
      if (L.solo && (gap === L.homeIndex || gap === L.homeIndex + 1)) return { kind: "stay" };
      // a piece that leaves a row that stays needs a row of its own, and the plan holds only so many
      if (!L.solo && restRows().length >= MAX_LANES) {
        if (!L.capNoted && opts.notify) {
          L.capNoted = true;
          opts.notify("A clip can hold " + MAX_LANES + " rows at most.");
        }
        return { kind: "stay" };
      }
      return { kind: "gap", gap: gap };
    }

    function startDwell(key) {
      var L = drag.lift;
      window.clearTimeout(L.timer);
      L.ready = false;
      L.timer = key ? window.setTimeout(function () {
        if (!drag || drag.lift !== L || L.key !== key) return;
        L.ready = true;
        // the pointer has rested, so the same spot is read again, now that it counts
        steer(L.clientY);
      }, DWELL_MS) : 0;
    }

    // what the piece asks for at a place among the rows
    function askFor(zone) {
      var L = drag.lift;
      var seg = L.float.segments[0];
      if (zone.kind === "stay") return { kind: "stay" };
      if (zone.kind === "gap") return gapAsk(zone.gap);
      if (L.ready) {
        var others = mergeCandidates(seg, zone.lane);
        if (!others.length) return { kind: "row", lane: zone.lane };
        var problem = combineProblem(others.concat([seg]));
        if (!problem) return { kind: "combine", lane: zone.lane, targets: others };
        // pieces that cannot be combined say why, once for each row, and the piece goes on asking for a place beside it
        if (L.noted !== zone.lane.id) {
          L.noted = zone.lane.id;
          if (opts.notify) opts.notify(problem);
        }
      }
      return gapAsk(zone.rel < 0.5 ? zone.index : zone.index + 1);
    }

    // how far each row has to move for the piece to be set down where it asks, in pixels: the rows from the place on make room, and a row that the piece leaves empty is closed up
    function shiftsFor(ask) {
      var L = drag.lift;
      var shifts = L.rows.map(function () { return 0; });
      if (ask.kind !== "gap") return shifts;
      if (L.solo) {
        var to = ask.gap > L.homeIndex ? ask.gap - 1 : ask.gap;
        for (var i = to; i < L.homeIndex; i++) shifts[i] = L.slot;
        for (var j = L.homeIndex + 1; j <= to; j++) shifts[j] = -L.slot;
      } else {
        for (var k = ask.gap; k < shifts.length; k++) shifts[k] = L.slot;
      }
      return shifts;
    }

    function paintAsk(ask) {
      var L = drag.lift;
      L.intent = ask;
      var shifts = shiftsFor(ask);
      L.rows.forEach(function (row, i) {
        var node = laneRecs[row.lane.id].el;
        node.style.transform = shifts[i] ? "translateY(" + shifts[i] + "px)" : "";
      });
      // the row the piece came from holds the place it would return to; it is gone once the rows are moving to close it
      if (L.solo) laneRecs[L.home.id].el.classList.toggle("is-vacated", ask.kind === "gap");
      var into = ask.kind === "row" || ask.kind === "combine";
      L.rec.el.classList.toggle("is-entering", into);
      showDrop(into ? ask.lane : null);
      showMergeTargets(ask.kind === "combine" ? ask.targets : []);
    }

    // the floating row follows the pointer up and down, and the pointer is read among the rows
    function steer(clientY) {
      var L = drag.lift;
      L.clientY = clientY;
      var y = clientY - dom.lanes.getBoundingClientRect().top;
      var last = L.rows[L.rows.length - 1];
      var top = clamp(y - L.grab, L.rows[0].top - L.h / 2, last.top + last.h - L.h / 2);
      L.rec.el.style.transform = "translateY(" + (top - L.top0) + "px)";
      var zone = zoneAt(y);
      var key = zone.kind === "into" ? zone.lane.id : "";
      if (key !== L.key) {
        L.key = key;
        L.keyY = y;
        startDwell(key);
      } else if (key && Math.abs(y - L.keyY) > DWELL_WANDER_PX) {
        // a pointer that is still on the move has not settled, so the wait starts over
        L.keyY = y;
        startDwell(key);
      }
      paintAsk(askFor(zone));
    }

    // the piece is set down: in its own row again, in a row of its own at the place it asked for, in another row, or combined with the pieces it was held over
    function settleLifted(was, cancelled) {
      var L = was.lift;
      window.clearTimeout(L.timer);
      // the rows hold still again at once, with no glide back
      dom.lanes.classList.remove("is-carrying");
      st.lanes.forEach(function (l) {
        var rec = laneRecs[l.id];
        if (!rec) return;
        rec.el.style.transform = "";
        rec.el.classList.remove("is-vacated");
      });
      var seg = L.float.segments[0];
      st.lanes.splice(st.lanes.indexOf(L.float), 1);
      // a row that was taken out of the model while the piece was carried is put back, so the piece has somewhere to land
      if (st.lanes.indexOf(L.home) < 0) st.lanes.splice(Math.min(L.homeIndex, st.lanes.length), 0, L.home);
      var ask = cancelled ? { kind: "stay" } : L.intent;
      if ((ask.kind === "row" || ask.kind === "combine") && st.lanes.indexOf(ask.lane) < 0) ask = { kind: "stay" };
      if (ask.kind === "gap") {
        if (L.solo) {
          // the row moves as it is, which keeps what it is made of
          L.home.segments.push(seg);
          var from = st.lanes.indexOf(L.home);
          var to = ask.gap > from ? ask.gap - 1 : ask.gap;
          if (to !== from) {
            st.lanes.splice(from, 1);
            st.lanes.splice(to, 0, L.home);
          }
        } else {
          st.lanes.splice(Math.min(ask.gap, st.lanes.length), 0, { id: newId("L"), label: pieceLabel(seg), segments: [seg] });
        }
      } else if (ask.kind === "row") {
        ask.lane.segments.push(seg);
      } else if (ask.kind === "combine") {
        combineWith(ask.lane, seg);
      } else {
        L.home.segments.splice(Math.min(L.pos, L.home.segments.length), 0, seg);
      }
    }

    function onDown(e) {
      if (!st.ready) return;
      if (e.button === 2) return;
      closeMenu();
      var node = e.target.closest(".tl-seg");
      if (!node) {
        if (e.button === 0) { select(""); seekT(seekTimeAtClient(e.clientX)); }
        return;
      }
      var hit = find(node.dataset.seg);
      if (!hit || e.button !== 0) return;
      e.preventDefault();
      select(hit.seg.id);
      var edge = e.target.closest(".tl-h");
      drag = {
        id: hit.seg.id,
        mode: edge ? (edge.classList.contains("l") ? "trimL" : "trimR") : "move",
        x: e.clientX,
        y: e.clientY,
        orig: clone(hit.seg),
        moved: false,
        lift: null,
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    }

    function onMove(e) {
      if (!drag) return;
      if (drag.mode === "vmove") { moveV(e); return; }
      if (drag.mode === "vtrimL" || drag.mode === "vtrimR") { trimVEdge(e); return; }
      var hit = find(drag.id);
      if (!hit) return;
      var dx = e.clientX - drag.x;
      var dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      drag.moved = true;
      var seg = hit.seg;
      var o = drag.orig;
      var pps = pxPerSec();
      if (!(pps > 0)) return;
      var dt = dx / pps;
      var guide = -1;
      var node = segEls[seg.id];
      node.classList.add("is-dragging");
      if (drag.mode === "move") {
        var len = segLen(o);
        // the piece may slide past either end until only a hand hold of it is left
        var vis = minVisible(len);
        var lo = vis - len;
        var hi = Math.max(lo, D() - vis);
        var at = clamp(o.at + dt, lo, hi);
        // the start or the end of the piece snaps, whichever is closer to something
        var a = snapTo(at, seg.id);
        var b = snapTo(at + len, seg.id);
        if (a.hit >= 0 && (b.hit < 0 || Math.abs(a.t - at) <= Math.abs(b.t - (at + len)))) { at = a.t; guide = a.hit; }
        else if (b.hit >= 0) { at = b.t - len; guide = b.hit; }
        seg.at = r3(clamp(at, lo, hi));
        // a drag that stays level only moves the piece along its row; going up or down takes it off the row
        if (!drag.lift && Math.abs(dy) > LIFT_PX && (st.lanes.length > 1 || hit.lane.segments.length > 1)) liftPiece(hit);
        if (drag.lift) steer(e.clientY);
      } else if (drag.mode === "trimL") {
        var hi = o.at + segLen(o) - MIN_LEN;
        var lo = Math.min(leftLimit(o), hi);
        var s1 = snapTo(clamp(o.at + dt, lo, hi), seg.id);
        guide = s1.hit;
        trimLeftTo(seg, o, clamp(s1.t, lo, hi));
        clampFades(seg);
      } else {
        var oEnd = o.at + segLen(o);
        var top = Math.max(o.at + MIN_LEN, rightLimit(o));
        var s2 = snapTo(clamp(oEnd + dt, o.at + MIN_LEN, top), seg.id);
        guide = s2.hit;
        trimRightTo(seg, o, clamp(s2.t, o.at + MIN_LEN, top));
        clampFades(seg);
      }
      setSnapGuide(guide);
      positionSeg(seg, segEls[seg.id]);
      // the room the timeline makes past the ends follows the pieces while one is carried, so the view reaches it as it goes
      applyZoomWidth();
      syncVmode();
      drawSoon();
      renderProps();
      paintHandles();
      tick(false);
    }

    // a piece of the video is carried along the timeline: it keeps its place in the order of the pieces, and it may go past either end until only a hand hold of it is left
    function moveV(e) {
      var pick = findV(drag.id);
      if (!pick) return;
      var dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) < 3) return;
      drag.moved = true;
      var pps = pxPerSec();
      if (!(pps > 0)) return;
      var v = pick.seg;
      var len = vLen(drag.orig);
      var prev = st.vsegs[pick.index - 1];
      var next = st.vsegs[pick.index + 1];
      var vis = minVisible(len);
      var lo = Math.max(prev ? vEnd(prev) : -Infinity, vis - len);
      var hi = Math.min(next ? next.at - len : Infinity, D() - vis);
      if (hi < lo) hi = lo;
      var at = clamp(drag.orig.at + dx / pps, lo, hi);
      var guide = -1;
      // the start or the end of the piece snaps, whichever is closer to something
      var a = snapTo(at, v.id);
      var b = snapTo(at + len, v.id);
      if (a.hit >= 0 && (b.hit < 0 || Math.abs(a.t - at) <= Math.abs(b.t - (at + len)))) { at = a.t; guide = a.hit; }
      else if (b.hit >= 0) { at = b.t - len; guide = b.hit; }
      v.at = r3(clamp(at, lo, hi));
      vsegEls[v.id].classList.add("is-dragging");
      setSnapGuide(guide);
      positionV(v, vsegEls[v.id]);
      applyZoomWidth();
      syncVmode();
      drawSoon();
      renderProps();
      paintHandles();
      tick(false);
    }

    // an edge of a piece of the video is drawn in or out like the edge of a piece of the audio: the piece keeps its place in the order, stays between its neighbours and cannot be drawn out past what the video holds, and what the cut leaves open on either side turns black
    function trimVEdge(e) {
      var pick = findV(drag.id);
      if (!pick) return;
      var dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) < 3) return;
      drag.moved = true;
      var pps = pxPerSec();
      if (!(pps > 0)) return;
      var v = pick.seg;
      var o = drag.orig;
      var prev = st.vsegs[pick.index - 1];
      var next = st.vsegs[pick.index + 1];
      var dt = dx / pps;
      var guide = -1;
      if (drag.mode === "vtrimL") {
        var hiL = vEnd(o) - MIN_LEN;
        var loL = Math.min(Math.max(prev ? vEnd(prev) : -Infinity, o.at - o.srcStart / st.vspeed), hiL);
        var sl = snapTo(clamp(o.at + dt, loL, hiL), v.id);
        guide = sl.hit;
        var at = clamp(sl.t, loL, hiL);
        v.at = r3(at);
        v.srcStart = r3(Math.max(0, o.srcStart + (at - o.at) * st.vspeed));
      } else {
        var loR = o.at + MIN_LEN;
