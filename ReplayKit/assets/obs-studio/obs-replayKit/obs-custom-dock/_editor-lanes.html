<!-- shared partial (helper #include target: editor-lanes). the timeline of the clip editor: the video row and the audio rows under it, a toolbar over it, a properties panel beside the video and an undo history. every audio track is a row made of pieces that can be selected, moved along the timeline, which grows to reach a piece moved past an end of the clip, and carried to other rows (to the edge of a row for a place above or below it, held in the middle of a row to go into it, where a piece lying over pieces of that row combines with them into one piece named after both), cut, copied, faded, sped up and muted; the video row is made of pieces as well, which can be selected, split, moved along the timeline and deleted, and the video can be played at another speed, which stretches the whole timeline. the saved clip reaches over every piece of the video and of the audio, so where one lies past an end of the video the clip is longer than the video and the picture is black where no piece of the video is. audio files from outside the clip can be brought in with the button of the toolbar or by dropping them on the editor, each into a row of its own. the pieces are played next to the muted video so the edits can be heard, and the finished plan is handed to the saved copy. host: RKEditorLanes.create({ video, helper, dom, getBounds, setBounds, getTime, seek, duration, isPlaying, togglePlay, stop, isOpen, master, restore, setVideoRate, onVideoSpeed, onEdit, notify }), where notify(text, kind, title) takes a line or a list of lines and a kind of bad for a refusal that the host tells in a popup -->
<style>
  .editor-bottom {
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-height: 48vh;
    padding: 0 12px 12px;
  }
  /* as medal draws it: the toolbar is a long rounded bar of its own across the editor, the panels of the editor come down onto its top edge, and the ruler and the tracks lie under it apart from it. the drag handle sits on that edge and takes no room, its grab area reaching a little above and below it */
  .tl-card {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .tl-resizer {
    flex: 0 0 0;
    cursor: ns-resize;
    position: relative;
    z-index: 6;
    touch-action: none;
  }
  .tl-resizer::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -5px;
    height: 10px;
  }
  .tl-resizer::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 3px;
    width: 46px;
    height: 3px;
    border-radius: 2px;
    background: rgba(var(--text-rgb), .22);
    transform: translateX(-50%);
    transition: background 120ms linear;
  }
  .tl-resizer:hover::after,
  .tl-resizer.is-dragging::after { background: rgba(var(--text-rgb), .55); }
  .tl-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
    margin: 0 0 8px;
    padding: 6px;
    background: var(--ed-panel, var(--grey6));
    border: 1px solid var(--grey4-solid, var(--grey4));
    border-radius: 8px;
  }
  .tl-group { display: flex; align-items: center; gap: 2px; }
  /* the two ends take equal room, so the play group sits in the middle of the bar whatever is on either side */
  .tl-side { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 2px; }
  .tl-side-end { justify-content: flex-end; }
  .tl-play-group { flex: 0 0 auto; margin: 0 8px; }
  .tl-sep { width: 1px; height: 20px; margin: 0 6px; background: rgba(var(--text-rgb), .16); flex: 0 0 auto; }
  .tl-btn {
    width: 32px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .tl-btn svg { width: 17px; height: 17px; fill: currentColor; display: block; }
  .tl-btn:hover:not(:disabled) { background: rgba(var(--text-rgb), .1); }
  .tl-btn:disabled { opacity: .3; cursor: default; }
  .tl-btn.is-active { background: rgba(var(--text-rgb), .17); }
  .tl-btn.tl-delete { color: var(--red); }
  .tl-btn.tl-delete:hover:not(:disabled) { background: rgba(var(--danger-rgb), .15); }
  .tl-btn.tl-deselect { color: var(--selected2); }
  .tl-toolbar button.rk-hover-control { transform: none !important; translate: none; transition: background-color 90ms linear, border-color 90ms linear, color 90ms linear, opacity 120ms linear; }
  .tl-toolbar button.rk-hover-control > svg { flex-shrink: 0; width: 17px; height: 17px; transform: none; transition: width min(var(--anim_press, 120ms), 140ms) var(--ease_smooth, ease), height min(var(--anim_press, 120ms), 140ms) var(--ease_smooth, ease); }
  .tl-toolbar button.rk-hover-control:enabled:hover > svg { width: calc(17px * min(var(--hover_grow, 1.04), var(--rk-hover-limit, 1.04))); height: calc(17px * min(var(--hover_grow, 1.04), var(--rk-hover-limit, 1.04))); }
  .tl-toolbar button.rk-hover-control:enabled:active > svg { width: calc(17px * max(var(--press_shrink, .97), var(--rk-press-limit, .97))); height: calc(17px * max(var(--press_shrink, .97), var(--rk-press-limit, .97))); }
  @media (prefers-reduced-motion: reduce) { .tl-toolbar button.rk-hover-control > svg { transition: none; } }
  .tl-time {
    min-width: 108px;
    padding: 0 6px;
    text-align: center;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space: nowrap;
  }
  .tl-time span { color: var(--text_muted); }
  /* the note that shows while audio files are being brought in */
  .tl-busy { display: none; align-items: center; gap: 7px; margin-left: 8px; font-size: 12px; color: var(--text_muted); white-space: nowrap; }
  .tl-busy.is-on { display: flex; }
  .tl-busy::before { content: ""; width: 12px; height: 12px; border: 2px solid rgba(var(--text-rgb), .22); border-top-color: var(--text); border-radius: 50%; animation: tl-busy-spin .8s linear infinite; }
  @keyframes tl-busy-spin { to { transform: rotate(360deg); } }
  /* laid over the editor while files are dragged over it; it takes no presses, so the drop lands on what lies under it */
  .tl-drop { position: fixed; inset: 10px; z-index: 60; display: none; align-items: center; justify-content: center; pointer-events: none; border-radius: 12px; border: 2px dashed rgba(var(--accent-rgb), .9); background: rgba(var(--accent-rgb), .14); }
  .tl-drop.is-on { display: flex; }
  .tl-drop.is-off { border-color: rgba(var(--text-rgb), .35); background: rgba(0, 0, 0, .28); }
  .tl-drop span { padding: 8px 16px; border-radius: 8px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 14px; font-weight: 600; }
  /* stands in the audio area while it has no rows */
  .tl-empty { display: flex; align-items: center; justify-content: center; height: var(--tl-track-h, 40px); margin-top: 3px; border-radius: 5px; border: 1px dashed rgba(var(--text-rgb), .18); color: var(--text_muted); font-size: 12px; }
  .tl-empty[hidden] { display: none; }

  /* the frame that holds the tracks keeps its scrollbars outside of it, in the margin along its right and bottom edge, so no scrollbar ever lies over a track; the native bars are hidden and these follow the scroll of the frame */
  .tl-area {
    flex: 1 1 auto;
    min-height: 0;
    margin: 0 -12px -12px 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 8px;
    grid-template-rows: minmax(0, 1fr) 8px;
    gap: 4px;
  }
  .tl-holder {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: 8px;
    background: var(--grey7);
  }
  .tl-frame {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    scrollbar-width: none;
  }
  .tl-frame::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .tl-bar { position: relative; visibility: hidden; }
  .tl-bar.is-active { visibility: visible; }
  .tl-bar.is-v { grid-column: 2; grid-row: 1; }
  .tl-bar.is-h { grid-column: 1; grid-row: 2; }
  .tl-thumb {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 4px;
    background: rgba(var(--text-rgb), .26);
    transition: background 120ms linear;
    touch-action: none;
  }
  .tl-bar.is-v .tl-thumb { width: 100%; }
  .tl-bar.is-h .tl-thumb { height: 100%; }
  .tl-bar:hover .tl-thumb, .tl-thumb.is-dragging { background: rgba(var(--text-rgb), .46); }

  /* the tracks stand inside the frame with room on both sides, and only the ruler stays put while the tracks scroll under it, the video row among them. the script widens the content and the margins of the axis by the room a piece needs that was moved past an end of the clip, and tells the room in --tl-ext-l and --tl-ext-r */
  /* the room on the right is the blank room the script adds past the end, so the tracks reach the right edge of the frame when the timeline fits */
  .tl-content { --tl-pad: 14px; position: relative; min-width: 100%; box-sizing: border-box; padding: 6px 0 0 var(--tl-pad); }
  .tl-axis { position: relative; }
  .tl-ruler { position: sticky; top: 0; z-index: 9; height: 33px; background: var(--grey7); }
  /* the ruler is only as wide as the axis, so its colour is carried over the room beside it, or a piece out there would show above the tracks that scroll under the ruler */
  .tl-ruler::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(-1 * (var(--tl-pad) + var(--tl-ext-l, 0px))); right: calc(-1 * var(--tl-ext-r, 0px)); background: var(--grey7); }
  /* the ruler can be pressed over the room made for pieces past the ends of the clip too, which is where the playhead goes to hear and see them */
  .tl-ruler .trim-scrubber { left: calc(-1 * var(--tl-ext-l, 0px)); right: calc(-1 * var(--tl-ext-r, 0px)); }
  /* the strip of room between the ruler and the video row is a part of the ruler as far as the mouse goes, so a press and a drag right above the first track scrub the timeline too */
  .trim-scrubber.tl-scrub-gap { top: 0; bottom: auto; height: 10px; left: calc(-1 * var(--tl-ext-l, 0px)); right: calc(-1 * var(--tl-ext-r, 0px)); z-index: 8; }
  .tl-tracks { position: relative; padding-top: 10px; }
  .tl-lanes { position: relative; padding: 0 0 12px; }
  .tl-lane {
    position: relative;
    height: var(--tl-track-h, 40px);
    margin-top: 3px;
    border-radius: 5px;
  }
  .tl-lane.is-drop { --tl-holder: rgba(var(--accent-rgb), .16); }
  .tl-lane.is-drop::before { box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .8); }
  /* every row is a holder that runs the whole width of the timeline, past both ends of the clip, and its pieces lie on it; one strip per row, so no seam shows where the clip used to end and the video row is not darker where its video was trimmed away */
  .tl-lane::before, .tl-subrow::before, .trim-timeline::before { content: ""; position: absolute; top: 0; left: calc(-1 * var(--tl-ext-l, 0px)); right: calc(-1 * var(--tl-ext-r, 0px)); border-radius: 5px; background: var(--tl-holder, rgba(var(--text-rgb), .035)); pointer-events: none; }
  .tl-lane::before, .tl-subrow::before { bottom: 0; }
  .trim-timeline::before { height: var(--trim-strip-h, 40px); }
  .tl-lane.is-floating::before { display: none; }
  /* the video row takes the presses past the ends of the clip with these, where the bar of the cut does not reach, so a piece lying out there can still be picked */
  .tl-vext { position: absolute; top: 0; z-index: 0; height: var(--trim-strip-h, 40px); cursor: pointer; }
  .tl-vext.l { right: 100%; width: var(--tl-ext-l, 0px); }
  .tl-vext.r { left: 100%; width: var(--tl-ext-r, 0px); }
  /* a piece that is carried to another row leaves its row for one of its own that is out of the flow and floats over the rest; the rows glide aside to make room where it asks to be put, or hold still while it asks to go into one of them */
  .tl-lane.is-floating { position: absolute; left: 0; right: 0; margin: 0; z-index: 4; background: transparent; pointer-events: none; }
  .tl-lane.is-floating .tl-seg { box-shadow: 0 8px 18px rgba(0, 0, 0, .45); }
  .tl-lane.is-vacated { opacity: 0; }
  /* a carried piece that is about to go into a row lets the row show through, with the pieces it would be combined with lit */
  .tl-lane.is-floating.is-entering { opacity: .62; }
  .tl-lane.is-floating.is-entering .tl-seg { box-shadow: none; }
  .tl-lanes.is-carrying .tl-lane:not(.is-floating) { transition: transform 170ms cubic-bezier(.2, .7, .2, 1), opacity 120ms linear; }
  .tl-wave { position: absolute; top: 0; z-index: 1; pointer-events: none; }
  .tl-gap { position: absolute; top: 0; height: var(--tl-track-h, 40px); z-index: 5; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--text); cursor: pointer; overflow: hidden; }
  .trim-timeline > .tl-gap { height: var(--trim-strip-h, 40px); }
  .tl-gap:hover { background: repeating-linear-gradient(135deg, rgba(var(--text-rgb), .09) 0 4px, transparent 4px 8px); }
  .tl-gap.is-selected { border-color: var(--selected2); background: rgba(var(--text-rgb), .12); }
  .tl-gap svg { width: 16px; height: 16px; fill: currentColor; opacity: 0; pointer-events: none; }
  .tl-gap.is-selected svg { opacity: 1; }
  .tl-film { position: absolute; top: 0; pointer-events: none; }
  /* a track wears a faint outline in its own colour at rest: the audio tracks in the blue of their fill and the video track in a tint taken from the clip itself. the track that is selected wears the bright outline and the grips of the cut, the same on every track */
  .tl-seg {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    box-sizing: border-box;
    border-radius: 5px;
    border: 2px solid rgba(var(--seg-rgb, var(--accent-rgb)), .5);
    cursor: grab;
    touch-action: none;
  }
  .tl-seg:hover { border-color: rgba(var(--seg-rgb, var(--accent-rgb)), .85); }
  .tl-seg.is-muted { border-color: rgba(var(--text-rgb), .16); }
  .tl-seg.is-muted:hover { border-color: rgba(var(--text-rgb), .32); }
  .tl-seg.is-selected { z-index: 3; border-color: rgba(var(--text-rgb), .95); box-shadow: 0 1px 6px rgba(0, 0, 0, .38); }
  .tl-seg.is-dragging { cursor: grabbing; z-index: 4; }
  .tl-seg.is-merge-target { z-index: 3; border-color: var(--selected2); box-shadow: inset 0 0 0 2px var(--selected2); background: rgba(var(--accent-rgb), .18); }
  .tl-seg.is-muted .tl-chip { opacity: .55; }
  .tl-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 7px 2px 5px;
    border-radius: 4px;
    background: rgba(0, 0, 0, .5);
    color: #fff;
    font-size: 11px;
    line-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    user-select: none;
    vertical-align: top;
  }
  /* every piece wears its tag at its own start, the same spot on audio, video and layers, and the tag scrolls away with the piece instead of staying in view */
  .tl-seg, .tl-vseg, .tl-cue.tl-layer { container: track-piece / inline-size; }
  .tl-seg > .tl-chip, .tl-vseg > .tl-chip, .tl-cue.tl-layer > .tl-chip { position: absolute; z-index: 1; left: 16px; top: 50%; transform: translateY(-50%); margin: 0; box-sizing: border-box; min-width: 0; max-width: max(0px, calc(100% - 24px)); }
  @container track-piece (max-width: 84px) {
    :is(.tl-seg, .tl-vseg, .tl-cue.tl-layer) > .tl-chip { left: 50%; width: 16px; max-width: calc(100% - 4px); padding: 2px; gap: 0; transform: translate(-50%, -50%); }
    .tl-chip-label { display: none; }
  }
  @container track-piece (max-width: 20px) { .tl-chip { display: none; } }
  @container track-piece (max-width: 44px) { .is-selected > .tl-chip { display: none; } }
  .tl-vseg.is-linked > .tl-chip, .tl-seg.is-linked > .tl-chip { background: rgba(var(--link-rgb), .85); }
  /* the subtitles row sits above the video row; a cue is a block like a piece, in a warm colour of its own */
  .tl-subs[hidden] { display: none; }
  .tl-marquee { position: absolute; top: 2px; bottom: 2px; z-index: 6; border: 1px solid var(--selected2); border-radius: 4px; background: rgba(var(--accent-rgb), .18); pointer-events: none; }
  .tl-chip.tl-subchip { cursor: pointer; pointer-events: auto; }
  .tl-subrow { position: relative; height: var(--tl-track-h); margin: 0 0 3px; border-radius: 6px; }
  .tl-chip.tl-subchip { position: absolute; z-index: 5; left: 8px; top: 6px; margin: 0; max-width: calc(100% - 32px); }
  .tl-cue {
    position: absolute; top: 3px; bottom: 3px; z-index: 2; box-sizing: border-box; min-width: 4px; padding: 0 8px;
    border-radius: 4px; border: 2px solid rgba(224, 165, 55, .7); background: rgba(224, 165, 55, .2);
    color: #fff; font-size: 11px; line-height: calc(var(--tl-track-h) - 8px); cursor: grab; touch-action: none; overflow: hidden;
  }
  .tl-cue:hover { border-color: rgba(224, 165, 55, 1); }
  .tl-cue.is-selected { z-index: 3; border-color: rgba(var(--text-rgb), .95); box-shadow: 0 1px 6px rgba(0, 0, 0, .38); }
  /* a cue the speech engine was unsure of, until its text is edited or kept: orange, with a mark at its start */
  .tl-cue.is-unsure { border-color: rgba(255, 159, 67, .9); background: rgba(255, 159, 67, .28); padding-left: 22px; }
  .tl-cue.is-unsure:hover { border-color: rgb(255, 159, 67); }
  .tl-cue.is-unsure::before { content: "!"; position: absolute; left: 4px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: rgb(255, 159, 67); color: #1a1a1a; font-size: 10px; font-weight: 800; line-height: 14px; text-align: center; pointer-events: none; }
  .tl-cue.is-unsure.is-selected { border-color: rgba(var(--text-rgb), .95); }
  /* a layer is a block like a subtitle, in a cool colour of its own, alone in its row */
  .tl-layers[hidden] { display: none; }
  .tl-cue.tl-layer { border-color: rgba(120, 140, 255, .75); background: rgba(120, 140, 255, .22); }
  .tl-cue.tl-layer:hover { border-color: rgba(120, 140, 255, 1); }
  .tl-cue.tl-layer.is-selected { border-color: rgba(var(--text-rgb), .95); }
  .tl-chip.tl-layerchip { max-width: 40%; }
  /* a layer carries its own tag, so the tag goes where the layer goes instead of standing at the start of its row */
  .tl-layerrow > .tl-layerchip { display: none; }
  .tl-cue.tl-layer .tl-cue-text { display: none; }
  .tl-cue.tl-layer.is-linked > .tl-chip { background: rgba(var(--link-rgb), .85); }
  /* a layer shows what it is along its block, its picture (a clip its thumbnail) repeated at the height of the block like the strip of the video row, under a faint wash of its colour */
  .tl-cue.tl-layer.has-thumb { background-repeat: no-repeat, repeat-x; background-size: 100% 100%, auto 100%; background-position: 0 0, left center; }
  .tl-cue.tl-layer.has-thumb .tl-cue-text { visibility: hidden; }
  /* a sticker, a shape or a gif sits a little smaller with room between its copies, so they read as separate pictures */
  .tl-cue.tl-layer.has-thumb.is-pic { background-repeat: no-repeat, space; background-size: 100% 100%, auto 78%; background-position: 0 0, center; }
  /* a row of another clip is a video row: the same height, ground and outline as the video row, its pieces its frames edge to edge with no wash */
  .tl-subrow.tl-layerrow.is-video { border-radius: 5px; }
  /* an added clip lights up in its own colour while it is selected, and so does the other half of it, its picture or its sound, so the two read as one */
  :is(.tl-seg, .tl-vseg, .tl-layer).is-linked.is-selected { border-color: rgb(var(--link-rgb)) !important; box-shadow: 0 0 0 1px rgb(var(--link-rgb)), 0 1px 6px rgba(0, 0, 0, .38); }
  :is(.tl-seg, .tl-vseg, .tl-layer).is-linked.is-grouped { border-color: rgb(var(--link-rgb)) !important; box-shadow: 0 0 0 1px rgba(var(--link-rgb), .55); }
  .tl-cue.tl-layer.is-clip { top: 0; bottom: 0; padding: 0; border-radius: 5px; border-color: var(--tl-video-line, rgba(var(--text-rgb), .3)); background-color: transparent; }
  .tl-cue.tl-layer.is-clip:hover { border-color: rgba(var(--text-rgb), .55); }
  .tl-cue.tl-layer.is-clip.is-selected { border-color: rgba(var(--text-rgb), .95); }
  .tl-subrow.tl-layerrow.is-drop-target::before { outline: 2px dashed var(--selected2); outline-offset: -2px; }
  .tl-box .btn.tl-wide { width: 100%; height: 32px; margin-top: 12px; --hover_grow: 1.01; --press_shrink: .99; }
  .tl-box .btn.tl-wide + .btn.tl-wide { margin-top: 8px; }
  /* the layers on the preview sit over the picture, under the subtitles, each placed by its centre */
  .lay-overlay { position: absolute; z-index: 2; pointer-events: none; overflow: hidden; }
  /* a piece of the video taken from another clip plays in an element of its own over the video, fitted into the picture the way the saved copy fits it, and under the canvas of the look, which draws it instead while there is a look */
  .ed-piece-view { position: absolute; z-index: 1; pointer-events: none; transform-origin: 0 0; }
  .ed-piece-view[hidden] { display: none; }
  .ed-piece-pic { position: absolute; background: #000; overflow: hidden; }
  .ed-piece-pic video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .lay-overlay[hidden] { display: none; }
  .lay-item { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: grab; touch-action: none; }
  .lay-item[hidden] { display: none; }
  .lay-overlay.is-dragging .lay-item { cursor: grabbing; }
  /* the overlay is inside the editor, whose rules for its videos lay them over the whole preview, so a clip here is put back in its box with more weight */
  .lay-overlay .lay-media { position: relative; display: block; width: 100%; height: auto; pointer-events: none; user-select: none; }
  .lay-item::after { content: ""; position: absolute; inset: -2px; border: 1px dashed transparent; border-radius: 2px; pointer-events: none; transition: border-color 120ms linear; }
  .lay-item:hover::after, .lay-item.is-selected::after { border-color: rgba(255, 255, 255, .7); }
  .lay-item .lay-grip, .lay-item .lay-rot { opacity: 0; }
  .lay-item:hover .lay-grip, .lay-item.is-selected .lay-grip, .lay-item:hover .lay-rot, .lay-item.is-selected .lay-rot { opacity: 1; }
  .tl-cue-text { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; user-select: none; }
  .tl-chip svg { width: 12px; height: 12px; fill: currentColor; flex: 0 0 auto; }
  .tl-chip-label { overflow: hidden; text-overflow: ellipsis; }
  .tl-h { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; z-index: 4; }
  .tl-h.l { left: -2px; }
  .tl-h.r { right: -2px; }
  /* the grips of the track that is selected are the grips of the cut on the video row: a bright cap at each end with the same short stroke in it */

    // a press on a cue selects it, and a drag moves it (with every other picked cue) or, from an edge, moves that edge; shift or ctrl adds a cue to the pick or takes it out, the name of a row picks the whole row, and a drag beside the cues picks the ones it passes over, while a plain press there moves the playhead

        return;
      }

      var cue = findSub(node.dataset.cue);

        commit();
        subsChanged();

      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    }

    // a box dragged across a row picks the cues of that row it touches; shift keeps what was picked before

    // the cue after this one in its row, which a merge joins it to

    }

    // every cue of one row moves into another, which keeps its own style and name
    function mergeRows(fromId, intoId) {

      st.subs.forEach(function (c) { if (c.row === fromId) c.row = intoId; });
      dropEmptyRows();
      commit();
      subsChanged();
    }

    function moveRow(rowId, dir) {
      var i = st.subRows.findIndex(function (r) { return r.id === rowId; });
      var j = i + dir;
      if (i < 0 || j < 0 || j >= st.subRows.length) return;
      var row = st.subRows.splice(i, 1)[0];
      st.subRows.splice(j, 0, row);
      commit();
      subsChanged();
    }

    function onSubContext(e) {

      }

    // a time of the source video as it lands on the timeline: through the piece of the video it is in when the video was cut up, else stretched by the speed; null when that moment was cut out
    function sourceToTimeline(srcT) {

      for (var i = 0; i < st.vsegs.length; i++) {
        var v = st.vsegs[i];

      }
      return null;
    }

    // the subtitles of the saved copy, row by row in seconds of the copy, each cue with the lines the preview broke it into; null when there are none

      if (!st.subs.length) return null;
      var start = saveWindow().start;
      var end = saveWindow().end;

        var cues = [];
        var cell = 0;

          var b = Math.min(c.end, end);

        if (dragging === "vtrimR") capL = true;
      } else if (st.Dsrc > 0 && opts.getBounds && videoSelected()) {
        var b = boundsT();
        var w = windowT();
        var edge = EDGE / st.vspeed;
        var pps = pxPerSec();
        var near = Math.max(edge, pps > 0 ? 1.5 / pps : 0);
        var drawnL = b.start > edge;
        var drawnR = b.end < D() - edge;
        if (naturalV()) {
          cutL = true;
          cutR = true;
          range = true;
        } else if (!pick) {
          cutL = Math.abs(w.start - b.start) <= near;
          cutR = Math.abs(w.end - b.end) <= near;
          // the outline of the cut is drawn over the video itself, so it only shows while the saved clip does not reach past it on either side
          range = cutL && cutR;
        } else {
          var left = pick.seg.at;
          var right = vEnd(pick.seg);
          var atL = Math.abs(left - b.start) <= near;
          var atR = Math.abs(right - b.end) <= near;
          cutL = atL || (drawnL && b.start >= left - near && b.start <= right + near);
          cutR = atR || (drawnR && b.end >= left - near && b.end <= right + near);
          capL = !atL && left >= w.start - near && left <= w.end + near;
          capR = !atR && right >= w.start - near && right <= w.end + near;
          // the edge that is being dragged keeps its own grip, even where it passes the place of the cut
          var mode = drag && drag.id === pick.seg.id ? drag.mode : "";
          if (mode === "vtrimL") { capL = true; cutL = cutL && !atL; }
          if (mode === "vtrimR") { capR = true; cutR = cutR && !atR; }
        }
      }
      var cls = dom.timeline.classList;
      cls.toggle("cut-l", cutL);
      cls.toggle("cut-r", cutR);
      cls.toggle("cut-range", range);
      st.vsegs.forEach(function (v) {
        var node = vsegEls[v.id];
        if (!node) return;
        var mine = !!pick && pick.seg === v;
        node.classList.toggle("is-capped-l", mine && capL);
        node.classList.toggle("is-capped-r", mine && capR);
        joinedEdges(node, v, st.vsegs, vEnd);
      });
      Object.keys(segEls).forEach(function (sid) {
        var hit = find(sid);
        if (hit) joinedEdges(segEls[sid], hit.seg, hit.lane.segments, segEnd);
      });
      // a grip of the cut that is hidden must not keep the keys of the keyboard either
      var focused = document.activeElement;
      if (focused && focused.tagName === "INPUT" && dom.timeline.contains(focused)) {
        if ((focused.id === "trim-start" && !cutL) || (focused.id === "trim-end" && !cutR)) focused.blur();
      }
    }

    function select(id) {
      selectedGap = null;
      st.selected = id || "";
      subPicked = findSub(st.selected) ? [st.selected] : [];
      paintSelection();
      renderProps();
      refreshToolbar();
      if (opts.onSubtitles) opts.onSubtitles();
    }

    // operations

    function rowGaps(items, endOf) {
      var cursor = 0, gaps = [];
      items.slice().sort(function (a, b) { return a.at - b.at; }).forEach(function (item) {
        if (item.at > cursor + 0.002) gaps.push({ start: r3(cursor), end: r3(item.at) });
        cursor = Math.max(cursor, endOf(item));
      });
      return gaps;
    }

    function gapRow(kind, row) {
      if (kind === "video") return { items: st.vsegs, end: vEnd };
      if (kind === "layer") return { items: st.layers.filter(function (l) { return l.row === row; }), end: function (l) { return l.end; } };
      var lane = st.lanes.find(function (l) { return l.id === row; });
      return { items: lane ? lane.segments : [], end: segEnd };
    }

    function removeGap() {
      if (!selectedGap) return;
      var gap = selectedGap, row = gapRow(gap.kind, gap.row);
      var found = rowGaps(row.items, row.end).find(function (g) { return Math.abs(g.start - gap.start) < 0.002 && Math.abs(g.end - gap.end) < 0.002; });
      if (!found) { select(""); return; }
      var length = found.end - found.start;
      row.items.forEach(function (item) {
        if (item.at < found.end - 0.002) return;
        item.at = r3(item.at - length);
        if (gap.kind === "layer") item.end = r3(item.end - length);
        if (gap.kind === "audio") unlink(item);
      });
      selectedGap = null;
      done();
    }

    function syncGaps() {
      var live = {}, d = D() || 1;
      function row(host, kind, id) {
        if (!host) return;
        var data = gapRow(kind, id);
        rowGaps(data.items, data.end).forEach(function (gap) {
          var key = kind + ":" + id + ":" + gap.start + ":" + gap.end;
          live[key] = true;
          var node = gapNodes[key];
          if (!node) {
            node = gapNodes[key] = el("button", "tl-gap");
            node.type = "button";
            node.innerHTML = icon("action/trash");
            node.addEventListener("pointerdown", function (e) { e.preventDefault(); e.stopImmediatePropagation(); });
            node.addEventListener("click", function (e) {
              e.stopPropagation();
              if (drag) return;
              closeMenu();
              if (selectedGap && selectedGap.key === key) { removeGap(); return; }
              select("");
              selectedGap = { key: key, kind: kind, row: id, start: gap.start, end: gap.end };
              paintSelection();
              refreshToolbar();
              syncGaps();
            });
            node.addEventListener("contextmenu", function (e) {
              e.preventDefault(); e.stopPropagation();
              select("");
              selectedGap = { key: key, kind: kind, row: id, start: gap.start, end: gap.end };
              paintSelection(); refreshToolbar();
              showMenu(e.clientX, e.clientY, [{ label: "Remove empty space", icon: "action/trash", danger: true, key: "Delete", action: removeGap }]);
            });
          }
          if (node.parentNode !== host) host.appendChild(node);
          node.style.left = (gap.start / d * 100) + "%";
          node.style.width = ((gap.end - gap.start) / d * 100) + "%";
          var picked = !!selectedGap && selectedGap.key === key;
          node.classList.toggle("is-selected", picked);
          node.setAttribute("aria-pressed", picked ? "true" : "false");
          node.setAttribute("aria-label", picked ? "Remove empty space" : "Select empty space");
        });
      }
      row(dom.timeline, "video", "");
      st.lanes.forEach(function (lane) { row(laneRecs[lane.id] && laneRecs[lane.id].el, "audio", lane.id); });
      Object.keys(layerRowEls).forEach(function (id) { row(layerRowEls[id], "layer", id); });
      Object.keys(gapNodes).forEach(function (key) { if (!live[key]) { gapNodes[key].remove(); delete gapNodes[key]; } });
      if (selectedGap && !live[selectedGap.key]) selectedGap = null;
    }

    // a piece cut at the time t of the timeline: the parts that lie after the cut go to a new piece and a part that runs over it is cut in two
    function splitPiece(hit, t) {
      var seg = hit.seg;
      if (t < seg.at + MIN_LEN || t > segEnd(seg) - MIN_LEN) return null;
      var tau = (t - seg.at) * seg.speed;
      var right = clone(seg);
      right.id = newId("S");
      right.at = r3(t);
      // the two halves of a linked sound would each follow the whole piece
      unlink(seg);
      unlink(right);
      right.fadeIn = 0;
      seg.fadeOut = 0;
      var leftParts = [];
      var rightParts = [];
      seg.parts.forEach(function (p) {
        var len = partLen(p);
        if (p.off < tau) {
          var kept = clone(p);
          if (p.off + len > tau) kept.srcEnd = r3(p.srcStart + (tau - p.off));
          leftParts.push(kept);
        }
        if (p.off + len > tau) {
          var tail = clone(p);
          if (p.off < tau) { tail.srcStart = r3(p.srcStart + (tau - p.off)); tail.off = 0; }
          else tail.off = r3(p.off - tau);
          rightParts.push(tail);
        }
      });
      seg.parts = leftParts;
      right.parts = rightParts;
      hit.lane.segments.splice(hit.lane.segments.indexOf(seg) + 1, 0, right);
      return right;
    }

    // a piece of the video cut at the time t: the second piece starts where the first one ends, in the source as well as on the timeline
    function splitV(v, t) {
      if (t < v.at + MIN_LEN || t > vEnd(v) - MIN_LEN) return null;
      var cut = r3(v.srcStart + (t - v.at) * vSpeed(v));
      v.fx = RKEditorFx.cleanFx(v.fx || st.fx);
      v.speed = vSpeed(v);
      v.pitch = v.pitch == null ? st.vpitch : v.pitch;
      v.audioLink = v.audioLink == null ? st.vlink : v.audioLink;
      var right = clone(v);
      right.id = newId("V");
      right.srcStart = cut;
      right.at = r3(v.at + (cut - v.srcStart) / v.speed);
      v.srcEnd = cut;
      st.vsegs.splice(st.vsegs.indexOf(v) + 1, 0, right);
      // the sound of a piece from another clip is cut with it, and the second half follows the second piece
      linkedTo(v.id).forEach(function (h) {
        var copy = clone(h.seg);
        copy.id = newId("S");
        copy.link = right.id;
        h.lane.segments.splice(h.lane.segments.indexOf(h.seg) + 1, 0, copy);
      });
      return right;
    }

    // a piece put into the video at the time t: the video is cut there and everything from there on (pieces, sound, subtitles and video rows) moves along by its length, so nothing that was there is covered; a linked sound follows its own clip instead
    function insertPiece(piece, t) {
      var len = vLen(piece);
      t = r3(t);
      var under = vAt(t);
      if (under && t > under.at + MIN_LEN && t < vEnd(under) - MIN_LEN) splitV(under, t);
      st.vsegs.forEach(function (v) { if (v.at >= t - 1e-6) v.at = r3(v.at + len); });
      if (st.ready) {
        allSegs().forEach(function (h) { if (!h.seg.link && t > h.seg.at + MIN_LEN && t < segEnd(h.seg) - MIN_LEN) splitPiece(h, t); });
        allSegs().forEach(function (h) { if (!h.seg.link && h.seg.at >= t - 1e-6) h.seg.at = r3(h.seg.at + len); });
      }
      st.subs.forEach(function (cue) {
        if (cue.at < t - 1e-6) return;
        cue.at = r3(cue.at + len);
        cue.end = r3(cue.end + len);
        if (cue.words) cue.words = cue.words.map(function (w) { return [r3(w[0] + len), r3(w[1] + len)]; });
      });
      st.layers.forEach(function (l) { if (l.at >= t - 1e-6) { l.at = r3(l.at + len); l.end = r3(l.end + len); } });
      piece.at = t;
      var i = 0;
      while (i < st.vsegs.length && st.vsegs[i].at < piece.at) i++;
      st.vsegs.splice(i, 0, piece);
    }

    function fxRow() { var l = findLayer(st.selected); return l && l.kind === "clip" ? l : null; }

    // a layer cut at the time t: the second half stays in the same row and starts where the first ends, in its clip as well; a linked sound is cut with it
    function splitLayer(l, t) {
      if (!(t > l.at + LAYER_MIN && t < l.end - LAYER_MIN)) return null;
      var right = clone(l);
      right.id = newId("E");
      right.at = r3(t);
      if (l.kind === "clip" || l.gif) right.src = r3(l.src + (t - l.at));
      l.end = r3(t);
      st.layers.splice(st.layers.indexOf(l) + 1, 0, right);
      linkedTo(l.id).forEach(function (h) {
        var copy = clone(h.seg);
        copy.id = newId("S");
        copy.link = right.id;
        h.lane.segments.splice(h.lane.segments.indexOf(h.seg) + 1, 0, copy);
      });
      return right;
    }

    // a layer let go over another row joins it, and over the top of the rows gets a row of its own on top of the others; the row higher up covers the ones under it
    function moveToRow(l, key) {
      st.layers.splice(st.layers.indexOf(l), 1);
      if (key === "new") {
        l.row = l.id;
        st.layers.push(l);
      } else {
        l.row = key;
        var last = -1;
        st.layers.forEach(function (x, i) { if (x.row === key) last = i; });
        st.layers.splice(last + 1, 0, l);
      }
      st.layers = groupRows(st.layers);
      st.selected = l.id;
      done();
    }

    // the sound linked to a clip goes with it when the clip changes rows
    function moveLinks(from, to) {
      allSegs().forEach(function (h) {
        if (h.seg.link === from) h.seg.link = to;
        if (h.seg.origin === from) h.seg.origin = to;
      });
    }

    // a video row let go over the video goes into it where it starts, the same part of its clip
    function rowToPiece(l) {
      var at = st.layers.indexOf(l);
      if (at < 0 || !(st.Dsrc > 0)) return;
      var srcEnd = l.src + (l.end - l.at) * st.vspeed;
      var piece = { id: newId("V"), at: 0, srcStart: r3(l.src), srcEnd: r3(l.dur > 0 ? Math.min(l.dur, srcEnd) : srcEnd), ref: l.ref, name: l.name, dur: l.dur, aspect: l.aspect, fx: RKEditorFx.cleanFx(l.fx) };
      st.layers.splice(at, 1);
      insertPiece(piece, l.at);
      moveLinks(l.id, piece.id);
      st.selected = piece.id;
      done();
    }

    // a piece of another clip carried up out of the video becomes a video row of its own where it lay, full size, and leaves black behind in the video
    function pieceToRow(v) {
      if (!v.ref || st.layers.length >= LAYER_MAX) return;
      var made = cleanLayers([{ kind: "clip", ref: v.ref, name: v.name, at: v.at, end: vEnd(v), src: v.srcStart, dur: v.dur, x: 0.5, y: 0.5, w: 1, aspect: v.aspect || 0.5625, opacity: 1, fx: v.fx || st.fx }])[0];
      if (!made) return;
      st.vsegs.splice(st.vsegs.indexOf(v), 1);
      st.layers.push(made);
      moveLinks(v.id, made.id);
      st.selected = made.id;
      done();
    }

    // what the playhead cuts: the piece that is selected, or when the video as a whole is selected its piece under the playhead, or when nothing is selected everything under the playhead, the video among it
    function doSplit() {
      if (!st.ready && !st.vsegs.length) return;
      var t = nowT();
      var first = null;
      var pickV = selectedV();
      var pickA = selected();
      var pickL = findLayer(st.selected);
      if (pickL) {
        first = splitLayer(pickL, t);
      } else if (pickV) {
        first = splitV(pickV.seg, t);
      } else if (pickA) {
        first = splitPiece(pickA, t);
      } else if (st.selected === "video") {
        var under = vAt(t);
        if (under) first = splitV(under, t);
      } else {
        if (st.ready) {
          allSegs().filter(function (h) { return t > h.seg.at + MIN_LEN && t < segEnd(h.seg) - MIN_LEN; }).forEach(function (h) {
            var right = splitPiece(h, t);
            if (right && !first) first = right;
          });
        }
        var cut = vAt(t);
        var rightV = cut ? splitV(cut, t) : null;
        if (rightV && !first) first = rightV;
      }
      if (!first) return;
      st.selected = first.id;
      done();
    }

    function doDelete() {
      if (selectedGap) { removeGap(); return; }
      var layer = findLayer(st.selected);
      if (layer) {
        st.layers.splice(st.layers.indexOf(layer), 1);
        st.selected = "";
        syncLinked();
        done();
        refreshToolbar();
        return;
      }
      var picked = pickedSubs();
      if (picked.length) {
        st.subs = st.subs.filter(function (c) { return picked.indexOf(c.id) < 0; });
        st.selected = "";
        subPicked = [];
        dropEmptyRows();
        commit();
        subsChanged();
        refreshToolbar();
        return;
      }
      var pickV = selectedV();
      if (pickV) {
        st.vsegs.splice(pickV.index, 1);
        st.selected = "";
        done();
        return;
      }
      var hit = selected();
      if (!hit) return;
      hit.lane.segments.splice(hit.lane.segments.indexOf(hit.seg), 1);
      st.selected = "";
      done();
    }

    // whether one more row fits, which the plan of the saved copy limits; a note says so when it does not
    function roomForRow() {
      if (restRows().length < MAX_LANES) return true;
      if (opts.notify) opts.notify("A clip can hold " + MAX_LANES + " rows at most.");
      return false;
    }

    // the copy lies in a row of its own, right under the piece at the same place, so both can be seen and each can be moved without the other
    function doDuplicate() {
      var hit = selected();
      if (!hit || !roomForRow()) return;
      var c = clone(hit.seg);
      c.id = newId("S");
      st.lanes.splice(st.lanes.indexOf(hit.lane) + 1, 0, { id: newId("L"), label: pieceLabel(c), segments: [c] });
      st.selected = c.id;
      done();
    }

    // a piece that shares its row with others goes into a row of its own, right under that row
    function doOwnRow() {
      var hit = selected();
      if (!hit || hit.lane.segments.length < 2 || !roomForRow()) return;
      hit.lane.segments.splice(hit.lane.segments.indexOf(hit.seg), 1);
      st.lanes.splice(st.lanes.indexOf(hit.lane) + 1, 0, { id: newId("L"), label: pieceLabel(hit.seg), segments: [hit.seg] });
      done();
    }

    function doCopy() {
      var hit = selected();
      if (hit) st.clipboard = clone(hit.seg);
      refreshToolbar();
    }

    function doPaste(laneIndex, at) {
      if (!st.clipboard) return;
      var hit = selected();
      var c = clone(st.clipboard);
      c.id = newId("S");
      unlink(c);
      var t = at != null ? at : nowT();
      c.at = r3(clamp(t, 0, Math.max(0, D() - segLen(c))));
      var lane = laneIndex != null ? st.lanes[laneIndex] : hit ? hit.lane : st.lanes[0];
      if (!lane) {
        // every row was deleted, so the piece brings a row of its own
        lane = { id: newId("L"), label: pieceLabel(c), segments: [] };
        st.lanes.push(lane);
      }
      lane.segments.push(c);
      st.selected = c.id;
      done();
    }

    function doMute() {
      var hit = selected();
      if (!hit) return;
      hit.seg.muted = !hit.seg.muted;
      done();
    }

    function doMuteLane(laneIndex) {
      var lane = st.lanes[laneIndex];
      if (!lane || !lane.segments.length) return;
      var mute = lane.segments.some(function (s) { return !s.muted; });
      lane.segments.forEach(function (s) { s.muted = mute; });
      done();
    }

    function doMoveLane(laneIndex, delta) {
      var to = laneIndex + delta;
      if (to < 0 || to >= st.lanes.length) return;
      var lane = st.lanes.splice(laneIndex, 1)[0];
      st.lanes.splice(to, 0, lane);
      done();
    }

    // a combined piece goes back to one piece for every part, each in a row of its own
    function doUngroup() {
      var hit = selected();
      if (!hit || hit.seg.parts.length < 2) return;
      var seg = hit.seg;
      var made = [];
      seg.parts.forEach(function (p, i) {
        var piece = clone(seg);
        piece.id = i === 0 ? seg.id : newId("S");
        piece.parts = [newPart(p.src, p.srcStart, p.srcEnd, 0, 1)];
        piece.at = r3(seg.at + p.off / seg.speed);
        piece.volume = r3(Math.min(4, seg.volume * p.gain));
        // the fades belong to the piece as a whole, so a part that does not span all of it keeps none
        var spans = p.off < 0.0005 && Math.abs(partLen(p) - localLen(seg)) < 0.0005;
        if (!spans) { piece.fadeIn = 0; piece.fadeOut = 0; }
        made.push(piece);
      });
      hit.lane.segments.splice(hit.lane.segments.indexOf(seg), 1, made[0]);
      var at = st.lanes.indexOf(hit.lane);
      for (var i = 1; i < made.length; i++) {
        st.lanes.splice(at + i, 0, { id: newId("L"), label: labelOf(made[i].parts[0].src), segments: [made[i]] });
      }
      st.selected = made[0].id;
      done();
    }

    function markIn() {
      var b = boundsT();
      var t = nowT();
      if ((b.end - t) * st.vspeed < 0.5) return;
      setBoundsT(t, b.end);
      commit();
    }

    function markOut() {
      var b = boundsT();
      var t = nowT();
      if ((t - b.start) * st.vspeed < 0.5) return;
      setBoundsT(b.start, t);
      commit();
    }

    // while the audio is left alone when the video is trimmed (the switch of the toolbar off), the cut of the clip only ever trims the video: a cut drawn in by the keys of the cut, by a draft or before the switch was turned off becomes a trim of the pieces of the video, and the cut opens up to the whole clip, so the audio, the layers and the subtitles past it stay in the saved clip
    function releaseCut() {
      if (prefs.trimAudioWithVideo || !(st.Dsrc > 0) || !opts.getBounds || !opts.setBounds) return false;
      var b = boundsT();
      var d = D();
      var edge = EDGE / st.vspeed;
      var lo = b.start > edge ? b.start : -Infinity;
      var hi = b.end < d - edge ? b.end : Infinity;
      if (lo === -Infinity && hi === Infinity) return false;
      var kept = [];
      st.vsegs.forEach(function (v) {
        var end = vEnd(v);
        var a = Math.max(v.at, lo);
        var e = Math.min(end, hi);
        if (e - a < MIN_LEN) { if (st.selected === v.id) st.selected = ""; return; }
        v.srcStart = r3(v.srcStart + (a - v.at) * vSpeed(v));
        v.srcEnd = r3(v.srcEnd - (end - e) * vSpeed(v));
        v.at = r3(a);
        kept.push(v);
      });
      st.vsegs = kept;
      setBoundsT(0, d);
      return true;
    }

    function toggleTrimAudioWithVideo() {
      prefs.trimAudioWithVideo = !prefs.trimAudioWithVideo;
      savePrefs();
      // turning it off hands a cut that was drawn in over to the video alone
      if (prefs.trimAudioWithVideo ? applyVideoCut() : releaseCut()) { changed(); commit(); }
      paintHandles();
      refreshToolbar();
      setBoundsUi(opts.getBounds().start, opts.getBounds().end);
    }

    function applyVideoCut() {
      if (!(st.Dsrc > 0) || !st.vsegs.length) return false;
      var b = boundsT();
      var start = Infinity, end = -Infinity;
      st.vsegs.forEach(function (v) { start = Math.min(start, v.at); end = Math.max(end, vEnd(v)); });
      start = clamp(start, b.start, b.end);
      end = clamp(end, start, b.end);
      if ((end - start) * st.vspeed < 0.5 || (Math.abs(start - b.start) < 0.0005 && Math.abs(end - b.end) < 0.0005)) return false;
      setBoundsT(start, end);
      return true;
    }

    function trimCutEdge(edge) {
      if (!prefs.trimAudioWithVideo || st.vsegs.length !== 1) return;
      var v = st.vsegs[0];
      var b = boundsT();
      if (edge === "start") {
        var first = Math.max(0, v.at - v.srcStart / vSpeed(v));
        var lastStart = Math.min(vEnd(v) - MIN_LEN, b.end - 0.5 / st.vspeed);
        if (lastStart < first) return;
        var start = clamp(b.start, first, lastStart);
        v.srcStart = r3(Math.max(0, v.srcStart + (start - v.at) * vSpeed(v)));
        v.at = r3(start);
        if (Math.abs(start - b.start) > 0.0005) setBoundsT(start, b.end);
      } else if (edge === "end") {
