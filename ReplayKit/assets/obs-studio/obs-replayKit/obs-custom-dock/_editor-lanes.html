    // the button: the helper opens the picker, starts making audio of every file chosen, and says which ones it took
    function pickAudio() {
      if (!st.ready || st.picking) return;
      var room = importRoom();
      if (room < 1) { importNote("A clip can hold " + MAX_LANES + " rows at most."); return; }
      var mine = seq;
      st.picking = true;
      refreshToolbar();
      notifyBusy();
      fetch(opts.helper + "/import-audio/pick?max=" + room, { method: "POST", cache: "no-store" })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (mine !== seq) return null;
          st.picking = false;
          refreshToolbar();
          notifyBusy();
          if (!data || !data.ok) {
            if (data && !data.cancelled) importNote(data.message || "The audio could not be imported");
            return null;
          }
          var jobs = [];
          var problems = [];
          (data.files || []).forEach(function (f) {
            if (!f.ok) { problems.push((f.name || "File") + ": " + (f.message || "The audio could not be imported")); return; }
            jobs.push({ name: f.name, begin: function () { return Promise.resolve(f.id); } });
          });
          if (data.skipped > 0) problems.push("A clip can hold " + MAX_LANES + " rows at most, so " + data.skipped + (data.skipped === 1 ? " file was" : " files were") + " left out");
          if (!jobs.length) { if (problems.length) reportProblems(problems); return null; }
          st.importing += jobs.length;
          setBusy();
          return runImports(jobs, null, mine, problems);
        })
        .catch(function () {
          if (mine !== seq) return;
          st.picking = false;
          refreshToolbar();
          notifyBusy();
          importNote("The audio could not be imported");
        });
    }

    // files dropped on the editor: sent to the helper one after the other, each into a row of its own at the place it was dropped on the timeline, or at the playhead when it was dropped anywhere else
    function dropFiles(files, folders, clientX, clientY) {
      if (!st.ready) { importNote("Audio cannot be added to this clip"); return; }
      if (!files.length) { if (folders) importNote("Folders cannot be added, drop the files in them"); return; }
      var at = null;
      var rect = dom.frame.getBoundingClientRect();
      if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) at = timeAtClient(clientX);
      var room = importRoom();
      var jobs = [];
      var problems = [];
      var left = 0;
      files.forEach(function (file) {
        if (!file.size) { problems.push(file.name + ": the file is empty"); return; }
        if (file.size > MAX_IMPORT_BYTES) { problems.push(file.name + ": the file is larger than 512 MB"); return; }
        if (jobs.length >= room) { left += 1; return; }
        jobs.push({ name: file.name, begin: function () { return upload(file); } });
      });
      if (left > 0) problems.push("A clip can hold " + MAX_LANES + " rows at most, so " + left + (left === 1 ? " file was" : " files were") + " left out");
      if (!jobs.length) { if (problems.length) reportProblems(problems); return; }
      st.importing += jobs.length;
      setBusy();
      runImports(jobs, at, seq, problems);
    }

    // what a drop holds, read while the event is still going: the files, and how many folders were among them
    function droppedFiles(dt) {
      var files = [];
      var folders = 0;
      if (dt.items && dt.items.length) {
        for (var i = 0; i < dt.items.length; i++) {
          var item = dt.items[i];
          if (item.kind !== "file") continue;
          var entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
          if (entry && entry.isDirectory) { folders += 1; continue; }
          var file = item.getAsFile();
          if (file) files.push(file);
        }
      } else {
        files = Array.prototype.slice.call(dt.files || []);
      }
      return { files: files, folders: folders };
    }

    // files dragged over the editor. a drag over the page that nothing takes would make the window open the file itself, so every file drag is taken here while the editor is open
    var dragDepth = 0;
    var dropTimer = 0;

    function hasFiles(e) {
      var types = e.dataTransfer && e.dataTransfer.types;
      if (!types) return false;
      for (var i = 0; i < types.length; i++) if (types[i] === "Files") return true;
      return false;
    }

    // the overlay stays while the drag goes on, and a drag that ends without a leave being seen takes it away after a moment, so it never stays up
    function dropShow(on) {
      window.clearTimeout(dropTimer);
      dropTimer = 0;
      if (els.drop) {
        els.drop.classList.toggle("is-on", !!on);
        // a clip that cannot take audio says so, and the overlay is plainer
        els.drop.classList.toggle("is-off", !st.ready);
        els.dropLabel.textContent = st.ready ? "Drop audio files to add them" : "Audio cannot be added to this clip";
      }
      if (on) dropTimer = window.setTimeout(function () { dropShow(false); }, 1500);
      else dragDepth = 0;
    }

    function onDragEnter(e) {
      if (!opts.isOpen() || !hasFiles(e)) return;
      e.preventDefault();
      dragDepth += 1;
      dropShow(true);
    }

    function onDragOver(e) {
      if (!opts.isOpen() || !hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = st.ready ? "copy" : "none";
      dropShow(true);
    }

    function onDragLeave(e) {
      if (!opts.isOpen() || !hasFiles(e)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) dropShow(false);
    }

    function onDrop(e) {
      if (!opts.isOpen() || !hasFiles(e)) return;
      e.preventDefault();
      dropShow(false);
      var got = droppedFiles(e.dataTransfer);
      dropFiles(got.files, got.folders, e.clientX, e.clientY);
    }

    // loading

    function ask(name) {
      return fetch(opts.helper + "/clip-audio?name=" + encodeURIComponent(name) + "&t=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.json(); })
        .catch(function () { return null; });
    }

    function fetchPeaks(index) {
      return fetchPeaksFrom(opts.helper + "/audio-peaks?key=" + encodeURIComponent(st.key) + "&i=" + index);
    }

    function fetchPeaksFrom(url) {
      return fetch(url + "&t=" + Date.now(), { cache: "no-store" })
        .then(function (res) { if (!res.ok) throw new Error("no waveform"); return res.json(); })
        .then(function (j) {
          var data = Uint8Array.from(j.peaks);
          var max = 0;
          for (var i = 0; i < data.length; i++) if (data[i] > max) max = data[i];
          // a quiet track is drawn larger, up to six times, so its waveform can still be read; the loudness of a piece follows its volume on top of that
          return { rate: j.rate, duration: j.duration, data: data, norm: max > 0 ? clamp(0.8 / (max / 255), 1, 6) : 1 };
        });
    }

    // resolves true when the lanes are ready, false when the clip has no audio to lay out or its audio could not be prepared; the note says why. the video row works either way
    function load(name, hooks) {
      hooks = hooks || {};
      var mine = ++seq;
      unloadState();
      st.name = name;
      st.Dsrc = Number(opts.duration()) || 0;
      // the video is there whatever the audio turns out to be
      resetVideo();
      st.initial = signature();
      function stage(text) { if (hooks.stage) hooks.stage(text); }
      function failed(text) {
        if (mine !== seq) return false;
        if (hooks.note) hooks.note(text);
        var d = st.Dsrc;
        unloadState();
        st.Dsrc = d;
        resetVideo();
        st.initial = signature();
        return false;
      }
      stage("Preparing the audio");
      return ask(name).then(function step(info) {
        if (mine !== seq) return false;
        if (!info || !info.ok) return failed("The audio of this clip could not be read");
        // a clip without audio still takes audio from outside, as long as its file can be read; one that cannot be read may hold audio that is not seen, so it is left alone
        var silent = !info.tracks || !info.tracks.length;
        if (silent && !info.readable) return false;
        if (info.error) return failed("The audio tracks could not be prepared");
        if (!silent && !info.ready) {
          return new Promise(function (resolve) { setTimeout(resolve, 400); }).then(function () { return mine === seq ? ask(name).then(step) : false; });
        }
        st.key = info.key || "";
        st.tracks = info.tracks || [];
        stage("Drawing the waveforms");
        return Promise.all(st.tracks.map(function (t) { return fetchPeaks(t.index).then(function (p) { if (mine === seq) st.peaks[t.index] = p; }); }))
          .then(function () {
            if (mine !== seq) return false;
            stage("Loading the tracks");
            return startEngine(mine);
          })
          .then(function (ok) {
            if (!ok || mine !== seq) return false;
            buildModel();
            st.ready = true;
            dom.lanes.hidden = false;
            syncDom();
            layout();
            drawSoon();
            refreshToolbar();
            return true;
          })
          .catch(function (err) { return failed(err && err.message ? err.message : "The audio tracks could not be loaded"); });
      });
    }

    function unloadState() {
      Object.keys(gapNodes).forEach(function (key) { gapNodes[key].remove(); });
      gapNodes = {};
      selectedGap = null;
      Object.keys(refThumbs).forEach(function (ref) {
        refThumbs[ref].onload = null;
        refThumbs[ref].removeAttribute("src");
      });
      refThumbs = {};
      if (dom.subOverlay) { dom.subOverlay.hidden = true; dom.subOverlay._key = ""; dom.subOverlay._lit = []; dom.subOverlay.textContent = ""; }
      if (layerRaf) { cancelAnimationFrame(layerRaf); layerRaf = 0; }
      Object.keys(layerViews).forEach(function (id) { destroyLayerView(layerViews[id]); });
      layerViews = {};
      Object.keys(layerRowEls).forEach(function (id) { layerRowEls[id].remove(); });
      layerRowEls = {};
      layerEls = {};
      // the subtitle rows are only drawn again when subtitles change, so a next clip without any would keep showing these
      Object.keys(subEls).forEach(function (id) { subEls[id].remove(); });
      Object.keys(subRowEls).forEach(function (id) { subRowEls[id].remove(); });
      subEls = {};
      subRowEls = {};
      if (dom.subs) { dom.subs.hidden = true; dom.subs._rows = 0; }
      if (dom.layerOverlay) dom.layerOverlay.hidden = true;
      if (dom.layers) { dom.layers.hidden = true; dom.layers._rows = 0; }
      if (pv) { hidePiece(); pv.ref = ""; pv.video.removeAttribute("src"); pv.video.load(); }
      // the element is the clock again, and it shows its picture
      leaveVmode();
      showPicture(true);
      stopEngine();
      closeMenu();
      dropShow(false);
      if (els.busy) els.busy.classList.remove("is-on");
      lastBusy = false;
      // the remove audio switch of the last clip does not carry over to the next one
      eng.off = false;
      dom.lanes.classList.remove("is-off");
      dom.props.classList.remove("is-off");
      var hadSpeed = st.vspeed !== 1;
      st = fresh();
      panelClosedFor = "";
      pressOutside = false;
      if (opts.onFx) opts.onFx();
      if (opts.onSelectKind) opts.onSelectKind("");
      if (hadSpeed) {
        opts.setVideoRate(1);
        if (opts.onVideoSpeed) opts.onVideoSpeed(1);
      }
      Object.keys(segEls).forEach(function (id) { segEls[id].remove(); });
      Object.keys(laneRecs).forEach(function (id) { laneRecs[id].el.remove(); });
      Object.keys(vsegEls).forEach(function (id) { vsegEls[id].remove(); });
      segEls = {};
      laneRecs = {};
      vsegEls = {};
      dom.lanes.hidden = true;
      dom.props.hidden = true;
      if (dom.timeline) dom.timeline.classList.remove("is-selected");
      dom.frame.scrollLeft = 0;
      dom.frame.scrollTop = 0;
      // no pieces are left, so the room made for them is taken back
      applyZoomWidth();
    }

    // what the saved copy asks the helper for in the audio: null while nothing was changed and the video plays at its own speed and is put together as it was recorded. the pieces are sent as they lie on the timeline, past the ends of the video included, and the helper cuts them to the saved clip. a video at another speed always needs the plan, since the audio is cut on the timeline of the saved clip
    function plan() {
      if (!st.ready) return null;
      if (signature() === st.initial && st.vspeed === 1 && !composedSave()) return null;
      // the files brought in that a piece still uses, by number and id
      var used = [];
      st.lanes.forEach(function (l) {
        l.segments.forEach(function (s) {
          s.parts.forEach(function (p) { if (p.src >= IMPORT_BASE && used.indexOf(p.src) < 0) used.push(p.src); });
        });
      });
      return {
        imports: used.map(function (src) { return { src: src, id: trackOf(src).importId }; }),
        lanes: st.lanes.filter(function (l) { return l.segments.length > 0; }).map(function (l) {
          return {
            label: laneLabel(l),
            segments: l.segments.map(function (s) {
              return {
                parts: s.parts.map(function (p) { return { src: p.src, srcStart: r3(p.srcStart), srcEnd: r3(p.srcEnd), off: r3(p.off), gain: r3(p.gain) }; }),
                at: r3(s.at), volume: r3(s.volume), fadeIn: r3(s.fadeIn), fadeOut: r3(s.fadeOut), speed: r3(s.speed), pitch: !!s.pitch, muted: !!s.muted,
              };
            }),
          };
        }),
      };
    }

    // what it asks for in the video: null while the saved copy is the cut of the video as it was recorded, else the pieces of the video and the part of the timeline that is the saved clip, which reaches past the video where audio does
    function videoPlan(force) {
      if (!force && !composedSave()) return null;
      var w = composedSave() ? windowT() : boundsT();
      return {
        pieces: st.vsegs.map(function (v) {
          var p = { at: r3(v.at), srcStart: r3(v.srcStart), srcEnd: r3(v.srcEnd) };
          if (v.ref) p.ref = v.ref;
          if (v.speed != null) p.speed = v.speed;
          if (composedSave()) {
            var look = RKEditorFx.resolve(v.fx || st.fx);
            if (!RKEditorFx.isIdentity(look)) p.look = look;
          }
          return p;
        }),
        window: { start: r3(w.start), end: r3(w.end) },
      };
    }

    // what the saved copy asks for in the look of the video: the numbers of the steps, or null while it is left as it was recorded
    function lookPlan() {
      if (composedSave()) return null;
      var r = RKEditorFx.resolve(st.fx);
      return RKEditorFx.isIdentity(r) ? null : r;
    }

    // whether the rows, the pieces, the speed or the look differ from the clip as it was recorded; the cut is for the host to judge
    function edited() {
      return signature() !== st.initial || Math.abs(st.vspeed - 1) > 1e-6 || st.subs.length > 0 || st.layers.length > 0 || !!lookPlan() || !!st.aspect && st.aspect !== "original";
    }

    // the edit as it stands, for the host to keep as a draft: what the history takes, plus the files brought in from outside that a piece still uses, which a draft can only reach again by their ids
    function draftState() {
      var snap = snapshot();
      var used = {};
      snap.lanes.forEach(function (l) {
        l.segments.forEach(function (s) {
          s.parts.forEach(function (p) { if (p.src >= IMPORT_BASE) used[p.src] = true; });
        });
      });
      var imports = [];
      st.tracks.forEach(function (t) {
        if (t.importId && used[t.index]) imports.push({ index: t.index, id: t.importId, label: t.label });
      });
      return { snap: snap, imports: imports };
    }

    // the other way. a kept edit goes back as one step on top of the state the editor opened in, so undo returns to the clip as it was recorded. the files it brought in are looked up again first; a piece whose source is gone (a file the cache lost, a track the clip does not have any more) is left out and named, since nothing could play it
    function applyDraft(d) {
      var mine = seq;
      var snap = d && d.snap;
      if (!snap || !Array.isArray(snap.lanes) || !Array.isArray(snap.vsegs) || !isFinite(snap.start) || !isFinite(snap.end) || !(snap.vspeed > 0)) return Promise.resolve({ ok: false, dropped: [] });
      var dropped = [];
      var wanted = (Array.isArray(d.imports) ? d.imports : []).filter(function (imp) { return imp && typeof imp.id === "string" && isFinite(imp.index) && imp.index >= IMPORT_BASE; });
      return wanted.reduce(function (chain, imp) {
        return chain.then(function () {
          if (mine !== seq) return null;
          if (!st.ready) { dropped.push(imp.label || "Audio"); return null; }
          return askImport(imp.id)
            .then(function (info) {
              if (!info || !info.ok || info.state !== "ready") throw new Error("gone");
              return fetchPeaksFrom(opts.helper + "/import-audio/peaks?id=" + encodeURIComponent(imp.id));
            })
            .then(function (peaks) {
              if (mine !== seq) return null;
              if (!trackOf(imp.index)) {
                st.tracks.push({ index: imp.index, label: imp.label || "Audio", importId: imp.id });
                st.peaks[imp.index] = peaks;
                st.nextImport = Math.max(st.nextImport, imp.index - IMPORT_BASE + 1);
              }
              return loadItem(ensureItem(imp.index));
            })
            .catch(function () {
              if (mine !== seq) return;
              forgetTrack(imp.index);
              dropped.push(imp.label || "Audio");
            });
        });
      }, Promise.resolve()).then(function () {
        if (mine !== seq) return { ok: false, dropped: dropped };
        var clean = clone(snap);
        clean.lanes = clean.lanes
          .map(function (l) {
            l.segments = (l.segments || []).filter(function (s) { return Array.isArray(s.parts) && s.parts.every(function (p) { return !!trackOf(p.src); }); });
            return l;
          })
          .filter(function (l) { return l.segments.length > 0; });
        // the ids of rows and pieces come from a session that is over, and new ones must not meet them
        var top = 0;
        var seen = JSON.stringify(clean).match(/"id":"[A-Z](\d+)"/g) || [];
        seen.forEach(function (m) { top = Math.max(top, parseInt(m.replace(/\D+/g, ""), 10) || 0); });
        st.nextId = Math.max(st.nextId, top + 1);
        var corrected = false;
        try {
          restoreSnap(clean);
          var v = st.vsegs.length === 1 ? st.vsegs[0] : null;
          var simple = v && !v.ref && !st.layers.length && !st.subs.length && !st.tracks.some(function (t) { return !!t.importId; });
          // Older simple drafts could keep the audio window behind a video trim.
          if (prefs.trimAudioWithVideo && simple && Math.abs(v.at - v.srcStart / st.vspeed) < 0.002) {
            corrected = applyVideoCut();
            if (corrected) changed();
          }
          commit();
        } catch (e) {
          return { ok: false, dropped: dropped };
        }
        return { ok: true, dropped: dropped, corrected: corrected };
      });
    }

    // wiring, once

    function buildDom() {
      // the lanes area owns its overlays: the dimmed ends of the cut, the playhead and the guide of a snap
      els.dimStart = el("div", "tl-dim");
      els.dimStart.style.left = "0";
      els.dimEnd = el("div", "tl-dim");
      els.dimEnd.style.right = "0";
      els.playline = el("div", "tl-playline");
      els.snapline = el("div", "tl-snapline");
      els.anchor = els.dimStart;
      [els.dimStart, els.dimEnd].forEach(function (n) { dom.lanes.appendChild(n); });
      els.empty = el("div", "tl-empty");
      els.empty.textContent = "No audio rows. Drop an audio file here or press the import button.";
      dom.lanes.insertBefore(els.empty, els.dimStart);
      els.drop = el("div", "tl-drop");
      els.drop.setAttribute("aria-hidden", "true");
      els.dropLabel = el("span");
      els.drop.appendChild(els.dropLabel);
      document.body.appendChild(els.drop);
      [els.playline, els.snapline].forEach(function (n) { (dom.tracks || dom.lanes).appendChild(n); });
      // a press on the video row selects the video or the piece of it that was pressed; every piece carries its own tag
      if (dom.timeline) {
        dom.timeline.insertBefore(el("div", "tl-vext l"), dom.timeline.firstChild);
        dom.timeline.insertBefore(el("div", "tl-vext r"), dom.timeline.firstChild);
        dom.timeline.addEventListener("pointerdown", onVideoDown);
        dom.timeline.addEventListener("contextmenu", onVideoContext);
      }
      installTransport();
      if (dom.subs) {
        dom.subs.addEventListener("pointerdown", onSubDown);
        dom.subs.addEventListener("contextmenu", onSubContext);
        if (dom.subOverlay) {
          dom.subOverlay.addEventListener("pointerdown", onPlaceDown);
          // a press on a subtitle is the subtitle, never a click on the video under it
          dom.subOverlay.addEventListener("click", function (e) { if (e.target.closest(".sub-cue")) e.stopPropagation(); });
        }
        dom.subs._rows = 0;
      }
      if (dom.layers) {
        dom.layers.addEventListener("pointerdown", onLayerDown);
        dom.layers._rows = 0;
      }
      if (dom.layerOverlay) {
        dom.layerOverlay.addEventListener("pointerdown", onLayerPlaceDown);
        // a press on a layer is the layer, never a click on the video under it
        dom.layerOverlay.addEventListener("click", function (e) { if (e.target.closest(".lay-item")) e.stopPropagation(); });
      }
      dom.lanes.hidden = true;
      dom.lanes.addEventListener("pointerdown", onDown);
      dom.lanes.addEventListener("contextmenu", onContext);
      // the presses on pieces hold back the focus the browser would move, so a press on the timeline puts the keys on this page itself while it sits in a frame of a page that had them; without it delete and the other keys went nowhere
      dom.frame.addEventListener("pointerdown", function () { if (!document.hasFocus()) { try { window.focus(); } catch (_) {} } }, true);
      buildToolbar();
      buildProps();
      // the shared hover and press profile of the dock, which only reaches the buttons that exist when the page starts
      if (window.RKHover) {
        RKHover.apply(dom.toolbar, { control: ".tl-btn" });
        RKHover.apply(dom.props, { control: ".tl-mini, .tl-reset, .tl-x" });
      }
      barUpdates.push(makeBar(dom.vbar, "y"));
      barUpdates.push(makeBar(dom.hbar, "x"));
      dom.frame.addEventListener("scroll", function () { rulerSoon(); drawSoon(); barUpdates.forEach(function (fn) { fn(); }); }, { passive: true });
      dom.frame.addEventListener("wheel", function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        e.preventDefault();
        setZoom(st.zoom * Math.exp(-e.deltaY * 0.0018), e.clientX);
      }, { passive: false });
      if (window.ResizeObserver) {
        var watcher = new ResizeObserver(function () { layout(); });
        watcher.observe(dom.frame);
        watcher.observe(dom.content);
        watcher.observe(video);
      }
      document.addEventListener("keydown", onKey, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("dragenter", onDragEnter, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("dragover", onDragOver, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("dragleave", onDragLeave, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("drop", onDrop, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("pointerdown", function (e) {
        if (menu && !menu.contains(e.target)) closeMenu();
        pressOutside = !!(st.selected || selectedGap) && opts.isOpen() && isOutside(e.target, e);
      }, { capture: true, signal: EDITOR_SIGNAL });
      document.addEventListener("click", function (e) {
        var was = pressOutside;
        pressOutside = false;
        if (was && (st.selected || selectedGap) && isOutside(e.target, e)) select("");
      }, { capture: true, signal: EDITOR_SIGNAL });
      window.addEventListener("blur", closeMenu, { signal: EDITOR_SIGNAL });
      // the height of the timeline is set by dragging the bar above it, which trades space with the video
      dom.resizer.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        var startY = e.clientY;
        var startH = dom.bottom.getBoundingClientRect().height;
        dom.resizer.classList.add("is-dragging");
        dom.resizer.setPointerCapture(e.pointerId);
        var move = function (ev) {
          var maxH = Math.max(200, window.innerHeight - 300);
          prefs.height = clamp(startH - (ev.clientY - startY), 190, maxH);
          dom.bottom.style.height = prefs.height + "px";
          dom.bottom.style.maxHeight = "calc(100vh - 300px)";
        };
        var up = function () {
          dom.resizer.classList.remove("is-dragging");
          dom.resizer.removeEventListener("pointermove", move);
          dom.resizer.removeEventListener("pointerup", up);
          dom.resizer.removeEventListener("pointercancel", up);
          savePrefs();
        };
        dom.resizer.addEventListener("pointermove", move);
        dom.resizer.addEventListener("pointerup", up);
        dom.resizer.addEventListener("pointercancel", up);
      });
      if (prefs.height > 0) {
        dom.bottom.style.height = prefs.height + "px";
        dom.bottom.style.maxHeight = "calc(100vh - 300px)";
      }
    }

    buildDom();

    // what the tools panel of the editor works the subtitles and the audio through
    var subsApi = {
      list: function () { return clone(st.subs); },
      rows: function () { return st.subRows.map(function (r) { return { id: r.id, title: rowTitle(r), auto: r.auto, style: clone(r.style), count: rowCues(r.id).length }; }); },
      rowOf: function (id) { var cue = findSub(id); return cue ? cue.row : ""; },
      fonts: function () { return SUB_FONTS.slice(); },
      ranges: function () { return clone(SUB_RANGES); },
      defaultStyle: function () { return defaultRowStyle(); },
      selected: function () { return findSub(st.selected) ? st.selected : ""; },
      picked: function () { return pickedSubs(); },
      // an empty id lets go of the selected subtitle and leaves any other selection alone
      select: function (id) {
        if (findSub(id)) select(id);
        else if (!id && findSub(st.selected)) select("");
      },
      now: function () { return nowT(); },
      seek: function (t) { seekT(clamp(t, 0, D())); },
      bounds: function () { return videoEdited() ? windowT() : boundsT(); },
      duration: function () { return D(); },
      // a new cue at the playhead in a row of its own, as long as there is room for it, and selected
      add: function (text) {
        var at = clamp(nowT(), 0, Math.max(0, D() - SUB_MIN));
        var end = Math.min(D(), at + 2);
        if (end - at < SUB_MIN) return "";
        var row = { id: newId("R"), auto: false, title: "", style: defaultRowStyle() };
        st.subRows.push(row);
        var cue = { id: newId("C"), row: row.id, at: r3(at), end: r3(end), text: String(text || "").slice(0, SUB_TEXT_MAX) };
        st.subs.push(cue);
        sortSubs();
        st.selected = cue.id;
        commit();
        subsChanged();
        paintSelection();
        return cue.id;
      },
      // a change of text while typing is one step of the history once typing stops; the caller says when with checkpoint
      setText: function (id, text) {
        var cue = findSub(id);
        if (!cue) return;
        cue.text = String(text || "").slice(0, SUB_TEXT_MAX);
        // fixing a word keeps the timing, adding or taking one away leaves nothing to line the words up with
        if (cue.words && !wordsFit(cue)) delete cue.words;
        // the text has been looked at and set by hand
        delete cue.unsure;
        delete cue.alts;
        subsChanged();
      },
      setTimes: function (id, at, end) {
        var cue = findSub(id);
        if (!cue || !isFinite(at) || !isFinite(end)) return;
        at = clamp(at, 0, D());
        end = clamp(end, at + SUB_MIN, D());
        if (cue.words && Math.abs((end - at) - (cue.end - cue.at)) < 0.001) cue.words = shiftWords(cue.words, r3(at) - cue.at);
        cue.at = r3(at);
        cue.end = r3(end);
        sortSubs();
        commit();
        subsChanged();
      },
      remove: function (id) {
        var cue = findSub(id);
        if (!cue) return;
        st.subs.splice(st.subs.indexOf(cue), 1);
        if (st.selected === id) st.selected = "";
        dropEmptyRows();
        commit();
        subsChanged();
        paintSelection();
      },
      // cues made from the words of the speech engine, in seconds of the timeline, as a new row named after what was listened to; the rows already there stay, and undo takes the new one back in one step
      addRow: function (title, cues) {
        var row = { id: newId("R"), auto: true, title: String(title || "Subtitles").slice(0, SUB_TITLE_MAX), style: defaultRowStyle() };
        var made = cleanSubs(cues.map(function (c) { return { id: newId("C"), row: row.id, at: c.at, end: c.end, text: c.text, words: c.words, unsure: c.unsure === true, alts: c.alts }; }), [row]);
        if (!made.length) return "";
        st.subRows.push(row);
        st.subs = st.subs.concat(made);
        sortSubs();
        commit();
        subsChanged();
        return row.id;
      },
      clear: function () {
        if (!st.subs.length) return;
        st.subs = [];
        st.subRows = [];
        if (/^C\d+$/.test(st.selected)) st.selected = "";
        commit();
        subsChanged();
      },
      // a style change of a row shows at once; a slider being dragged says false and the history waits for checkpoint
      setRowStyle: function (rowId, patch, record) {
        var row = findRow(rowId);
        if (!row) return;
        row.style = cleanRowStyle(Object.assign({}, row.style, patch || {}));
        if (record !== false) commit();
        subsChanged();
      },
      // every cue of a row, picked, with the one already selected kept as the one shown
      pickRow: function (rowId) {
        if (!findRow(rowId)) return;
        pickSubs(rowCues(rowId).map(function (c) { return c.id; }), st.selected);
      },
      mergeNext: function (id) { var cue = findSub(id); if (cue) mergeNext(cue); },
      // an unsure subtitle replaced by what else the speech engine heard there, as one step of undo
      pickAlternative: function (id, text) {
        var cue = findSub(id);
        if (!cue || !cue.unsure) return;
        subsApi.setText(id, text);
        commit();
      },
      // unsure subtitles the user has checked and kept as they are
      markChecked: function (ids) {
        var changed = false;
        (ids || []).forEach(function (id) {
          var cue = findSub(id);
          if (cue && cue.unsure) { delete cue.unsure; delete cue.alts; changed = true; }
        });
        if (!changed) return;
        commit();
        subsChanged();
      },
      hasNext: function (id) { var cue = findSub(id); return !!(cue && nextInRow(cue)); },
      mergeRows: function (fromId, intoId) { mergeRows(fromId, intoId); },
      removeRow: function (rowId) { removeRow(rowId); },
      // the selected source audio track, 0 for all audio when video is selected, or null for other selections
      selectedTrack: function () {
        if (videoSelected()) return 0;
        var hit = selected();
        if (!hit || !hit.seg.parts.length) return null;
        var src = hit.seg.parts[0].src;
        var track = st.tracks.find(function (t) { return t.index === src; });
        return track && !track.importId ? track.index : null;
      },
      checkpoint: function () { commit(); },
      sourceToTimeline: function (srcT) { return sourceToTimeline(srcT); },
      // the audio tracks of the clip itself (not the files brought in), which the speech engine can listen to
      sourceTracks: function () { return st.tracks.filter(function (t) { return !t.importId; }).map(function (t) { return { index: t.index, label: t.label }; }); },
      // the part of the source video the saved copy shows, in seconds of the video, which is what the speech engine listens to
      sourceRange: function () {
        if (videoEdited()) {
          var a = Infinity, b = 0;
          st.vsegs.forEach(function (v) { if (!v.ref) { a = Math.min(a, v.srcStart); b = Math.max(b, v.srcEnd); } });
          return { start: a === Infinity ? 0 : a, end: b };
        }
        var bb = opts.getBounds();
        return { start: bb.start, end: bb.end };
      },
    };

    return {
      subtitles: subsApi,
      subtitlePlan: subtitlePlan,
      // the look of the video, which the tabs on the right set; a slider being dragged says false and the history waits for checkpoint
      // the look of what is selected: a clip row has its own, everything else is the look of the video
      fx: {
        get: function () { var row = fxRow(), pick = selectedV(); return clone(row ? row.fx || RKEditorFx.defaultFx() : pick ? pick.seg.fx || st.fx : st.fx); },
        set: function (next, record) {
          var row = fxRow(), pick = selectedV();
          if (row) { row.fx = RKEditorFx.cleanFx(next); paintLayers(); }
          else if (pick) {
            var look = RKEditorFx.cleanFx(next);
            if (JSON.stringify(look) === JSON.stringify(st.fx)) delete pick.seg.fx;
            else pick.seg.fx = look;
          }
          else { st.fx = RKEditorFx.cleanFx(next); st.vsegs.forEach(function (v) { delete v.fx; }); }
          if (opts.onFx) opts.onFx();
          if (record !== false) commit();
        },
        // the look of the video itself, which its preview shows whatever is selected
        main: function () { var piece = vAt(nowT(), nowT() >= windowT().end - 0.001); return clone(piece ? piece.fx || st.fx : RKEditorFx.defaultFx()); },
        // the element whose frames the tiles show: the clip row that is selected, else the video
        picture: function () { var row = fxRow(); return row && layerViews[row.id] ? layerViews[row.id].media : null; },
        checkpoint: function () { commit(); },
      },
      // whatever is selected back to how it starts, for the reset tab of the right bar
      resetSelected: function () { return resetSelected(); },
      lookPlan: lookPlan,
      layerPlan: layerPlan,
      // a layer put at the playhead and selected: { kind: "clip" | "media", ref, name, len, dur, aspect, w, gif }; the id, or empty when there is no room for it
      addLayer: function (l) { return addLayer(l); },
      clearSelection: function () { select(""); },
      // the undo and redo of the toolbar, for the quick action menu of the title bar
      undo: function () { undo(); },
      redo: function () { redo(); },
      canUndo: function () { return st.history.length >= 2; },
      canRedo: function () { return st.future.length > 0; },
      panelClosed: panelClosed,
      closePanel: function () { setPanelClosed(true); },
      openPanel: function () { setPanelClosed(false); },
      refreshProps: function () { renderProps(); },
      importAudio: function () { if (st.ready && !st.picking) pickAudio(); },
      // whether audio can be added right now, and what the audio tab says when it cannot
      importState: function () { return { ready: st.ready, picking: st.picking, importing: st.importing, tip: IMPORT_TIP }; },
      // an import the helper already made (a voiceover), placed as a row of its own starting at the time of the timeline given
      placeImportAt: function (id, at, link) {
        if (!st.ready) return Promise.resolve(false);
        var mine = seq;
        st.importing += 1;
        setBusy();
        return waitImport(id, mine)
          .then(function (info) { return info ? placeImport(info, at, mine, link) : false; })
          .catch(function (err) { importNote((err && err.message) || "The recording could not be added"); return false; })
          .then(function (placed) {
            if (mine === seq) { st.importing = Math.max(0, st.importing - 1); setBusy(); }
            return placed;
          });
      },
      load: load,
      unload: function () { seq += 1; unloadState(); },
      plan: plan,
      videoPlan: videoPlan,
      aspect: function (value) {
        if (arguments.length) {
          if (["original", "9:16", "16:9", "16:10", "21:9", "4:3", "1:1"].indexOf(value) < 0 || value === (st.aspect || "original")) return;
          st.aspect = value;
          commit();
          if (opts.onFrame) opts.onFrame();
        }
        return st.aspect || "original";
      },
      // the saved clip is not the video as it was recorded, so it is put together piece by piece and the timeline plays by itself
      videoEdited: videoEdited,
      // the part of the timeline between which the preview plays, in the time of the video, while the timeline plays by itself; null otherwise
      windowBounds: windowBounds,
      available: function () { return st.ready; },
      // true while audio is being added to the clip
      busy: isBusy,
      // for the drafts: whether anything was changed, what the edit is, and the way back
      edited: edited,
      draft: draftState,
      applyDraft: applyDraft,
      videoSpeed: function () { return st.vspeed; },
      // the frames of the clip for the video row, as the host captures them: { aspect, frames: [{ t, canvas, ok }] }, or null to take them away
      setFilmstrip: function (f) {
        film = f && f.frames && f.frames.length ? f : null;
        if (!film && filmCanvas) { filmCanvas.remove(); filmCanvas = null; }
        drawSoon();
      },
      // the colour of the faint outline of the video row, any css colour; empty puts the neutral one back
      setVideoTint: function (css) {
        if (!dom.timeline) return;
        if (css) dom.timeline.style.setProperty("--tl-video-line", css);
        else dom.timeline.style.removeProperty("--tl-video-line");
      },
      setPlayhead: function (t) { setPlayhead(t); if (els.split) refreshToolbar(); },
      showBounds: setBoundsUi,
      trimCutEdge: trimCutEdge,
      refresh: function () {
        var d = Number(opts.duration()) || st.Dsrc;
        if (Math.abs(d - st.Dsrc) > 1e-6) {
          var untouched = signature() === st.initial;
          var whole = naturalV();
          st.Dsrc = d;
          if (whole) st.vsegs[0].srcEnd = r3(d);
          if (untouched) st.initial = signature();
        }
        syncDom();
        layout();
        var b = opts.getBounds();
        setBoundsUi(b.start, b.end);
      },
      initHistory: initHistory,
      checkpoint: commit,
      applyMaster: applyMaster,
      setOff: function (off) { eng.off = !!off; dom.lanes.classList.toggle("is-off", !!off); dom.props.classList.toggle("is-off", !!off); tick(true); },
      resetZoom: function () { st.zoom = 1; applyZoomWidth(); dom.frame.scrollLeft = 0; },
      onPlayState: function () { refreshToolbar(); tick(true); paintLayers(); },
      onSeek: function () { tick(true); refreshToolbar(); paintLayers(); },
    };
  }

  window.RKEditorLanes = { create: create };
})();
</script>
