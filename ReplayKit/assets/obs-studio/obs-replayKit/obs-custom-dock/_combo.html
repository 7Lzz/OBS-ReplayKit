<style>
  .combo {
    position:relative;
    flex:1;
    min-width:0;
  }
  .combo-button {
    width:100%;
    height:32px;
    border:1px solid var(--field-solid,var(--button_border,var(--field)));
    border-radius:4px;
    background:var(--field,var(--button_bg));
    color:var(--text);
    outline:none;
  }
  .combo-button {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 37px 0 9px;
    cursor:pointer;
    text-align:left;
    position:relative;
  }
  .combo-arrow {
    position:absolute;
    right:0;
    top:1px;
    width:28px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .combo-arrow svg { width:16px; height:16px; fill:currentColor; transition:transform var(--anim_menu) var(--ease_smooth); }
  .combo.is-open .combo-arrow svg { transform:rotate(180deg); }
  .combo-button::before {
    content:"";
    position:absolute;
    top:1px;
    bottom:1px;
    right:26px;
    width:1px;
    background:var(--panel,var(--bg_card));
    pointer-events:none;
  }
  .combo.is-open .combo-button {
    border-color:var(--selected-solid,var(--primary-solid,var(--selected,var(--primary))));
    background:var(--window,var(--bg_window));
    border-radius:4px;
  }
  .combo.is-disabled .combo-button {
    color:var(--disabled);
    border-color:var(--field2);
    background:var(--field2);
    cursor:default;
  }
  .combo.is-disabled .combo-button::before { background:var(--field2); }
  .combo.is-disabled .combo-arrow { opacity:.65; }
  .combo.is-disabled .combo-menu { display:none; }
  .combo-label {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .combo-menu {
    position:absolute;
    z-index:20;
    top:34px;
    left:0;
    right:0;
    /* Keep closed menus out of the scroll area. Animate opacity and translation, so height changes cannot flash a scrollbar. */
    max-height:0;
    overflow:hidden;
    background:var(--panel,var(--bg_card));
    border:1px solid var(--line,var(--button_border));
    border-radius:4px;
    padding:0 3px;
    box-shadow:0 10px 24px var(--shadow-weak);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translateY(-6px);
    transform-origin:top center;
    transition:opacity 150ms ease, transform var(--anim_menu) var(--ease_smooth), visibility 0s linear var(--anim_menu);
  }
  .combo.is-open .combo-menu {
    max-height:300px;
    overflow-x:hidden;
    overflow-y:auto;
    padding:3px;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translateY(0);
    transition:opacity 130ms ease, transform var(--anim_menu) var(--ease_smooth);
  }
  /* "Custom" sits above the generated resolutions, set off by a divider. */
  .combo.sep-after-first .combo-option:first-child {
    border-bottom:1px solid var(--line2);
    border-radius:0;
    margin-bottom:3px;
    padding-bottom:3px;
  }
  /* options fade + rise in with a short stagger. */
  .combo.is-open .combo-option { animation:rk-option-in 200ms var(--ease_smooth) backwards; }
  .combo.is-open .combo-option:nth-child(2) { animation-delay:26ms; }
  .combo.is-open .combo-option:nth-child(3) { animation-delay:48ms; }
  .combo.is-open .combo-option:nth-child(4) { animation-delay:68ms; }
  .combo.is-open .combo-option:nth-child(n+5) { animation-delay:84ms; }
  @keyframes rk-option-in { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
  .combo-option {
    min-height:28px;
    display:flex;
    align-items:center;
    padding:0 10px;
    border-radius:3px;
    color:var(--text);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .combo-option + .combo-option { margin-top:2px; }
  .combo-option-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* an option may lead with a small icon and trail a quieter detail, such as the shape and the ratio of an aspect */
  .combo-option-icon { flex:none; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-right:9px; }
  .combo-option-icon svg { display:block; overflow:visible; }
  .combo-option-detail { flex:none; margin-left:6px; color:var(--text_muted); }
  .combo-option.is-selected .combo-option-detail { color:inherit; opacity:.75; }
  /* Selected options use the normal theme highlight and its contrasting text. */
  .combo-option:hover, .combo-option:focus-visible { background:var(--button_bg_hover); outline:none; }
  .combo-option.is-selected { position:relative; padding-right:30px; background:var(--selected,var(--primary)); color:var(--on-accent); }
  .combo-option.is-selected:hover, .combo-option.is-selected:focus-visible { background:var(--selected,var(--primary)); color:var(--on-accent); }
  .combo-option.is-selected::after { content:""; position:absolute; right:13px; top:50%; width:4px; height:8px; margin-top:-6px; border:solid currentColor; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .combo-option.is-disabled {
    color:var(--muted);
    cursor:default;
    background:transparent;
  }
  .combo-option .option-blurb {
    color:var(--muted);
    margin-left:4px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .combo-option.is-selected .option-blurb { color:inherit; }
  /* a menu that takes several: each row leads with the select icon, its corners always there and its tick drawn in once the row is picked, and stays open while rows are picked */
  .combo.is-multi .combo-option.is-selected { padding-right:10px; }
  .combo.is-multi .combo-option.is-selected::after { display:none; }
  .combo-option-pick { flex:none; display:inline-flex; width:14px; height:14px; margin-right:9px; color:var(--text_muted); }
  .combo-option.is-selected .combo-option-pick { color:inherit; }
  .combo-option-pick svg { width:14px; height:14px; fill:currentColor; overflow:visible; }
  .combo-option-pick svg path + path { transform-box:fill-box; transform-origin:center; opacity:0; transform:scale(.4); transition:opacity 120ms ease, transform 160ms var(--ease_pop, ease-out); }
  .combo-option.is-selected .combo-option-pick svg path + path { opacity:1; transform:none; }
  /* a setting under the choices, set apart by a divider: a label and a switch on one row */
  .combo-footer { margin:3px 0 0; padding:3px 0 0; border-top:1px solid var(--line2, var(--line)); }
  .combo-toggle { min-height:28px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 10px; border-radius:3px; color:var(--text); cursor:pointer; white-space:nowrap; }
  .combo-toggle:hover { background:var(--button_bg_hover); }
</style>
<script>
(function () {
  const bindings = new WeakMap();
  function bind(combo, changed, config) {
    config = config || {};
    const events = config.signal ? { signal:config.signal } : undefined;
    const button = combo.querySelector(".combo-button");
    const label = combo.querySelector(".combo-label");
    const menu = combo.querySelector(".combo-menu");
    let options = [], value = "";
    // config.multi lets several rows be picked at once; value is then their values joined with commas in the order of the menu, and a row named in config.only stands alone, so picking it lets the others go and it comes back when nothing else is left
    const multi = !!config.multi;
    const only = (config.only || []).map(String);
    let picked = [];
    if (multi) { combo.classList.add("is-multi"); menu.setAttribute("aria-multiselectable", "true"); }
    function close() {
      combo.classList.remove("is-open");
      combo.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-expanded", "false");
      menu.style.removeProperty("max-height");
      window.removeEventListener("keydown", menuKey, true);
      preview();
    }
    function preview(option) {
      if (config.preview) config.preview(option || options.find((entry) => entry.value === value));
    }
    function place() {
      if (!combo.classList.contains("is-open")) return;
      const rect = combo.getBoundingClientRect();
      let top = 8, bottom = window.innerHeight - 8;
      for (let parent = combo.parentElement; parent && parent !== document.body; parent = parent.parentElement) {
        if (!/^(auto|scroll|hidden|clip)$/.test(getComputedStyle(parent).overflowY)) continue;
        const bounds = parent.getBoundingClientRect();
        top = Math.max(top, bounds.top + parent.clientTop + 4);
        bottom = Math.min(bottom, bounds.top + parent.clientTop + parent.clientHeight - 4);
      }
      const below = bottom - rect.bottom;
      const above = rect.top - top;
      const height = Math.min(300, menu.scrollHeight + 2);
      const up = below < height && above > below;
      menu.style.top = up ? "auto" : "calc(100% + 2px)";
      menu.style.bottom = up ? "calc(100% + 2px)" : "auto";
      menu.style.maxHeight = Math.max(28, Math.min(height, up ? above : below)) + "px";
    }
    function open() {
      if (!options.length) return;
      document.querySelectorAll(".combo.is-open").forEach((other) => {
        if (other !== combo) {
          if (bindings.has(other)) bindings.get(other)();
          else {
            other.classList.remove("is-open");
            other.setAttribute("aria-expanded", "false");
          }
        }
      });
      combo.classList.add("is-open");
      combo.setAttribute("aria-expanded", "true");
      button.setAttribute("aria-expanded", "true");
      place();
      if (config.menuKeys) {
        window.addEventListener("keydown", menuKey, { capture:true, signal:config.signal });
        const selected = menu.querySelector(".is-selected");
        if (selected) selected.scrollIntoView({ block:"nearest" });
      }
    }
    function select(next, notify) {
      if (multi) { pick(String(next).split(","), notify); return; }
      const option = options.find((entry) => entry.value === String(next)) || options[0];
      value = option ? option.value : "";
      label.textContent = option ? option.label : "";
      label.style.fontFamily = option && option.font ? '"' + option.font + '", sans-serif' : "";
      menu.querySelectorAll(".combo-option").forEach((row) => {
        const selected = row.dataset.value === value;
        row.classList.toggle("is-selected", selected);
        row.setAttribute("aria-selected", String(selected));
      });
      preview(option);
      if (notify && changed) changed(value);
    }
    function pick(list, notify) {
      let chosen = options.filter((entry) => list.includes(entry.value));
      const alone = chosen.find((entry) => only.includes(entry.value));
      if (alone) chosen = [alone];
      if (!chosen.length) chosen = options.slice(0, 1);
      picked = chosen.map((entry) => entry.value);
      value = picked.join(",");
      label.textContent = chosen.map((entry) => entry.label).join(", ");
      menu.querySelectorAll(".combo-option").forEach((row) => {
        const selected = picked.includes(row.dataset.value);
        row.classList.toggle("is-selected", selected);
        row.setAttribute("aria-selected", String(selected));
      });
      if (notify && changed) changed(value);
    }
    // a row picked in a menu that takes several turns on or off, and a row that stands alone replaces the rest
    function toggle(rowValue) {
      if (only.includes(rowValue)) { pick([rowValue], true); return; }
      const rest = picked.filter((v) => !only.includes(v));
      pick(rest.includes(rowValue) ? rest.filter((v) => v !== rowValue) : rest.concat([rowValue]), true);
    }
    function menuKey(event) {
      if (!combo.classList.contains("is-open")) return;
      const key = event.key;
      if (key !== "Escape" && config.footer && config.footer.contains(event.target)) return;
      const rows = Array.from(menu.querySelectorAll(".combo-option"));
      const focused = rows.indexOf(document.activeElement);
      let next = -1;
      if (key === "Escape") {
        event.preventDefault(); event.stopPropagation(); close(); button.focus(); return;
      }
      if ((key === "Enter" || key === " ") && focused >= 0) {
        event.preventDefault(); event.stopPropagation();
        if (multi) { toggle(rows[focused].dataset.value); return; }
        select(rows[focused].dataset.value, true); close(); button.focus(); return;
      }
      const current = focused >= 0 ? focused : options.findIndex((entry) => entry.value === value);
      if (key === "ArrowDown") next = Math.min(rows.length - 1, current + 1);
      else if (key === "ArrowUp") next = Math.max(0, current - 1);
      else if (key === "Home") next = 0;
      else if (key === "End") next = rows.length - 1;
      else if (key.length === 1 && /\S/.test(key) && !event.ctrlKey && !event.altKey && !event.metaKey) {
        for (let offset = 1; offset <= rows.length; offset++) {
          const index = (current + offset + rows.length) % rows.length;
          if (rows[index].textContent.trim().toLowerCase().startsWith(key.toLowerCase())) { next = index; break; }
        }
        event.preventDefault(); event.stopPropagation();
      }
      if (next >= 0 && rows[next]) {
        event.preventDefault(); event.stopPropagation();
        rows[next].focus({ preventScroll:true });
        rows[next].scrollIntoView({ block:"nearest" });
        preview(options[next]);
      }
    }
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      if (combo.classList.contains("is-open")) close(); else open();
    }, events);
    menu.addEventListener("mousedown", (event) => {
      if (event.button !== 0 || !config.footer || !config.footer.contains(event.target)) return;
      const control = event.target.closest("input, button, select, textarea, a, [tabindex], [contenteditable='true']");
      if (control && config.footer.contains(control)) return;
      // keep focus until the label or shared row handler activates its control
      event.preventDefault();
    }, events);
    menu.addEventListener("click", (event) => {
      const row = event.target.closest(".combo-option");
      if (!row || !menu.contains(row)) return;
      event.stopPropagation();
      if (multi) { toggle(row.dataset.value); return; }
      select(row.dataset.value, true);
      close();
      button.focus();
    }, events);
    menu.addEventListener("mouseover", (event) => {
      const row = event.target.closest(".combo-option");
      if (row && menu.contains(row)) preview(options.find((entry) => entry.value === row.dataset.value));
    }, events);
    menu.addEventListener("mouseleave", () => preview(), events);
    combo.addEventListener("keydown", (event) => {
      const key = event.key;
      if (key !== "Escape" && config.footer && config.footer.contains(event.target)) return;
      if (config.menuKeys && ["ArrowDown", "ArrowUp", "Home", "End"].includes(key)) {
        event.preventDefault(); event.stopPropagation(); open(); menuKey(event); return;
      }
      if (key === "Escape") {
        if (!combo.classList.contains("is-open")) return;
        event.preventDefault(); event.stopPropagation(); close(); button.focus();
      } else if (key === "Enter" || key === " ") {
        event.preventDefault(); event.stopPropagation();
        if (combo.classList.contains("is-open")) close(); else open();
      } else if (["ArrowDown", "ArrowUp", "Home", "End"].includes(key) && options.length && !multi) {
        event.preventDefault(); event.stopPropagation();
        const current = Math.max(0, options.findIndex((entry) => entry.value === value));
        const next = key === "Home" ? 0 : key === "End" ? options.length - 1
          : (current + (key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
        select(options[next].value, true);
      }
    }, events);
    combo.addEventListener("focusout", (event) => { if (!combo.contains(event.relatedTarget)) close(); }, events);
    document.addEventListener("pointerdown", (event) => { if (!combo.contains(event.target)) close(); }, { capture:true, signal:config.signal });
    window.addEventListener("resize", place, events);
    if (config.signal) config.signal.addEventListener("abort", close, { once:true });
    bindings.set(combo, close);
    return {
      get value() { return value; },
      set value(next) { select(next, false); },
      get options() { return options.slice(); },
      setOptions(next) {
        close();
        options = next.map((entry) => ({ value:String(entry.value), label:String(entry.label), font:entry.font || "", description:entry.description || "", icon:entry.icon || "", detail:entry.detail || "" }));
        menu.replaceChildren();
        options.forEach((entry) => {
          const row = document.createElement("div");
          row.className = "combo-option";
          row.tabIndex = -1;
          row.setAttribute("role", "option");
          row.dataset.value = entry.value;
          if (multi) {
            const mark = document.createElement("span");
            mark.className = "combo-option-pick";
            mark.innerHTML = (window.RK_ICONS || {})["action/select"] || "";
            row.appendChild(mark);
          }
          // the icon is markup the page itself builds, never text that came from outside
          if (entry.icon) {
            const icon = document.createElement("span");
            icon.className = "combo-option-icon";
            icon.innerHTML = entry.icon;
            row.appendChild(icon);
          }
          const text = document.createElement("span");
          text.className = "combo-option-label";
          text.textContent = entry.label;
          row.appendChild(text);
          if (entry.detail) {
            const detail = document.createElement("span");
            detail.className = "combo-option-detail";
            detail.textContent = entry.detail;
            row.appendChild(detail);
          }
          if (entry.font) row.style.fontFamily = '"' + entry.font + '", sans-serif';
          menu.appendChild(row);
        });
        if (config.footer) menu.appendChild(config.footer);
        select(value, false);
      },
      close,
    };
  }
  window.RKCombo = { bind };
})();
</script>
