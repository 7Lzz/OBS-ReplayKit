<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit</title>
<style>
  /* fallbacks only -- the helper injects the real theme tokens above this block */
  :root {
    --window:#1D1F26;
    --grey3:#464B59;
    --grey5:#2F323C;
    --grey6:#272A33;
    --grey8:#131419;
    --line2:#5B6273;
    --primary:#284CB8;
    --primary_light:#476BD7;
    --text:#ffffff;
    --text_muted:#969696;
    --green:#3fbf7f;
    --amber:#E2A33B;
    --font:"Segoe UI",system-ui,sans-serif;
    --ease_pop:cubic-bezier(.2, .7, .3, 1);
    --anim_press:130ms;
  }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--grey6); color:var(--text); font:13px var(--font); user-select:none; -webkit-user-select:none; }
  button { font:inherit; color:inherit; }

  /* the window is the card, as on the notification reader: the plugin rounds it and borders it, the page fills it in the colour the plugin looks for */
  .card { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--grey6); }
  .card.is-opening { animation:rk-open 280ms var(--ease_smooth, ease-out) both; }
  @keyframes rk-open { from { opacity:0; } to { opacity:1; } }

  .top { position:relative; flex:none; display:flex; align-items:center; gap:10px; padding:18px 56px 14px 22px; }
  .top h1 { flex:1; min-width:0; margin:0; font-size:16px; font-weight:700; line-height:1.35; overflow-wrap:anywhere; }
  .badge { flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; }
  .badge svg { width:18px; height:18px; }
  .badge.is-check { background:color-mix(in srgb, var(--green) 18%, transparent); color:var(--green); }
  .badge.is-warning { background:color-mix(in srgb, var(--amber) 18%, transparent); color:var(--amber); }
  .badge.is-icon { border-radius:6px; }
  .badge.is-icon svg { width:26px; height:26px; }
  .badge svg path:not([style]) { fill:currentColor; }
  .x {
    position:absolute; top:14px; right:16px; width:26px; height:26px; padding:0; border:0; border-radius:var(--border_radius,4px);
    display:grid; place-items:center; background:transparent; color:var(--text_muted); cursor:pointer;
    transition:background-color 90ms linear, transform var(--anim_press) var(--ease_pop);
  }
  .x:hover { background:var(--button_bg_hover,var(--grey3)); color:var(--text); }
  .x:active { transform:scale(.94); }
  .x svg { width:14px; height:14px; }

  .body { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; justify-content:center; padding:0 22px 4px; }
  .media { display:block; width:100%; max-height:200px; border-radius:6px; background:var(--grey8); object-fit:contain; }
  .media[hidden] { display:none; }
  .text { margin:12px 0 0; font-size:13.5px; line-height:1.5; overflow-wrap:anywhere; }
  .media[hidden] + .text { margin-top:0; }
  .big { display:block; margin-top:2px; font-size:30px; font-weight:700; letter-spacing:-.01em; color:var(--green); }
  .big:empty { display:none; }
  .detail { margin:8px 0 0; color:var(--text_muted); font-size:12.5px; line-height:1.55; overflow-wrap:anywhere; }
  .text:empty, .detail:empty { display:none; }

  .foot { flex:none; display:flex; justify-content:flex-end; gap:8px; padding:14px 22px 18px; }
  .btn {
    height:32px; padding:0 14px; border:1px solid var(--grey3); border-radius:6px; background:var(--window);
    font-size:12.5px; font-weight:600; cursor:pointer;
    transition:border-color 90ms linear, background-color 90ms linear, color 90ms linear;
  }
  .btn:hover { border-color:var(--line2); }
  .btn[hidden] { display:none; }
  .btn.is-primary { background:var(--primary); border-color:var(--primary); color:var(--on-accent); }
  .btn.is-primary:hover { background:var(--primary_light); border-color:var(--primary_light); }
</style>
<!--#include scrollbar-->
<!--#include interaction-states-->
</head>
<body>
<div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="text detail">
  <header class="top">
    <span class="badge is-check" id="badge" aria-hidden="true"></span>
    <h1 id="title">&nbsp;</h1>
    <button class="x" type="button" id="x" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">{{glyph:editor/close}}</svg>
    </button>
  </header>
  <div class="body">
    <img class="media" id="media" alt="" hidden>
    <p class="text" id="text"><span id="line"></span><span class="big" id="big"></span></p>
    <p class="detail" id="detail"></p>
  </div>
  <div class="foot">
    <button class="btn" type="button" id="close">Close</button>
    <button class="btn is-primary" type="button" id="go" hidden></button>
  </div>
</div>
<script>
  (function lockdown() {
    document.addEventListener("contextmenu", (e) => e.preventDefault(), true);
    document.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive:false, capture:true });
  })();

  const HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";
  const $ = (id) => document.getElementById(id);
  const els = { card:$("card"), badge:$("badge"), title:$("title"), media:$("media"), line:$("line"), big:$("big"), detail:$("detail"), close:$("close"), x:$("x"), go:$("go") };
  const inner = (svg) => String(svg || "").replace(/^<svg[^>]*>/i, "").replace(/<\/svg>\s*$/i, "");
  const BADGES = {
    check: '<svg viewBox="0 0 24 24">{{glyph:action/check}}</svg>',
    warning: '<svg viewBox="0 0 24 24">{{glyph:action/warning}}</svg>',
  };
  // the note the clips page reads when it shows, which is how a gif to scroll to reaches it from this window
  const OPEN_FILTER_KEY = "rk-clips-open-filter";
  let action = null;
  let shownId = "";
  // a show that comes while the one before it is still fetching wins
  let showRun = 0;

  function closeCard() {
    fetch(HELPER + "/done-popup/close?t=" + Date.now(), { method:"POST", cache:"no-store" }).catch(() => {});
  }

  function paintBadge(icon) {
    const own = icon === "gif" && window.RK_ICONS && RK_ICONS["nav/gifs"];
    els.badge.className = "badge " + (own ? "is-icon" : icon === "warning" ? "is-warning" : "is-check");
    els.badge.innerHTML = own ? '<svg viewBox="0 0 24 24">' + inner(RK_ICONS["nav/gifs"]) + "</svg>" : BADGES[icon === "warning" ? "warning" : "check"];
  }

  function clear() {
    els.title.innerHTML = "&nbsp;";
    els.line.textContent = "";
    els.big.textContent = "";
    els.detail.textContent = "";
    els.media.hidden = true;
    els.media.removeAttribute("src");
    els.go.hidden = true;
    action = null;
  }

  // the window is reused: the plugin calls this with the notification to show each time it opens the card
  window.__replaykitShowDone = async function (id) {
    const run = ++showRun;
    shownId = id;
    els.card.classList.remove("is-opening");
    void els.card.offsetWidth;
    els.card.classList.add("is-opening");
    let item = null;
    try {
      const res = await fetch(HELPER + "/done-popup/item?id=" + encodeURIComponent(id) + "&t=" + Date.now(), { cache:"no-store" });
      const data = await res.json();
      item = data && data.ok && data.item ? data.item : null;
    } catch (_) {}
    if (run !== showRun) return;
    clear();
    if (!item) { closeCard(); return; }
    const popup = item;
    paintBadge(popup.icon || (item.kind === "warning" ? "warning" : "check"));
    els.title.textContent = item.title || "";
    els.line.textContent = popup.text || "";
    els.big.textContent = popup.big || "";
    els.detail.textContent = popup.detail || "";
    if (typeof popup.media === "string" && popup.media.startsWith("/")) { els.media.src = HELPER + popup.media; els.media.hidden = false; }
    action = popup.action && typeof popup.action === "object" && popup.action.label ? popup.action : null;
    els.go.hidden = !action;
    els.go.textContent = action ? action.label : "";
    (action ? els.go : els.close).focus({ preventScroll:true });
  };

  // the next open must not show this result for a frame before its own arrives
  window.__replaykitHideDone = function () {
    showRun++;
    shownId = "";
    clear();
  };

  function runAction() {
    const chosen = action;
    if (!chosen) { closeCard(); return; }
    if (chosen.kind === "reveal-gif" && chosen.file) {
      try { localStorage.setItem(OPEN_FILTER_KEY, JSON.stringify({ revealGif: String(chosen.file), at: Date.now() })); } catch (_) {}
      fetch(HELPER + "/open-clips-window?t=" + Date.now(), { method:"POST", cache:"no-store" }).catch(() => {});
    } else if (chosen.kind === "link" && chosen.url) {
      fetch(HELPER + "/notifications/open-link?url=" + encodeURIComponent(chosen.url), { method:"POST", cache:"no-store" }).catch(() => {});
    }
    closeCard();
  }

  els.x.addEventListener("click", closeCard);
  els.close.addEventListener("click", closeCard);
  els.go.addEventListener("click", runAction);
  els.media.addEventListener("error", () => { els.media.hidden = true; });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); closeCard(); }
  });

  if (window.RKHover) RKHover.apply(document, { control:".btn" });
</script>
</body>
</html>
