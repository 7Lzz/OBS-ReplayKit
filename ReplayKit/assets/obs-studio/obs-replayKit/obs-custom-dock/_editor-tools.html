<!-- shared partial (helper #include target: editor-tools). the bar on the left of the preview in the clip editor and the panel it opens: subtitles (made by hand or by the speech engine of the helper), audio (the import moved here from the toolbar) and a voiceover recorded from a microphone. the subtitle that is selected, and the look of its row, is edited in the panel on the right. the subtitles themselves live in the lanes module, which owns the timeline, the history and the drafts; this file only drives them. depends on _color-picker being on the page -->
<style>
  /* a font of the subtitles that windows does not have, shipped with replaykit; the helper hands the same file to the saved copy */
  @font-face { font-family: "Fredoka One"; src: url(/fonts/FredokaOne-Regular.ttf) format("truetype"); font-display: block; }
  /* the bar and the panel stand against the left edge of the window, square: the bar in the window colour, the panel it opens in the panel colour the toolbar shares, a hairline toward the video, and the groups inside drawn straight on the panel */
  .ed-left { display: flex; min-height: 0; background: var(--bg_window); border-right: 1px solid var(--grey4-solid, var(--grey4)); }
  .ed-rail { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; width: 68px; padding: 8px 6px; }
  /* a tab is its own rounded block inside the bar; the open one keeps the hover colour, the way the settings sidebar reads */
  .ed-tab {
    position: relative; width: 100%; height: 56px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text_muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 11px; cursor: pointer;
    transition: background-color 90ms linear, color 90ms linear;
  }
  .ed-tab svg { width: 20px; height: 20px; fill: currentColor; }
  .ed-tab:hover, .ed-tab.is-active { background: rgba(var(--text-rgb), .08); color: var(--text); }
  .ed-tab.is-recording svg { color: #e33b57; }
  .ed-tools {
    display: flex; flex-direction: column; width: clamp(250px, 21vw, 310px); min-height: 0;
    background: var(--ed-panel, var(--grey6));
    border-left: 1px solid var(--grey4-solid, var(--grey4));
    animation: ed-panel-in 180ms var(--ease_smooth) both;
  }
  .ed-tools[hidden] { display: none; }
  .ed-tools.is-closing { animation: ed-panel-out 140ms ease-in both; pointer-events: none; }
  @keyframes ed-panel-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  @keyframes ed-panel-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-10px); } }
  /* the cards of the right panel come in from the right whenever they are shown */
  .editor-side > .editor-card:not([hidden]) { animation: ed-card-in 180ms var(--ease_smooth) both; }
  .editor-side > .editor-card.is-closing { animation: ed-card-out 130ms ease-in both; pointer-events: none; }
  @keyframes ed-card-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  @keyframes ed-card-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(10px); } }
  .ed-tools-head { display: flex; align-items: center; flex: 0 0 auto; height: 46px; padding: 0 8px 0 14px; gap: 8px; }
  .ed-tools-title { flex: 1 1 auto; font-size: 13px; font-weight: 700; color: var(--text); }
  .ed-x, .tl-x { width: 26px; height: 26px; padding: 0; border: 0; border-radius: var(--border_radius); background: transparent; color: var(--text_muted); display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
  .ed-x:hover, .tl-x:hover { background: var(--button_bg_hover); color: var(--text); }
  .ed-x svg, .tl-x svg { width: 14px; height: 14px; fill: currentColor; }
  /* the panels scroll without a bar, as medal does */
  .ed-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 0 14px 14px; }
  .ed-scroll::-webkit-scrollbar { display: none; }
  .ed-pane { display: flex; flex-direction: column; gap: 22px; }
  .ed-pane:not([hidden]) { animation: ed-pane-in 160ms var(--ease_smooth) both; }
  .ed-pane[hidden] { display: none; }
  @keyframes ed-pane-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .ed-sec-head { display: flex; align-items: center; height: 26px; gap: 2px; margin: 0 0 6px; }
  .ed-sec-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .ed-sec-head .ed-link { margin-left: auto; }
  .ed-row { display: flex; align-items: center; gap: 10px; min-height: 32px; margin: 0 0 8px; font-size: 12px; color: var(--text); }
  .ed-row[hidden] { display: none; }
  .ed-row > .ed-row-label { flex: 0 0 78px; color: var(--text_muted); display: inline-flex; align-items: center; white-space: nowrap; }
  .ed-row > .tl-speeds { flex: 1 1 auto; min-width: 0; }
  .ed-row.is-off > :not(.ed-row-label) { opacity: .45; pointer-events: none; }
  .ed-status { font-size: 12px; color: var(--text_muted); margin: 8px 0 0; }
  .ed-status:empty { display: none; }
  .ed-tools .btn, .ed-sub-edit .btn { width: 100%; height: 32px; gap: 6px; }
  .ed-tools .btn svg, .ed-sub-edit .btn svg { width: 14px; height: 14px; fill: currentColor; }
  .ed-progress { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 12px; color: var(--text); }
  .ed-progress[hidden] { display: none; }
  .ed-progress > span { flex: 0 0 auto; }
  .ed-bar { flex: 1 1 auto; height: 4px; border-radius: 2px; background: var(--grey4); overflow: hidden; }
  .ed-bar i { display: block; height: 100%; width: 0; background: var(--primary_light); transition: width 200ms linear; }
  .ed-link { border: 0; background: none; color: var(--text_muted); font: inherit; font-size: 12px; cursor: pointer; padding: 0; }
  .ed-link:hover { color: var(--text); text-decoration: underline; }
  .ed-link[hidden] { display: none; }
  .ed-sec[hidden] { display: none; }
  /* the two ways in to subtitles, as big buttons with an icon and a line under the name */
  .ed-bigs { display: flex; flex-direction: column; gap: 8px; }
  .ed-big { display: flex; align-items: center; gap: 12px; width: 100%; height: 64px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 8px; background: rgba(var(--text-rgb), .05); color: var(--text); font: inherit; text-align: left; cursor: pointer; transition: background-color 90ms linear; }
  .ed-big:hover { background: rgba(var(--text-rgb), .09); }
  .ed-big-icon { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 6px; background: rgba(var(--text-rgb), .08); display: grid; place-items: center; }
  .ed-big-icon svg { width: 20px; height: 20px; fill: currentColor; }
  .ed-big-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ed-big-title { font-size: 13px; font-weight: 700; }
  .ed-big-blurb { font-size: 12px; color: var(--text_muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-big-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-back { margin-left: -6px; }
  .ed-back[hidden] { display: none; }
  .ed-view { display: flex; flex-direction: column; gap: 22px; }
  .ed-view > * { flex: none; }
  .ed-view.is-page { gap: 0; }
  .ed-view.is-page > .btn { margin-top: 6px; }
  .ed-view.is-page > .ed-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--hairline); }
  .ed-view:not([hidden]) { animation: ed-pane-in 160ms var(--ease_smooth) both; }
  .ed-view[hidden] { display: none; }
  .ed-view > .ed-status { margin: 10px 0 0; }
  /* the generate button is its own progress bar while the speech engine works, with a cross to stop it */
  .ed-gen { position: relative; overflow: hidden; }
  .ed-gen-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--primary); opacity: 0; transition: width 400ms linear, opacity 120ms linear; pointer-events: none; }
  .ed-gen-label { position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
  .ed-gen-icon { position: relative; z-index: 1; display: inline-flex; }
  .ed-gen.is-working .ed-gen-icon { display: none; }
  .ed-gen-cancel { position: absolute; z-index: 2; right: 6px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border-radius: 4px; display: none; place-items: center; color: var(--on-accent); }
  .ed-gen-cancel:hover { background: rgba(0, 0, 0, .25); }
  .ed-gen-cancel svg { width: 12px; height: 12px; fill: currentColor; }
  .ed-tools .btn.ed-gen.is-working, .ed-tools .btn.ed-gen.is-working:hover { background: rgba(var(--accent-rgb), .28); border-color: transparent; cursor: default; }
  .ed-gen.is-working .ed-gen-fill { opacity: 1; }
  .ed-gen.is-working .ed-gen-cancel { display: grid; }

  .ed-tools .combo-button, .ed-sub-edit .combo-button { font:inherit; font-size:12px; }

  /* the subtitle being edited and the look of its row, in the panel on the right */
  .ed-sub-edit[hidden] { display: none; }
  .ed-sub-edit { display: flex; flex-direction: column; gap: 16px; }
  /* the groups of the right panel are set apart by the divider the settings use between groups */
  .ed-sub-edit > .ed-sec + .ed-sec { border-top: 1px solid var(--hairline); padding-top: 14px; }
  .ed-sub-head { display: flex; align-items: center; gap: 8px; height: 46px; margin-bottom: -14px; }
  .ed-sub-head .editor-card-title { height: auto; flex: 1 1 auto; }
  .ed-sub-time { font-size: 12px; color: var(--text_muted); font-variant-numeric: tabular-nums; }
  .ed-sub-text { display: block; width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical; border: 1px solid var(--grey4-solid, var(--grey4)); border-radius: var(--border_radius); background: var(--grey8); color: var(--text); font: inherit; font-size: 13px; line-height: 1.4; padding: 8px 10px; }
  .ed-sub-text:focus { outline: none; border-color: var(--primary_light); }
  .ed-btns { display: flex; gap: 6px; margin: 8px 0 0; }
  .ed-btns .btn { flex: 1 1 0; }
  .ed-btns.ed-pickrow { margin: -6px 0 0; }
  .ed-slide { display: grid; grid-template-columns: minmax(0, 1fr) 52px; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .ed-slide .tl-value { height: 30px; }
  .ed-toggles { display: flex; gap: 6px; }
  .ed-toggles .btn.tl-mini { width: 34px; height: 30px; padding: 0; }
  .ed-toggles .btn.tl-mini svg { width: 16px; height: 16px; fill: currentColor; }
  .ed-colorfield { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .ed-colorfield input { flex: 1 1 auto; min-width: 0; height: 30px; box-sizing: border-box; padding: 0 9px; border: 1px solid var(--grey4); border-radius: 4px; background: var(--grey8); color: var(--text); font: inherit; font-size: 12px; text-transform: uppercase; outline: none; }
  .ed-colorfield input:focus { border-color: var(--primary_light); }
  .ed-colorfield input.is-bad { border-color: #e33b57; }
  .ed-colordot { flex: 0 0 26px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; position: relative; overflow: hidden; background: repeating-conic-gradient(#777 0 25%, #bbb 0 50%) 0 0 / 8px 8px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .18); }
  .ed-colordot::after { content: ""; position: absolute; inset: 0; background: var(--dot, #000); }
  .ed-colordot:hover { box-shadow: 0 0 0 2px rgba(255, 255, 255, .4); }
  .ed-switchrow { display: flex; align-items: center; gap: 8px; min-height: 32px; margin: 0 0 8px; font-size: 12px; color: var(--text); cursor: pointer; }

  /* the library: every clip of the folder in a card over the editor, to lay one over the video */
  .ed-lib-veil { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; background: rgba(0, 0, 0, .55); animation: ed-lib-fade 140ms linear both; }
  .ed-lib-veil[hidden] { display: none; }
  @keyframes ed-lib-fade { from { opacity: 0; } to { opacity: 1; } }
  .ed-lib { display: flex; flex-direction: column; width: min(940px, calc(100vw - 48px)); height: min(720px, calc(100vh - 64px)); background: var(--grey6); border: 1px solid var(--grey4); border-radius: 10px; box-shadow: 0 18px 48px rgba(0, 0, 0, .45); animation: ed-lib-in 180ms var(--ease_smooth) both; overflow: hidden; }
  @keyframes ed-lib-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  .ed-lib-head { display: flex; flex: 0 0 auto; align-items: center; gap: 14px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--hairline); }
  .ed-lib-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 0 0 auto; }
  .ed-lib-head .ed-fx-search { flex: 0 1 160px; width: 160px; min-width: 0; }
  /* the buttons of the library sit after a divider beside its name; the sort and the search keep to the right, the sort trigger and menu being the ones of the clips page */
  .ed-lib-divider { flex: 0 0 1px; width: 1px; height: 20px; background: var(--hairline); }
  .ed-lib-head .clip-sort-wrap.ed-lib-sort { margin-left: auto; margin-right: -6px; }
  /* the shared scrollbar of the dock, its outline a step lighter than this card so it shows; its room is kept so the cards never change width when it comes */
  .ed-lib-body { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-gutter: stable; margin-right: 6px; padding: 16px 8px 12px 18px; --sb-outline: var(--grey5); }
  .ed-lib-head-row { display: flex; align-items: center; gap: 6px; margin: 2px 0 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text); }
  .ed-lib-head-row svg { width: 13px; height: 13px; fill: currentColor; }
  .ed-lib-head-row[hidden], .ed-lib-grid[hidden] { display: none; }
  .ed-lib-grid + .ed-lib-head-row { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--hairline); }
  .ed-lib-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .ed-lib-card { display: flex; flex-direction: column; gap: 7px; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .ed-lib-thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--grey8); box-shadow: 0 0 0 1px rgba(var(--text-rgb), .08); transition: box-shadow 90ms linear; }
  .ed-lib-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ed-lib-card:hover .ed-lib-thumb, .ed-lib-card:focus-visible .ed-lib-thumb { box-shadow: 0 0 0 2px rgb(var(--accent-rgb)); }
  .ed-lib-card:focus-visible { outline: none; }
  .ed-lib-len { position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 4px; background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
  .ed-lib-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-lib-empty { font-size: 13px; color: var(--text_muted); text-align: center; padding: 40px 0; }
  .ed-lib-empty:empty { display: none; }
  /* the elements: shapes, stickers and files, in tiles of four */
  .ed-el-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .ed-el-tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; background: rgba(var(--text-rgb), .05); display: grid; place-items: center; cursor: pointer; transition: background-color 90ms linear, box-shadow 90ms linear; }
  .ed-el-tile[hidden] { display: none; }
  .ed-el-tile:hover { background: rgba(var(--text-rgb), .1); box-shadow: 0 0 0 1px rgba(var(--text-rgb), .25); }
  .ed-el-tile svg, .ed-el-tile img { width: 64%; height: 64%; object-fit: contain; display: block; pointer-events: none; }
  .ed-el-tile.is-busy { opacity: .45; pointer-events: none; }
  .ed-el-credit { font-size: 11px; color: var(--text_muted); margin: 8px 0 0; line-height: 1.4; }
  /* the stickers, the way medal shows them: three to a row on dark tiles, the first few on the elements page and the rest behind see all */
  .ed-st-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .ed-st-tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 8px; background: var(--grey8); display: grid; place-items: center; cursor: pointer; transition: box-shadow 90ms linear; }
  .ed-st-tile[hidden] { display: none; }
  .ed-st-tile:hover { box-shadow: 0 0 0 1px rgba(var(--text-rgb), .3); }
  .ed-st-tile img { width: 76%; height: 76%; object-fit: contain; display: block; pointer-events: none; }
  .ed-st-tile.is-busy { opacity: .45; pointer-events: none; }
  .ed-sec-head .ed-link.ed-seeall { margin-left: auto; font-weight: 600; color: var(--text); }
  .ed-sec-head .ed-link.ed-seeall:hover { text-decoration: none; color: var(--primary_light); }
  .ed-el-page[hidden], .ed-el-home[hidden] { display: none; }
  .ed-st-kind { font-size: 12px; font-weight: 600; color: var(--text_muted); margin: 0 0 -14px; }
  .ed-st-kind[hidden] { display: none; }
  .ed-el-page, .ed-el-home { display: flex; flex-direction: column; gap: 22px; }
  .ed-sec[hidden] { display: none; }

  /* the voiceover, laid out like the recorder of medal: the microphone, the time, the level, then the button */
  .ed-rec { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ed-rec .combo { width:100%; flex:none; }
  .ed-mic-note { align-self: stretch; font-size: 12px; color: var(--text_muted); margin:0; min-height:2.8em; line-height:1.4; }
  .ed-mic-note:empty { display: none; }
  .ed-rec-time { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); margin-top: 6px; }
  .ed-wave { align-self: stretch; height: 44px; border-radius: 6px; background: var(--grey6); display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 10px; overflow: hidden; }
  .ed-wave i { flex: 0 0 2px; height: 4px; border-radius: 1px; background: var(--grey1); transition: height 90ms linear; }
  .ed-wave.is-live i { background: var(--text); }
  .ed-rec-hint { font-size: 12px; color: var(--text_muted); }
  .ed-rec-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--grey3); background: var(--grey5); display: grid; place-items: center; cursor: pointer; padding: 0; margin-top: 8px; transition: background-color 120ms linear, border-color 120ms linear; }
  .ed-rec-btn i { width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 160ms var(--ease_pop), border-radius 140ms ease, background-color 140ms ease, width 140ms ease, height 140ms ease; }
  .ed-rec-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary_light); }
  .ed-rec-btn:hover:not(:disabled) i { transform: scale(1.22); background: var(--on-accent); }
  .ed-rec-btn.is-on i { width: 14px; height: 14px; border-radius: 3px; background: #e33b57; }
  .ed-rec-btn.is-on:hover:not(:disabled) i { background: #fff; }
  .ed-rec-btn:disabled { opacity: .45; cursor: default; }
  .ed-rec-label { font-size: 12px; color: var(--text_muted); }
  .ed-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); margin: 14px 0 0; cursor: pointer; align-self: stretch; }

  /* the subtitles shown over the preview, placed on the picture itself; sizes are fractions of its height so they match the saved copy at any size. every position stacks its rows in their order */
  .sub-overlay { position: absolute; z-index: 3; pointer-events: none; }
  .sub-overlay[hidden] { display: none; }
  .sub-group { position: absolute; left: 5%; right: 5%; display: flex; flex-direction: column; gap: calc(var(--sub-h, 400px) * .01); }
  .sub-group:empty { display: none; }
  .sub-group[data-position="bottom"] { bottom: 7%; }
  .sub-group[data-position="top"] { top: 7%; }
  .sub-group[data-position="middle"] { top: 50%; transform: translateY(-50%); }
  .sub-cue { max-width: 100%; position: relative; pointer-events: auto; cursor: grab; touch-action: none; }
  .sub-cue.is-placed { position: absolute; max-width: 90%; transform: translate(-50%, -50%); }
  .sub-overlay.is-dragging .sub-cue { cursor: grabbing; }
  /* the dashed outline of the overlay preview: shown on hover and while dragging, so it is clear the subtitle can be moved */
  .sub-cue::after { content: ""; position: absolute; inset: -3px; border: 1px dashed transparent; border-radius: 3px; pointer-events: none; transition: border-color 120ms linear; }
  .sub-cue:hover::after, .sub-overlay.is-dragging .sub-cue::after { border-color: rgba(255, 255, 255, .6); }
  /* the corner grips of the overlay preview, on the corners of the outline */
  .sub-grip { position: absolute; z-index: 2; width: 10px; height: 10px; margin: -5px 0 0 -5px; box-sizing: border-box; border-radius: 2px; border: 1px solid rgb(var(--accent-rgb)); background: var(--grey7); opacity: 0; transition: opacity 120ms linear; touch-action: none; }
  .sub-grip[data-corner="nw"] { left: -3px; top: -3px; cursor: nwse-resize; }
  .sub-grip[data-corner="ne"] { left: calc(100% + 3px); top: -3px; cursor: nesw-resize; }
  .sub-grip[data-corner="sw"] { left: -3px; top: calc(100% + 3px); cursor: nesw-resize; }
  .sub-grip[data-corner="se"] { left: calc(100% + 3px); top: calc(100% + 3px); cursor: nwse-resize; }
  .sub-cue:hover .sub-grip, .sub-overlay.is-dragging .sub-grip { opacity: 1; }
  /* the rotation grip: a round handle on a stem rising from the middle of the top of the outline */
  .sub-rot { position: absolute; z-index: 2; left: 50%; top: -27px; width: 12px; height: 12px; margin-left: -6px; box-sizing: border-box; border-radius: 50%; border: 2px solid #fff; background: rgb(var(--accent-rgb)); opacity: 0; transition: opacity 120ms linear; cursor: grab; touch-action: none; }
  .sub-rot::after { content: ""; position: absolute; left: 50%; top: 10px; width: 1px; height: 14px; margin-left: -.5px; background: rgba(255, 255, 255, .7); pointer-events: none; }
  .sub-cue:hover .sub-rot, .sub-overlay.is-dragging .sub-rot { opacity: 1; }
  .sub-line { display: inline-block; white-space: pre; max-width: 100%; box-sizing: border-box; }
  .sub-line .sub-word.is-on, .sub-line .sub-word.is-done { color: var(--sub-word); }

    // controls of the style of a row; each write goes to the row being edited

    // the rows of the subtitles picked on the timeline, the one shown first
    function editRows() {
      var rows = editRow ? [editRow] : [];
      subs.picked().forEach(function (id) { var r = subs.rowOf(id); if (r && rows.indexOf(r) < 0) rows.push(r); });
      return rows;
    }

    // one change to every row of the pick is one step of the history
    function writeStyle(patch, record) {
      var rows = editRows();
      rows.forEach(function (r, i) { subs.setRowStyle(r, patch, i === rows.length - 1 ? record : false); });
    }
    // a change that keeps coming (a slider, a colour being dragged) to the rows given becomes one step of the history once it rests
    function writeStyleSoon(rows, patch) {
      rows.forEach(function (r) { subs.setRowStyle(r, patch, false); });
      clearTimeout(styleTimer);
      styleTimer = setTimeout(function () { subs.checkpoint(); }, 600);
    }

    function paintFill(slide) {
      var min = Number(slide.min), max = Number(slide.max);
      slide.style.setProperty("--fill", ((Number(slide.value) - min) / (max - min) * 100) + "%");
    }

    function slider(key, label) {
      var range = subs.ranges()[key];
      var box = el("div", "ed-slide");
      var wrap = el("div", "tl-slider-wrap");
      var slide = el("input", "tl-slider rk-range");
      slide.type = "range";
      slide.min = String(range[0]);
      slide.max = String(range[1]);
      slide.step = "1";
      slide.setAttribute("aria-label", label);
      wrap.appendChild(slide);
      var value = el("input", "tl-value");
      value.type = "text";
      value.inputMode = "numeric";
      value.autocomplete = "off";
      value.setAttribute("aria-label", label);
      box.appendChild(wrap);
      box.appendChild(value);
      slide.addEventListener("input", function () {
        paintFill(slide);
        value.value = slide.value;
        var p = {};
        p[key] = Number(slide.value);
        writeStyle(p, false);
      });
      slide.addEventListener("change", function () { subs.checkpoint(); });
      value.addEventListener("keydown", function (e) { if (e.key === "Enter") value.blur(); e.stopPropagation(); });
      value.addEventListener("change", function () {
        var v = parseFloat(value.value);
        if (!isFinite(v)) { paintStyle(); return; }
        var p = {};
        p[key] = v;
        writeStyle(p);
      });
      box.show = function (v) {
        if (document.activeElement !== value) value.value = String(v);
        if (document.activeElement !== slide) { slide.value = String(v); paintFill(slide); }
      };
      return box;
    }

    // a colour as a hex field and a dot that opens the shared colour picker; colours carry their opacity
    function colorField(key, label) {
      var box = el("div", "ed-colorfield");
      var input = el("input");
      input.type = "text";
      input.maxLength = 9;
      input.spellcheck = false;
      input.autocomplete = "off";
      input.setAttribute("aria-label", label);
      var dot = el("button", "ed-colordot");
      dot.type = "button";
      dot.setAttribute("aria-label", "Choose " + label.toLowerCase());
      box.appendChild(input);
      box.appendChild(dot);
      var current = "#000000";
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") input.blur(); e.stopPropagation(); });
      input.addEventListener("change", function () {
        var text = input.value.trim();
        if (text && text.charAt(0) !== "#") text = "#" + text;
        var v = window.RKColor ? RKColor.cleanAlphaColor(text, null) : null;
        if (!v) { input.classList.add("is-bad"); return; }
        input.classList.remove("is-bad");
        if (key === "shapeColor") { setShapeColor(v); return; }
        var p = {};
        p[key] = v;
        writeStyle(p);
      });
      dot.addEventListener("click", function () {
        if (key === "shapeColor") {
          if (window.openColorDialog) window.openColorDialog(current, label, setShapeColor, { alpha: false, anchor: dot });
          return;
        }
        var to = editRows();
        if (!window.openColorDialog || !to.length) return;
        window.openColorDialog(current, label, function (v) {
          var p = {};
          p[key] = v;
          // the picker stays open while another subtitle is picked, so it keeps to the row it was opened for
          writeStyleSoon(to, p);
        }, { alpha: true, anchor: dot });
      });
      box.show = function (v) {
        current = v;
        dot.style.setProperty("--dot", cssColor(v));
        if (document.activeElement !== input) { input.value = v.toUpperCase(); input.classList.remove("is-bad"); }
      };
      return box;
    }

    // the colour new shapes are drawn in for this edit; the tiles show it
    function setShapeColor(v) {
      v = String(v || "").slice(0, 7).toLowerCase();
      if (!/^#[0-9a-f]{6}$/.test(v)) return;
      prefs.shapeColor = v;

    // the sort of the clips page, the same trigger and menu: newest and oldest, and length and file size that each open to their two ways
    function buildLibrarySort() {

      menu.setAttribute("role", "menu");

      function item(value, sub) {

      menu.appendChild(item("newest"));
      menu.appendChild(item("oldest"));
      Object.keys(LIB_SORT_GROUPS).forEach(function (key) {

        menu.appendChild(g);

    // the cards are put back in the order picked, each in its own grid
    function sortLibrary() {
      var lib = els.lib;
      var key = {
        newest: function (c) { return -(c.mtime || 0); }, oldest: function (c) { return c.mtime || 0; },
        longest: function (c) { return -(c.duration || 0); }, shortest: function (c) { return c.duration || 0; },
        biggest: function (c) { return -(c.size || 0); }, smallest: function (c) { return c.size || 0; },
      }[lib.sort] || function (c) { return -(c.mtime || 0); };
      lib.cards.sort(function (a, b) { return key(a.clip) - key(b.clip) || a.clipName.localeCompare(b.clipName); });

    function paintLibrary() {
      var lib = els.lib;

      var split = lib.favGrid.children.length > 0;

    async function addClipLayer(c, title) {
      var source = clip;
      try { await o.protect([c.name]); }
      catch (err) { o.notify((err && err.message) || "The clip is processing.", "bad", "Library"); return; }
      if (!clip || clip !== source) return;
      var id = lanes.addLayer({ kind: "clip", ref: c.name, name: title, len: c.duration, dur: c.duration, aspect: c.width > 0 && c.height > 0 ? c.height / c.width : 0.5625, w: 1 });
      closeLibrary();
      if (!id) { o.notify("There is no room for another layer.", "bad", "Library"); return; }
      // the sound of the clip comes in as a row of its own linked to the clip, so it follows it; a clip without sound adds none
      helperJson("/import-audio/clip?name=" + encodeURIComponent(c.name), "POST").then(function (r) {
        if (r && r.ok && r.id) return lanes.placeImportAt(r.id, null, id);
        return null;
      }).catch(function () {});
    }

    // a text sticker drawn on a canvas about width pixels wide: a thick outline, a comic burst, a pill or a speech bubble
    function drawTextSticker(d, width) {
      var text = d[0], style = d[1], main = d[2], second = d[3];
      var family = style === "pill" || style === "bubble" ? '"Fredoka One", "Segoe UI", sans-serif' : 'Impact, "Arial Black", sans-serif';
      var fs = 120;
      var probe = document.createElement("canvas").getContext("2d");
      probe.font = fs + "px " + family;
      var tw = probe.measureText(text).width;
      var w, h;
      if (style === "burst") { w = h = Math.ceil(Math.max(tw * 1.3, 300) + 40); }
      else if (style === "pill") { w = tw + 130; h = fs * 1.55; }
      else if (style === "bubble") { w = tw + 130; h = fs * 1.6 + 56; }
      else { w = tw + 80; h = fs * 1.5; }
      var k = width / w;
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(2, Math.round(w * k));
      canvas.height = Math.max(2, Math.round(h * k));
      var ctx = canvas.getContext("2d");
      ctx.scale(k, k);
      ctx.lineJoin = "round";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = fs + "px " + family;
      var cx = w / 2;
      if (style === "burst") {
        var r = w / 2 - 14, spikes = 16;
        ctx.beginPath();
        for (var i = 0; i < spikes * 2; i++) {
          var a = Math.PI * i / spikes - Math.PI / 2;
          var rr = i % 2 ? r * 0.76 : r;
          ctx[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * rr, h / 2 + Math.sin(a) * rr);
        }
        ctx.closePath();
        ctx.fillStyle = main;
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = "#111111";
        ctx.stroke();
        var scale = Math.min(1, (r * 1.3) / tw);
        ctx.font = Math.round(fs * scale) + "px " + family;
        ctx.lineWidth = 16 * scale;
        ctx.strokeStyle = "#111111";
        ctx.strokeText(text, cx, h / 2 + 4);
        ctx.fillStyle = second;
        ctx.fillText(text, cx, h / 2 + 4);
      } else if (style === "pill") {
        var ph = h - 20;
        ctx.beginPath();
        ctx.roundRect(10, 10, w - 20, ph, ph / 2);
        ctx.fillStyle = main;
        ctx.fill();
        ctx.fillStyle = second;
        ctx.fillText(text, cx, h / 2 + 6);
      } else if (style === "bubble") {
        var bh = h - 56;
        ctx.beginPath();
        ctx.roundRect(8, 8, w - 16, bh - 8, 36);
        ctx.moveTo(w * 0.22, bh - 1);
        ctx.lineTo(w * 0.16, h - 8);
        ctx.lineTo(w * 0.36, bh - 1);
        ctx.fillStyle = main;
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#111111";
        ctx.stroke();
        // the join of the tail is covered again so the outline does not cross into the bubble
        ctx.fillRect(w * 0.22 - 2, bh - 9, w * 0.14 + 4, 10);
        ctx.fillStyle = second;
        ctx.fillText(text, cx, (bh + 8) / 2 + 4);
      } else {
        ctx.shadowColor = "rgba(0, 0, 0, .35)";
        ctx.shadowOffsetY = 7;
        ctx.lineWidth = 24;
        ctx.strokeStyle = second;
        ctx.strokeText(text, cx, h / 2 + 4);
        ctx.shadowColor = "transparent";
        ctx.fillStyle = main;
        ctx.fillText(text, cx, h / 2 + 4);
      }
      return canvas;
    }

    function fluentUrl(name) { return FLUENT + encodeURIComponent(name) + "/3D/" + name.toLowerCase().replace(/[ -]/g, "_") + "_3d.png"; }

    // a tile of the stickers: a text one is drawn once the fonts are there, a 3d one is its picture, and an animated one plays while it is hovered and is a still picture otherwise, which keeps the page light
    function stickerTile(x) {
      var t = el("button", "ed-st-tile");
      t.type = "button";
      t.kind = x.kind;
      t.dataset.tooltip = x.name;
      t.setAttribute("aria-label", x.name);
      t.searchText = (x.name + " " + x.search + " sticker").toLowerCase();
      var img = el("img");
      img.alt = "";
      img.loading = "lazy";
      if (x.kind === "text") {
        (document.fonts ? document.fonts.load('120px "Fredoka One"') : Promise.resolve()).catch(function () {}).then(function () { img.src = drawTextSticker(x.data, 220).toDataURL("image/png"); });
      } else if (x.kind === "3d") {
        img.src = fluentUrl(x.data);
      } else {
        var code = x.data[0];
        img.src = NOTO + code + "/emoji.svg";
        t.addEventListener("mouseenter", function () { img.src = NOTO + code + "/512.webp"; });
        t.addEventListener("mouseleave", function () { img.src = NOTO + code + "/emoji.svg"; });
      }
      t.appendChild(img);
      t.addEventListener("click", function () { addSticker(x, t); });
      return t;
    }

    function setElView(v) {
      elView = v;
      paintView();
    }

    // a picture the page drew goes to the helper as png and comes back as a layer
    function uploadPicture(canvas, name, aspect) {
      return new Promise(function (resolve, reject) { canvas.toBlob(function (b) { if (b) resolve(b); else reject(new Error("The picture could not be made")); }, "image/png"); })
        .then(function (blob) { return fetch(o.helper + "/import-media/upload?name=" + encodeURIComponent(name), { method: "POST", cache: "no-store", body: blob }); })
        .then(function (res) { return res.json(); })
        .then(function (r) {
          if (!r || !r.ok) throw new Error((r && r.message) || "The element could not be added");
          if (!lanes.addLayer({ kind: "media", ref: r.id, name: name, aspect: aspect, w: 0.25 })) throw new Error("There is no room for another layer.");
        });
    }

    function busy(tile, promise) {
      tile.classList.add("is-busy");
      return promise.catch(function (err) { o.notify((err && err.message) || "The element could not be added", "bad", "Elements"); })
        .then(function () { tile.classList.remove("is-busy"); });
    }

    function addShape(sh, tile) {
      var w = sh[2][0], h = sh[2][1];
      var scale = 640 / Math.max(w, h);
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.fillStyle = prefs.shapeColor;
      ctx.fill(new Path2D(sh[3]), sh[4] || "nonzero");
      busy(tile, uploadPicture(canvas, sh[1], h / w));
    }

    // a text sticker goes to the helper as the png it is drawn into, a 3d one as its png and an animated one as its gif, so the saved copy plays it too
    function addSticker(x, tile) {
      var failed = function () { throw new Error("The sticker could not be loaded. Check the internet connection."); };
      var made;
      if (x.kind === "text") {
        made = (document.fonts ? document.fonts.load('120px "Fredoka One"') : Promise.resolve()).catch(function () {}).then(function () {
          var c = drawTextSticker(x.data, 720);
          return new Promise(function (resolve) { c.toBlob(resolve, "image/png"); }).then(function (b) { return { blob: b, aspect: c.height / c.width }; });
        });
      } else {
        var url = x.kind === "3d" ? fluentUrl(x.data) : NOTO + x.data[0] + "/512.gif";
        made = fetch(url, { cache: "force-cache" }).then(function (res) { if (!res.ok) failed(); return res.blob(); }, failed).then(function (b) { return { blob: b, aspect: 1 }; });
      }
      busy(tile, made.then(function (m) {
        if (!m.blob) throw new Error("The sticker could not be made");
        return fetch(o.helper + "/import-media/upload?name=" + encodeURIComponent(x.name), { method: "POST", cache: "no-store", body: m.blob })
          .then(function (res) { return res.json(); })
          .then(function (r) {
            if (!r || !r.ok) throw new Error((r && r.message) || "The sticker could not be added");
            if (!lanes.addLayer({ kind: "media", ref: r.id, name: x.name, aspect: m.aspect, w: x.kind === "text" ? 0.28 : 0.2, gif: !!r.gif })) throw new Error("There is no room for another layer.");
          });
      }));
    }

    // files from the picker of the helper; the shape of each is read off the picture before it is laid on
    function pickMedia() {
      // closing the picker without a file answers ok false and cancelled, which is not an error
      fetch(o.helper + "/import-media/pick", { method: "POST", cache: "no-store" }).then(function (res) { return res.json(); }).then(function (r) {
        if (!r || r.cancelled) return;
        if (!r.ok || !Array.isArray(r.files)) throw new Error(r.message || "The files could not be added");
        var bad = [];
        r.files.reduce(function (chain, f) {
          return chain.then(function () {
            if (!f.ok) { bad.push(f.name + ": " + f.message); return null; }
            return new Promise(function (resolve) {
              var img = new Image();
              img.onload = function () { resolve(img.naturalWidth > 0 ? img.naturalHeight / img.naturalWidth : 1); };
              img.onerror = function () { resolve(1); };
              img.src = o.helper + "/import-media/file?id=" + encodeURIComponent(f.id);
            }).then(function (aspect) {
              if (!lanes.addLayer({ kind: "media", ref: f.id, name: f.name, aspect: aspect, w: 0.3, gif: !!f.gif })) bad.push(f.name + ": there is no room for another layer");
            });
          });
        }, Promise.resolve()).then(function () { if (bad.length) o.notify(bad.join("\n"), "bad", "Elements"); });
      }).catch(function (err) { o.notify((err && err.message) || "The files could not be added", "bad", "Elements"); });
    }

    function buildRecord(pane) {
      var box = el("div", "ed-rec");
      els.mic = makeCombo(function (v) { prefs.mic = v; savePrefs(); }, function (option) {
        els.micNote.textContent = option ? option.description || option.label : "";
      });
      els.micNote = el("p", "ed-mic-note", "");
      box.append(els.micNote, els.mic);
      els.recTime = el("div", "ed-rec-time", "");
      box.appendChild(els.recTime);
      els.wave = el("div", "ed-wave");
      for (var i = 0; i < WAVE_BARS; i++) els.wave.appendChild(el("i"));
      box.appendChild(els.wave);
      els.recHint = el("div", "ed-rec-hint", "Record your voice");
      box.appendChild(els.recHint);
      els.recBtn = el("button", "ed-rec-btn");
      els.recBtn.type = "button";
      els.recBtn.setAttribute("aria-label", "Start recording");
      els.recBtn.appendChild(el("i"));
      els.recBtn.addEventListener("click", function () { if (rec.on) stopRecording(true); else startRecording(); });
      box.appendChild(els.recBtn);
      els.recLabel = el("div", "ed-rec-label", "Start Recording");
      box.appendChild(els.recLabel);
      var hear = el("label", "ed-check");
      els.hear = el("input");
      els.hear.type = "checkbox";
      els.hear.className = "rk-switch";
      els.hear.checked = prefs.hear;
      els.hear.addEventListener("change", function () { prefs.hear = els.hear.checked; savePrefs(); });
      hear.appendChild(els.hear);
      hear.appendChild(el("span", "", "Hear the clip while recording"));
      box.appendChild(hear);
      pane.appendChild(box);
      paintTime(0);
      paintWave();
    }

    function build() {
      root.textContent = "";
      els.rail = el("nav", "ed-rail");
      els.rail.appendChild(tab("library", "editor/library", "Library"));
      els.rail.appendChild(tab("elements", "editor/image", "Elements"));
      els.rail.appendChild(tab("subtitles", "editor/subtitles", "Subtitles"));
      els.rail.appendChild(tab("audio", "editor/audio", "Audio"));
      els.rail.appendChild(tab("record", "editor/microphone", "Record"));
      els.panel = el("section", "ed-tools");
      var head = el("div", "ed-tools-head");
      els.back = el("button", "ed-x ed-back");
      els.back.type = "button";
      els.back.setAttribute("aria-label", "Back");
      els.back.dataset.tooltip = "Back";
      els.back.innerHTML = BACK_ICON;
      els.back.addEventListener("click", function () { if (prefs.tab === "elements") setElView("home"); else setView("home"); });
      head.appendChild(els.back);
      els.title = el("div", "ed-tools-title", "");
      var close = el("button", "ed-x");
      close.type = "button";
      close.setAttribute("aria-label", "Close the panel");
      close.innerHTML = icon("editor/close");
      close.addEventListener("click", function () { prefs.open = false; savePrefs(); paintTabs(); });
      head.appendChild(els.title);
      head.appendChild(close);
      els.panel.appendChild(head);
      var scroll = el("div", "ed-scroll");
      els.panes = { elements: el("div", "ed-pane"), subtitles: el("div", "ed-pane"), audio: el("div", "ed-pane"), record: el("div", "ed-pane") };
      buildElements(els.panes.elements);
      buildSubtitles(els.panes.subtitles);
      buildAudio(els.panes.audio);
      buildRecord(els.panes.record);
      Object.keys(els.panes).forEach(function (k) { scroll.appendChild(els.panes[k]); });
      els.panel.appendChild(scroll);
      root.appendChild(els.rail);
      root.appendChild(els.panel);
      buildSubEdit(o.side);
      buildLibrary();
      hovers(root);
      paintTabs();
    }

    // what follows the model of the lanes; the lanes call refresh far more often than anything changes, so it is batched to a frame

    function refresh() {
      if (!built || refreshQueued) return;
      refreshQueued = requestAnimationFrame(function () { refreshQueued = 0; paint(); });
    }

    function paint() {
      var list = subs.list();
      var rows = subs.rows();
      paintSubEdit(list, rows);
      followTrack();
      var state = lanes.importState();
      els.importBtn.disabled = !state.ready || state.picking;
      els.importNote.textContent = !state.ready ? "Audio cannot be added to this clip." : state.importing > 0 ? "Adding audio..." : "";
      // a running job keeps the button live so its cross can stop it
      els.generate.disabled = !job.busy && (!clip || !clip.audio);
      els.autoStatus.textContent = clip && !clip.audio ? "This clip has no audio to listen to." : "";
    }

    // a track of the clip clicked on the timeline while the subtitles tab is open becomes what auto subtitles listen to
    function followTrack() {
      var track = subs.selectedTrack();
      if (track === lastTrack) return;
      lastTrack = track;
      if (track == null || !prefs.open || prefs.tab !== "subtitles" || els.listenRow.hidden) return;
      els.listen.setValue(String(track));
    }

    function paintSubEdit(list, rows) {
      var id = subs.selected();
      var i = list.findIndex(function (c) { return c.id === id; });
      var cue = list[i];
      // the presets of subtitles, or the list of words to check, take the place of this card while their tab is picked
      if (cue && o.subtitlePane && o.subtitlePane() !== "edit") cue = null;
      if (editing && editing !== id) { clearTimeout(textTimer); subs.checkpoint(); }
      editing = cue ? cue.id : "";
      editRow = cue ? cue.row : "";
      var card = els.subEdit;
      if (!cue) {
        // the card slides out before the panel goes
        if (!card.hidden && !card.classList.contains("is-closing")) {
          card.classList.add("is-closing");
          setTimeout(function () {
            card.classList.remove("is-closing");
            if (!editing) card.hidden = true;
          }, 130);
        }
        return;
      }
      card.classList.remove("is-closing");
      card.hidden = false;
      var many = subs.picked().length;
      els.subTitle.textContent = many > 1 ? many + " subtitles" : "Subtitle";
      els.textSec.hidden = many > 1;
      els.subTime.textContent = many > 1 ? "" : fmt(cue.at) + " - " + fmt(cue.end);
      if (document.activeElement !== els.subText && els.subText.value !== cue.text) els.subText.value = cue.text;
      if (document.activeElement === els.subText && els.subText.dataset.cue !== cue.id) els.subText.value = cue.text;
      els.subText.dataset.cue = cue.id;
      els.subPrev.disabled = i <= 0;
      els.subNext.disabled = i >= list.length - 1;
      els.subMerge.disabled = !subs.hasNext(cue.id);
      paintStyle(rows);
    }

    function paintStyle(rows) {
      var r = (rows || subs.rows()).find(function (x) { return x.id === editRow; });
      if (!r) return;
      var s = r.style;
      els.font.setValue(s.font);
      els.color.show(s.color);
      els.size.show(s.size);
      els.rotate.show(s.rotate);
      els.bold.classList.toggle("is-active", s.bold);
      els.italic.classList.toggle("is-active", s.italic);
      els.aligns.forEach(function (b) { b.classList.toggle("is-active", b.dataset.value === s.align); });
      els.position.paint(s.x != null ? "" : s.position);
      els.wordOn.input.checked = s.wordOn;
      els.word.show(s.word);
      els.wordRow.classList.toggle("is-off", !s.wordOn);
      els.wordFx.paint(s.wordFx);
      els.wordFxRow.classList.toggle("is-off", !s.wordOn);
      els.borderColor.show(s.borderColor);
      els.borderWidth.show(s.borderWidth);
      els.bg.show(s.bg);
      els.radius.show(s.radius);
      els.padX.show(s.padX);
      els.padY.show(s.padY);
      // the box settings only mean something once the background has a colour that shows
      var boxed = hexAlpha(s.bg) > 0;
      [els.radiusRow, els.padXRow, els.padYRow].forEach(function (rw) { rw.classList.toggle("is-off", !boxed); });
      els.shadow.input.checked = s.shadow;
    }

    // auto subtitles. one job at a time; a job that answers after the clip was closed or another job started is ignored

    function setProgress(text, pct) {
      var on = text != null;
      els.generate.classList.toggle("is-working", on);
      els.generate.setAttribute("aria-busy", on ? "true" : "false");
      if (!on) {
        els.genFill.style.width = "0%";
        els.genLabel.textContent = "Generate subtitles";
        return;
      }
      var p = Math.max(0, Math.min(100, pct || 0));
      // the engine first loads and works out the language, which can be most of the run, and says nothing until its first 30 seconds of audio are done; the bar eases forward meanwhile at a pace set by how long the audio is, and the real figure takes over once it is ahead, so the label carries no number while listening
      if (job.listenAt) {
        var t = (performance.now() - job.listenAt) / 1000;
        p = Math.max(p, 90 * (1 - Math.exp(-t / job.listenTau)));
      }
      els.genFill.style.width = p + "%";
      els.genLabel.textContent = text + (job.listenAt || p <= 0 ? "..." : " " + Math.round(p) + "%");
    }

    function endJob() {
      clearTimeout(job.timer);
      job.timer = 0;
      job.id = "";
      job.busy = false;
      job.listenAt = 0;
      setProgress(null);
      refresh();
    }

    function cancelJob() {
      var id = job.id;
      job.run += 1;
      endJob();
      if (id) helperJson("/speech/cancel?id=" + encodeURIComponent(id), "POST").catch(function () {});
    }

    function poll(fn, ms) { job.timer = setTimeout(fn, ms); }

    function generate() {
      if (!clip || job.busy) return;
      var run = ++job.run;
      job.busy = true;
      refresh();
      setProgress("Getting ready", 0);
      var model = prefs.accuracy;
      helperJson("/speech/status?model=" + model).then(function (st) {
        if (run !== job.run) return null;
        if (st.installed) return transcribe(run, model);
        // the first time the engine and the model of the chosen accuracy are fetched, which the progress says
        return helperJson("/speech/install?model=" + model, "POST").then(function () { return waitInstall(run, model); });
      }).catch(function (err) {
        if (run !== job.run) return;
        endJob();
        o.notify((err && err.message) || "Subtitles could not be made", "bad", "Auto subtitles");
      });
    }

    function waitInstall(run, model) {
      return helperJson("/speech/status?model=" + model).then(function (st) {
        if (run !== job.run) return null;
        if (st.installed) return transcribe(run, model);
        if (!st.installing) throw new Error(st.error || "The speech engine could not be downloaded.");
        setProgress("Downloading " + st.downloadMb + " MB", st.percent);
        return new Promise(function (resolve, reject) { poll(function () { waitInstall(run, model).then(resolve, reject); }, 500); });
      });
    }

    function transcribe(run, model) {
      var range = subs.sourceRange();
      var tracks = els.listenRow.hidden ? "0" : els.listen.value() || "0";
      var names = tracks.split(",").map(function (v) { var t = (clip.tracks || []).find(function (x) { return String(x.index) === v; }); return t ? t.label : ""; });
      var title = tracks === "0" || names.indexOf("") >= 0 ? "Subtitles" : names.join(" + ");
      // a guess at how long listening takes until the engine reports, from a two minute clip taking about 5 seconds on fast and 19 on accurate
      job.listenAt = performance.now();
      job.listenTau = Math.max(4, (range.end - range.start) * (model === "fast" ? 0.05 : 0.17));
      setProgress("Listening", 0);
      return helperJson("/speech/transcribe?file=" + encodeURIComponent(clip.name) + "&start=" + range.start.toFixed(3) + "&end=" + range.end.toFixed(3) + "&tracks=" + encodeURIComponent(tracks) + "&language=" + encodeURIComponent(els.lang.value()) + "&model=" + model, "POST")
        .then(function (started) {
          if (run !== job.run) { helperJson("/speech/cancel?id=" + encodeURIComponent(started.id), "POST").catch(function () {}); return null; }
          job.id = started.id;
          return waitJob(run, title);
        });
    }

    function waitJob(run, title) {
      return helperJson("/speech/job?id=" + encodeURIComponent(job.id)).then(function (j) {
        if (run !== job.run) return null;
        if (j.state === "error") throw new Error(j.message || "The clip could not be listened to.");
        if (j.state !== "done") {
          setProgress(j.state === "preparing" || j.state === "queued" ? "Getting the audio" : j.state === "checking" ? "Checking unclear words" : "Listening", j.percent);
          return new Promise(function (resolve, reject) { poll(function () { waitJob(run, title).then(resolve, reject); }, 400); });
        }
        var cues = groupWords(j.words || [], function (t) { return subs.sourceToTimeline(t); }, prefs.length, j.alternatives);
        endJob();
        var rowId = cues.length ? subs.addRow(title, cues) : "";
        if (!rowId) {
          o.notify("No speech was found in this part of the clip.", "info");
          return null;
        }
        // the new subtitles come in selected, the first one shown, so their style can be set for all of them at once
        var made = subs.list().filter(function (c) { return c.row === rowId; });
        if (made.length) { subs.select(made[0].id); subs.pickRow(rowId); }
        var unsure = cues.filter(function (c) { return c.unsure; }).length;
        var check = unsure === 1 ? " One might be misheard. It is marked in orange; select it and open Check on the right." : unsure > 1 ? " " + unsure + " might be misheard. They are marked in orange; select them and open Check on the right." : "";
        o.notify(cues.length + " subtitles added in a new row. Undo takes them back." + check + (j.warning ? " " + j.warning : ""), "info");
        return null;
      });
    }

    // the voiceover. recording runs while the clip plays from the playhead; it stops with the stop button, when the clip stops playing, when it reaches its end or when the editor closes, and the take is placed where the playhead was

    function paintTime(seconds) { els.recTime.textContent = clock(seconds) + " / " + clock(REC_MAX_MIN * 60); }

    function paintWave() {
      var bars = els.wave.children;
      for (var i = 0; i < bars.length; i++) {
        var p = rec.peaks[rec.peaks.length - bars.length + i] || 0;
        bars[i].style.height = Math.max(4, Math.min(36, Math.sqrt(p) * 60)) + "px";
      }
      els.wave.classList.toggle("is-live", rec.on);
    }

    function paintRecord() {
      els.recBtn.classList.toggle("is-on", rec.on);
      els.recBtn.setAttribute("aria-label", rec.on ? "Stop recording" : "Start recording");
      els.recBtn.disabled = rec.starting || !lanes.importState().ready && !rec.on;
      els.recLabel.textContent = rec.on ? "Stop Recording" : "Start Recording";
      els.recHint.textContent = rec.on ? "Recording..." : "Record your voice";
      var t = els.rail.querySelector('[data-tab="record"]');
      if (t) t.classList.toggle("is-recording", rec.on);
    }

    function startRecording() {
      if (rec.on || rec.starting || !clip) return;
      if (!lanes.importState().ready) { o.notify("Audio cannot be added to this clip.", "bad", "Record"); return; }
      rec.starting = true;
      paintRecord();
      var device = els.mic.value();
      helperJson("/voiceover/start" + (device ? "?device=" + encodeURIComponent(device) : ""), "POST").then(function () {
        rec.starting = false;
        if (!clip) { helperJson("/voiceover/stop?keep=0", "POST").catch(function () {}); paintRecord(); return; }
        rec.on = true;
        rec.idle = 0;
        rec.peaks = [];
        rec.t0 = performance.now();
        rec.lag = 0;
        rec.startT = subs.now();
        if (!prefs.hear) o.setQuiet(true);
        var startedAt = performance.now();
        o.play();
        // the microphone was already running when playback was asked for, so the time until the picture moves is cut from the front of the take
        o.video.addEventListener("playing", function once() {
          o.video.removeEventListener("playing", once);
          rec.lag = (performance.now() - startedAt) / 1000;
        });
        paintRecord();
        meterLoop();
      }).catch(function (err) {
        rec.starting = false;
        paintRecord();
        o.notify((err && err.message) || "The microphone could not be started.", "bad", "Record");
      });
    }

    function meterLoop() {
      if (!rec.on) return;
      helperJson("/voiceover/level").then(function (l) {
        if (!rec.on) return;
        paintTime(l.seconds || 0);
        rec.peaks.push(l.peak || 0);
        if (rec.peaks.length > WAVE_BARS) rec.peaks.shift();
        paintWave();
        if (!l.running) { stopRecording(true); return; }
        // the clip stopping (the end of the cut, a pause) is the end of the take
        rec.idle = o.isPlaying() ? 0 : rec.idle + 1;
        if (rec.idle >= 3) { stopRecording(true); return; }
        rec.timer = setTimeout(meterLoop, 120);
      }).catch(function () { if (rec.on) rec.timer = setTimeout(meterLoop, 300); });
    }

    function stopRecording(keep) {
      if (!rec.on) return;
      rec.on = false;
      clearTimeout(rec.timer);
      if (o.isPlaying()) o.pause();
      o.setQuiet(false);
      rec.peaks = [];
      paintWave();
      paintTime(0);
      paintRecord();
      var at = Math.max(0, rec.startT - rec.lag);
      helperJson("/voiceover/stop?keep=" + (keep && clip ? "1" : "0"), "POST").then(function (r) {
        if (!r.kept || !clip) return;
        return lanes.placeImportAt(r.import.id, at);
      }).catch(function (err) {
        o.notify((err && err.message) || "The recording could not be added.", "bad", "Record");
      });
    }

    // the default is the microphone of the settings with its whole chain; any other one is recorded as it comes in
    function loadMics() {
      helperJson("/settings").then(function (d) {
        var id = d.settings && d.settings.micDeviceId;
        return helperJson("/mic/devices").then(function (m) {
          var devices = m.devices || [];
          var hit = devices.find(function (x) { return x.value === id; });
          var name = hit ? (hit.value === "default" && hit.blurb ? hit.blurb : hit.label) : "";
          var list = [["", "Settings microphone", "", (name ? name + ". " : "") + "Uses Settings > Audio processing."]];
          devices.forEach(function (x) {
            list.push([x.value, x.value === "default" ? "Windows default" : x.label, "", (x.blurb || x.label) + ". Records this device directly."]);
          });
          els.mic.setOptions(list, prefs.mic);
        });
      }).catch(function () {
        els.mic.setOptions([["", "Settings microphone", "", "Uses noise suppression and input sensitivity from Settings > Audio."]], "");
      });
    }

    // the host tells when a clip is opened and closed
    function prepare() {
      if (!built) { build(); built = true; }
    }

    function opened(info) {
      prepare();
      clip = info;
      // everything the clip hears is the default; a clip with tracks of its own can be listened to one track at a time, which helps when the game drowns out the voice
      var tracks = (info.tracks || []).map(function (t) { return [String(t.index), t.label]; });
      els.listen.setOptions([["0", "All audio"]].concat(tracks), "0");
      els.listenRow.hidden = tracks.length < 2;
      lastTrack = null;
      loadMics();
      refresh();
      paintRecord();
    }

    function closed() {
      if (!built) return;
      if (els.lib && !els.lib.veil.hidden) closeLibrary();
      if (rec.on) stopRecording(false);
      if (job.busy) cancelJob();
      closeCombos();
      clip = null;
      prefs.open = false;
      view = "home";
      elView = "home";
      if (els.shapeColor) setShapeColor("#ffffff");
      else prefs.shapeColor = "#ffffff";
      paintTabs();
      refresh();
    }

    return { prepare: prepare, refresh: refresh, opened: opened, closed: closed, recording: function () { return rec.on || rec.starting; } };
  }

  // keeps the overlay of the subtitles on the picture of the video: the element letterboxes the video, so the overlay takes the box the picture is drawn in and its height sets the size of the text; a host that cuts the picture to a frame of its own says where that frame is with box
  function trackPicture(video, overlay, box) {
    function place() {
      var r = box ? box() : null;
      if (!r) {
        var w = video.clientWidth, h = video.clientHeight;
        var vw = video.videoWidth || 16, vh = video.videoHeight || 9;
        var scale = Math.min(w / vw, h / vh);
        r = { left: video.offsetLeft + (w - vw * scale) / 2, top: video.offsetTop + (h - vh * scale) / 2, width: vw * scale, height: vh * scale };
      }
      overlay.style.left = r.left + "px";
      overlay.style.top = r.top + "px";
      overlay.style.width = r.width + "px";
      overlay.style.height = r.height + "px";
      overlay.style.setProperty("--sub-h", r.height + "px");
    }
    video.addEventListener("loadedmetadata", place);
    if (window.ResizeObserver) new ResizeObserver(place).observe(video);
    window.addEventListener("resize", place, { signal: EDITOR_SIGNAL });
    place();
    return place;
  }

  window.RKEditorTools = { create: create, trackPicture: trackPicture, groupWords: groupWords, layoutText: layoutText };
})();
</script>
