<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit Account</title>
<style>
  /* fallbacks only -- the helper injects the real theme tokens above this block */
  :root {
    --window:#1D1F26;
    --panel:#272A33;
    --grey3:#464B59;
    --grey5:#2F323C;
    --grey6:#272A33;
    --line2:#5B6273;
    --primary:#284CB8;
    --primary_light:#476BD7;
    --text:#ffffff;
    --text_muted:#969696;
    --red:#e33b57;
    --green:#3BA55D;
    --on-accent:#ffffff;
    --button_bg_hover:#464B59;
    --text-rgb:255, 255, 255;
    --font:"Segoe UI",system-ui,sans-serif;
    --ease_smooth:cubic-bezier(.16, 1, .3, 1);
    --ease_pop:cubic-bezier(.2, .7, .3, 1);
    --anim_press:130ms;
    --tab-width:40px;
  }
  * { box-sizing:border-box; }
  html,body {
    width:100%; height:100%; margin:0; overflow:hidden;
    background:transparent; color:var(--text); font:13px var(--font);
    user-select:none; -webkit-user-select:none;
  }
  button { font:inherit; color:inherit; }

  /* the whole window is the panel; the circle above it is drawn as the open tab, so the top border is left off under it */
  .panel {
    position:absolute; inset:0;
    background:var(--grey5); border:1px solid var(--grey3);
    border-radius:4px; border-top-right-radius:0;
  }
  /* --tab-width is the width of the circle button, set by the plugin; the strip paints over the top border under it in the header colour, so the tab and the header row read as one shape */
  .panel::after {
    content:""; position:absolute; z-index:3; top:-1px; right:0;
    width:calc(var(--tab-width) - 2px); max-width:calc(100% - 2px); height:1px;
    background:var(--grey6);
  }
  .clip { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; border-radius:3px; border-top-right-radius:0; }
  .clip.is-opening { animation:rk-unroll 190ms var(--ease_smooth); }
  @keyframes rk-unroll { from { clip-path:inset(0 0 100% 0); } to { clip-path:inset(0 0 0 0); } }

  .head { flex:none; height:40px; display:flex; align-items:center; padding:0 14px; background:var(--grey6); border-bottom:1px solid var(--grey3); }
  .head-title { font-size:11px; font-weight:600; letter-spacing:.03em; color:var(--text_muted); text-transform:uppercase; }

  .who { flex:none; display:flex; align-items:center; gap:14px; padding:18px 16px 12px; }
  .av { position:relative; flex:none; width:48px; height:48px; padding:0; border:0; border-radius:50%; overflow:visible; cursor:pointer; }
  .av:disabled { cursor:default; }
  .av:focus-visible { outline:2px solid var(--primary_light); outline-offset:2px; }
  /* a picked picture covers the disc; the status light of a signed in account stays on top of it */
  .av.pic { background:var(--grey6); box-shadow:inset 0 0 0 1px rgba(var(--text-rgb), .16); }
  .av.pic img { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; }
  /* the pencil that says the circle can be clicked, over a dark wash while the pointer is on it */
  .av-edit { position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(0, 0, 0, .5); opacity:0; transition:opacity 120ms linear; }
  .av-edit svg { width:18px; height:18px; fill:#fff; }
  .av:hover:not(:disabled) .av-edit, .av:focus-visible .av-edit { opacity:1; }
  .who-links { display:flex; gap:12px; margin-top:5px; }
  .who-link { padding:0; border:0; background:none; font-size:12px; color:var(--primary_light); cursor:pointer; }
  .who-link:hover { text-decoration:underline; }
  .who-link:disabled { opacity:.5; cursor:default; text-decoration:none; }
  .note.is-error { color:var(--red); }
  /* nobody signed in: a grey see-through disc with the outline of a person in it, head and shoulders well inside the ring */
  .av.anon { background:rgba(var(--text-rgb), .08); box-shadow:inset 0 0 0 1px rgba(var(--text-rgb), .2); overflow:hidden; }
  .av.anon > svg { position:absolute; inset:0; width:100%; height:100%; }
  .av.anon > svg * { fill:none; stroke:rgba(var(--text-rgb), .5); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  /* signed in: the colour of the account with its first letter, and a live status light */
  .av.on { display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:#fff; box-shadow:inset 0 0 0 1px rgba(var(--text-rgb), .16); }
  .av.on::after { content:""; position:absolute; z-index:2; right:-1px; bottom:-1px; width:13px; height:13px; border-radius:50%; background:var(--green); border:2.5px solid var(--grey5); }
  .who-name { font-size:15px; font-weight:700; line-height:1.25; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .who-sub { margin-top:3px; font-size:12px; color:var(--text_muted); }

  .note { flex:none; padding:0 16px 14px; font-size:12px; line-height:1.55; color:var(--text_muted); }
  .note b { color:var(--text); font-weight:600; }
  .busy { flex:none; display:flex; align-items:center; gap:10px; padding:0 16px 14px; font-size:12.5px; color:var(--text); }
  .busy i { flex:none; width:14px; height:14px; border-radius:50%; border:2px solid rgba(var(--text-rgb), .2); border-top-color:var(--primary_light); animation:spin 800ms linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .actions { flex:none; margin-top:auto; display:flex; gap:8px; padding:14px 16px 16px; border-top:1px solid var(--grey3); }
  .btn {
    flex:1 1 0; min-width:0; height:34px; padding:0 14px; border:1px solid var(--grey3); border-radius:6px; background:var(--window);
    font-size:12.5px; font-weight:600; cursor:pointer;
    transition:border-color 90ms linear, background-color 90ms linear, color 90ms linear;
  }
  .btn:hover { border-color:var(--line2); }
  .btn.is-primary { background:var(--primary); border-color:var(--primary); color:var(--on-accent); }
  .btn.is-primary:hover { background:var(--primary_light); border-color:var(--primary_light); }
  .btn.is-danger { border-color:var(--red); color:var(--red); background:transparent; }
  .btn.is-danger:hover { background:rgba(227, 59, 87, .14); }
  .btn:disabled { opacity:.5; cursor:default; }
  [hidden] { display:none !important; }
</style>
<!--#include theme-preview-->
</head>
<body>
<div class="panel">
  <div class="clip is-opening" id="clip">
    <div class="head"><span class="head-title">Streamable account</span></div>

    <div class="who">
      <button class="av anon" id="avatar" type="button" aria-label="Change picture"></button>
      <div style="min-width:0">
        <div class="who-name" id="name">Anonymous</div>
        <div class="who-sub" id="sub">Not signed in</div>
        <div class="who-links">
          <button class="who-link" type="button" id="changePicture">Change picture</button>
          <button class="who-link" type="button" id="removePicture" hidden>Remove</button>
        </div>
      </div>
    </div>

    <p class="note" id="note"></p>
    <div class="busy" id="busy" hidden><i></i><span id="busyText">Opening Streamable...</span></div>

    <div class="actions">
      <button class="btn is-primary" type="button" id="signIn">Sign in to Streamable</button>
      <button class="btn" type="button" id="cancel" hidden>Cancel</button>
      <button class="btn" type="button" id="open" hidden>Open Streamable</button>
      <button class="btn is-danger" type="button" id="signOut" hidden>Sign out</button>
    </div>
  </div>
</div>
<script>
  (function lockdown() {
    document.addEventListener("contextmenu", (e) => e.preventDefault(), true);
    document.addEventListener("wheel", (e) => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive:false, capture:true });
  })();

  const HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";
  const $ = (id) => document.getElementById(id);
  const els = {
    clip:$("clip"), avatar:$("avatar"), name:$("name"), sub:$("sub"), note:$("note"), busy:$("busy"), busyText:$("busyText"),
    signIn:$("signIn"), cancel:$("cancel"), open:$("open"), signOut:$("signOut"), changePicture:$("changePicture"), removePicture:$("removePicture"),
  };
  const EDIT_SVG = (window.RK_ICONS && window.RK_ICONS["action/edit"]) || "";
  const ANON_SVG = '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="16.2" r="6.1"/><path d="M12.7 37.1V32.7Q12.7 27.9 17.5 27.9H30.5Q35.3 27.9 35.3 32.7V37.1"/></svg>';
  const LOGIN_POLL_MS = 500;
  const LOGIN_TIMEOUT_MS = 120000;
  let auth = { signedIn:false, name:"", plan:"", retentionDays:2 };
  // the version of the picked picture, empty for none; the picker blocks the request until it closes, so a second one is not opened meanwhile
  const picture = { version:"", picking:false, error:"" };
  const flow = { active:false, poll:0, timeout:0 };

  async function helperJson(path, options) {
    const res = await fetch(HELPER + path, { cache:"no-store", ...(options || {}) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) throw new Error(body.message || ("HTTP " + res.status));
    return body;
  }

  // one colour per name, the same the circle in the title bar computes, so the two always agree
  function hueOf(name) {
    let hash = 2166136261;
    for (const ch of String(name).toLowerCase()) hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619) >>> 0;
    return hash % 360;
  }

  function initialOf(name) {
    const match = String(name).match(/[A-Za-z0-9]/);
    return match ? match[0].toUpperCase() : "S";
  }

  function planLabel(plan) { return plan ? plan.charAt(0).toUpperCase() + plan.slice(1) : "Free"; }

  function render(busyText) {
    const on = auth.signedIn;
    els.avatar.className = "av " + (on ? "on" : "anon") + (picture.version ? " pic" : "");
    if (picture.version) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = HELPER + "/profile-picture?v=" + encodeURIComponent(picture.version);
      els.avatar.replaceChildren(img);
      els.avatar.style.background = "";
    } else if (on) {
      const hue = hueOf(auth.name);
      els.avatar.textContent = initialOf(auth.name);
      els.avatar.style.background = "linear-gradient(135deg, hsl(" + hue + " 54% 50%), hsl(" + hue + " 52% 36%))";
    } else {
      els.avatar.innerHTML = ANON_SVG;
      els.avatar.style.background = "";
    }
    if (EDIT_SVG) els.avatar.insertAdjacentHTML("beforeend", '<span class="av-edit" aria-hidden="true">' + EDIT_SVG + "</span>");
    els.avatar.disabled = picture.picking;
    els.changePicture.disabled = picture.picking;
    els.removePicture.disabled = picture.picking;
    els.removePicture.hidden = !picture.version;
    els.name.textContent = on ? (auth.name || "Signed in") : "Anonymous";
    els.sub.textContent = on ? planLabel(auth.plan) + " plan" : "Not signed in";
    els.note.innerHTML = on
      ? "Uploads go to your Streamable account and are kept for <b>" + auth.retentionDays + " days</b>."
      : "Clips you share upload without an account and stay up for <b>" + auth.retentionDays + " days</b>. Sign in to use your own Streamable account.";
    const working = !!busyText;
    els.busy.hidden = !working;
    if (working) els.busyText.textContent = busyText;
    els.note.hidden = working;
    els.note.classList.toggle("is-error", !!picture.error);
    if (picture.error) els.note.textContent = picture.error;
    els.signIn.hidden = on || working;
    els.cancel.hidden = !working;
    els.open.hidden = !on || working;
    els.signOut.hidden = !on || working;
  }

  function apply(data) {
    auth = {
      signedIn: !!data.signedIn,
      name: data.maskedUsername || data.username || data.displayName || "",
      plan: data.plan || "",
      retentionDays: Number(data.retentionDays) || 2,
    };
    picture.version = typeof data.picture === "string" ? data.picture : "";
    render();
  }

  async function changePicture(remove) {
    if (picture.picking) return;
    picture.picking = true;
    picture.error = "";
    render(flow.active ? "Sign in in the Streamable window..." : "");
    try {
      const data = await helperJson("/profile-picture/" + (remove ? "clear" : "pick"), { method:"POST" });
      picture.version = typeof data.picture === "string" ? data.picture : "";
    } catch (e) {
      picture.error = e.message || "That file could not be used as a picture.";
    }
    picture.picking = false;
    render(flow.active ? "Sign in in the Streamable window..." : "");
  }

  async function readAccount() {
    try { apply(await helperJson("/me?t=" + Date.now())); } catch (_) { /* helper offline, the menu keeps what it shows */ }
  }

  function stopFlow() {
    clearInterval(flow.poll);
    clearTimeout(flow.timeout);
    flow.poll = 0;
    flow.timeout = 0;
    if (!flow.active) return;
    flow.active = false;
    // any sign-in window still open (ours or one streamable spawned) is closed from the helper side, which js cannot do across origins
    fetch(HELPER + "/close-signin-windows", { method:"POST", cache:"no-store" }).catch(() => {});
    render();
  }

  // one poller drives the whole flow: the first call opens the window and every later one only reads its state, so a status read can never race ahead of the open and be mistaken for a window closed without signing in
  function startSignIn() {
    if (flow.active) return;
    flow.active = true;
    let sawWindow = false;
    render("Opening Streamable...");
    async function poll(first) {
      if (!flow.active) return;
      let res, data;
      try {
        res = await fetch(HELPER + "/import-session?source=owned" + (first ? "&start=1" : ""), { method:"POST", cache:"no-store" });
        data = await res.json().catch(() => ({}));
      } catch (_) { return; }
      if (!flow.active || !res.ok) return;
      if (data.signedIn) { apply(data); stopFlow(); render(); return; }
      if (data.pending === true) { sawWindow = true; render("Sign in in the Streamable window..."); return; }
      if (sawWindow) { stopFlow(); return; }
      render("Opening Streamable...");
    }
    poll(true);
    flow.poll = setInterval(() => poll(false), LOGIN_POLL_MS);
    flow.timeout = setTimeout(stopFlow, LOGIN_TIMEOUT_MS);
  }

  els.signIn.addEventListener("click", startSignIn);
  els.avatar.addEventListener("click", () => changePicture(false));
  els.changePicture.addEventListener("click", () => changePicture(false));
  els.removePicture.addEventListener("click", () => changePicture(true));
  els.cancel.addEventListener("click", stopFlow);
  els.open.addEventListener("click", () => {
    fetch(HELPER + "/open-url?url=" + encodeURIComponent("https://streamable.com/"), { cache:"no-store" }).catch(() => {});
  });
  els.signOut.addEventListener("click", () => {
    auth = { signedIn:false, name:"", plan:"", retentionDays:2 };
    render();
    fetch(HELPER + "/logout", { method:"POST", cache:"no-store" }).then(() => readAccount()).catch(() => {});
  });

  // the window is reused, so the plugin calls this on every open: read the account again and replay the unroll
  window.__replaykitShowAccount = function () {
    els.clip.classList.remove("is-opening");
    void els.clip.offsetWidth;
    els.clip.classList.add("is-opening");
    picture.error = "";
    render(flow.active ? "Sign in in the Streamable window..." : "");
    readAccount();
  };

  render();
  readAccount();
</script>
</body>
</html>
