<script>

    "no-visible-capture": "no capture source was showing in the scene",
    "capture-not-live": "the capture source had no picture",
    "capture-target-not-focused": "the captured window was not the one in focus",

    async function load() {

      const query = search.value.trim();
      const needle = query.toLocaleLowerCase();
      try {
        if (!owned) {
          status.textContent = "Loading games…";
          const response = await fetch(helper + "/games/library", {cache:"no-store"});
          const data = await response.json();
