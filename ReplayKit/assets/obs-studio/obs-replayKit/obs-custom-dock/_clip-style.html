  }
  .menu-item:hover { background: var(--button_bg_hover); }
  .menu-item.is-disabled { opacity: .5; cursor: default; pointer-events: none; }
  /* the share group (Create Link, Copy to clipboard) carries the blue accent on its icons only, the row text stays white like every other row */
  .menu-item.share-menu-item .menu-item-icon { color: var(--link_accent); }
  .menu-item.share-menu-item:hover { background: rgba(var(--accent-rgb), .13); }
  .menu-item.favorite-menu-item.is-favorite .menu-item-icon { color: var(--amber); }
  .menu-separator {
    height: 1px;
    margin: 4px 0;
    background: var(--grey4);
  }
  .menu-item.delete-menu-item { color: var(--red); }
  .menu-item.delete-menu-item:hover { background: rgba(227, 59, 87, 0.16); color: var(--red); }
  .menu-item.delete-menu-item.is-armed,
  .menu-item.delete-menu-item.is-armed:hover { background: var(--red); color: var(--text); }

  /* link icon inside action buttons */
  .btn .btn-icon {
    width: 14px;
    height: 14px;
    margin-right: 6px;
    fill: currentColor;
    flex-shrink: 0;
  }
  .body {
    padding: 8px 10px 6px;
    min-width: 0;
  }
  .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta {
    font-size: 11px;
    color: var(--text_muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    min-width: 0;
    overflow: hidden;
  }
  .meta .dot {
    width: 3px;
    height: 3px;
    background: var(--text_muted);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .meta .size,
  .meta .age,
  .meta .dot {
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .meta .link-status {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--green);
  }
  .meta .link-status.is-expiring { color: var(--amber); }
  .actions {
    min-height: 40px;
    padding: 0 10px;
    display: flex;
    gap: 6px;
    background: var(--grey4);
    border-top: 0;
    border-radius: 0 0 5px 5px;
  }
  .actions .action-link-btn {
    flex: 0 0 auto;
    justify-content: flex-start;
    height: 40px;
    padding: 0 2px;
    border-color: transparent;
    background: transparent;
  }
  .actions .action-link-btn:hover,
  .actions .action-link-btn.is-flashing {
    background: transparent;
    border-color: transparent;
    color: var(--link_accent);
  }
  .actions .action-link-btn,
  .actions .action-link-btn:hover,
  .actions .action-link-btn:active {
    transform: none !important;
    scale: 1 !important;
    transition: color 80ms linear;
  }
  .actions.is-progress {
    padding: 0;
    background: var(--grey4);
  }
  /* the dotted corner of a card, the one the corner of the window has: dragging it makes every card bigger or smaller together. quiet until the pointer is on the card, and gone in the home view, in theater mode and in fullscreen */
  .card-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 3;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 1px 1px 0;
    cursor: nwse-resize;
    color: var(--text);
    opacity: .4;
    touch-action: none;
    transition: opacity 120ms linear;
    /* only the lower right half of its box, where the dots are, answers the pointer: the X of an upload bar or of a failed link sits right beside it and keeps its whole box */
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
  .card:hover .card-resize { opacity: .65; }
  .card .card-resize:hover { opacity: 1; }
  /* a clip that was only just saved has no picture yet: its card says it is being processed in place of the grey tile, and the player stays out of reach until the picture is there */
  .processing-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--grey8);
    color: var(--text_muted);
    font-size: 12px;
    border-radius: 5px 5px 0 0;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 200ms linear, visibility 0s linear 200ms;
  }
  .rk-home .processing-overlay { border-radius: 10px; }
  .card.is-processing .processing-overlay { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 120ms linear; }
  .processing-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(var(--text-rgb), .16);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: clip-sort-spin .8s linear infinite;
  }
  .card.is-processing .preview { cursor: default; }
  .card.is-processing .play-overlay, .card.is-processing .player-shade, .card.is-processing .preview-controls, .card.is-processing .progress-bar, .card.is-processing .center-pulse, .card.is-processing .duration-badge { display: none !important; }
  .card-resize svg { width: 14px; height: 14px; fill: currentColor; display: block; pointer-events: none; }
  .rk-home .card-resize, .card.is-theater-card .card-resize { display: none; }
  /* while a drag of the corner runs the cursor stays the corner cursor wherever the pointer is, nothing under it reacts, and the cards do not play their hover motion as the rows move */
  html.is-card-resizing, html.is-card-resizing * { cursor: nwse-resize !important; user-select: none !important; }
  html.is-card-resizing .card { pointer-events: none; transition: none !important; translate: 0 0 !important; }
  /* a chosen size is the same for every list: columns of that width, left aligned, and the room that is left stays empty */
  html.rk-card-sized .grid { grid-template-columns: repeat(auto-fill, min(var(--rk-card-w), 100%)); justify-content: start; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: var(--button_bg);
    color: var(--text);
    border: 1px solid var(--button_border);
    border-radius: var(--border_radius);
    height: 30px;
    padding: 0 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    white-space: nowrap;
    transition: background-color 60ms linear, border-color 60ms linear;
    user-select: none;
    flex: 1;
  }
  .btn:hover {
    background-color: var(--button_bg_hover);
    border-color: var(--button_border_hover);
  }
  .btn:active { background-color: var(--button_bg_down); }
  /* :disabled blocks pointer events natively; .is-busy is used by the "uploading x% - cancel" button which must remain clickable so the user can cancel. buttons that should be fully locked also set the `disabled` attribute, so this split is safe. */
  .btn:disabled {
    opacity: 0.6;
    cursor: progress;
    pointer-events: none;
  }
  .actions .action-link-btn.is-blocked {
    opacity: .55;
    cursor: not-allowed;
    pointer-events: auto;
  }
  .btn.is-busy {
    opacity: 0.6;
    cursor: progress;
  }
  .btn.is-flashing,
  .btn.primary {
    background-color: var(--primary);
    border-color: var(--primary_light);
    color: var(--on-accent);
  }
  .btn.primary:hover { background-color: var(--primary_light); }
  /* in-card progress readout shown during compress / upload. its a plain div, not a button -- only the trailing X (.progress-cancel) is clickable, so the bar no longer swallows clicks or flips the whole control to a red Cancel the instant the pointer touches it. a real .progress-fill child holds the blue fill, kept out of pointer-events so the X stays hittable. no text -- the bar itself is the readout. */
  .btn.is-progress {
    position: relative;
    overflow: hidden;
    min-width: 0;
    height: 38px;
    padding: 0 30px 0 12px;
    background-color: transparent;
    border-color: transparent;
    border-radius: 0 0 5px 5px;
    cursor: default;
  }
  /* the div still matches .btn:hover/.btn:active -- pin the resting look so hovering the bar doesnt shift it. */
  .btn.is-progress:hover,
  .btn.is-progress:active {
    background-color: transparent;
    border-color: transparent;
  }
  .btn.is-progress .progress-track {
    position: absolute;
    left: 12px;
    right: 34px;
    top: 50%;
    height: 6px;
    transform: translateY(-50%);
    border-radius: 3px;
    background: var(--grey3);
    overflow: hidden;
  }
  /* width is driven frame-by-frame from updateDisplayProgress -- no css width transition, it only fought the raf and added ~600ms of lag. */
  .btn.is-progress .progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--link_accent);
    border-radius: inherit;
    transition: background-color 60ms linear;
    pointer-events: none;
    z-index: 0;
  }
  /* finalizing: bytes are all sent; the bar holds at 99 while the quick transcode-trigger call finishes. a faint sheen keeps it from reading as stalled -- no text, no jump to 100. */
  .btn.is-progress.is-finalizing .progress-fill {
    background-image: linear-gradient(100deg, transparent 20%, rgba(var(--on-accent-rgb), .22) 50%, transparent 80%);
    background-size: 220% 100%;
    animation: progress-sheen 1s linear infinite;
  }
  @keyframes progress-sheen { from { background-position: 140% 0; } to { background-position: -60% 0; } }
  /* streamable transcode readout -- same bar mechanism as upload but amber, full-width (no cancel X, you cant cancel a server-side transcode), and the link stays uncopyable until it finishes. */
  .btn.is-progress.is-transcode { padding: 0 12px; }
  .btn.is-progress.is-transcode .progress-track { right: 12px; }
  .btn.is-progress.is-transcode .progress-fill { background: var(--amber); }
  .btn.is-progress > .btn-icon,
  .btn.is-progress > .btn-label {
    display: none;
  }
  /* The cancel target keeps a comfortable hit area while only its close icon is visible. */
  .btn.is-progress > .progress-cancel {
    position: absolute;
    right: 8px;
    top: 50%;
    /* above the resize corner (3) for the few pixels where the two boxes still touch */
    z-index: 4;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transform: translateY(-50%);
    transition: color 80ms ease-out;
  }
  .btn.is-progress > .progress-cancel:hover { background: transparent; color: var(--red); }
  .btn.is-progress > .progress-cancel svg { width: 10px; height: 10px; fill: currentColor; }
  /* "remove link" X on a failed upload -- same treatment as the upload bar cancel X, pushed to the right end of the action row. */
  .actions .link-remove-btn {
    position: relative;
    z-index: 4;
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text_muted);
    cursor: pointer;
    transition: color 80ms ease-out;
  }
  .actions .link-remove-btn:hover { background: transparent; color: var(--red); }
  .actions .link-remove-btn svg { width: 10px; height: 10px; fill: currentColor; }
  .toast {
    position: fixed;
    right: 14px;
    bottom: 14px;
    background: var(--grey6);
    color: var(--red);
    border: 1px solid var(--red);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    max-width: 380px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    z-index: 60;
    display: none;
  }
  .toast.is-shown { display: block; }
  .toast.is-info  { color: var(--text); border-color: var(--grey4-solid,var(--grey4)); }
  /* an error is told in a popup over everything, the editor included, shaped like the confirm sheet the obs window draws; it waits until it is read */
  /* with the veil class named too, or the 40 of .modal-veil further down wins and the popup would only sit over the editor by its place in the page */
  .modal-veil.popup-veil { z-index: 80; }
  .popup-card { width: min(400px, calc(100vw - 48px)); min-width: min(330px, calc(100vw - 48px)); padding: 18px 20px 16px; border-radius: 6px; }
  .popup-head { display: flex; align-items: flex-start; gap: 10px; }
  .popup-head svg { width: 18px; height: 18px; flex: 0 0 auto; margin-top: 1px; fill: var(--red); }
  .popup-card h2 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .popup-body { margin-top: 8px; font-size: 13px; line-height: 1.5; max-height: 42vh; overflow: auto; overflow-wrap: anywhere; white-space: pre-line; user-select: text; }
  .popup-body[hidden] { display: none; }
  .popup-card .row { margin-top: 16px; }
  .popup-card .row .btn { min-width: 84px; }

  /* the save popup: the editor is locked behind it while the copy or the new original is written, and it follows the encode of the helper. it sits over the editor and the toast and under an error popup */
  #save-veil { z-index: 70; }
  /* a save that is over in a moment never shows the card: the page is locked at once, and the card only comes up when the wait is long enough to notice */
  #save-veil.is-quiet { background: transparent; animation: none; }
  #save-veil.is-quiet .save-modal { visibility: hidden; animation: none; }
  .save-modal { width: 380px; max-width: calc(100vw - 48px); }
  .save-modal [hidden] { display: none; }
  .save-modal .clip-name { margin: 2px 0 14px; font-size: 12px; color: var(--text_muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save-track { position: relative; height: 6px; border-radius: 3px; background: var(--grey3); overflow: hidden; }
  .save-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: var(--link_accent); transition: width 300ms linear; }
  /* until the helper reports a position the bar slides instead of sitting empty */
  .save-track.is-waiting .save-fill { width: 34%; transition: none; animation: save-slide 1.15s ease-in-out infinite; }
  @keyframes save-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .save-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
  .save-percent { color: var(--text_muted); }
  .save-note { margin-top: 10px; }
  /* the quiet line in the editor bar that says the edit is being kept as a draft */
  .trim-draft-note { margin-left: 10px; font-size: 11px; font-weight: 400; color: var(--text_muted); opacity: 0; transition: opacity 240ms linear; pointer-events: none; }
  .trim-draft-note.is-shown { opacity: .85; }
  .meta .link-status.is-draft { color: var(--text_muted); }

  /* "compress this clip" modal */
  .modal-veil {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-veil.is-open { display: flex; }
  .modal {
    width: 360px;
    background: var(--grey6);
    border: 1px solid var(--grey4-solid,var(--grey4));
    border-radius: 8px;
    padding: 18px 18px 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .modal h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .modal .body { color: var(--text_muted); font-size: 12.5px; line-height: 1.5; }
  .modal .body code {
    background: var(--grey8);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11.5px;
  }
  .modal .row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
  .modal .row .btn { flex: 0 0 auto; }

  /* trim modal */
  /* width fills as much of the clips window (850-2400px, per the resize bounds in 71_routes.ps1) as it can without letting the 16:9 video wrap push the modal taller than the window -- bounded by whichever of window width or the height-derived-from-16:9 is tighter. floor matches the old fixed width so the window minimum looks unchanged. */
  /* the editor is a page of its own inside the clips view: a top bar, the video with a side panel, and the timeline along the bottom, covering the whole view until cancel hands the clips back */
  #trim-veil {
    --ed-panel: color-mix(in srgb, var(--grey6) 45%, var(--grey7));
    background: var(--grey7);
    align-items: stretch;
    justify-content: stretch;
    -webkit-user-select: none;
    user-select: none;
  }
  /* nothing of the editor highlights on a drag, apart from what is typed */
  #trim-veil input, #trim-veil textarea { -webkit-user-select: text; user-select: text; }
  /* the wide buttons of the editor grow and give only a little, a full-width button that scales like a small one jumps */
  #trim-veil .editor-top .btn, .ed-tools .btn:not(.tl-mini), .ed-sub-edit .btn:not(.tl-mini), .ed-fx-card .btn { --hover_grow: 1.01; --press_shrink: .99; }
  /* the layout is there, unseen, while the clip loads, so the timeline is built at the size it will be shown at */
  #trim-veil.is-measuring { display: flex; visibility: hidden; }
  #trim-veil.is-open .modal { animation: none; }
  .trim-modal {
    /* every track of the timeline, the video row and the audio rows alike, is this tall */
    --tl-track-h: 40px;
    --trim-strip-h: var(--tl-track-h);
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: var(--grey7);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }
  /* the bar over the editor is the bar over the clips and the projector: the window colour with a hairline under it, and as tall as the tab bar (51px, the hairline included) */
  .editor-top {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 51px;
    padding: 0 14px;
    background: var(--bg_window);
    border-bottom: 1px solid var(--grey4-solid, var(--grey4));
  }
  .editor-cancel { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .editor-cancel svg { width: 14px; height: 14px; display: block; }
  .editor-title { flex: 1 1 auto; min-width: 0; }
  .trim-modal .editor-top .trim-heading { margin: 0; justify-content: flex-start; }
  .trim-modal .editor-top .clip-name { margin: 2px 0 0; }
  .editor-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  /* the tools on the left and the panel on the right stand against the edges of the window, square, the panels a half step lighter than the page and running into the toolbar of the timeline under them, with a hairline toward the video, like the bar over them; the timeline below needs no line, its drag handle sets it apart */
  .editor-body {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) clamp(260px, 26vw, 340px) auto;
    min-height: 0;
  }
  .editor-stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px; }
  .editor-stage .trim-video-wrap { flex: 1 1 auto; min-height: 0; aspect-ratio: auto; border-radius: 4px; }
  /* the preview is only the picture while editing: its controls live in the toolbar, and they come back over the video in fullscreen */
  #trim-veil .trim-video-wrap:not(:fullscreen) .player-shade,
  #trim-veil .trim-video-wrap:not(:fullscreen) .trim-preview-controls,
  #trim-veil .trim-video-wrap:not(:fullscreen) .trim-seek-overlay { display: none; }
  .tl-toolbar .trim-volume-control { position: static; opacity: 1; }
  /* the volume in the toolbar is always open, its slider showing */
  .tl-toolbar .volume-control { width: 124px; background: transparent; }
  .tl-toolbar .volume-control:hover { width: 124px; background: rgba(var(--text-rgb), .08); }
  .tl-toolbar .volume-slider-wrap { opacity: 1; }
  .tl-toolbar .volume-btn { color: var(--text); }
  .tl-toolbar .icon-btn { width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .tl-toolbar .icon-btn:hover { background: rgba(var(--text-rgb), .08); }
  .tl-toolbar .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .editor-side {
    min-width: 0;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 14px 14px;
    background: var(--ed-panel);
    border-left: 1px solid var(--grey4-solid, var(--grey4));
  }
  .editor-side::-webkit-scrollbar { display: none; }
  /* the panel slides out to the right when what was selected is let go, the way the tools panel slides out to the left, holding a still copy of the card that went for the length of the slide */
  #trim-veil .editor-side.is-closing { animation: ed-side-out 140ms ease-in both; pointer-events: none; }
  #trim-veil .editor-side > .editor-card.ed-side-ghost { animation: none; }
  @keyframes ed-side-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(10px); } }
  /* the right panel is only there while something is selected, and the video takes its room otherwise; the bar of its tabs stays */
  .editor-body:not(:has(.editor-side > :not([hidden]))) { grid-template-columns: auto minmax(0, 1fr) auto; }
  .editor-side:not(:has(> :not([hidden]))) { display: none; }
  .editor-card { flex: 0 0 auto; padding: 0; border: 0; background: transparent; }
  .editor-card-title { display: flex; align-items: center; height: 38px; font-size: 13px; font-weight: 700; color: var(--text); margin: 0; }
  .editor-card .trim-mode-row { margin: 0; border-top: 1px solid var(--hairline); }
  .editor-card .editor-card-title + .trim-mode-row { border-top: 0; }
