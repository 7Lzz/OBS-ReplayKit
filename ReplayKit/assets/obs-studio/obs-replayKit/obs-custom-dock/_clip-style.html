<style>
  :root {
    --border_radius: 4px;
    --font_size: 13px;
    --font_family: "Segoe UI", system-ui, sans-serif;
    --grey1: #5B6273;
    --grey3: #464B59;
    --grey4: #3C404D;
    --grey5: #2F323C;
    --grey6: #272A33;
    --grey7: #1D1F26;
    --grey8: #13141A;
    --blue2: #476BD7;
    --blue3: #284CB8;
    --green: #37D247;
    --red: #E33B57;
    --amber: #E2A33B;
    --white1: #FFFFFF;
    --white5: #969696;
    --bg_window: var(--grey7);
    --bg_card: var(--grey5);
    --text: var(--white1);
    --text_muted: var(--white5);
    --button_bg: var(--grey4);
    --button_bg_hover: var(--grey3);
    --button_bg_down: var(--grey7);
    --button_border: var(--button_bg-solid,var(--button_bg));
    --button_border_hover: var(--grey1);
    --primary: var(--blue3);
    --primary_light: var(--blue2);
    --link_accent: #4D96EE;
    --on-accent: #ffffff;
    --on-accent-rgb: 255, 255, 255;
    --text-rgb: 255, 255, 255;
    --bg-rgb: 29, 31, 38;
    --accent-rgb: 40, 76, 184;
    --danger-rgb: 227, 59, 87;
    --hairline: rgba(var(--text-rgb),.08);
    --overlay-soft: rgba(var(--text-rgb),.06);
    --overlay-strong: rgba(var(--text-rgb),.14);
    --shadow: rgba(0,0,0,.45);
    --shadow-weak: rgba(0,0,0,.28);
    /* shared motion language. ease_pop is a light overshoot for taps/pops; ease_smooth is a long decelerating ease-out for panels that should glide into place and settle. */
    --ease_pop: cubic-bezier(.2, .7, .3, 1);
    --ease_smooth: cubic-bezier(.16, 1, .3, 1);
    --anim_press: 130ms;
    --anim_menu: 200ms;
    --hover_grow: 1.03;
    --press_shrink: .96;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg_window);
    color: var(--text);
    font-family: var(--font_family);
    font-size: var(--font_size);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  .tabs {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    background: var(--bg_window);
    border-bottom: 1px solid var(--grey4-solid,var(--grey4));
    overflow: visible;
  }
  .tab-group,
  .tab-actions {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }
  /* the filters are a bold label with an icon in front, and only the one that is on is filled: the soft wash of the text colour the sidebar rail puts behind its selected icon, with the corner of the clip cards where the rail has a circle. the hover and press scale of a button comes from the shared control profile (CLIP_HOVER_PROFILES), nothing slides between tabs and the fill just changes */
  .tab-group {
    position: relative;
    gap: 4px;
    transition: transform 140ms ease;
  }
  body.is-selection-mode .tab-group { transform: translateX(2px); }
  .tab-actions {
    gap: 6px;
    margin-left: auto;
  }
  /* the same three strengths the rail uses: the icon and label at 62% of the text colour at rest and full when hovered or on, the wash behind at 8% on hover, 13% pressed and 16% for the tab that is on */
  .tab {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 30px;
    padding: 0 14px 0 11px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: rgba(var(--text-rgb), .62);
    font: inherit;
    font-size: var(--font_size);
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    /* the shared control profile reads these two; the tabs are wide and sit close together, so they get a gentler grow and press than the other buttons */
    --hover_grow: 1.02;
    --press_shrink: .985;
  }
  .tab:hover {
    background: rgba(var(--text-rgb), .08);
    color: rgb(var(--text-rgb));
  }
  .tab:active { background: rgba(var(--text-rgb), .13); }
  .tab.is-active,
  .tab.is-active:hover,
  .tab.is-active:active {
    background: rgba(var(--text-rgb), .16);
    color: rgb(var(--text-rgb));
  }
  .tab svg { width: 16px; height: 16px; flex: 0 0 auto; fill: currentColor; }
  /* the label and its count are one span so both sit on one baseline; as flex items of their own they were centred by their boxes and the smaller type came out a little higher than the label. the span goes up a pixel because the font puts its letters low in the line box, so the letters meet the centre of the icon */
  .tab-text {
    position: relative;
    top: -1px;
  }
  .tab .count {
    margin-left: 6px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    opacity: .75;
  }
  .clip-sort-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
  }
  /* trigger = sorting glyph + a chevron that flips on open. no "Sort: Newest" text, no resting box -- just the glyph, a faint surface on hover. when the menu is open it takes on the menu's surface and squares its bottom edge so the panel below reads as one connected shape. */
  .clip-sort-trigger {
    height: 32px;
    padding: 0 6px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: background-color 90ms linear, border-color 90ms linear;
  }
  .clip-sort-trigger:hover { background: var(--grey5); }
  .clip-folder-btn { width: 32px; padding: 0; }
  .clip-folder-btn svg { width: 18px; height: 18px; }
  .clip-sort-wrap.is-open .clip-sort-trigger {
    background: var(--grey5);
    border-color: var(--grey3);
    border-bottom-color: transparent;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    color: var(--text);
    transform: none;
    /* sit above the fixed menu (z 10000) so the trigger's border-less bottom overlaps and hides the menu's top border across the trigger's width -- that's what makes the seam disappear. */
    position: relative;
    z-index: 10001;
  }
  .clip-sort-trigger:focus-visible {
    outline: none;
    border-color: var(--primary_light);
  }
  .clip-sort-trigger svg { fill: currentColor; }
  .clip-sort-icon { width: 16px; height: 16px; flex: 0 0 16px; }
  .clip-sort-chevron {
    width: 12px;
    height: 12px;
    flex: 0 0 12px;
    opacity: .65;
    transition: transform var(--anim_menu) var(--ease_smooth);
  }
  .clip-sort-wrap.is-open .clip-sort-chevron { transform: rotate(180deg); }
  .clip-sort-wrap.is-loading .clip-sort-icon,
  .clip-sort-wrap.is-loading .clip-sort-chevron { display: none; }
  .clip-sort-spinner {
    display: none;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(var(--text-rgb),.22);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: clip-sort-spin .8s linear infinite;
  }
  .clip-sort-wrap.is-loading .clip-sort-spinner { display: inline-block; }
  @keyframes clip-sort-spin { to { transform: rotate(360deg); } }
  .clip-search {
    width: 160px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 2px;
    border-bottom: 1px solid var(--grey3);
    color: var(--text_muted);
    transition: border-color 100ms linear, color 100ms linear;
  }
  .clip-search:focus-within { border-bottom-color: var(--primary_light); color: var(--text); }
  .clip-search svg { width: 14px; height: 14px; fill: currentColor; flex: 0 0 14px; }
  .clip-search-input {
    min-width: 0;
    width: 100%;
    border: 0;
    outline: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .clip-search-input::placeholder { color: var(--text_muted); opacity: 1; }
  /* panel surface, border + row hover are copied from .menu-dropdown (the card right-click menu) so the two menus read identically. no shadow. anchored `position:absolute` to .clip-sort-wrap with `right:0` so the layout engine keeps the panel's right edge pixel-flush with the trigger's -- no js placement math to drift sub-pixel. `top:calc(100% - 1px)` laps the trigger's bottom border; the open trigger (z 10001) paints over that overlap so the seam vanishes. */
  .clip-sort-menu {
    position: absolute;
    top: calc(100% - 1px);
    right: 0;
    left: auto;
    min-width: 194px;
    max-height: 320px;
    background: var(--grey5);
    border: 1px solid var(--grey3);
    border-radius: 4px;
    border-top-right-radius: 0;
    padding: 4px 0;
    box-shadow: none;
    overflow-y: auto;
    z-index: 10000;
    /* stays in the dom both ways. closed: clipped to nothing from its top edge + faded + inert. open: the clip window drops open so the panel unrolls out of the trigger. visibility flips only after the close settles so it cant be tabbed or hit while hidden. */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    clip-path: inset(0 0 100% 0);
    transition: opacity 120ms ease, clip-path 190ms var(--ease_smooth), visibility 0s linear 190ms;
  }
  .clip-sort-wrap.is-open .clip-sort-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    clip-path: inset(0 0 0 0);
    transition: opacity 90ms ease, clip-path 190ms var(--ease_smooth);
  }
  .clip-sort-heading {
    padding: 6px 14px 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--text_muted);
    user-select: none;
  }
  /* no per-row stagger -- the panel just glides, same as the card right-click menu. */
  .clip-sort-item {
    width: 100%;
    padding: 7px 14px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    white-space: nowrap;
  }
  .clip-sort-item:hover { background: var(--button_bg_hover); }
  .clip-sort-label { flex: 1 1 auto; }
  /* Selected sorting uses the same theme highlight as the other dropdowns. */
  .clip-sort-item.is-active { background: var(--selected,var(--primary)); color: var(--on-accent); }
  .clip-sort-item.is-active.rk-hover-row:hover { background: var(--selected,var(--primary)); color: var(--on-accent); }
  .clip-sort-check {
    width: 15px;
    height: 15px;
    fill: currentColor;
    flex: 0 0 15px;
    margin-left: auto;
    opacity: 0;
  }
  .clip-sort-item.is-active .clip-sort-check { opacity: 1; }
  /* Length / File size: a row that discloses two sub-options instead of being a sort itself. */
  .clip-sort-caret {
    width: 13px;
    height: 13px;
    fill: currentColor;
    flex: 0 0 13px;
    margin-left: auto;
    opacity: .5;
    transition: transform var(--anim_menu) var(--ease_smooth);
  }
  .clip-sort-grouprow[aria-expanded="true"] .clip-sort-caret { transform: rotate(180deg); }
  .clip-sort-sub {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height var(--anim_menu) var(--ease_smooth), opacity 120ms ease;
  }
  .clip-sort-group.is-expanded .clip-sort-sub { max-height: 84px; opacity: 1; }
  /* --rk-row-padding overrides rk-hover-rows own 14px default so its hover nudge starts from this rows real resting indent instead of snapping back to the top-level items -- without it the hover state pulls a subitem 12px to the left instead of nudging it 2px right. */
  .clip-sort-subitem { padding-left: 28px; --rk-row-padding: 28px; }
  .clip-sort-subitem .clip-sort-label { font-size: 11.5px; }
  /* Compress all is grouped with sorting as a batch action, so the filters stay a single calm segmented control. */
  .tab-action {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--primary_light);
    border-radius: 6px;
    background: var(--primary);
    color: var(--on-accent);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  #compress-all-btn[hidden] { display: none !important; }
  .bulk-actions {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    animation: bulk-actions-in 220ms var(--ease_smooth) both;
  }
  .bulk-actions[hidden] { display: none !important; }
  .bulk-actions::after {
    content: "";
    width: 1px;
    height: 20px;
    margin-left: 7px;
    background: var(--grey4);
  }
  .bulk-summary {
    display: inline-flex;
    flex-direction: column;
    justify-content: center;
    min-width: 78px;
    margin-left: 3px;
    font-size: 11px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .bulk-summary[hidden] { display: none !important; }
  .bulk-summary-count { color: var(--white1); }
  .bulk-summary-size { margin-top: 2px; color: var(--text_muted); font-variant-numeric: tabular-nums; }
  @keyframes bulk-actions-in {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .bulk-count {
    padding: 0 5px;
    color: var(--text_muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bulk-icon-btn {
    position: relative;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--white1);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .bulk-icon-btn:hover { background: var(--grey5); color: var(--text); }
  .bulk-icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .bulk-icon-btn.bulk-delete { color: var(--red); }
  .bulk-icon-btn.bulk-delete:hover { color: var(--red); background: rgba(227, 59, 87, .15); }
  .bulk-icon-btn.bulk-delete.is-armed { color: var(--text); background: var(--red); }
  .bulk-icon-btn:disabled { opacity: .5; cursor: progress; pointer-events: none; }
  /* upload button doubles as Stop while the queue drains -- keep it lit and clickable so the tooltip progress reads and a second click halts scheduling. */
  #bulk-upload.is-running { color: var(--on-accent); background: var(--primary); }
  #bulk-upload.is-running:hover { background: var(--primary_light); }
  /* the bulk toolbar tooltip is a single js-positioned element (see showBulkTip) -- these buttons hug the window's left edge so a css-only tooltip either clips or has to be left-anchored off-center. js clamps the box into the viewport and slides the arrow to keep it pointing at the button. */
  .info-dot {
    flex: none;
    margin-left: 4px;
    padding: 0;
    width: 15px;
    height: 15px;
    display: inline-flex;
    vertical-align: middle;
    border: 0;
    background: transparent;
    color: var(--text_muted, #969696);
    cursor: help;
    -webkit-user-select: none;
    user-select: none;
    transition: transform var(--anim_press) var(--ease_pop), color 90ms ease;
  }
  .info-dot::before {
    content: "";
    width: 100%;
    height: 100%;
    background-color: currentColor;
    -webkit-mask: url(/icons/ui/info.svg) center / contain no-repeat;
    mask: url(/icons/ui/info.svg) center / contain no-repeat;
  }
  .info-dot:hover { color: var(--text); transform: scale(1.12); }
  .info-dot:active { transform: scale(.94); }
  .info-dot:focus { outline: none; }
  .info-dot:focus-visible { color: var(--text); border-radius: 50%; box-shadow: 0 0 0 2px var(--selected2, #476bd7); }
  .bulk-clear {
    height: 30px;
    padding: 0 7px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--white1);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .bulk-clear:hover { color: var(--white1); background: var(--grey5); }
  .bulk-clear:disabled { opacity: .5; cursor: progress; pointer-events: none; }
  /* transient "stop the whole upload run" button, sits next to Clear while the queue drains. */
  .bulk-stop { color: var(--red); font-variant-numeric: tabular-nums; }
  .bulk-stop:hover { color: var(--red); background: rgba(var(--danger-rgb), .15); }
  .bulk-stop[hidden] { display: none !important; }
  .tab-action:hover {
    background: var(--primary_light);
    border-color: var(--primary_light);
    color: var(--on-accent);
  }
  .tab-action:disabled,
  .tab-action.is-disabled {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .tab-action svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex: 0 0 14px;
  }
  .tab-action.is-running {
    background: var(--primary);
    border-color: var(--primary_light);
    color: var(--on-accent);
    cursor: progress;
  }
  .tab-action .progress {
    color: rgba(var(--on-accent-rgb), 0.72);
    margin-left: 2px;
    font-variant-numeric: tabular-nums;
  }
  .scroll-area {
    flex: 1 1 auto;
    min-height: 0;
    height: auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px;
    overflow-anchor: none;
  }
  /* the room of the scrollbar is kept whether or not the list is tall enough for one, so the cards stand at the same width on every tab and nothing resizes when a list that fits replaces one that does not */
  html:not(.rk-home) .scroll-area { scrollbar-gutter: stable; }
  /* inside the obs window the resize grip sits over the last 18px of the right edge, so the track of this scrollbar stops above it; the page reaches that edge, so the scroller stops short of it and its scrollbar keeps off the edge */
  html.rk-embedded .scroll-area { --sb-end: 26px; margin-right: 6px; }
  /* the scrollbars of the timeline end before the resize corner too: they sit in the margin the timeline keeps along its right and bottom, which reaches the edge of the window */
  html.rk-embedded .tl-area { margin: 0 -6px -6px 0; }
  /* while a clip is fullscreened, OBS CEF still wants to repaint the grid behind the fullscreen top layer when the host window maximizes/restores. keep non-active UI invisible until the transition settles so leaving fullscreen does not spend seconds repainting dozens of hidden cards. */
  body.is-clip-fullscreen .tabs,
  body.is-clip-fullscreen .section-heading,
  body.is-clip-fullscreen #empty,
  body.is-clip-fullscreen #toast,
  body.is-clip-fullscreen #grid .card:not(.is-fullscreen-card),
  body.is-clip-fullscreen .home-shelves :is(.home-head, .home-hero-info, .card:not(.is-fullscreen-card)),
  body.is-clip-fullscreen #favorites-grid .card:not(.is-fullscreen-card) {
    visibility: hidden;
  }
  body.is-clip-fullscreen .scroll-area {
    overflow: hidden;
  }
  /* theater mode keeps the player inside the Clips window, but promotes the selected card into a wide stage below the tabs. */
  body.is-clip-theater .section-heading,
  body.is-clip-theater #empty,
  body.is-clip-theater #toast,
  body.is-clip-theater #grid .card:not(.is-theater-card),
  body.is-clip-theater .home-shelves :is(.home-head, .home-hero-info, .card:not(.is-theater-card)),
  body.is-clip-theater #favorites-grid .card:not(.is-theater-card) {
    visibility: hidden;
  }
  body.is-clip-theater .scroll-area { overflow: hidden; }
  body.is-clip-theater #grid { contain: none; }
  .card.is-theater-card {
    position: fixed !important;
    z-index: 40;
    /* !important -- `#grid .card { left:0; top:0 }` (id selector) otherwise beats this shorthand left/top and pins the stage flush to the top-left wall while right/bottom keep their 14px. */
    inset: 58px 14px 14px !important;
    width: auto !important;
    height: auto !important;
    transform: none !important;
    translate: 0 0;
    contain: none;
  }
  /* the stage animates on the standalone scale/opacity properties, not transform -- the rule above pins transform to none !important to beat `#grid .card`'s translate, so a transform-based entrance would never render. */
  @keyframes clip-theater-in {
    from { opacity: 0; scale: .985; }
    to { opacity: 1; scale: 1; }
  }
  .card.is-theater-card { animation: clip-theater-in 170ms var(--ease_smooth) both; }
  /* leaving theatre removes the classes that would have animated, so the grid coming back gets the exit motion instead -- one animation on the scroll container rather than one per card, which matters with the virtualised grid. */
  @keyframes clip-theater-restore {
    from { opacity: 0; scale: .994; }
    to { opacity: 1; scale: 1; }
  }
  body.is-theater-restoring .scroll-area { animation: clip-theater-restore 170ms var(--ease_smooth) both; }
  .card.is-theater-card .preview {
    flex: 1 1 auto;
    min-height: 0;
    aspect-ratio: auto;
    border-radius: 5px 5px 0 0;
  }
  .card.is-theater-card .preview-media,
  .card.is-theater-card .preview video {
    border-radius: 5px 5px 0 0;
  }
  .card.is-theater-card .preview video {
    object-fit: contain;
    opacity: 1;
  }
  .grid {
    display: grid;
    /* the columns of every list of cards: as many as fit of at least 330px, sharing the row; min(330px, 100%) gives a narrow popup one card as wide as its content, since a hard floor there pushed the right edge behind overflow-x. the virtual list (#grid) does not work out columns of its own, it reads these tracks back */
    grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr));
    gap: 14px;
    align-items: start;
    overflow-anchor: none;
  }
  /* the virtual list is a grid of the rule above like every other list; only the cards near the screen exist, so the window script places each one on a track the grid worked out instead of the grid flowing them */
  #grid {
    position: relative;
    min-height: 0;
    contain: layout style;
  }
  #grid .card {
    position: absolute;
    left: 0;
    top: 0;
    min-width: 0;
    max-width: 100%;
    width: var(--virtual-card-width, 260px);
    transform: translate3d(var(--virtual-card-x, 0px), var(--virtual-card-y, 0px), 0);
  }
  /* favorites sub-section above the main virtualized grid. hidden by defualt; render() toggles `is-shown` on both the heading and the grid when the all filter is active and theres at least one favorite. same goes for the "all clips" heading -- it only shows in that case to seperate the two sub-sections visually. */
  .favorites-grid { display: none; margin-bottom: 18px; }
  /* the home view: this page with a big player for the newest clip and two shelves of clips under the header that RKHomeDashboard draws, and no toolbar. a clip is its player with the name and the age under it, without the card, the menus or the buttons of the clips view */
  .rk-home .tabs, .rk-home #favorites-heading, .rk-home #favorites-grid, .rk-home #rest-heading, .rk-home .select-clip-btn, .rk-home .favorite-btn, .rk-home .codec-badge, .rk-home .card .actions { display: none !important; }

  .home-hero-age { margin-top: 2px; color: var(--text_muted); font-size: 12.5px; line-height: 18px; }
  .home-hero-facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--hairline); font-size: 13px; }
  .home-hero-facts dt { color: var(--text_muted); }
  .home-hero-facts dd { margin: 0; font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {

  }
  .rk-home .preview, .rk-home .preview-media, .rk-home .preview .thumb, .rk-home .preview video, .rk-home .play-overlay, .rk-home .player-shade { border-radius: 10px; }

  .rk-home .card.is-theater-card { inset: 14px !important; }

  .section-heading {
    display: none;

  /* divider above "all clips" so the favorites-vs-rest boundary reads clearly even with both headings now sharing the same bold white style. same border colour as every other hairline in this file (inputs, cards, toasts) for consistency. */

  }
  .card {
    position: relative;
    background: var(--bg_card);
    border: 1px solid var(--grey4-solid,var(--grey4));
    border-radius: 6px;
    overflow: visible;
    display: flex;
    flex-direction: column;
    /* hover lift uses `translate` (the individual property, integer px, vertical only) so it composes with the translate3d that positions virtualized cards and can never drift a card sideways. the thumbnail does the "grow" instead -- it scales inside .previews overflow:clip so the card box, and the progress bar glued to its bottom edge, never move relative to each other. `transform` itself stays untransitioned so a recycled card snaps to its new slot. */
    translate: 0 0;
    transition: translate 160ms var(--ease_smooth), box-shadow 200ms var(--ease_smooth), border-color 100ms linear, opacity 150ms linear;
    overflow-anchor: none;
    /* keep card layout isolated without content-visibility. OBS CEF can flicker grid children after maximize/restore when content-visibility:auto is combined with virtualized rows and lazy media. */
    contain: layout style;
  }
  .card.menu-open { z-index: 20; }
  .preview {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: clip;
    /* the scrub dot is centred on the (bottom-flush) progress bar, so part of it naturally sits past .previews own bottom edge -- that overhang onto the card body below is the intended look, not a bug, so this margin lets it render instead of getting cut off. overflow:hidden cant do this (no clip-margin concept); overflow:clip can. */
    overflow-clip-margin: 6px;
    border-radius: 5px 5px 0 0;
    cursor: pointer;
  }
  /* groups the thumb + video into one layer under the overlay controls. */
  .preview-media {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 5px 5px 0 0;
  }
  .preview:is(:fullscreen, .rk-fs) .preview-media,
  .preview:-webkit-full-screen .preview-media { border-radius: 0; }
  .preview .thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
    border-radius: 5px 5px 0 0;
  }
  .preview video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
    opacity: 0;
    transition: opacity 80ms linear;
    border-radius: 5px 5px 0 0;
    will-change: transform;
  }
  /* the fullscreen target is the .preview container now (not the <video> itself), so the browser doesnt fire its built-in dblclick=exit-fullscreen shortcut. we size the container to 100%/100% and let the video letterbox-fit inside it. */
  .preview:is(:fullscreen, .rk-fs),
  .preview:-webkit-full-screen {
    width: 100%;
    height: 100%;
    background: #000;
  }
  .preview:is(:fullscreen, .rk-fs) video,
  .preview:-webkit-full-screen video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    opacity: 1;
    border-radius: 0;
  }
  .preview:is(:fullscreen, .rk-fs) .theater-btn,
  .preview:-webkit-full-screen .theater-btn { display: none; }
  .preview:is(:fullscreen, .rk-fs) .select-clip-btn,
  .preview:-webkit-full-screen .select-clip-btn,
  .preview:is(:fullscreen, .rk-fs) .favorite-btn,

  .preview.is-playing.is-video-ready video {

  /* resting cards just get a light dim so the thumbnail reads as "not playing" -- no play glyph. it lifts on hover. */
  .preview .play-overlay {

  .card:hover .preview .play-overlay,
  .preview.is-playing .play-overlay { opacity: 0; }

  /* preview controls (volume + fullscreen, bottom of preview) - float over the video, fade in on card hover so resting cards look clean. the two halves (left = volume, right = fullscreen) sit above the progress bar. */
  .preview-controls {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;

    align-items: center;

  .icon-btn {
    background: rgba(0, 0, 0, 0.55);
    border: none;
    /* sits on the video thumbnail -- fixed white icon on a dark pill, independent of the theme */
    color: #fff;

    border-radius: 50%;

    align-items: center;

  .icon-btn svg  { width: 16px; height: 16px; fill: currentColor; display: block; }
  .favorite-btn {
    position: absolute;
    top: 3px;
    right: 3px;
    z-index: 5;
    width: 32px;
    height: 32px;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: background-color 80ms linear, color 80ms linear;
  }
  .favorite-btn:hover { background: rgba(0, 0, 0, 0.85); }
  /* filled star (favorited) renders in youtube-/imdb-style gold so it reads at a glance against the dark card; outline state keeps the white-on-translucent look so its visible without competing for attention with the play button. */
  .favorite-btn.is-favorite { color: var(--amber); }
  .favorite-btn svg {
    width: 22px;

  /* a card of the drafts tab carries the edit icon over its whole picture, faint, as the mark of what it is. it goes the moment the card is hovered or its clip plays, so it never sits on the video the person came to look at */
  .draft-mark { display: none; }
  .card.is-draft-card .draft-mark {
    position: absolute;

  /* the way from the home view into the clips view: a small round button in the corner of a clip, shown while the pointer is on it */

  .rk-home .locate-btn {

  .rk-home .locate-btn svg { width: 17px; height: 17px; fill: currentColor; display: block; }
  .rk-home .preview:is(:fullscreen, .rk-fs) .locate-btn,
  .rk-home .card.is-theater-card .locate-btn { display: none; }
  /* the clip the clips view was opened on: a soft ring, a faint glow and a wash behind the title, all in the text colour like the wash of the tab that is on, that come up and fade, once */
  @keyframes rk-locate {
    0% { box-shadow: 0 0 0 0 rgba(var(--text-rgb), 0), 0 0 0 0 rgba(var(--text-rgb), 0), inset 0 0 0 999px rgba(var(--text-rgb), 0); }

    100% { box-shadow: 0 0 0 0 rgba(var(--text-rgb), 0), 0 0 0 0 rgba(var(--text-rgb), 0), inset 0 0 0 999px rgba(var(--text-rgb), 0); }
  }
  .card.is-located { animation: rk-locate 2400ms var(--ease_smooth) 1 both; }
  /* multi-select lives on the opposite corner from Favorite: a quiet empty circle becomes a checked blue control, then the toolbar exposes the bulk operations. */
  .select-clip-btn {
    position: absolute;
    top: 3px;
    left: 3px;
    z-index: 5;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .select-clip-btn:hover { background: transparent; }
  .select-clip-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.35; }
  /* transparent-white (not `none`) so the fill can animate to solid when the card is ticked. */
  .select-clip-btn .select-ring { fill: rgba(var(--text-rgb), 0); transition: fill 140ms linear, stroke 140ms linear; }
  /* the check just fades + eases up to full size when a card is ticked -- no overshoot/bounce. */
  .select-clip-btn .select-check {
    fill: none;
    opacity: 0;
    scale: 0.7;
    transform-box: fill-box;

  .favorite-btn {

    pointer-events: none;

  .card.is-selected { border-color: var(--primary-solid,var(--primary)); box-shadow: 0 0 0 1px var(--primary-solid,var(--primary)); }
  .card.is-selected .select-clip-btn { background: transparent; }
  .card.is-selected .select-clip-btn .select-ring { display: block; fill: var(--primary); stroke: var(--primary); }
  .card.is-selected .select-clip-btn .select-check { stroke: var(--on-accent); stroke-width: 1.55; opacity: 1; scale: 1; }
  body.is-selection-mode .card:not(.is-selected) { opacity: .58; }
  body.is-selection-mode .card:not(.is-selected):hover { opacity: .78; }
  body.is-selection-mode .card { cursor: pointer; }

  /* volume "pill": icon and slider live inside one rounded container that expands on hover. no gap, no absolute positioning, no dead zone -- moving the cursor from the icon to the slider keeps the pill hovered the whole way. */
  .volume-control {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    width: 28px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 14px;
    overflow: hidden;
    transition: width 200ms var(--ease_smooth), background-color 80ms linear;
  }
  .volume-control:hover {
    width: 124px;
    background: rgba(0, 0, 0, 0.85);
  }
  .volume-btn {
    flex: 0 0 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .volume-btn svg { width: 16px; height: 16px; fill: currentColor; display: block; }
  /* youtube-style speaker waves: every arc + the mute X live in the svg at once, hidden by default. the
     button's data-level (set by syncVolumeUi) reveals just as many as the current volume warrants, and each
     one eases in/out from the speaker edge on its own -- so 24%->50% grows only the 2nd arc, 50%->24% retracts
     only the 2nd arc, etc. no re-render, no restaged animation. */
  .volume-btn .vol-wave,
  .volume-btn .vol-x {
    transform-box: fill-box;
    opacity: 0;
    scale: 0.3;
    transition: opacity 170ms ease, scale 260ms var(--ease_smooth);
  }
  .volume-btn .vol-wave { transform-origin: left center; }
  .volume-btn .vol-x { transform-origin: center; }
  .volume-btn:not([data-level="1"]):not([data-level="2"]):not([data-level="3"]) .vol-x { opacity: 1; scale: 1; }
  .volume-btn:is([data-level="1"], [data-level="2"], [data-level="3"]) .vol-wave-1,
  .volume-btn:is([data-level="2"], [data-level="3"]) .vol-wave-2,
  .volume-btn[data-level="3"] .vol-wave-3 { opacity: 1; scale: 1; }
  .volume-slider-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding: 0 12px 0 2px;
    min-width: 0;
    opacity: 0;
    transition: opacity 120ms linear;
  }
  .volume-control:hover .volume-slider-wrap { opacity: 1; }
  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(var(--text-rgb), 0.3);
    border-radius: 2px;
    outline: none;
    margin: 0;

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    border: none;
  }

  /* duration badge: bottom-right pill on the thumbnail, youtube-style. hidden until the js probe fills it in (probeduration reads the video metadata when the card scrolls into view). stays visible in fullscreen but auto-hides with the rest of the overlay via the is-idle rule. */
  .duration-badge {
    position: absolute;
    right: 6px;
    bottom: 6px;
    z-index: 3;
    padding: 2px 6px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    border-radius: 3px;
    pointer-events: none;
    line-height: 1.3;
    display: none;
  }
  .duration-badge.is-ready { display: block; }
  /* the badge is a "thumbnail garnish" -- it shouldnt sit on top of the actual video. hide it whenever the user has expressed intent to watch: .card:hover -- mouse is over the card. the hover preview will start playing in a moment; hide immediately so the badge doesnt lag behind the user and sit on top of live frames. .preview.is-playing -- belt-and-suspenders for the case where playback was started without a hover (programmatic / fullscreen). .preview:fullscreen -- bottom bars "0:36 / 1:00" is the source of truth in fullscreen. wins over .is-ready via the longer selector chain alone; no !important needed. */
  .card:hover .duration-badge.is-ready,
  .preview.is-playing .duration-badge.is-ready,
  .preview:is(:fullscreen, .rk-fs) .duration-badge.is-ready,
  .preview:-webkit-full-screen .duration-badge.is-ready {
    display: none;
  }
  /* codec badge: same thumbnail-garnish treatment as the duration badge, mirrored to the bottom-left corner. red tint is the one state worth a second look -- hevc still tagged hev1, meaning this specific clip hasnt gone thru the auto-fix yet and may not play on an iphone. */
  .codec-badge {
    position: absolute;
    left: 6px;
    bottom: 6px;
    z-index: 3;
    padding: 2px 6px;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    border-radius: 3px;
    pointer-events: none;
    line-height: 1.3;
    display: none;
  }
  .codec-badge.is-ready { display: block; }
  .codec-badge.is-unfixed { background: rgba(227, 59, 87, 0.55); }
  .card:hover .codec-badge.is-ready,
  .preview.is-playing .codec-badge.is-ready,
  .preview:is(:fullscreen, .rk-fs) .codec-badge.is-ready,
  .preview:-webkit-full-screen .codec-badge.is-ready {
    display: none;
  }

  /* duration progress bar at the very bottom of the preview. always visible -- the empty bar tells you "this is a video", the fill animates while a hover preview plays. in fullscreen the bar is also a click + drag scrubber (handler wired in buildcard). */
  /* hit area only, fixed size -- big enough to grab comfortably at any time. the visible bar is the ::before track below, not this element, on purpose: a bottom-anchored box whose height is both transitioned and left to auto-resolve its top (top: auto + bottom: 0 + height) never actually repaints on chromium even though getcomputedstyle reports the new height correctly -- confirmed by disabling the transition, which unstuck it immediately. explicitly animating top+height together (like the fullscreen bar below already does) sidesteps that entirely, so the growing pieces here do the same instead of animating this elements own height. */
  .progress-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 8px;
    z-index: 3;
    cursor: pointer;
  }
  .progress-bar::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 5px;
    height: 3px;
    background: rgba(0, 0, 0, 0.75);
    transition: top 80ms linear, height 80ms linear;
  }
  /* grows the bar a bit and reveals the scrub dot below, same idea as the fullscreen bar -- 3px is fine to look at but too thin to reliably grab with a mouse. top+height move together so the bottom edge (top+height) stays fixed at 8px, i.e. the track stays flush with the bottom of the hit area (and .previews visible bottom edge) on both sides of the grow. */
  .progress-bar:hover::before,
  .progress-bar.is-scrubbing::before {
    top: 3px;
    height: 5px;
  }
  /* scoped to .progress-bar -- this used to be a bare .progress-fill selector, which also matched the unrelated .progress-fill span inside the compress/upload button (.btn.is-progress) since they share a class name. its unscoped top/height leaked into that button through the cascade (higher-specificity .btn.is-progress .progress-fill never set its own height to override it), collapsing the fill into a 3px strip pinned to the top instead of covering the button. confirmed 2026-08-11. */
  .progress-bar .progress-fill {
    position: absolute;
    left: 0;
    top: 5px;
    height: 3px;
    width: 0%;
    background: var(--primary_light);
    /* no css transition on width: its repainted every animation frame from the requestanimationframe loop in buildcard(), so easing would just lag the bar behind the real playhead. top/height do transition, same reasoning as ::before above. */
    transition: top 80ms linear, height 80ms linear;
  }
  .progress-bar:hover .progress-fill,
  .progress-bar.is-scrubbing .progress-fill {
    top: 3px;
    height: 5px;
  }
  /* dock-sized scrub dot, hidden until the bar is hovered or being dragged -- scaled down version of the fullscreen one below (same anchor-to-fill-edge trick). centred on the fill itself (top:50%), which is bottom-flush against .previews edge, so the dot naturally straddles that edge and overhangs a little onto the card body below -- thats the intended look, not a bug; .previews overflow-clip-margin (see .preview) is what lets that overhang actually render instead of getting cut off. */
  .progress-scrub-dot {
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary_light);
    pointer-events: none;
    transition: transform 80ms ease-out;
  }
  .progress-bar:hover .progress-scrub-dot,
  .progress-bar.is-scrubbing .progress-scrub-dot {
    transform: translateY(-50%) scale(1);
  }
  /* fullscreen-only player chrome (youtube-style) - when the .preview container is the fullscreen element (not the <video>), theres no native browser hud to fall back on. we build one that mirrors youtubes bottom-bar shape: a single transparent panel running edge-to-edge along the bottom of the viewport, holding a thin progress bar with a scrub dot up top and a row of [play/pause | volume | time text ........ fs] under it. a dark gradient fades the bottom 25% of the video so light scenes dont make the controls illegible. hide-from-dock: every element added for the fullscreen player (play-toggle-btn, time-display, settings gear) carries `display: none` here -- the fullscreen rules below switch them on. progress-scrub-dot is not in this list anymore -- it has its own dock-visible styling above. */
  .preview .play-toggle-btn,
  .preview .time-display,
  .preview .settings-wrap { display: none; }
  .preview:is(:fullscreen, .rk-fs) .settings-wrap,
  .preview:-webkit-full-screen .settings-wrap {
    display: inline-flex;
    position: relative;
  }
  /* youtube-style playback-speed popup. anchored above the gear, opens on .is-open. the styling matches the rest of the docks dark-glass menus (auth menu, card more-menu) -- subtle translucent black background, no flashy accent border. */
  /* playback-speed popup -- styled 1:1 with youtubes actual ytp-variable-speed-panel. values pulled from getcomputedstyle(.ytp-settings-menu) on a live youtube.com page: 60% black background (not super transparent, not backdrop-blur), 12px radius, no shadow, no border. inner controls are subtle translucent-white pills/chips at 10% alpha (20% when active), no borders. the obs-blue accent is kept only on the active pill so the player chrome reads as "youtube but ours". */
  .settings-menu {
    position: absolute;
    right: 0;
    /* sit above the progress bar (at bottom:56px in fullscreen). */
    bottom: calc(100% + 20px);
    width: 330px;                /* YouTubes exact value */
    background: rgba(0, 0, 0, 0.6);
    border: 0;
    border-radius: 12px;
    padding: 0;
    box-shadow: none;
    color: rgb(238, 238, 238);
    z-index: 10;
    /* sits above the gear, so it grows up out of its bottom edge and eases back down to close -- mirror of the menus that drop. */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(10px) scale(.96);
    transform-origin: bottom center;
    transition: opacity 160ms ease, transform var(--anim_menu) var(--ease_smooth), visibility 0s linear var(--anim_menu);
  }
  .settings-wrap.is-open .settings-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition: opacity 130ms ease, transform var(--anim_menu) var(--ease_smooth);
  }
  /* header: gear glyph + "playback speed" label. no divider line -- youtube uses generous whitespace instead. */
  .settings-menu .menu-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 0;
    margin: 0;
    font-size: 14px;
    font-weight: 500;
    color: rgb(238, 238, 238);
    border: 0;
  }
  .settings-menu .menu-header svg {
    width: 12px;
    height: 18px;
    fill: currentColor;
  }
  /* big centred current-value readout. youtube uses font-weight: 900 for the "1.00x" -- a very heavy display weight that makes the value stand out without taking up extra room. the number itself is now an <input> so the user can type any custom rate; the "x" suffix is a static sibling so they cant accidentally edit or delete it. */
  .speed-current {
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: rgb(238, 238, 238);
    font-variant-numeric: tabular-nums;
    margin: 20px 16px 12px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1px;
  }
  .speed-current-value {
    /* strip all defualt <input> chrome so it reads as plain text. */
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 0;
    outline: 0;
    padding: 0;
    margin: 0;
    color: inherit;
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: right;
    width: 5ch;             /* fits "16.00" -- the longest possible readout, since tofixed(2) always shows 2 decimals and speed_max is 16 -- without clipping the last digit */
    cursor: text;
    /* underline always shown so its clear this number is clickable/editable, not just a label; brightens further on focus. */
    border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    transition: border-color 80ms linear;
  }
  .speed-current-value:focus {
    border-bottom-color: rgba(255, 255, 255, 0.85);
  }
  .speed-current-unit {
    margin-left: 1px;
  }
  /* slider row: [-] [========o========] [+]. */
  .speed-slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    margin-bottom: 16px;
  }
  .speed-step-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    border-radius: 16px;
    color: #fff;
    font-size: 24px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background-color 80ms ease-out;
  }
  .speed-step-btn:hover  { background: rgba(255, 255, 255, 0.20); }
  .speed-step-btn:active { background: rgba(255, 255, 255, 0.28); }
  .speed-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 3px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 2px;
    outline: none;
  }
  .speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    border: 0;
  }
  /* quick-select preset pills. youtube renders them as a strip of chips with 10% white background and 16px radius. pills flex to share the row evenly (rather than a fixed 53px) so however many there are, they still fill the fixed-width menu -- needed once the 10x pill joined the original five. active pill flips to obs blue (our accent) rather than youtubes subtle 20% white -- single sharp brand colour across the chrome. */
  .speed-pills {
    display: flex;
    gap: 8px;
    padding: 0 16px 14px;
    justify-content: space-between;
  }
  .speed-pill {
    flex: 1;
    height: 32px;
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    border-radius: 16px;
    padding: 0;
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background-color 80ms ease-out;
  }
  .speed-pill:hover { background: rgba(255, 255, 255, 0.20); }
  .speed-pill.is-active {
    background: var(--primary);
    color: var(--on-accent);
  }

  /* center play/pause flash. pops in with a quick scale+fade-out every time the user toggles playback via click on the video surface, the play-toggle button, or the space key. mirrors the youtube indicator. js adds .is-flashing for 500 ms. */
  .center-pulse {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46px;
    height: 46px;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 350ms ease-out, transform 350ms ease-out;
  }
  .center-pulse svg { width: 22px; height: 22px; fill: var(--text); }
  /* the dock preview is small, so the flash matches the old resting play button; give it room in fullscreen. */
  .preview:is(:fullscreen, .rk-fs) .center-pulse,
  .preview:-webkit-full-screen .center-pulse { width: 76px; height: 76px; }
  .preview:is(:fullscreen, .rk-fs) .center-pulse svg,
  .preview:-webkit-full-screen .center-pulse svg { width: 38px; height: 38px; }
  .center-pulse.is-flashing {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.15);
    transition: opacity 80ms linear, transform 80ms linear;
  }

  /* the shaded backdrop that sits behind the controls when fullscreen. kept short (covers only the control strip + progress bar, not anything above) so it doesnt bleed dark into the settings popup that pops above the gear. earlier this was 110px tall, which meant the popup -- at bottom:64px from the screen, on top of the still-opaque part of the gradient -- read as opaque even at 28% alpha. now the shade tops out at 64px; the popup sits above that and gets the real video as its backdrop. */
  .preview .player-shade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to top,
                  rgba(0, 0, 0, 0.85) 0%,
                  rgba(0, 0, 0, 0.50) 60%,
                  rgba(0, 0, 0, 0) 100%);
    opacity: 0;
    transition: opacity 120ms linear;
  }
  .preview:is(:fullscreen, .rk-fs) .player-shade,
  .preview:-webkit-full-screen .player-shade { opacity: 1; }

  /* theater mode: match the fullscreen player -- controls always shown over a shade, and the seek scrubber lifted
     above the controls row instead of sitting flush at the very bottom of the stage. */
  .card.is-theater-card .preview-controls { opacity: 1; pointer-events: auto; }
  .card.is-theater-card .player-shade { opacity: 1; }
  .card.is-theater-card .progress-bar { bottom: 42px; height: 12px; }
  .card.is-theater-card .progress-fill { background: var(--primary_light); }

  /* hoist the controls row to a youtube-like bottom bar: edge-to-edge, play/volume/time on the left, fullscreen on the right. */
  .preview:is(:fullscreen, .rk-fs) .preview-controls,
  .preview:-webkit-full-screen .preview-controls {
    opacity: 1;
    pointer-events: auto;
    left: 12px;
    right: 12px;
    bottom: 8px;
    gap: 0;
  }
  .preview:is(:fullscreen, .rk-fs) .controls-left,
  .preview:-webkit-full-screen .controls-left {
    display: flex; align-items: center; gap: 6px;
  }
  .preview:is(:fullscreen, .rk-fs) .controls-right,
  .preview:-webkit-full-screen .controls-right {
    display: flex; align-items: center; gap: 6px;
  }
  .preview:is(:fullscreen, .rk-fs) .play-toggle-btn,
  .preview:-webkit-full-screen .play-toggle-btn,
  .preview:is(:fullscreen, .rk-fs) .time-display,
  .preview:-webkit-full-screen .time-display { display: inline-flex; }

  /* big-target icon buttons -- youtubes are about 36 px tall; we match. the hover background is subtle so it doesnt compete with the gradient backdrop. */
  .preview:is(:fullscreen, .rk-fs) .preview-controls .icon-btn,
  .preview:-webkit-full-screen .preview-controls .icon-btn,
  .preview:is(:fullscreen, .rk-fs) .play-toggle-btn,
  .preview:-webkit-full-screen .play-toggle-btn {
    background: transparent;
    width: 36px;
    height: 36px;
    border-radius: 4px;
    color: #fff;
  }
  .preview:is(:fullscreen, .rk-fs) .preview-controls .icon-btn:hover,
  .preview:-webkit-full-screen .preview-controls .icon-btn:hover,
  .preview:is(:fullscreen, .rk-fs) .play-toggle-btn:hover,
  .preview:-webkit-full-screen .play-toggle-btn:hover {
    background: rgba(255, 255, 255, 0.16);
  }
  .preview:is(:fullscreen, .rk-fs) .preview-controls .icon-btn svg,
  .preview:-webkit-full-screen .preview-controls .icon-btn svg,
  .preview:is(:fullscreen, .rk-fs) .play-toggle-btn svg,
  .preview:-webkit-full-screen .play-toggle-btn svg {
    width: 22px; height: 22px; fill: currentColor;
  }
  .play-toggle-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  /* youtube-style time text: tabular numerics so the seconds tick doesnt shift the layout. uses css variable substitution so the content is js-controlled via setproperty on the badge. */
  .time-display {
    align-items: center;
    color: #fff;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 0 8px;
    line-height: 36px;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
  }

  /* volume cluster: in fullscreen the slider is collapsed by defualt and expands on hover/focus of the volume button -- the same trick youtube uses. the existing .volume-slider-wrap css handles most of this; we just make the cluster blend with the new bar. */
  .preview:is(:fullscreen, .rk-fs) .volume-control,
  .preview:-webkit-full-screen .volume-control { background: transparent; }

  /* the progress bar is the players seek scrubber in fullscreen. place it above the controls row instead of in its own strip at the bottom of the screen -- the youtube look. */
  .preview:is(:fullscreen, .rk-fs) .progress-bar,
  .preview:-webkit-full-screen .progress-bar {
    left: 0;
    right: 0;
    bottom: 51px;
    height: 14px;
    cursor: pointer;
    background: transparent;
    border-radius: 0;
    z-index: 4;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-bar::before,
  .preview:-webkit-full-screen .progress-bar::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 5px;
    height: 4px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 0;
    transition: top 80ms linear, height 80ms linear;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-bar:hover::before,
  .preview:-webkit-full-screen .progress-bar:hover::before,
  .preview:is(:fullscreen, .rk-fs) .progress-bar.is-scrubbing::before,
  .preview:-webkit-full-screen .progress-bar.is-scrubbing::before {
    top: 4px;
    height: 6px;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-fill,
  .preview:-webkit-full-screen .progress-fill {
    background: var(--primary_light);
    border-radius: 0;
    transition: none;
    position: absolute;  /* anchor the scrub dot to the fills edge */
    left: 0;
    top: 5px;
    height: 4px;
    z-index: 2;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-bar:hover .progress-fill,
  .preview:-webkit-full-screen .progress-bar:hover .progress-fill,
  .preview:is(:fullscreen, .rk-fs) .progress-bar.is-scrubbing .progress-fill,
  .preview:-webkit-full-screen .progress-bar.is-scrubbing .progress-fill {
    top: 4px;
    height: 6px;
  }
  /* youtube-style hover preview fill: a translucent white band that follows the cursors x position along the bar, indicating where a click will seek to. js writes the width onto the element via a css variable on each pointermove; css does the rest. sits behind the real progress fill so it cant visually overpower it when both are present. */
  .preview:is(:fullscreen, .rk-fs) .progress-hover-fill,
  .preview:-webkit-full-screen .progress-hover-fill {
    display: block;
    position: absolute;
    left: 0; top: 5px;
    height: 4px;
    width: var(--hover-fill, 0%);
    background: rgba(255, 255, 255, 0.35);
    border-radius: 0;
    pointer-events: none;
    z-index: 1;
    transition: none;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-bar:hover .progress-hover-fill,
  .preview:-webkit-full-screen .progress-bar:hover .progress-hover-fill,
  .preview:is(:fullscreen, .rk-fs) .progress-bar.is-scrubbing .progress-hover-fill,
  .preview:-webkit-full-screen .progress-bar.is-scrubbing .progress-hover-fill {
    top: 4px;
    height: 6px;
  }
  .preview .progress-hover-fill { display: none; }
  /* time tooltip floating above the cursor when hovering the bar. */
  .preview .progress-hover-time { display: none; }
  .preview:is(:fullscreen, .rk-fs) .progress-bar:hover .progress-hover-time,
  .preview:-webkit-full-screen .progress-bar:hover .progress-hover-time,
  .preview:is(:fullscreen, .rk-fs) .progress-bar.is-scrubbing .progress-hover-time,
  .preview:-webkit-full-screen .progress-bar.is-scrubbing .progress-hover-time {
    display: block;
    position: absolute;
    bottom: calc(100% + 6px);
    transform: translateX(-50%);
    left: var(--hover-x, 0px);
    padding: 3px 7px;
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    border-radius: 3px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }
  /* scrub dot riding the playhead. lives inside the .progress-fill so its right:-7px anchor lines up with the playheads actual x position. previously the dot was a sibling of .progress-fill anchored to the right edge of the whole .progress-bar -- which meant it sat at the end of the bar regardless of playback position. hidden by defualt, revealed on bar hover. */
  .preview:is(:fullscreen, .rk-fs) .progress-scrub-dot,
  .preview:-webkit-full-screen .progress-scrub-dot {
    display: block;
    position: absolute;
    right: -7px;
    top: 50%;
    transform: translateY(-50%) scale(0);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary_light);
    pointer-events: none;
    transition: transform 80ms ease-out;
  }
  .preview:is(:fullscreen, .rk-fs) .progress-bar:hover .progress-scrub-dot,
  .preview:-webkit-full-screen .progress-bar:hover .progress-scrub-dot,
  .preview:is(:fullscreen, .rk-fs) .progress-bar.is-scrubbing .progress-scrub-dot,
  .preview:-webkit-full-screen .progress-bar.is-scrubbing .progress-scrub-dot {
    transform: translateY(-50%) scale(1);
  }

  /* auto-hide after a few seconds of mouse idleness so the controls dont sit on top of the video forever. .is-idle is toggled from js based on a mousemove timer. */
  .preview:is(:fullscreen, .rk-fs).is-idle,
  .preview:-webkit-full-screen.is-idle { cursor: none; }
  .preview:is(:fullscreen, .rk-fs).is-idle .preview-controls,
  .preview:-webkit-full-screen.is-idle .preview-controls,
  .preview:is(:fullscreen, .rk-fs).is-idle .progress-bar,
  .preview:-webkit-full-screen.is-idle .progress-bar,
  .preview:is(:fullscreen, .rk-fs).is-idle .player-shade,
  .preview:-webkit-full-screen.is-idle .player-shade {
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms linear;
  }

  /* title row (name + edit pencil + delete + 3-dot menu) */
  .title-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .name {
    /* dont grow -- the name sizes to its text so the pencil sits right next to it. can still shrink (with ellipsis) when the filename is too long for the card. */
    flex: 0 1 auto;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 2px 0;
  }
  .name-edit-input {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: var(--grey7);
    border: 1px solid var(--button_border_hover);
    border-radius: 3px;
    padding: 1px 4px;
    outline: none;
  }
  /* static extension chip next to the rename input -- not an input, so it cant be typed into, and user-select:none keeps a drag-select from grabbing it either. darker fill than the input reads as "this part isnt editable" without needing a label to say so. */
  .name-edit-ext {
    flex: 0 0 auto;
    font-size: 13px;
    font-weight: 500;
    color: var(--text_muted);
    background: var(--grey8);
    border: 1px solid var(--button_border);
    border-radius: 3px;
    padding: 1px 4px;
    user-select: none;
    cursor: default;
  }
  /* title-row icons are always visible -- the cursor doesnt need to be on the card for them to make sense (the user might already be looking at the card to know they want to rename / open folder). */
  .icon-mini-btn {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--text_muted);
    cursor: pointer;
    width: 22px;
    height: 22px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color 80ms linear, background-color 80ms linear;
  }
  .icon-mini-btn:hover { color: var(--text); background: var(--button_bg_hover); }
  .icon-mini-btn svg   { width: 14px; height: 14px; fill: currentColor; display: block; }
  .title-actions {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .icon-mini-btn.delete-btn {
    color: var(--red);
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
    transition: width 140ms ease, color 80ms linear, background-color 80ms linear, transform var(--anim_press) var(--ease_pop);
  }
  /* same hover-grow / press-shrink as every other button. transform composes with the armed-state width animation without disturbing it; the armed (confirm) state opts back out below. */
  .icon-mini-btn.delete-btn:hover {
    color: var(--red);
    background: rgba(var(--danger-rgb), 0.16);
    transform: scale(var(--hover_grow));
  }
  .icon-mini-btn.delete-btn:active { transform: scale(var(--press_shrink)); }
  .icon-mini-btn.delete-btn.is-armed { transform: none; }
  .icon-mini-btn.delete-btn svg {
    transition: width 140ms ease, opacity 80ms linear;
  }
  .delete-confirm-text {
    display: inline-block;
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    transform: translateX(-4px);
    transition: max-width 140ms ease, opacity 80ms linear, transform 140ms ease;
  }
  /* armed state: the trash icon has been clicked once and is waiting for a second click to confirm. */
  .icon-mini-btn.delete-btn.is-armed,
  .icon-mini-btn.delete-btn.is-armed:hover {
    width: 64px;
    background: var(--red);
    color: #fff;
  }
  .icon-mini-btn.delete-btn.is-armed svg {
    width: 0;
    opacity: 0;
  }
  .icon-mini-btn.delete-btn.is-armed .delete-confirm-text {
    max-width: 48px;
    opacity: 1;
    transform: translateX(0);
  }

  /* dropdown for the card actions. pointer placement is calculated in JS for both a three-dot click and a card right-click. */
  .menu-container { position: static; flex-shrink: 0; }
  .menu-dropdown {
    position: absolute;
    top: var(--menu-top, 0px);
    left: var(--menu-left, 0px);
    right: auto;
    min-width: 190px;
    background: var(--grey5);
    border: 1px solid var(--grey3);
    border-radius: 4px;
    padding: 4px 0;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    z-index: 100;
    /* same glide as the sort menu -- kept in the dom, faded + lifted + shrunk from its top edge while closed, eased down into place on open. */
    opacity: 0;

    pointer-events: none;

  /* group labels plus a left icon rail let the eye jump to a group by its name and then to a row by its glyph -- the icons used to sit a whole menu width from the text they described and one row had none, which broke the column; label style matches .clip-sort-heading so the two menus stay related */
  .menu-heading {

  .menu-heading:first-child { padding-top: 5px; }

  }
  .menu-item svg {

    height: 16px;
    fill: currentColor;
