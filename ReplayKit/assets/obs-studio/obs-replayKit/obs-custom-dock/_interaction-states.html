<!-- Shared hover API. Call RKHover.apply(root, { profile: selector }) to assign one of the reusable profiles. -->
<style>
  .rk-hover-control {
    transition: transform var(--anim_press, 120ms) var(--ease_pop, ease), background-color 90ms linear,
      border-color 90ms linear, color 90ms linear, opacity 120ms linear;
  }
  .rk-hover-control:not(:disabled):not(.is-disabled):not(.is-busy):not(.is-progress):not(.is-flashing):not(.is-armed):hover {
    transform: scale(min(var(--hover_grow, 1.04), var(--rk-hover-limit, 1.04)));
  }
  .rk-hover-control:not(:disabled):not(.is-disabled):not(.is-busy):not(.is-progress):not(.is-flashing):not(.is-armed):active {
    transform: scale(max(var(--press_shrink, .97), var(--rk-press-limit, .97)));
  }
  .rk-hover-control:focus-visible { outline: 2px solid var(--primary_light, var(--primary)); outline-offset: 2px; }
  /* a control clicked with the mouse never shows the ring of keyboard focus, even once a key like space is pressed on it; the ring is for moving through the page with tab */
  html[data-rk-input="pointer"] :focus-visible { outline: none !important; }

  :is(.check-row, .action-row, .combo-toggle, .trim-mode-row, .compress-downsample-row, .switch, .ed-switchrow, .ed-check, [data-control-row]):not(.is-disabled):not([aria-disabled="true"]):has(:is(input[type="checkbox"], button, a.btn, [role="button"]):not(:disabled):not([aria-disabled="true"])) { cursor:pointer; }

  .rk-hover-row { transition: background-color 90ms linear, color 90ms linear, padding-left var(--anim_press, 120ms) var(--ease_pop, ease); }
  .rk-hover-row:not(.is-disabled):hover { background: var(--button_bg_hover); padding-left: calc(var(--rk-row-padding, 14px) + 2px); }
  .rk-hover-accent:hover { background: rgba(var(--accent-rgb), .13); }
  .rk-hover-danger:hover { background: rgba(227, 59, 87, .16); color: var(--red); }
  .rk-hover-danger.is-armed:hover { background: var(--red); color: var(--text); padding-left: var(--rk-row-padding, 14px); }
  .rk-hover-nav { transition: transform var(--anim_press, 120ms) var(--ease_pop, ease), background-color 90ms linear, border-color 90ms linear; }
  .rk-hover-nav:hover { transform: translateX(var(--rk-nav-hover-x, 3px)); }
  .rk-hover-nav:active { transform: translateX(var(--rk-nav-hover-x, 3px)) scale(var(--press_shrink, .97)); }

  .rk-hover-card {
    transition: translate 160ms var(--ease_smooth, ease), box-shadow 200ms var(--ease_smooth, ease),
      border-color 100ms linear, opacity 150ms linear;
  }
  .rk-hover-card:hover { border-color: var(--grey1); translate: 0 -2px; box-shadow: 0 5px 14px -8px rgba(0, 0, 0, .4); }
  .rk-hover-card.is-selected:hover { box-shadow: 0 0 0 1px rgba(var(--text-rgb), .6), 0 5px 14px -8px rgba(0, 0, 0, .4); }

  .rk-hover-surface { transition: width 200ms var(--ease_smooth, ease), background-color 90ms linear; }
  .rk-hover-surface:hover { background: var(--rk-hover-surface-bg, rgba(0, 0, 0, .85)); }

  @media (prefers-reduced-motion: reduce) {
    .rk-hover-control, .rk-hover-row, .rk-hover-card, .rk-hover-surface { transition-duration: 0ms; }
  }
</style>
<script>
  // the last way the page was moved through: a press of the mouse, or tab
  (function () {
    var root = document.documentElement;
    root.dataset.rkInput = "pointer";
    document.addEventListener("pointerdown", function () { root.dataset.rkInput = "pointer"; }, true);
    document.addEventListener("keydown", function (e) { if (e.key === "Tab") root.dataset.rkInput = "keyboard"; }, true);
  })();
(function () {
  var rows = ".check-row, .action-row, .combo-toggle, .trim-mode-row, .compress-downsample-row, .switch, .ed-switchrow, .ed-check, [data-control-row]";
  // native labels already activate their input; other single-control rows forward the click once
  document.addEventListener("click", function (event) {
    if (event.defaultPrevented || event.button !== 0 || !(event.target instanceof Element)) return;
    var row = event.target.closest(rows);
    if (!row || row.closest(".is-disabled, [aria-disabled='true'], [inert]")) return;
    var interactive = event.target.closest("input, button, select, textarea, a, [role='button'], [role='combobox'], [contenteditable]:not([contenteditable='false'])");
    if (interactive && row.contains(interactive)) return;
    var controls = row.querySelectorAll("input:not([type='hidden']), button, select, textarea, a.btn, [role='button']");
    if (controls.length !== 1) return;
    var control = controls[0];
    if (!control.matches("input[type='checkbox'], button, a.btn, [role='button']") || control.matches(":disabled, [aria-disabled='true']") || !control.getClientRects().length) return;
    var label = event.target.closest("label");
    if (label && label.control === control) return;
    event.preventDefault();
    control.focus({ preventScroll:true });
    control.click();
  });
})();
(function () {
  var profiles = ["control", "overlay", "row", "accent", "danger", "nav", "card", "surface"];
  var observed = new WeakSet();
  var resize = new ResizeObserver(function (entries) {
    entries.forEach(function (entry) {
      var element = entry.target;
      if (!element.isConnected) {
        resize.unobserve(element);
        observed.delete(element);
        return;
      }
      var size = Math.max(element.offsetWidth, element.offsetHeight);
      if (!size) return;
      // Limit growth to 3px and shrinkage to 4px across the whole button.
      element.style.setProperty("--rk-hover-limit", String(1 + 3 / size));
      element.style.setProperty("--rk-press-limit", String(1 - 4 / size));
    });
  });
  window.RKHover = {
    apply: function (root, mappings) {
      if (!root || !mappings) return;
      profiles.forEach(function (profile) {
        var selector = mappings[profile];
        if (typeof selector !== "string" || !selector) return;
        root.querySelectorAll(selector).forEach(function (element) {
          element.classList.add("rk-hover-" + profile);
          if (profile === "control" && !observed.has(element)) {
            observed.add(element);
            resize.observe(element);
          }
        });
      });
    },
  };
})();
</script>
