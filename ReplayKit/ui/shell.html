<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit</title>
<style>
  :root { --window:#1D1F26; --panel:#272A33; --text:#ffffff; --text-rgb:255, 255, 255; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--window); }
  /* a page that is not showing is transparent and not hidden, so it keeps its layers and is painted the moment it comes back, and nothing of it shows through the page that comes in */
  iframe { position:absolute; left:0; top:0; width:100%; height:100%; border:0; z-index:0; opacity:0; pointer-events:none; background:transparent; }
  iframe.on { z-index:2; opacity:1; pointer-events:auto; }

  /* what the page that is leaving fades into. fading the frame itself to nothing shows the frames stacked under it, which is how the settings page used to flash up for a moment before the preview came on; the pages are covered by the colour of the stage instead, over the whole of the stage and under the skeleton and the veil */
  .dip { position:fixed; inset:0; z-index:3; background:var(--window); opacity:0; pointer-events:none; }
  .dip.on { opacity:1; transition:opacity 100ms ease-out; }
  /* the cover of a swap between two pages comes off with a fade, which is how the new page comes in */
  .dip.soft { transition:opacity 180ms ease-out; }

  /* what stands in for a page that is still loading, so a click on a tab is answered at once: the shape the page had the last time it showed (_skeleton.html), or a plain one before it ever has */
  .skel { position:fixed; inset:0; z-index:4; display:none; background:var(--window); opacity:0; pointer-events:none; }
  .skel-bones { position:absolute; inset:0; }
  .skel.on { display:block; animation:skel-in 140ms ease both; pointer-events:auto; }
  /* the first placeholder of the page is under the curtain of the plugin, so it needs no fade, and it must not start at no opacity: the browser holds a freshly loaded page off the screen until it paints content, and content at no opacity does not count */
  .skel.on.instant { animation:none; opacity:1; }
  .skel.out { animation:skel-out 160ms ease both; pointer-events:none; }
  @keyframes skel-in { from { opacity:0; } to { opacity:1; } }
  @keyframes skel-out { from { opacity:1; } to { opacity:0; } }

  /* over the page for as long as a native window is being built, which holds the window thread for a while; this browser keeps drawing meanwhile, so the spinner keeps turning */
  .veil { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:rgba(0, 0, 0, .45); opacity:0; pointer-events:none; transition:opacity 160ms ease; }
  .veil.on { opacity:1; pointer-events:auto; }
  .veil-box { display:flex; align-items:center; gap:12px; padding:12px 18px 12px 14px; border-radius:10px; background:var(--panel); box-shadow:0 8px 28px rgba(0, 0, 0, .4); font:14px "Segoe UI", system-ui, sans-serif; color:var(--text); }
  .veil-spin { width:18px; height:18px; border-radius:50%; border:2px solid rgba(var(--text-rgb), .22); border-top-color:var(--text); }
  /* the veil is always in the page, so the spinner only turns while it shows or the page draws a frame every frame for nothing */
  .veil.on .veil-spin { animation:veil-spin .8s linear infinite; }
  @keyframes veil-spin { to { transform:rotate(360deg); } }

</style>
<!--#include skeleton-->
</head>
<body>
<div class="dip" id="dip"></div>
<div class="skel" id="skel"><div class="skel-bones" id="skel-bones"></div></div>
<div class="veil" id="veil"><div class="veil-box"><span class="veil-spin"></span><span id="veil-text"></span></div></div>
<script>
// the one browser the clean layout keeps inside the obs window. every view (home, clips, settings, setup) is a same-origin iframe that stays loaded and laid out, and they are simply stacked: the one showing is on top and opaque, so switching is a z-order flip inside a single compositor frame and no native window is hidden or shown, which is what used to flash. a page that is not showing is covered, never hidden, because the browser stops running animation frames for a hidden or transparent frame, and a page that cannot draw while it waits would be revealed empty. the plugin drives it through RKShell and hears back through /shell/shown once the wanted page is really on screen.
(function () {
  "use strict";

  var HELPER = location.origin;
  var VIEWS = { home: "/home-view", clips: "/clips-view", settings: "/settings-view", setup: "/setup-view" };
  var frames = {};
  // the view a show() is still waiting on, so a page that loads late does not steal the screen from a later choice
  var wanted = "";
  // the view whose page is told it is on screen; none while the preview or the obs settings cover this browser
  var active = "";
  var windowUp = true;
  var windowVisible = true;
  var settingsPage = "";
  var dipTimer = 0;
  var softTimer = 0;
  // a native view covered this browser until now: the page that comes back waits, out of sight, for the plugin to say the browser is on top again, and only then settles in
  var parked = false;
  var entering = "";
  var enterTimer = 0;
  // when each page was asked for, loaded and shown, in ms since this page started, for looking at where a slow first open goes
  var marks = {};
  var t0 = performance.now();
  function mark(key) { if (!(key in marks)) marks[key] = Math.round(performance.now() - t0); }

  function dispatch(f) {
    if (!f.loaded) return;
    var shown = windowVisible && f.name === active;
    try {
      var w = f.el.contentWindow;
      // windowUp tells a page that only lost the stage to another view apart from one whose window went away
      w.dispatchEvent(new w.CustomEvent("replaykit-window", { detail: { shown: shown, windowUp: windowUp } }));
    } catch (_) {}
  }
  function dispatchAll() { Object.keys(frames).forEach(function (k) { dispatch(frames[k]); }); }

  function updateStatus() {
    if (active !== "home" && active !== "clips") { document.title = "ReplayKit"; return; }
    var editor = false;
    var f = frames[active];
    if (f && f.loaded) {
      var doc = f.el.contentDocument;
      editor = ["trim-veil", "trim-processing-veil"].some(function (id) {
        var el = doc && doc.getElementById(id);
        return el && el.classList.contains("is-open");
      });
    }
    document.title = "rk-status:" + active + (editor ? ":editor" : ":page");
  }

  function watchEditor(f) {
    if (f.statusObserver) f.statusObserver.disconnect();
    if (f.name !== "home" && f.name !== "clips") return;
    var doc = f.el.contentDocument;
    if (!doc) return;
    f.statusObserver = new MutationObserver(function () { if (active === f.name) updateStatus(); });
    ["trim-veil", "trim-processing-veil"].forEach(function (id) {
      var el = doc.getElementById(id);
      if (el) f.statusObserver.observe(el, { attributes: true, attributeFilter: ["class"] });
    });
    if (active === f.name) updateStatus();
  }

  function ensure(name) {
    var f = frames[name];
    if (f) return f;
    var el = document.createElement("iframe");
    el.setAttribute("title", name);
    el.inert = true;
    f = frames[name] = { name: name, el: el, loaded: false, waiters: [] };
    mark(name + "Requested");
    el.addEventListener("load", function () {
      f.loaded = true;
      watchEditor(f);
      var doc = el.contentDocument;
      if (doc) doc.addEventListener("replaykit-skeleton-layout", function () {
        if (active === name && frames[name] === f) rememberSoon(name);
      });
      mark(name + "Loaded");
      if (skelFor === name) paintSkeleton(name);
      // a page that loaded behind the scenes must not start polling as if it were showing
      dispatch(f);
      f.waiters.splice(0).forEach(function (fn) { fn(); });
      preloadSoon();
    });
    var src = VIEWS[name] + (VIEWS[name].indexOf("?") < 0 ? "?" : "&") + "embedded=1";
    if (name === "settings" && settingsPage) src += "&page=" + encodeURIComponent(settingsPage);
    el.src = src;
    document.body.appendChild(el);
    if (document.title === "rk-status:empty") updateStatus();
    return f;
  }

  function ack(name) {
    fetch(HELPER + "/shell/shown?view=" + encodeURIComponent(name), { method: "POST", cache: "no-store" }).catch(function () {});
  }
  // two frames later whatever was just put on screen has been presented, which is the moment the plugin may put this browser above the preview; the timer only covers a browser that is not producing frames while it sits under the preview
  function ackSoon(name) {
    var sent = false;
    var send = function () {
      if (sent || wanted !== name) return;
      if (active !== name && !document.getElementById("skel").classList.contains("on")) return;
      sent = true;
      ack(name);
    };
    requestAnimationFrame(function () { requestAnimationFrame(send); });
    setTimeout(send, 150);
  }

  // use a neutral placeholder until the view has measured its own layout
  function plainMap(name) {
    var w = innerWidth, h = innerHeight, pad = 28, gap = 16;
    var blocks = [[3, pad, 26, 180, 14, 7], [3, pad, 52, 320, 10, 5]];
    if (name !== "clips") return { w:w, h:h, bg:"", b:blocks };
    var cols = Math.max(1, Math.floor((w - 2 * pad + gap) / (280 + gap)));
    var tileW = (w - 2 * pad - (cols - 1) * gap) / cols, tileH = tileW * 9 / 16;
    for (var y = 88; y < h; y += tileH + gap)
      for (var i = 0; i < cols; i++) blocks.push([2, Math.round(pad + i * (tileW + gap)), Math.round(y), Math.round(tileW), Math.round(tileH), 10]);
    return { w:w, h:h, bg:"", b:blocks };
  }
  // when the placeholder was painted, so it stays up long enough to be seen and the page that replaces it never flickers it away
  var skelOnAt = 0;
  var revealTimer = 0;
  var skelGen = 0;
  // the view the placeholder stands for while it is up
  var skelFor = "";
  // nothing of this page has been on screen yet
  var firstPaint = true;
  // the placeholder goes up at once and painted() runs once it is on screen: two frames later, or after a moment for a browser that is not producing frames while it sits under the preview or the curtain
  function paintSkeleton(name) {
    var variant = name === "settings" ? settingsPage : "";
    var map = RKSkeleton.loadView(name, variant);
    var f = frames[name];
    if (!map && f && f.loaded) {
      try {
        var pageSkeleton = f.el.contentWindow.RKSkeleton;
        var measured = pageSkeleton && pageSkeleton.loadingMap(name, variant);
        if (measured && measured.w === innerWidth && measured.h === innerHeight) map = measured;
      } catch (_) {}
    }
    RKSkeleton.draw(document.getElementById("skel-bones"), map || plainMap(name));
  }

  function showSkeleton(name, painted) {
    var el = document.getElementById("skel");
    paintSkeleton(name);
    el.classList.remove("out");
    el.classList.toggle("instant", firstPaint);
    el.classList.add("on");
    skelOnAt = 0;
    skelFor = name;
    var gen = ++skelGen;
    var done = false;
    var settle = function () {
      if (done || gen !== skelGen) return;
      done = true;
      firstPaint = false;
      skelOnAt = performance.now();
      painted();
    };
    requestAnimationFrame(function () { requestAnimationFrame(settle); });
    setTimeout(settle, 150);
  }
  // true when the placeholder was on screen and is now fading away over the page that replaced it, which then needs no entrance of its own
  function hideSkeleton(fade) {
    var el = document.getElementById("skel");
    skelOnAt = 0;
    skelFor = "";
    ++skelGen;
    if (!el.classList.contains("on")) return false;
    if (!fade) { el.classList.remove("on", "out"); return true; }
    el.classList.add("out");
    setTimeout(function () { if (el.classList.contains("out")) el.classList.remove("on", "out"); }, 170);
    return true;
  }
  // the very first reveal of a page waits for the page to say its first round of data is in (window.__rkReady), so what shows first is the finished page and not its loading state; later reveals flip at once
  function apply(name) {
    var f = frames[name];
    var ready = null;
    if (!f.revealed) {
      f.revealed = true;
      try { ready = f.el.contentWindow.__rkReady; } catch (_) {}
    }
    if (!ready) { reveal(name); return; }
    var patience = new Promise(function (resolve) { setTimeout(resolve, 1500); });
    Promise.race([ready, patience]).then(function () { if (wanted === name) reveal(name); });
  }

  function settle(el) {
    // the page that comes in fades in over the one it replaces, on the compositor, so it costs nothing even while the page behind it is busy. nothing moves: a page that rose into place read as a bounce
    if (!el.animate) return;
    try { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: "cubic-bezier(.2, .7, .3, 1)" }); } catch (_) {}
  }

  // a page that replaces another one is not faded over it: the one that shows fades into the stage colour, and the new one comes up out of it, the way the preview and the pages do through the plugin. the two are never on screen together and nothing moves
  function dipSwap(name) {
    var dip = document.getElementById("dip");
    clearTimeout(dipTimer);
    clearTimeout(softTimer);
    dip.classList.remove("soft");
    dip.classList.add("on");
    dipTimer = setTimeout(function () {
      if (wanted !== name) { undip(false); return; }
      flip(name, active, false, false, true);
    }, 90);
  }

  function reveal(name) {
    var wait = skelOnAt ? skelOnAt + RKSkeleton.MIN_SHOWN_MS - performance.now() : 0;
    if (wait > 0) {
      clearTimeout(revealTimer);
      revealTimer = setTimeout(function () { if (wanted === name) reveal(name); }, wait);
      return;
    }
    var before = active;
    var comingBack = parked;
    parked = false;
    // a page that was held back and never let in must not stay invisible the next time it is asked for
    entering = "";
    clearTimeout(enterTimer);
    var covered = hideSkeleton(true);
    if (!comingBack && !covered && before && before !== name && windowUp) {
      dipSwap(name);
      return;
    }
    flip(name, before, comingBack, covered, false);
  }

  // the page itself goes on top; viaDip says the cover of a swap is up and comes off now, which is the page coming in
  function flip(name, before, comingBack, covered, viaDip) {
    undip(viaDip);
    Object.keys(frames).forEach(function (k) {
      frames[k].el.classList.toggle("on", k === name);
      frames[k].el.style.opacity = "";
      // an inactive page can neither be focused nor read out, while it keeps drawing
      frames[k].el.inert = k !== name;
    });
    active = name;
    updateStatus();
    mark(name + "Shown");
    dispatchAll();
    var f = frames[name];
    if (comingBack && !covered) {
      // the preview or the obs settings were on top, so this browser is under them: the page stays out of sight until enter() says it is on top, since a fade nobody can see is no fade. the timer only exists so a plugin that never says it cannot leave the page invisible
      f.el.style.opacity = "0";
      entering = name;
      clearTimeout(enterTimer);
      enterTimer = setTimeout(enter, 900);
    } else if (!covered && !viaDip && before && before !== name) {
      settle(f.el);
    }
    try {
      if (name === "settings" && settingsPage) f.el.contentWindow.__rkGoToPage(settingsPage);
      f.el.contentWindow.focus();
    } catch (_) {}
    if (name === "settings") settingsPage = "";
    ackSoon(name);
    rememberSoon(name);
  }

  // the shape of a page that has been showing for a moment is kept, and the next time that page has to load its placeholder is drawn from it; not while a dialog or the editor is over it, or while it is still under its own placeholder
  var rememberTimer = 0;
  function rememberSoon(name) {
    clearTimeout(rememberTimer);
    rememberTimer = setTimeout(function () {
      var f = frames[name];
      if (!windowVisible || active !== name || !f || !f.loaded) return;
      try {
        var doc = f.el.contentDocument;
        if (!doc || !doc.body || doc.querySelector(".rk-skel-layer, .modal-veil.is-open, .modal-backdrop.is-visible")) return;
        RKSkeleton.save(RKSkeleton.viewKey(name, doc.body.dataset.skelPage), RKSkeleton.measure(doc.body));
      } catch (_) {}
    }, 1500);
  }

  window.addEventListener("resize", function () {
    if (skelFor) paintSkeleton(skelFor);
    if (active) rememberSoon(active);
  });

  function show(name, page) {
    if (!VIEWS[name]) return;
    wanted = name;
    if (name === "settings" && page) settingsPage = String(page);
    var f = frames[name];
    if (f && f.loaded) { apply(name); return; }
    // asked again while its placeholder is up and its page is on its way: that is already in hand, and only needs saying again once it is on screen
    if (skelFor === name) {
      if (name === "settings" && page) paintSkeleton(name);
      if (skelOnAt) ack(name);
      return;
    }
    // the page is still on its way: its placeholder answers the click, and the browser is lifted over the preview or the curtain with it. the page only starts loading once the placeholder has been painted, since the shell and its pages share one thread, and a page that is being parsed and run keeps anything from being painted until it is done
    showSkeleton(name, function () {
      if (wanted !== name) return;
      ack(name);
      var g = ensure(name);
      if (g.loaded) apply(name);
      else g.waiters.push(function () { if (wanted === name) apply(name); });
    });
  }

  // home and clips load behind the first page a moment after it is up, since the first click after the window opens is usually one of them, and the first page draws its own first round of data before the next one takes the thread; settings and setup load on their first visit
  var PRELOAD_AFTER_MS = 1000;
  var preloaded = false;
  function preloadSoon() {
    if (preloaded) return;
    preloaded = true;
    setTimeout(function () { ["home", "clips"].forEach(function (k) { if (!frames[k]) ensure(k); }); }, PRELOAD_AFTER_MS);
  }

  // the browser is on top of the stage now, so the page that was held back comes in
  function enter() {
    clearTimeout(enterTimer);
    if (!entering) return;
    var f = frames[entering];
    entering = "";
    if (!f) return;
    settle(f.el);
    f.el.style.opacity = "";
  }

  // the preview is about to take the stage: the page on it fades into the stage colour here first, so what the preview replaces is the stage colour and not a page that vanishes
  function leave() {
    var dip = document.getElementById("dip");
    clearTimeout(softTimer);
    dip.classList.remove("soft");
    if (active && frames[active]) dip.classList.add("on");
  }

  // the cover comes off without a fade, the next thing on screen is the page that was asked for; with soft it fades away over the page that has just been put under it
  function undip(soft) {
    var dip = document.getElementById("dip");
    clearTimeout(dipTimer);
    clearTimeout(softTimer);
    if (soft) {
      dip.classList.add("soft");
      dip.classList.remove("on");
      softTimer = setTimeout(function () { dip.classList.remove("soft"); }, 220);
      return;
    }
    dip.classList.remove("soft");
    dip.classList.remove("on");
  }

  // the preview or the obs settings now cover this browser: the displayed page stays as it is, but nothing is told it is on screen
  function park() {
    wanted = "";
    active = "";
    updateStatus();
    parked = true;
    // the preview is on top of this browser now, and the page it left comes back under no cover
    undip();
    if (entering && frames[entering]) frames[entering].el.style.opacity = "";
    entering = "";
    clearTimeout(enterTimer);
    hideSkeleton(false);
    dispatchAll();
    // focus leaves the hidden page, or its focus event would tell it that it is showing again
    try { window.focus(); } catch (_) {}
  }

  function windowShown(up, minimized) {
    var wasVisible = windowVisible;
    windowVisible = !!up;
    windowUp = windowVisible || !!minimized;
    if (windowVisible) sleepWanted = false;
    dispatchAll();
    if (windowVisible && !wasVisible && active) rememberSoon(active);
  }

  // the plugin asks once the window has been hidden for the time set in the settings: as soon as no view holds unsaved work or a running job the title says so, the plugin puts the whole browser on a blank page so its renderer gives the memory back, and it loads this page again when the window comes back
  var sleepWanted = false;
  var sleepAnswers = 0;
  function canSleep() {
    return Object.keys(frames).every(function (k) {
      var f = frames[k];
      if (!f.loaded) return false;
      try {
        var w = f.el.contentWindow;
        return typeof w.__rkCanUnload !== "function" || w.__rkCanUnload();
      } catch (_) { return false; }
    });
  }
  function trySleep() {
    if (!sleepWanted || !canSleep()) return;
    sleepWanted = false;
    document.title = "rk-sleep-ready:" + (++sleepAnswers);
  }
  function sleep() {
    sleepWanted = true;
    trySleep();
  }

  // a veil with a spinner over whatever page is showing, for as long as the plugin builds a native window; false takes it away
  function busy(text) {
    var veil = document.getElementById("veil");
    if (!text) { veil.classList.remove("on"); return; }
    document.getElementById("veil-text").textContent = String(text);
    veil.classList.add("on");
  }

  // the rail was pressed on the page that already shows: the page may have a way back of its own, and the editor of the clips view takes it
  function reselect(name) {
    var f = frames[name];
    if (!f || !f.loaded || name !== active) return;
    try {
      var w = f.el.contentWindow;
      if (typeof w.__rkReselect === "function") w.__rkReselect();
    } catch (_) {}
  }

  // the plugin asks now and then whether this page still runs, and the answer goes through the helper; a page whose renderer died stays silent, and the plugin reloads it
  function ping(n) {
    fetch(HELPER + "/shell/ping?n=" + encodeURIComponent(n), { method: "POST", cache: "no-store" }).catch(function () {});
  }

  // the window is leaving fullscreen on its own (another view, a close), so a clip playing fullscreen inside a page is told too
  function leaveFullscreen() {
    Object.keys(frames).forEach(function (k) {
      try {
        var d = frames[k].el.contentDocument;
        if (d && d.fullscreenElement) d.exitFullscreen();
      } catch (_) {}
    });
  }

  // the plugin has put the keyboard on this browser, and the page that shows is given it, so its keys work without a click on it
  function focusActive() {
    var f = frames[active];
    try { if (f) f.el.contentWindow.focus(); } catch (_) {}
  }

  // another view was picked while the settings page holds unsaved edits: it shows its prompt and tells the plugin where to go once it is answered
  function confirmLeave(target) {
    var f = frames.settings;
    try {
      if (f && f.loaded && typeof f.el.contentWindow.__rkConfirmLeave === "function") { f.el.contentWindow.__rkConfirmLeave(target); return; }
    } catch (_) {}
    fetch(HELPER + "/shell/leave-settings?to=" + encodeURIComponent(target), { method: "POST", cache: "no-store" }).catch(function () {});
  }

  // keep the last displayed page warm in the tray; inactive views can go unless they still hold work
  var IDLE_UNLOAD_MS = 30000;
  function sweep() {
    var now = performance.now();
    Object.keys(frames).forEach(function (k) {
      var f = frames[k];
      var onDisplay = k === active || k === wanted || f.el.classList.contains("on");
      if (k === entering || onDisplay || f.seen === undefined) { f.seen = now; return; }
      if (!f.loaded || now - f.seen < IDLE_UNLOAD_MS) return;
      try {
        var w = f.el.contentWindow;
        if (typeof w.__rkCanUnload === "function" && !w.__rkCanUnload()) return;
      } catch (_) { return; }
      if (f.statusObserver) f.statusObserver.disconnect();
      delete frames[k];
      f.el.remove();
    });
    trySleep();
  }
  setInterval(sweep, 5000);

  // a pick from the quick action menu under the logo goes to the page of its view, which carries it out
  function quickAction(view, id) {
    var f = frames[view];
    try {
      if (f && f.loaded && typeof f.el.contentWindow.__rkQuickAction === "function") f.el.contentWindow.__rkQuickAction(String(id));
    } catch (_) {}
  }

  // a clip is being saved: the clips view puts a card in for it until the clip is written
  function clipSaving(state, name) {
    var f = frames.clips;
    try {
      if (f && f.loaded && typeof f.el.contentWindow.__rkClipSaving === "function") f.el.contentWindow.__rkClipSaving(String(state), String(name || ""));
    } catch (_) {}
  }

  window.RKShell = { quickAction: quickAction, clipSaving: clipSaving, show: show, park: park, confirmLeave: confirmLeave, leave: leave, enter: enter, reselect: reselect, ping: ping, windowShown: windowShown, busy: busy, leaveFullscreen: leaveFullscreen, focus: focusActive, sleep: sleep, timing: function () { return JSON.stringify(marks); } };

  // the plugin names the view to start on in the address (at the start, after sleep, after a reload), so the first thing painted is the placeholder of that view; home without one
  var bootView = new URLSearchParams(location.search).get("view");
  show(VIEWS[bootView] ? bootView : "home");
})();
</script>
<!--#include shell-nav-->
</body>
</html>
