<!-- shared partial (helper #include target: share-card-editor). the share card drawn live from the settings the way the plugin draws it (share_card.cpp: each item placed by its centre and turned around it, with the sizes and colours /share/cover/state names as look), with the logo and the text dragged, resized at their corners and turned by their round handle like the overlay preview; undo and redo are the history of the page. host: RKShareCardEditor.init({ get, set, onChange }) where get(key) is the setting the page shows, set(key, value) puts one into its state and onChange() records and saves the edit; .refresh(cover) redraws, with the /share/cover/state answer when there is a new one; .holdVideo(true) lets go of the picked video until .holdVideo(false), so the helper can replace or delete its file meanwhile. -->
<style>
  .sce-wrap { width:100%; max-width:760px; margin:2px 0 8px; }
  .sce-hint { display:flex; justify-content:flex-end; align-items:center; gap:6px; margin-bottom:4px; }
  .sce-hint-text { font-size:10.5px; color:var(--muted); }
  .sce-screen { position:relative; width:100%; aspect-ratio:16 / 9; overflow:hidden; border-radius:4px; background:var(--window-solid); border:1px solid var(--line); user-select:none; }
  .sce-screen:not(.is-ready) .sce-item { visibility:hidden; }
  .sce-backdrop { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .sce-backdrop[hidden] { display:none; }
  .sce-backdrop.is-last-frame { object-fit:cover; filter:brightness(.35); }
  .sce-item { position:absolute; transform-origin:center; cursor:grab; touch-action:none; }
  .sce-item[hidden] { display:none; }
  .sce-item.is-dragging { cursor:grabbing; }
  .sce-item::after { content:""; position:absolute; inset:-2px; border:1px dashed transparent; border-radius:2px; pointer-events:none; transition:border-color 120ms linear; }
  .sce-screen:hover .sce-item::after, .sce-item.is-active::after { border-color:var(--line2); }
  /* the outline logo the card draws, in the colour of the text through its own shape */
  .sce-logo { display:block; width:100%; height:100%; pointer-events:none; background:currentColor; -webkit-mask:url("/icons/share/obs-logo-outline.svg") center / contain no-repeat; mask:url("/icons/share/obs-logo-outline.svg") center / contain no-repeat; }
  .sce-text { display:block; white-space:pre; font-family:var(--font); font-weight:600; line-height:normal; }
  .sce-grip { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; box-sizing:border-box; border-radius:2px; border:1px solid rgb(var(--accent-rgb)); background:var(--window); opacity:0; transition:opacity 120ms linear; touch-action:none; z-index:2; }
  .sce-grip[data-corner="nw"] { left:0; top:0; cursor:nwse-resize; }
  .sce-grip[data-corner="ne"] { left:100%; top:0; cursor:nesw-resize; }
  .sce-grip[data-corner="sw"] { left:0; top:100%; cursor:nesw-resize; }
  .sce-grip[data-corner="se"] { left:100%; top:100%; cursor:nwse-resize; }
  .sce-turn { position:absolute; left:50%; top:-24px; z-index:3; width:12px; height:12px; margin:-6px 0 0 -6px; box-sizing:border-box; border-radius:50%; border:2px solid var(--text); background:rgb(var(--accent-rgb)); opacity:0; transition:opacity 120ms linear; cursor:grab; touch-action:none; }
  .sce-turn::after { content:""; position:absolute; left:50%; top:10px; width:1px; height:14px; margin-left:-.5px; background:var(--line2); pointer-events:none; }
  .sce-screen:hover .sce-grip, .sce-screen:hover .sce-turn, .sce-item.is-active .sce-grip, .sce-item.is-active .sce-turn { opacity:1; }
  /* the size and turn labels of the shared transform-readout partial, shown with the handles */
  .sce-screen .rk-readout { opacity:0; }
  .sce-screen:hover .rk-readout, .sce-screen .rk-readout.is-active { opacity:1; }
</style>
<div class="sce-wrap">
  <div class="sce-hint">
    <span class="sce-hint-text" data-i18n="settings.dragToPosition"></span>
    <span class="control-note" data-i18n="settings.dragToMoveUseTheCornersToResize"></span>
    <button class="icon-btn field-reset" type="button" id="sceReset" title="Reset to default" data-i18n-title="common.resetToDefault">
      <svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg>
    </button>
  </div>
  <div class="sce-screen" id="sceScreen">
    <canvas class="sce-backdrop" id="sceMotion" aria-hidden="true" hidden></canvas>
    <img class="sce-backdrop" id="sceBackdrop" alt="" hidden>
    <video class="sce-backdrop" id="sceVideo" muted loop playsinline disablepictureinpicture hidden></video>
    <div class="sce-item" id="sceIcon" data-item="icon">
      <div class="sce-logo" id="sceLogo"></div>
      <div class="sce-grip" data-corner="nw"></div><div class="sce-grip" data-corner="ne"></div><div class="sce-grip" data-corner="sw"></div><div class="sce-grip" data-corner="se"></div>
      <div class="sce-turn"></div>
    </div>
    <div class="sce-item" id="sceTextItem" data-item="text">
      <span class="sce-text" id="sceText"></span>
      <div class="sce-grip" data-corner="nw"></div><div class="sce-grip" data-corner="ne"></div><div class="sce-grip" data-corner="sw"></div><div class="sce-grip" data-corner="se"></div>
      <div class="sce-turn"></div>
    </div>
    <div class="rk-readout" id="sceIconReadout" hidden></div>
    <div class="rk-readout" id="sceTextReadout" hidden></div>
  </div>
</div>
<script>
(function () {
  var screenEl = document.getElementById("sceScreen");
  var motionCanvas = document.getElementById("sceMotion");
  // the shader of the moving theme ground and its timing, the same partial the share window is built from
  var motionSource = document.getElementById("sceMotionShader");
  var turnSeconds = Number(motionSource.dataset.turnSeconds), shineSeconds = Number(motionSource.dataset.shineSeconds), loopSeconds = Number(motionSource.dataset.loopSeconds);
  var maskRange = Number(motionSource.dataset.maskRange);
  var backdrop = document.getElementById("sceBackdrop");
  var videoEl = document.getElementById("sceVideo");
  var textEl = document.getElementById("sceText");
  var items = { icon: document.getElementById("sceIcon"), text: document.getElementById("sceTextItem") };
  var readouts = { icon: document.getElementById("sceIconReadout"), text: document.getElementById("sceTextReadout") };
  var POSITION = window.RK_SETTING_LIMITS.share_cover_layout_position;
  var SCALE = window.RK_SETTING_LIMITS.share_cover_layout_scale;
  var TURN = window.RK_SETTING_LIMITS.share_cover_layout_rotation;
  // the middle of the card pulls an item centre in from this many screen pixels, and a turn snaps within this many degrees of a straight angle
  var SNAP_PX = 3, SNAP_DEGREES = 5;
  var host = null, cover = {}, layout = null, gesture = null, backdropKey = "", videoHeld = false;

  function clamp(value, range) { return Math.max(range.min, Math.min(range.max, value)); }
  function copyLayout(from) {
    var out = {};
    ["icon", "text"].forEach(function (name) {
      var at = from[name];
      out[name] = { x: Number(at.x), y: Number(at.y), scale: Number(at.scale), rotation: Number(at.rotation) };
    });
    return out;
  }
  function sameLayout(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  // the background the card is drawn on; an image or video background without its file draws the theme card, as the helper does
  function background() {
    var value = host.get("share_cover_background");
    return (value === "image" && !cover.hasImage) || (value === "video" && !cover.hasVideo) ? "theme" : value;
  }

  function releaseVideo() {
    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.load();
    videoEl.hidden = true;
  }

  // the picked video loops muted under the items, filling the card the way the share window draws it
  function showVideo(on) {
    if (!on || videoHeld) { if (videoEl.hasAttribute("src")) releaseVideo(); return; }
    videoEl.style.objectFit = host.get("share_cover_fit") === "fill" ? "cover" : "contain";
    var src = "/share/cover/video.mp4?t=" + (cover.videoStamp || 0);
    if (videoEl.getAttribute("src") !== src) {
      videoEl.src = src;
      var playing = videoEl.play();
      if (playing && playing.catch) playing.catch(function () {});
    }
    videoEl.hidden = false;
  }

  function showBackdrop(kind) {
    showVideo(kind === "video");
    var key = kind === "image" ? kind + "|" + host.get("share_cover_fit") + "|" + (cover.imageStamp || 0) : kind === "lastframe" ? kind + "|" + (cover.grabStamp || 0) : "";
    if (key === backdropKey) return;
    backdropKey = key;
    if (!key) { backdrop.hidden = true; backdrop.removeAttribute("src"); return; }
    backdrop.className = "sce-backdrop" + (kind === "lastframe" ? " is-last-frame" : "");
    backdrop.style.objectFit = kind === "image" && host.get("share_cover_fit") !== "fill" ? "contain" : "cover";
    // the desktop stands in for the last game frame the share window dims under the card
    backdrop.src = kind === "image" ? "/share/cover/image.png?t=" + (cover.imageStamp || 0) : "/desktop-preview.jpg?t=" + (cover.grabStamp || 0);
    backdrop.hidden = false;
  }

  function setItem(el, at) {
    el.style.left = at.x + "%";
    el.style.top = at.y + "%";
    el.style.transform = "translate(-50%, -50%) rotate(" + at.rotation + "deg)";
  }

  function placeReadout(name) {
    if (items[name].hidden) { RKReadout.hide(readouts[name]); return; }
    RKReadout.place(readouts[name], RK_M("common.sizeAndRotation", { size: layout[name].scale, rotation: layout[name].rotation }), items[name], screenEl);
  }

  // a #rrggbb or #rrggbbaa colour of the settings as css, its opacity the way the plugin draws it
  function colorCss(key) {
    return window.RKColor ? RKColor.toCss(host.get(key)) : host.get(key);
  }

  function createMotion(mask) {
    var gl = motionCanvas.getContext("webgl2", { alpha:false, antialias:false, depth:false, stencil:false });
    if (!gl) return null;

    function compile(type, code) {
      var shader = gl.createShader(type);
      gl.shaderSource(shader, code);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }

    var vertex = compile(gl.VERTEX_SHADER, `#version 300 es
      out vec2 uv;
      void main() {
        vec2 pos = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
        uv = vec2(pos.x, 1.0 - pos.y);
        gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
      }`);
    var fragment = compile(gl.FRAGMENT_SHADER, `#version 300 es
      precision highp float;
      #define float2 vec2
      #define float3 vec3
      #define frac fract
      #define lerp mix
      #define SampleSwirl(at) textureLod(swirlMask, at, 0.0).r
      in vec2 uv;
      uniform float aspect, seconds, shineSeed;
      uniform vec3 ground, accent;
      uniform sampler2D swirlMask;
      out vec4 color;
      const float SwirlTurnSeconds = ${turnSeconds.toFixed(1)};
      const float ShineInterval = ${shineSeconds.toFixed(1)};
      const float SwirlLoopSeconds = ${loopSeconds.toFixed(1)};
      const float SwirlMaskRange = ${maskRange.toFixed(6)};
      ${motionSource.textContent}
      void main() { color = vec4(ShareMotion(uv, aspect, seconds, shineSeed, ground, accent), 1.0); }`);
    var program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    var texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    // the mask is grey, so one channel of it is kept, as the share window keeps it
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gl.RED, gl.UNSIGNED_BYTE, mask);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var aspect = gl.getUniformLocation(program, "aspect"), time = gl.getUniformLocation(program, "seconds");
    var ground = gl.getUniformLocation(program, "ground"), accent = gl.getUniformLocation(program, "accent");
    var seed = gl.getUniformLocation(program, "shineSeed");
    return function (width, height, seconds, colors, shineSeed) {
      if (motionCanvas.width !== width || motionCanvas.height !== height) {
        motionCanvas.width = width;
        motionCanvas.height = height;
      }
      gl.viewport(0, 0, width, height);
      gl.uniform1f(aspect, width / height);
      gl.uniform1f(time, seconds);
      gl.uniform1f(seed, shineSeed);
      gl.uniform3fv(ground, colors[0]);
      gl.uniform3fv(accent, colors[1]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      motionCanvas.hidden = false;
    };
  }

  var drawMotion, motionMask, motionStart = null, motionFrame = 0, motionNextAt = 0, motionColors, motionSeed;
  function readMotionColors() {
    var style = getComputedStyle(screenEl);
    return ["--bg-rgb", "--accent-rgb"].map(function (name) {
      return style.getPropertyValue(name).trim().split(",").map(function (channel) { return Number(channel) / 255; });
    });
  }
  function onScreen() { return !!screenEl.clientHeight && !document.hidden && (!window.RKWindow || RKWindow.up()); }
  // the preview draws no more often than obs records, the rate the share window draws the card at too
  function frameMs() {
    var rate = Number(host.get("fpsNumerator")) / Number(host.get("fpsDenominator"));
    return Number.isFinite(rate) && rate > 0 ? 1000 / rate : Infinity;
  }
  function animate(now) {
    motionFrame = 0;
    if (!host || !cover.look || background() !== "theme" || !onScreen()) {
      motionStart = null;
      return;
    }
    if (!motionMask) {
      motionMask = new Image();
      motionMask.onload = motionMask.onerror = startMotion;
      motionMask.src = "/icons/share/obs-swirl-mask.png";
      return;
    }
    if (!motionMask.complete) return;
    if (drawMotion === undefined) {
      drawMotion = null;
      try { if (motionMask.naturalWidth) drawMotion = createMotion(motionMask); }
      catch (error) { drawMotion = null; console.error("Share card preview shader", error); }
    }
    // without webgl or the mask the preview shows the theme ground still, as the share window does without its mask
    if (!drawMotion) {
      motionCanvas.hidden = true;
      screenEl.style.background = "rgb(var(--bg-rgb))";
      return;
    }
    if (motionStart === null) {
      motionStart = now;
      motionNextAt = 0;
      motionSeed = Math.random();
    }
    // each draw is due one frame of the obs rate after the last one was due, so the rate holds on average whatever the refresh of the screen; requestAnimationFrame lands a little early or late, so a draw within 3 ms of its time counts
    var frame = frameMs();
    if (now >= motionNextAt - 3) {
      motionNextAt = now - motionNextAt > frame ? now + frame : motionNextAt + frame;
      var scale = window.devicePixelRatio || 1;
      // the motion repeats every loop, so its clock wraps there the way the share window wraps it
      drawMotion(Math.round(screenEl.clientWidth * scale), Math.round(screenEl.clientHeight * scale), ((now - motionStart) / 1000) % loopSeconds, motionColors, motionSeed);
    }
    startMotion();
  }
  function startMotion() {
    if (!motionFrame) motionFrame = requestAnimationFrame(animate);
  }

  // sizes follow the card height, so the preview keeps the proportions of the card at any width
  function place() {
    var height = screenEl.clientHeight, look = cover.look;
    if (!height || !look || !layout) return;
    var px = height / 1080;
    screenEl.style.background = "";
    if (background() === "theme") {
      motionColors = readMotionColors();
      startMotion();
    } else {
      motionStart = null;
      motionCanvas.hidden = true;
    }
    var side = look.logo * px * layout.icon.scale / 100;
    items.icon.style.width = side + "px";
    items.icon.style.height = side + "px";
    setItem(items.icon, layout.icon);
    var size = px * layout.text.scale / 100;
    var fontSize = background() === "theme" ? look.themeText : look.text;
    textEl.style.fontSize = fontSize * size + "px";
    var plate = textEl.classList.contains("has-plate");
    textEl.style.padding = plate ? look.plateY * size + "px " + look.plateX * size + "px" : "0";
    textEl.style.borderRadius = plate ? look.plateRadius * size + "px" : "0";
    textEl.style.background = plate ? colorCss("share_cover_box_color") : "none";
    setItem(items.text, layout.text);
    placeReadout("icon");
    placeReadout("text");
  }

  function render() {
    if (!host) return;
    if (!gesture) layout = copyLayout(host.get("share_cover_layout"));
    var kind = background();
    var width = cover.width > 0 && cover.height > 0 ? cover.width : 16, tall = cover.width > 0 && cover.height > 0 ? cover.height : 9;
    screenEl.style.aspectRatio = width + " / " + tall;
    showBackdrop(kind);
    items.icon.hidden = kind === "image" || kind === "video";
    // an unset text is the be right back message and an empty one is a card with no text
    var written = host.get("share_cover_text");
    var text = written === null || written === undefined ? RK_M("screenshare.coverDefaultText") : String(written).trim();
    textEl.textContent = text;
    items.text.hidden = !text;
    // the logo takes the theme text colour on the theme card and the light text over a picture, a video or the last frame
    items.icon.style.color = kind === "theme" || !cover.look ? "var(--text)" : cover.look.lightText;
    textEl.style.color = colorCss("share_cover_text_color");
    if (cover.look) {
      textEl.style.fontWeight = String(cover.look.textWeight);
      document.getElementById("sceLogo").style.opacity = String(cover.look.logoOpacity);
    }
    textEl.classList.toggle("has-plate", kind === "image" || kind === "video");
    screenEl.classList.toggle("is-ready", !!cover.look);
    place();
  }

  function commit() {
    host.set("share_cover_layout", copyLayout(layout));
    host.onChange();
  }

  function onItemDown(ev) {
    if (!host || ev.button !== 0 || !cover.look || gesture) return;
    var el = ev.currentTarget, name = el.dataset.item;
    var handle = ev.target.closest(".sce-grip, .sce-turn");
    ev.preventDefault();
    ev.stopPropagation();
    var box = screenEl.getBoundingClientRect(), at = layout[name];
    var cx = box.left + at.x / 100 * box.width, cy = box.top + at.y / 100 * box.height;
    gesture = {
      el: el, name: name, pointerId: ev.pointerId, box: box, cx: cx, cy: cy, px: ev.clientX, py: ev.clientY,
      kind: !handle ? "move" : handle.classList.contains("sce-turn") ? "turn" : "size",
      start: { x: at.x, y: at.y, scale: at.scale, rotation: at.rotation },
      distance: Math.max(1, Math.hypot(ev.clientX - cx, ev.clientY - cy)),
      angle: Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI,
    };
    el.classList.add("is-active");
    readouts[name].classList.add("is-active");
    if (gesture.kind === "move") el.classList.add("is-dragging");
    try { el.setPointerCapture(ev.pointerId); } catch (_) {}
  }

  function onItemMove(ev) {
    if (!gesture || ev.pointerId !== gesture.pointerId) return;
    var g = gesture, at = layout[g.name];
    if (g.kind === "move") {
      var x = g.start.x + (ev.clientX - g.px) / g.box.width * 100;
      var y = g.start.y + (ev.clientY - g.py) / g.box.height * 100;
      if (!ev.shiftKey) {
        if (Math.abs(x - 50) * g.box.width / 100 <= SNAP_PX) x = 50;
        if (Math.abs(y - 50) * g.box.height / 100 <= SNAP_PX) y = 50;
      }
      at.x = Math.round(clamp(x, POSITION) * 100) / 100;
      at.y = Math.round(clamp(y, POSITION) * 100) / 100;
    } else if (g.kind === "size") {
      at.scale = Math.round(clamp(g.start.scale * Math.hypot(ev.clientX - g.cx, ev.clientY - g.cy) / g.distance, SCALE));
    } else {
      var degrees = g.start.rotation + Math.atan2(ev.clientY - g.cy, ev.clientX - g.cx) * 180 / Math.PI - g.angle;
      degrees = ((degrees + 180) % 360 + 360) % 360 - 180;
      if (!ev.shiftKey) {
        var straight = Math.round(degrees / 90) * 90;
        if (Math.abs(degrees - straight) <= SNAP_DEGREES) degrees = straight === 180 ? -180 : straight;
      }
      at.rotation = Math.round(clamp(degrees, TURN));
    }
    place();
  }

  function onItemUp(ev) {
    if (!gesture || ev.pointerId !== gesture.pointerId) return;
    var g = gesture;
    gesture = null;
    g.el.classList.remove("is-active", "is-dragging");
    readouts[g.name].classList.remove("is-active");
    try { g.el.releasePointerCapture(ev.pointerId); } catch (_) {}
    var at = layout[g.name];
    if (at.x !== g.start.x || at.y !== g.start.y || at.scale !== g.start.scale || at.rotation !== g.start.rotation) commit();
  }

  function reset() {
    if (!host || gesture) return;
    var defaults = copyLayout(window.RK_SETTING_DEFAULTS.share_cover_layout);
    if (sameLayout(defaults, layout)) return;
    layout = defaults;
    commit();
    place();
  }

  Object.keys(items).forEach(function (name) {
    var el = items[name];
    el.addEventListener("pointerdown", onItemDown);
    el.addEventListener("pointermove", onItemMove);
    el.addEventListener("pointerup", onItemUp);
    el.addEventListener("pointercancel", onItemUp);
  });
  document.getElementById("sceReset").addEventListener("click", reset);
  // everything is sized from the card box, which has no size while its tab is hidden, so the card is laid out again whenever that size changes
  new ResizeObserver(place).observe(screenEl);
  document.addEventListener("visibilitychange", startMotion);
  motionCanvas.addEventListener("webglcontextlost", function (event) {
    event.preventDefault();
    drawMotion = null;
    motionCanvas.hidden = true;
  });
  motionCanvas.addEventListener("webglcontextrestored", function () {
    drawMotion = undefined;
    startMotion();
  });
  if (window.RKWindow) RKWindow.onChange(function (up) { if (up) startMotion(); });

  window.RKShareCardEditor = {
    init: function (given) { host = given; render(); },
    refresh: function (status) {
      if (status) {
        var hadImage = cover.imageStamp || 0, hadVideo = cover.videoStamp || 0;
        cover = Object.assign({}, status);
        // a new state answer can follow a new image or video pick or a new look at the desktop, so all are fetched again
        cover.imageStamp = hadImage + 1;
        cover.videoStamp = hadVideo + 1;
        cover.grabStamp = Date.now();
      }
      render();
    },
    holdVideo: function (on) { videoHeld = !!on; render(); },
  };
})();
</script>
