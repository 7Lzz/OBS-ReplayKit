<!-- the messages of the page: RK_M and RK_MH for text a script builds, data-i18n bindings for markup -->
<script>
(function () {
  if (window.RK_I18N) return;
  var ATTRS = ["title", "placeholder", "aria-label", "data-tooltip", "alt"];
  var has = Object.prototype.hasOwnProperty;
  var messages = window.RK_MESSAGES || {};
  var lang = typeof window.RK_LANG === "string" ? window.RK_LANG : "en-US";
  var messageSelector = ["[data-i18n]"].concat(ATTRS.map(function (name) { return "[data-i18n-" + name + "]"; })).join(", ");
  var plurals, numbers, languageRequest = 0;

  function fill(text, vars) {
    if (!vars) return text;
    return text.replace(/\{([A-Za-z0-9_]+)\}/g, function (match, key) { return has.call(vars, key) && vars[key] != null ? String(vars[key]) : match; });
  }

  // the text of a message for these values, its plural form picked and its count formatted, before the values go in
  function pick(id, vars) {
    var text = has.call(messages, id) ? messages[id] : id;
    if (typeof text === "string") return { text: text, vars: vars };
    var count = vars && vars.count;
    if (typeof count !== "number" || !Number.isFinite(count)) return { text: text.other, vars: vars };
    if (!plurals) plurals = new Intl.PluralRules(lang);
    if (!numbers) numbers = new Intl.NumberFormat(lang);
    return { text: text[plurals.select(count)] || text.other, vars: Object.assign({}, vars, { count: numbers.format(count) }) };
  }

  function M(id, vars) {
    var p = pick(id, vars);
    return fill(p.text, p.vars);
  }

  // a message as html: its text is escaped, its **runs** turn bold, and the values go in as the caller gives them, so a caller escapes what is not markup
  function H(id, vars) {
    var p = pick(id, vars);
    var safe = p.text.replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; });
    return fill(safe.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"), p.vars);
  }

  // the language and ids an element last rendered with: a bound element a script moves keeps whatever text the script gave it since, and only a new id or a new language renders it again
  var rendered = new WeakMap();

  function renderElement(element) {
    var id = element.getAttribute("data-i18n");
    var key = lang + "|" + id + "|" + ATTRS.map(function (name) { return element.getAttribute("data-i18n-" + name); }).join("|");
    if (rendered.get(element) === key) return;
    rendered.set(element, key);
    if (id && has.call(messages, id)) {
      var text = M(id);
      if (element.textContent !== text) element.textContent = text;
    }
    ATTRS.forEach(function (name) {
      var attributeId = element.getAttribute("data-i18n-" + name);
      if (attributeId && has.call(messages, attributeId)) element.setAttribute(name, M(attributeId));
    });
  }

  function renderMessages(root) {
    root = root && root.nodeType === 1 ? root : document;
    if (root.nodeType === 1 && root.matches(messageSelector)) renderElement(root);
    root.querySelectorAll(messageSelector).forEach(renderElement);
  }

  // keyed text renders the moment the parser or a script adds it, or a script points an element at another message, so no label waits for domcontentloaded or stays empty in markup a script builds
  function watchMessages() {
    new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++) {
        var r = records[i];
        if (r.type === "attributes") { renderElement(r.target); continue; }
        for (var j = 0; j < r.addedNodes.length; j++) if (r.addedNodes[j].nodeType === 1) renderMessages(r.addedNodes[j]);
      }
    }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-i18n"].concat(ATTRS.map(function (name) { return "data-i18n-" + name; })) });
  }

  // switches the page to another language without loading it again, for a picker that shows its choice before it is saved; bound text renders again here, and a page redraws the text its scripts built on the rk-language event
  function use(code) {
    if (typeof code !== "string" || !/^[a-z]{2,3}-[A-Za-z]{2,4}$/.test(code)) return Promise.reject(new Error("Unknown language."));
    var request = ++languageRequest;
    return fetch("/locale/messages.json?lang=" + encodeURIComponent(code), { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("The messages of " + code + " could not be loaded.");
      return res.json();
    }).then(function (loaded) {
      if (request !== languageRequest) return;
      messages = loaded;
      lang = code;
      plurals = numbers = null;
      document.documentElement.lang = code;
      renderMessages();
      document.dispatchEvent(new CustomEvent("rk-language", { detail: { lang: code } }));
    });
  }

  window.RK_M = M;
  window.RK_MH = H;
  // a number with the decimal mark of the language, for the sizes and speeds a page writes out; a value a script reads back from a field keeps toFixed
  function number(value, digits) {
    return new Intl.NumberFormat(lang, { minimumFractionDigits: digits, maximumFractionDigits: digits }).format(value);
  }
  window.RK_I18N = { use: use, lang: function () { return lang; }, number: number };
  document.documentElement.lang = lang;
  watchMessages();
})();
</script>
