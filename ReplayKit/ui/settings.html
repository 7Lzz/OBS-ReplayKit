<!DOCTYPE html>
<html lang="en" class="settings-view" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit Settings</title>
  <link rel="icon" type="image/svg+xml" href="/obs-icon.svg?v=3" />
<style>
  :root {
    --window:#1D1F26;
    --side:#272A33;
    --panel:#272A33;
    --field:#3C404D;
    --field2:#323540;
    --field-dark:#1D1F26;
    --line:#3C404D;
    --line2:#5B6273;
    --selected:#284CB8;
    --selected2:#476BD7;
    --text:#ffffff;
    --muted:#969696;
    --disabled:#969696;
    --danger:#e33b57;
    --danger-deep:#7f2232;
    --success:#37D247;
    --warning:#E2A33B;
    --link:#5c78df;
    --button:#3C404D;
    --button-hover:#464B59;
    --on-accent:#ffffff;
    --on-accent-rgb:255, 255, 255;
    --text-rgb:255, 255, 255;
    --bg-rgb:29, 31, 38;
    --accent-rgb:40, 76, 184;
    --danger-rgb:227, 59, 87;
    --hairline:rgba(var(--text-rgb),.08);
    --overlay-soft:rgba(var(--text-rgb),.06);
    --overlay-strong:rgba(var(--text-rgb),.14);
    --shadow:rgba(0,0,0,.45);
    --shadow-weak:rgba(0,0,0,.28);
    --font:"Segoe UI",system-ui,sans-serif;
    /* shared motion language -- kept in step with clips.html / controls_app.html. */
    --ease_pop:cubic-bezier(.2, .7, .3, 1);
    --ease_smooth:cubic-bezier(.16, 1, .3, 1);
    --anim_press:130ms;
    --anim_menu:200ms;
    --hover_grow:1.03;
    --press_shrink:.96;
  }
  * { box-sizing:border-box; }
  html,body {
    width:100%; height:100%; margin:0; overflow:hidden;
    background:var(--window); color:var(--text); font:13px var(--font);
    user-select:none; -webkit-user-select:none;
  }
  button,input { font:inherit; }
  button { user-select:none; }
  .shell {
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-columns:190px 1fr;
    grid-template-rows:1fr 58px;
    gap:0;
    background:var(--window);
    padding:10px 8px 0 10px;
    position:relative;
  }
  .sidebar {
    grid-row:1 / span 2;
    background:var(--side);
    border-radius:4px;
    padding:10px 6px;
    margin:0 8px 50px 0;
    display:flex;
    flex-direction:column;
  }
  .sidebar-footer {
    margin-top:auto;
    padding:8px 8px 2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  /* each version says which program it is, split by the dot of the clip cards */
  .sidebar-version {
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    white-space:nowrap;
    font-size:11px;
    color:var(--muted);
  }
  .sidebar-version .dot {
    flex:none;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--muted);
  }
  .sidebar-github {
    display:flex;
    align-items:center;
    justify-content:center;
    width:24px;
    height:24px;
    border-radius:4px;
    color:var(--muted);
    flex:0 0 auto;
  }
  .sidebar-github:hover { background:var(--button-hover); color:var(--text); }
  .sidebar-github svg { display:block; width:15px; height:15px; fill:currentColor; }
  .search-wrap {
    padding:0 3px 8px;
  }
  .search-wrap .search-input {
    height:30px;
    background:var(--window);
  }
  .nav-btn {
    width:100%;
    height:34px;
    border:1px solid transparent;
    border-radius:4px;
    background:transparent;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 10px;
    cursor:pointer;
    text-align:left;
  }
  .nav-btn:hover { background:var(--button-hover); }
  .nav-btn.is-active {
    background:var(--selected);
    border-color:var(--selected2);
    color:var(--on-accent);
  }
  .nav-btn svg { width:17px; height:17px; fill:currentColor; flex:0 0 auto; }
  .main {
    overflow:auto;
    padding:0 10px 10px 0;
  }
  /* inside the obs window the resize grip sits over the last 18px of the right edge, so the track of this scrollbar stops above it; the page reaches the edge of the window there, and the 8px the shell keeps on the right is the whole gap, the same as the one between the tabs and the page */
  html.rk-embedded .main { --sb-end:26px; padding-right:0; }
  /* the buttons of the footer keep clear of the resize corner, which sits over the last 18px of the bottom right of the window */
  html.rk-embedded .footer { padding-right:14px; }
  .page { display:none; }
  .page.is-active { display:block; }
  body.is-searching .page { display:block; }
  body.is-searching .page.search-hidden { display:none; }
  .search-empty {
    display:none;
    color:var(--muted);
    padding:12px 8px;
  }
  body.is-searching .search-empty.is-visible { display:block; }
  .search-hidden-row { display:none !important; }
  .nav-btn { transition:opacity 120ms linear; }
  /* inside the obs window the list is drawn flat with section labels, and the obs settings draw the same list natively in the same column, so going from one to the other reads as one settings window. the classic popup keeps its own look */
  .nav-group, .nav-switch, .nav-foot, .nav-rule { display:none; }
  /* the column is the 214px list of the obs settings plus the 8px margin of the panel, so the panel keeps its size when going over to them */
  html.rk-embedded .shell { grid-template-columns:222px 1fr; }
  html.rk-embedded .sidebar { border-radius:8px; margin:0 8px 8px 0; padding-bottom:4px; overflow-y:auto; }
  html.rk-embedded .nav-group { display:block; padding:16px 12px 6px; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); flex:0 0 auto; }
  html.rk-embedded .nav-group.is-first { padding-top:6px; }
  html.rk-embedded .nav-btn, html.rk-embedded .nav-switch { display:flex; width:100%; height:36px; margin-bottom:2px; border:0; border-radius:8px; background:transparent; color:rgba(var(--text-rgb),.86); align-items:center; gap:10px; padding:0 12px; cursor:pointer; text-align:left; font-size:14px; font-weight:500; flex:0 0 auto; }
  html.rk-embedded .nav-btn:hover, html.rk-embedded .nav-switch:hover { background:rgba(var(--text-rgb),.07); }
  html.rk-embedded .nav-btn.is-active { background:rgba(var(--text-rgb),.13); color:var(--text); font-weight:600; }
  html.rk-embedded .nav-btn svg { display:block; width:17px; height:17px; fill:currentColor; flex:0 0 auto; opacity:.72; }
  html.rk-embedded .nav-btn:hover svg, html.rk-embedded .nav-btn.is-active svg { opacity:1; }
  html.rk-embedded .nav-btn span, html.rk-embedded .nav-switch span { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  /* the version and the link sit on a rule at the bottom of the list, and under the rule is the way over to the obs settings, at the same place the way back sits on the obs side; the footer is what pushes itself and the foot down */
  html.rk-embedded .nav-foot { display:block; flex:0 0 auto; }
  html.rk-embedded .nav-rule { display:block; height:1px; margin:0 10px; background:rgba(var(--text-rgb),.10); flex:0 0 auto; }
  html.rk-embedded .nav-foot .nav-group { height:22px; margin:5px 0 8px; padding:0 12px; line-height:22px; }
  html.rk-embedded .nav-switch span { flex:1 1 auto; }
  html.rk-embedded .nav-switch { padding-right:11px; }
  html.rk-embedded .nav-logo { display:block; width:17px; height:17px; object-fit:contain; flex:0 0 auto; }
  /* the chevron is stroked like the one on the way back of the obs settings: thin, round ends, pointing on */
  html.rk-embedded .nav-chev { display:block; width:10px; height:12px; flex:0 0 auto; fill:none; stroke:rgba(var(--text-rgb),.62); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  html.rk-embedded .sidebar-footer { padding:0 10px 6px; }
  /* the shared hover nudge of a tab button is 1.5px sideways; here it is 1px, and the press shrinks less, so it reads as a hint rather than a slide */
  html.rk-embedded .rk-hover-nav:hover { transform:translateX(1px); }
  html.rk-embedded .rk-hover-nav:active { transform:translateX(1px) scale(.985); }
  .box {
    background:var(--panel);
    border-radius:4px;
    padding:0 0 11px;
    margin:0 8px 10px 0;
  }
  .box-title {
    height:30px;
    display:flex;
    align-items:center;
    padding:0 8px;
    font-weight:700;
  }
  .form-row {
    display:grid;
    grid-template-columns:180px minmax(260px,1fr);
    align-items:center;
    column-gap:8px;
    min-height:42px;
    padding:3px 8px;
  }
  /* the [hidden] attribute otherwise loses to .form-row's display:grid (same specificity, author sheet wins). */
  .form-row[hidden] { display:none; }
  .form-row.tight { min-height:30px; }
  .box-title + #setupFileRow[hidden] + #setupFileStatusRow[hidden] + .form-row > .action-row { border-top:0; }
  .label {
    justify-self:end;
    text-align:right;
    color:var(--text);
    line-height:1.25;
  }
  .field-wrap { min-width:0; display:flex; align-items:center; gap:6px; }
  .field-wrap.obs-menu-buttons { flex-wrap:wrap; }
  .field-wrap.is-stacked {
    flex-direction:column;
    align-items:stretch;
  }
  /* a stacked field-wrap (input + hint under it) grows the row -- pin the label to the input's row, not the cell's center, so it stays aligned when the hint appears. inputs are 32px tall. */
  .form-row:has(> .field-wrap.is-stacked) { align-items:start; }
  .form-row:has(> .field-wrap.is-stacked) > .label { line-height:32px; }
  .hint { color:var(--muted); font-size:12px; margin-left:4px; }
  #storageCompressionType .combo-option[data-value="smaller"],
  #storageCompressionType.is-smaller .combo-label,
  .storage-compression-warning { color:var(--danger); }
  #storageCompressionType .combo-option[data-value="smaller"].is-selected { background:var(--danger); color:var(--on-accent); }
  #compressionMode .combo-option[data-value="tiniest"],
  #compressionMode[data-value="tiniest"] .combo-label { color:var(--danger); }
  #compressionMode .combo-option[data-value="tiniest"].is-selected { background:var(--danger); color:var(--on-accent); }
  .storage-compression-warning { line-height:1.5; }
  .form-row.is-disabled .label,
  .form-row.is-disabled .hint {
    color:var(--disabled);
  }
  .text-input:disabled { color:var(--disabled); background:var(--field2); cursor:default; }
  .form-row.is-disabled .check-row {
    color:var(--disabled);
    cursor:default;
  }
  .text-input,.spin-input,.hotkey-input {
    width:100%;
    height:32px;
    border:1px solid var(--field-solid,var(--field));
    border-radius:4px;
    background:var(--field);
    color:var(--text);
    outline:none;
  }
  .game-rule-actions {
    width:100%;
    display:grid;
    grid-template-columns:minmax(180px,1fr) 28px;
    align-items:center;
    gap:4px;
  }
  /* the auto game list is drawn like the recording audio list: one row per game with its icon, the name, what it was matched on, and a remove button that comes up on hover */
  .game-rule-table {
    width:100%;
    min-height:30px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    background:rgba(var(--text-rgb),.035);
  }
  .game-rule-empty { padding:14px 14px; color:var(--muted); font-size:12px; line-height:1.5; }
  .game-rule-row {
    display:grid;
    grid-template-columns:24px minmax(0,1fr) 28px;
    align-items:center;
    column-gap:12px;
    min-height:50px;
    padding:0 8px 0 14px;
    transition:background 120ms linear;
  }
  .game-rule-row + .game-rule-row { border-top:1px solid var(--line); }
  .game-rule-row:hover { background:rgba(var(--text-rgb),.06); }
  .game-rule-ic { width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:var(--text); }
  .game-rule-ic svg, .game-rule-ic img { width:22px; height:22px; object-fit:contain; }
  .game-rule-text { min-width:0; }
  .game-rule-main,
  .game-rule-sub {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .game-rule-main { font-weight:600; }
  .game-rule-sub {
    color:var(--muted);
    font-size:12px;
    margin-top:1px;
  }
  .form-row.is-disabled .game-rule-table {
    border-color:var(--field2);
    opacity:.6;
  }
  .projector-action-row {
    width:100%;
    max-width:380px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
  }
  .projector-action-row .btn { width:100%; }
  .account-line { min-height:20px; display:flex; align-items:center; color:var(--text); }
  .account-line.is-off { color:var(--muted); }
  .account-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .text-input { padding:0 9px; }
  .volume-control {
    width:100%;
    display:grid;
    grid-template-columns:72px minmax(180px,1fr);
    align-items:center;
    gap:8px;
  }
  .volume-value {
    background:transparent;
    border-color:var(--field-solid,var(--field));
    text-align:center;
    padding:0 8px;
  }
  .volume-slider-wrap {
    position:relative;
    height:32px;
    min-width:0;
  }
  /* the look of the slider is the shared one of the slider partial */
  .volume-slider { position:relative; z-index:1; width:100%; height:32px; }
  /* recording audio in the audio tab: the mode of the list on a row of its own, then one row per source, and under the game audio section one row per program */
  /* the list stands in the column of the fields, under the dropdown that decides what it shows: 8px of the row, the 180px label column and the 8px gap */
  .ra-list { margin:6px 8px 0 196px; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:rgba(var(--text-rgb),.035); }
  .ra-row { display:grid; grid-template-columns:42px 26px minmax(110px,1fr) minmax(170px,300px) 46px; align-items:center; column-gap:12px; min-height:54px; padding:0 14px; --sw-w:34px; --sw-h:20px; }
  .ra-row + .ra-row { border-top:1px solid var(--line); }
  /* the whole row is the button, so it shows a pointer and a hover fill; the slider keeps its own cursor */
  .ra-row { cursor:pointer; user-select:none; transition:background 120ms linear; }
  .ra-row:hover, .ra-row.is-app:hover { background:rgba(var(--text-rgb),.06); }
  .ra-row .volume-slider-wrap { cursor:default; }
  .ra-row .check-row { min-height:0; width:auto; justify-content:center; }
  .ra-row .check-row input[type=checkbox] { margin:0; }
  .ra-row.is-section .ra-name { font-weight:700; }
  .ra-row.is-app { min-height:46px; padding-left:36px; background:rgba(var(--text-rgb),.02); }
  .ra-empty { padding:14px 14px 14px 36px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.5; }
  .ra-ic { width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:var(--text); transition:opacity 120ms linear; }
  .ra-ic svg, .ra-ic img { width:22px; height:22px; object-fit:contain; }
  .ra-name { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:opacity 120ms linear; }
  .ra-pct { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; transition:opacity 120ms linear; }
  .ra-slider-note { color:var(--muted); font-size:12px; transition:opacity 120ms linear; }
  .ra-row .volume-slider-wrap { transition:opacity 120ms linear; }
  .ra-row.is-off .ra-ic, .ra-row.is-off .ra-name, .ra-row.is-off .ra-pct, .ra-row.is-off .ra-slider-note { opacity:.5; }
  .ra-row.is-off .volume-slider-wrap { opacity:.4; }
  /* the microphone volume is the slider of the recording audio list in this tab, so the row of the shared microphone controls is not drawn a second time; its control stays on the page and follows the list */
  #page-audio .form-row:has(#micVolume) { display:none; }
  .color-control {
    width:100%;
    display:grid;
    grid-template-columns:42px minmax(120px, 180px);
    align-items:center;
    gap:8px;
  }
  .color-picker {
    width:42px;
    height:32px;
    border:1px solid var(--field-solid,var(--field));
    border-radius:4px;
    background:var(--color, var(--field));
    padding:3px;
    cursor:pointer;
    box-shadow:inset 0 0 0 3px var(--field-dark);
  }
  .color-picker:hover { border-color:var(--line2); }
  .color-value {
    width:100%;
    text-transform:lowercase;
  }
  .spin {
    position:relative;
    width:100%;
    max-width:none;
  }
  .spin-input {
    padding:0 37px 0 9px;
  }
  .spin-buttons {
    position:absolute;
    right:0;
    top:0;
    width:28px;
    height:32px;
    border-left:1px solid var(--panel-solid,var(--panel));
    display:grid;
    grid-template-rows:1fr 1fr;
    background:var(--field);
  }
  .spin-btn {
    border:0;
    background:transparent;
    color:var(--text);
    cursor:pointer;
    line-height:1;
    padding:0;
  }
  .spin-btn:hover { background:var(--button-hover); }
  .spin-btn + .spin-btn { border-top:1px solid var(--panel-solid,var(--panel)); }
  .spin-btn svg { width:9px; height:9px; fill:currentColor; }
  /* the switch and the rows it sits in come from the shared _switch partial; the base of a row of text and a switch is here */
  .check-row {
    min-height:32px;
    width:100%;
    max-width:440px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
  }
  .form-row.is-disabled .check-row input { opacity:.45; cursor:default; }
  .hotkey-grid {
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 0;
    margin-right:8px;
    min-height:380px;
  }
  .hotkey-section {
    font-weight:700;
    padding:9px 8px 5px;
  }
  .hotkey-row {
    display:grid;
    grid-template-columns:280px minmax(240px,1fr) auto;
    gap:6px;
    align-items:center;
    min-height:36px;
    padding:0 8px;
  }
  .hotkey-row .label { justify-self:end; }
  .hotkey-input {
    display:flex;
    align-items:center;
    padding:0 9px;
    overflow:hidden;
    white-space:nowrap;
  }
  .hotkey-input:focus {
    border-color:var(--selected2);
    background:var(--field-dark);
  }
  .hotkey-input.is-empty { color:var(--muted); }
  /* the keys of a bongo cat mode: a hotkey field each that takes the next key pressed, quieter while it keeps the key of the mode */
  .bongo-keys { flex:1; display:grid; grid-template-columns:repeat(auto-fill, 66px); justify-content:end; gap:6px; min-width:0; }
  .bongo-keys .hotkey-input { justify-content:center; cursor:pointer; }
  .bongo-keys .hotkey-input.is-default { color:var(--muted); }
  .bongo-keys .hotkey-input.is-listening { border-color:var(--selected2); background:var(--field-dark); color:var(--text); }
  #bongoKeysRow > .label { align-self:start; }
  /* the keys of the custom wasd keyboard where they sit on a keyboard; a picked key is filled with the accent the way a picked option is */
  /* the keys row is a wide row: its label in the top left and the keyboard under it across the page, the reset beside the keyboard */
  .page .box .form-row.ovk-row { grid-template-columns:minmax(0,1fr); }
  .page .form-row.ovk-row > .field-wrap { align-items:flex-start; justify-content:space-between; }
  .ovk-board { position:relative; flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; }
  .ovk-key { position:absolute; display:flex; align-items:center; justify-content:center; box-sizing:border-box; padding:0; overflow:hidden; white-space:nowrap; border:1px solid var(--line2); border-radius:4px; background:var(--button); color:var(--text); font:inherit; cursor:pointer; transition:background-color 90ms linear, border-color 90ms linear, color 90ms linear; }
  .ovk-key:hover { background:var(--button-hover); }
  .ovk-key.is-on { background:var(--selected, var(--primary)); border-color:transparent; color:var(--on-accent); }
  .ovk-key:focus-visible { outline:2px solid var(--selected2); outline-offset:1px; }
  .hotkey-actions { display:flex; gap:3px; }
  .hotkey-row[hidden] { display:none; }
  /* as wide as the three buttons of the row above, so both fields line up */
  .hotkey-extra-row .hotkey-actions { width:90px; }
  .icon-btn {
    width:28px;
    height:28px;
    border:1px solid var(--line2);
    border-radius:4px;
    background:var(--button);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-btn:hover { background:var(--button-hover); }
  .icon-btn:disabled {
    color:var(--disabled);
    opacity:.65;
    cursor:default;
  }
  .icon-btn svg { width:16px; height:16px; fill:currentColor; }
  /* per-field "reset to default" button -- let the control give up room for it. dimmed while the value is already default. */
  .field-wrap:has(> .field-reset) > .volume-control,
  .field-wrap:has(> .field-reset) > .color-control { width:auto; flex:1; }
  .field-reset { flex:none; }
  .field-reset.is-default { opacity:.4; }
  .field-reset.is-default:hover { opacity:1; }
  /* "browse…" button next to a path text field -- opens a native file/folder picker */
  .field-wrap:has(> .field-browse) > .text-input { width:auto; flex:1 1 0; min-width:0; }
  .field-browse { flex:none; }
  /* the floating colour picker lives in the shared _color-picker partial now */

  .inline-status {
    color:var(--muted);
    font-size:12px;
    line-height:1.35;
    min-height:18px;
  }
  .inline-status.good { color:var(--success); }
  .inline-status.bad { color:var(--danger); }
  .update-label { display:flex; align-items:baseline; gap:12px; }
  .update-label .inline-status { min-height:0; font-weight:400; overflow-wrap:anywhere; }

  }

  .settings-history .btn { display:grid; place-items:center; min-width:32px; width:32px; padding:0; }
  .settings-history svg { width:17px; height:17px; fill:currentColor; }
  .footer-note { min-width:0; color:var(--muted); font-size:12px; line-height:1.35; text-align:right; }
  .footer-note.bad { color:var(--danger); }
  .btn {
    min-width:52px;
    height:30px;
    border:1px solid var(--field-solid,var(--field));
    border-radius:4px;
    background:var(--field);
    color:var(--text);
    padding:0 13px;
    cursor:pointer;
  }
  .btn:hover { background:var(--button-hover); }
  .btn.is-primary {
    background:var(--selected);
    border-color:var(--selected2);
    color:var(--on-accent);
  }
  .btn.is-primary:hover { background:var(--selected2); }
  .btn.is-danger {
    background:var(--danger-deep);
    border-color:var(--danger);
    color:#fff;
  }
  .btn.is-danger:hover { background:var(--danger); }
  .btn:disabled {
    color:var(--muted);
    opacity:1;
    cursor:default;
    background:var(--panel);
    border-color:var(--field-solid,var(--field));
  }
  .modal-backdrop {
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,0,0,0.42);
    z-index:20;
  }
  .modal-backdrop.is-visible { display:flex; }
  .modal {
    width:min(430px, calc(100vw - 48px));
    background:var(--panel);
    border:1px solid var(--line2);
    border-radius:4px;
    box-shadow:0 16px 42px var(--shadow);
    overflow:hidden;
  }
  .modal-title {
    min-height:34px;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-weight:700;
    border-bottom:1px solid var(--line);
    background:var(--field-dark);
  }
  .modal-body {
    padding:13px 12px 12px;
  }
  .modal-text {
    line-height:1.45;
    margin-bottom:12px;
  }
  .modal-actions {
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:0 12px 12px;
  }
  @media (max-width:760px) {
    .shell { grid-template-columns:154px 1fr; }
    html.rk-embedded .shell { grid-template-columns:176px 1fr; }
    .form-row { grid-template-columns:130px minmax(180px,1fr); }
    .ra-list { margin-left:146px; }
    .hotkey-row { grid-template-columns:180px minmax(180px,1fr) auto; }
  }

  .spin-btn { transition:background-color 90ms linear; }

  /* modal + section-switch settle in rather than snapping. */
  @keyframes rk-veil-in { from { opacity:0; } to { opacity:1; } }
  @keyframes rk-modal-in { from { opacity:0; transform:translateY(10px) scale(.965); } to { opacity:1; transform:none; } }
  @keyframes rk-page-in { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .modal-backdrop.is-visible { animation:rk-veil-in 130ms ease both; }
  .modal-backdrop.is-visible .modal { animation:rk-modal-in 190ms var(--ease_smooth) both; }
  .page.is-active { animation:rk-page-in 190ms var(--ease_smooth) both; }

<style id="settings-layout">
  .shell { grid-template-columns:222px minmax(0,1fr); padding:10px 10px 0; }
  .sidebar { min-height:0; overflow-y:auto; margin-bottom:10px; border-radius:8px; }
  .nav-group { display:block; padding:16px 12px 6px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .nav-group.is-first { padding-top:8px; }
  .nav-btn { flex-shrink:0; height:36px; margin-bottom:2px; border:0; border-radius:6px; }
  .nav-btn.is-active { background:rgba(var(--text-rgb),.13); color:var(--text); }
  .main, html.rk-embedded .main { min-width:0; padding:20px 24px 24px; }
  .page, .search-empty { width:100%; max-width:900px; margin:0 auto; }
  .page-header { display:flex; align-items:center; gap:10px; padding:0 0 14px; text-align:left; }
  .page-header svg { display:block; flex:none; width:22px; height:22px; margin:0; fill:currentColor; color:var(--muted); }
  .page-heading { margin:0; font-size:17px; font-weight:650; line-height:1.3; }
  .page-subtitle { display:none; max-width:560px; margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
  .box, .hotkey-grid { margin:0 0 16px; padding:4px 20px; border:0; border-radius:8px; background:var(--panel); }
  .box-title { display:block; height:auto; padding:16px 0; border-bottom:1px solid var(--hairline); font-size:14px; line-height:1.4; }
  .page .box .form-row {
    grid-template-columns:minmax(0,1fr) minmax(200px,300px);
    gap:12px 28px; min-height:66px; padding:16px 0;
    border-top:1px solid var(--hairline); background-image:none;
  }
  .page .box-title + .form-row { border-top:0; }
  .page .box-title + #setupFileRow[hidden] + #setupFileStatusRow[hidden] + .form-row { border-top:0; }
  .page .form-row > .label { justify-self:stretch; text-align:left; line-height:1.4; font-weight:600; min-width:0; }
  .setting-description { display:block; margin-top:5px; color:var(--muted); font-size:12px; line-height:1.55; font-weight:400; }
  .setting-description:empty { display:none; }
  .page .form-row > .field-wrap { width:100%; }
  .page .form-row > .field-wrap:has(> .btn) { justify-content:flex-end; }
  .page .form-row > .field-wrap.is-stacked { align-self:center; gap:6px; }
  .page .form-row:has(> .field-wrap.is-stacked) > .label { line-height:1.4; }
  .page .form-row.setting-wide { grid-template-columns:minmax(0,1fr); gap:10px; }
  .page .form-row.setting-wide > :first-child:empty { display:none; }
  .page .form-row.setting-wide > :is(.check-row, .action-row) {
    grid-column:1; max-width:none; min-height:32px; padding:0; border:0;
    gap:24px; font-weight:600;
  }
  .page .form-row.setting-wide > :is(.check-row, .action-row) > span { flex:1; }
  .page .form-row.setting-wide > :is(.field-wrap, .inline-status) { grid-column:1; }
  .page .form-row:not(:has(> .label)):has(.inline-status, .release-link):not(:has(.inline-status:not(:empty), .release-link:not([hidden]))) { display:none; }
  .page .field-wrap > .text-input, .page .field-wrap > .spin { min-width:0; }
  .page .hint { margin-left:0; line-height:1.5; }
  .page .volume-control { grid-template-columns:60px minmax(0,1fr); min-width:0; }
  /* a slider runs the full width of its row under the name; the value box and the reset button stay on the line of the name */
  .page .box .form-row:has(> .field-wrap > .volume-control) { grid-template-columns:minmax(0,1fr) 64px auto; grid-template-areas:"label value reset" "slider slider slider"; gap:10px 8px; }
  .page .form-row:has(> .field-wrap > .volume-control) > .label { grid-area:label; }
  .page .form-row:has(> .field-wrap > .volume-control) > .field-wrap,
  .page .form-row:has(> .field-wrap > .volume-control) .volume-control { display:contents; }
  .page .form-row:has(> .field-wrap > .volume-control) .volume-value { grid-area:value; }
  .page .form-row:has(> .field-wrap > .volume-control) .field-reset { grid-area:reset; }
  .page .form-row:has(> .field-wrap > .volume-control) :is(.volume-slider-wrap, .sens-wrap) { grid-area:slider; }
  .page .color-control { grid-template-columns:42px minmax(0,1fr); min-width:0; }
  .page .ra-list { margin:0 0 16px; }
  .page .ra-row { grid-template-columns:34px 24px minmax(80px,1fr) minmax(90px,200px) 40px; gap:10px; padding:0 12px; }
  .page .ra-row.is-app { padding-left:24px; }
  .page .hotkey-grid { min-height:0; padding-bottom:12px; }
  .hotkey-section { padding:16px 0 12px; margin-bottom:4px; border-bottom:1px solid var(--hairline); font-size:14px; }
  .hotkey-row { grid-template-columns:minmax(0,1fr) minmax(150px,280px) auto; gap:10px; min-height:64px; padding:12px 0; }
  .hotkey-row .label { justify-self:stretch; text-align:left; line-height:1.4; font-weight:600; }
  .hotkey-row.hotkey-extra-row { min-height:44px; padding-top:0; }
  .page .theme-section-title { flex-wrap:wrap; }
  .page .theme-section-title > span { flex:1; }
  .page .theme-section-title .setting-description { margin-bottom:6px; }
  .page .mic-test { flex-wrap:wrap; justify-content:flex-end; }
  .page .mic-test .btn { order:1; }
  .page .mic-meter { flex-basis:160px; }
  .page .projector-action-row { max-width:none; }
  .page .combo-option { min-height:30px; padding:6px 10px; line-height:1.4; }
  .page .combo-option.is-selected { padding-right:30px; }
  /* every blurb of the combo sits in the same grid cell and only the one shown is visible, so the note is as tall as the longest of them and the card keeps its height while the options are hovered */
  .combo-note { display:grid; min-height:2.9em; }
  .combo-note > .combo-note-text { grid-area:1 / 1; visibility:hidden; }
  .combo-note > .combo-note-text.is-shown { visibility:visible; }
  .combo-note:empty { display:block; }
  .combo-note[hidden] { display:none; }
  .search-summary { width:100%; max-width:900px; margin:0 auto 16px; color:var(--muted); font-size:12px; }
  body.is-searching .page { margin-bottom:12px; }
  .nav-btn:focus:not(:focus-visible) { outline:none; }
  body.is-searching .nav-btn:not(.search-match) { opacity:.38; }
  .account-status, .account-value { width:100%; text-align:right; font-weight:600; overflow-wrap:anywhere; }
  .account-label { display:flex; align-items:center; gap:8px; }
  .account-label svg { width:17px; height:17px; fill:currentColor; flex:none; }
  /* the picture of the account circle in the title bar, drawn the way the account menu draws it: the circle leads the label like a profile header, and its buttons sit on one line in the field column */
  .profile-label { display:flex; align-items:center; gap:14px; }
  .profile-label > span { min-width:0; }
  .page .profile-actions { flex-wrap:nowrap; margin-top:0; }
  .profile-avatar { position:relative; flex:none; width:44px; height:44px; padding:0; border:0; border-radius:50%; overflow:hidden; background:rgba(var(--text-rgb), .08); box-shadow:inset 0 0 0 1px rgba(var(--text-rgb), .2); color:var(--text); font:inherit; font-size:18px; font-weight:700; cursor:pointer; }
  .profile-avatar:disabled { cursor:default; }
  .profile-avatar:focus-visible { outline:2px solid var(--selected2); outline-offset:2px; }
  .profile-avatar > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .profile-avatar > .profile-person { position:absolute; inset:0; width:100%; height:100%; fill:none; stroke:rgba(var(--text-rgb), .5); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .profile-edit { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0, 0, 0, .5); opacity:0; transition:opacity 120ms linear; }
  .profile-edit svg { width:18px; height:18px; fill:var(--on-accent); }
  .profile-avatar:hover:not(:disabled) .profile-edit, .profile-avatar:focus-visible .profile-edit { opacity:1; }
  .profile-picture-error { margin-top:6px; color:var(--danger); font-size:12px; text-align:right; }
  .page .account-actions { justify-content:flex-end; margin:0 0 0 auto; }
  .upload-details-note { margin:0; padding:12px 0 16px; border-top:1px solid var(--hairline); color:var(--muted); font-size:12px; line-height:1.6; }
  .account-actions:not(:has(button:not([hidden]))) { display:none; }
  #uninstallConfirmModal .modal { width:min(500px,calc(100vw - 32px)); max-height:calc(100vh - 32px); display:flex; flex-direction:column; }
  #uninstallConfirmModal .modal-body { min-height:0; overflow:auto; }
  #uninstallConfirmOkBtn { min-width:88px; }
  #uninstallConfirmOkBtn.is-armed { background:var(--danger); }
  #uninstallConfirmModal .modal-title, #uninstallConfirmModal .modal-actions { flex-shrink:0; }
  .uninstall-targets { padding:0; margin:0 0 14px; border:0; }
  .uninstall-targets legend { padding:0 0 10px; font-weight:600; }
  .uninstall-choice { display:flex; align-items:flex-start; gap:10px; padding:10px 0; cursor:pointer; }
  .uninstall-choice input { margin:3px 0 0; accent-color:var(--selected); }
  .uninstall-choice:has(input:disabled) { opacity:.5; cursor:default; }
  #uninstallReplayOptions { border-top:1px solid var(--hairline); margin-bottom:14px; }
  #uninstallReplayOptions .check-row { max-width:none; padding:12px 0; gap:16px; }
  .footer, html.rk-embedded .footer { width:100%; max-width:948px; margin:0 auto; padding:9px 24px 13px; }
  body.is-searching .page-header { padding:16px 0; text-align:left; }
  body.is-searching .page-header svg, body.is-searching .page-subtitle { display:none; }
  body.is-searching .page-heading { font-size:17px; }
  @media (max-width:1100px) {
    .main, html.rk-embedded .main { padding:12px 16px 20px; }
    .box, .hotkey-grid { padding-left:16px; padding-right:16px; }
    .page .box .form-row { grid-template-columns:minmax(0,1fr) minmax(170px,240px); gap:12px 20px; }
  }
  @media (max-width:900px) {
    .shell { grid-template-columns:180px minmax(0,1fr); }
    html.rk-embedded .shell { grid-template-columns:190px minmax(0,1fr); }
    .page .box .form-row { grid-template-columns:minmax(0,1fr); gap:10px; }
    .page .form-row > .field-wrap { grid-column:1; }
    .page .form-row > .label { line-height:1.4; }
    .hotkey-row { grid-template-columns:minmax(0,1fr) auto; gap:8px; }
    .hotkey-row > .label { grid-column:1 / -1; }

    .page .ra-row .volume-slider-wrap, .page .ra-slider-note { grid-column:3 / 5; grid-row:2; }

<body>

<input aria-label="Enable clipping" disabled="" id="liveClipping" type="checkbox" data-i18n-aria-label="settings.enableClipping"/>
<span><span data-i18n="settings.enableClipping"></span><span class="control-note" data-i18n="settings.keepsTheLastMomentsOfYour"></span></span>

        <div class="form-row">

      const heading = document.createElement("h1");

      description.className = "setting-description";
      description.id = note.id || "setting-description-" + index;
      copyText(description, note);
      const row = note.closest(".form-row");
      const group = note.closest(".check-row, .action-row");
      const label = row && row.querySelector(":scope > .label");
      if (note.closest(".theme-section-title")) {
        note.replaceWith(description);

        group.querySelector(":scope > span").appendChild(description);
        note.remove();

        label.appendChild(description);
        note.remove();
      } else if (row) {
        const text = row.firstElementChild;
        text.classList.add("label");
        text.appendChild(description);
        note.remove();
      } else {
        note.replaceWith(description);

  function applySettingsSearch() {
    const query = (els.settingsSearch.value || "").trim().toLowerCase();
    const searching = query.length > 0;
    document.body.classList.toggle("is-searching", searching);
    clearSearchClasses();
    document.getElementById("searchSummary").hidden = true;
    if (!searching) {
      els.searchEmpty.classList.remove("is-visible");
      const pageName = activePage;
      document.querySelectorAll(".nav-btn").forEach((button) => button.classList.toggle("is-active", button.dataset.page === pageName));
      document.querySelectorAll(".page").forEach((page) => {
        page.classList.toggle("is-active", page.id === "page-" + pageName);
      });
      setStatus(dirty ? RK_M("settings.settingsChanged") : RK_M("settings.settingsLoaded"), dirty ? "" : "good");
      return;
    }

    releaseHotkeyCapture();
    closeCombos();
    let matches = 0;
    document.querySelectorAll(".nav-btn").forEach((btn) => btn.classList.remove("is-active"));
    document.querySelectorAll(".page").forEach((page) => {
      let pageMatched = false;
      page.querySelectorAll(".form-row,.hotkey-row").forEach((row) => {
        // a row inside a hidden box or row is not on screen, so it cannot be a match
        if (row.closest("[hidden]")) return;
        const hit = searchText(row).includes(query);
        row.classList.toggle("search-hidden-row", !hit);
        if (hit) {
          pageMatched = true;
          matches += 1;
        }
      });
      page.querySelectorAll(".box").forEach((box) => {
        if (box.hidden) return;
        const rows = Array.from(box.querySelectorAll(".form-row")).filter((row) => !row.closest("[hidden]"));
        const boxMatched = rows.length ? rows.some((row) => !row.classList.contains("search-hidden-row")) : searchText(box).includes(query);
        box.classList.toggle("search-hidden-row", !boxMatched);
        if (boxMatched) pageMatched = true;
      });
      const hotkeyGrid = page.querySelector(".hotkey-grid");
      if (hotkeyGrid) {
        const rowMatched = Array.from(hotkeyGrid.querySelectorAll(".hotkey-row")).some((row) => !row.closest("[hidden]") && !row.classList.contains("search-hidden-row"));
        hotkeyGrid.classList.toggle("search-hidden-row", !rowMatched);
        if (rowMatched) pageMatched = true;
      }
      page.classList.toggle("search-hidden", !pageMatched);
      const nav = document.querySelector('.nav-btn[data-page="' + page.id.slice(5) + '"]');
      if (nav) nav.classList.toggle("search-match", pageMatched);
    });
    const summary = document.getElementById("searchSummary");
    summary.textContent = matches === 1 ? RK_M("settings.n1SettingFound") : RK_M("settings.countSettingsFound", { count: matches });
    summary.hidden = matches === 0;
    els.searchEmpty.classList.toggle("is-visible", matches === 0);
    setStatus(matches === 0 ? RK_M("settings.noMatchingSettings") : matches === 1 ? RK_M("settings.n1MatchingSetting") : RK_M("settings.countMatchingSettings", { count: matches }), matches ? "" : "bad");
  }

  async function helperJson(path, options) {
    let res;
    try { res = await fetch(HELPER + "/" + path, { cache:"no-store", ...(options || {}) }); }
    catch (_) { throw new Error(RK_M("clips.replaykitCouldNotBeReached")); }
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) {
      const error = new Error(body.message || body.error || ("HTTP " + res.status));
      error.data = body;
      throw error;
    }
    return body;
  }

  function settingValueChanged(key) {

  function sameSetting(a, b) {

  // key by key, since the helper answers with its own key order

    return Object.keys(Object.assign({}, a, b)).some((key) => !sameSetting(a[key], b[key]));
  }

  function isRestartKey(key) {

  function needsObsRestart() {

      { id:"redo", label:RK_M("common.redo"), icon:"quick/redo", disabled:document.getElementById("redoSettingsBtn").disabled },
    ];

    quickSent = body;

  function updateFooter() {

  const EMBEDDED = new URLSearchParams(location.search).get("embedded") === "1";

  // one report at a time and in order: the helper serves requests on parallel threads, so a dirty and a clean sent back to back (a save flips it quickly) could reach the plugin the wrong way round and leave it asking about edits that were saved
  let dirtyReports = Promise.resolve();
  function reportDirty() {
    if (!EMBEDDED || reportedDirty === dirty) return dirtyReports;
    reportedDirty = dirty;
    const value = dirty ? "1" : "0";
    dirtyReports = dirtyReports.then(() => fetch(HELPER + "/shell/settings-dirty?dirty=" + value, { method:"POST", cache:"no-store" })).catch(() => { reportedDirty = null; });
    return dirtyReports;

  // record is an edit made here, which saves itself; a refresh of what was saved is not, and neither is a save that failed, which waits for the next edit
  function markDirty(record = true) {

  function settingsSnapshot() {

  function updateHistoryButtons() {

  function resetSettingsHistory() {
    settingsHistory.past.length = 0;
    settingsHistory.future.length = 0;
    settingsHistory.current = settingsSnapshot();
    settingsHistory.group = null;
    updateHistoryButtons();
  }

  function recordSettingsHistory() {
    if (!settingsHistory.current || settingsHistory.restoring) return;
    const next = settingsSnapshot();
    if (JSON.stringify(next) === JSON.stringify(settingsHistory.current)) return;
    const source = historySource && historySource.target;
    const group = historyGesture || (source && source.matches('input:not([type="checkbox"]):not([type="radio"]), textarea') ? source : null);
    const now = performance.now();
    if (!group || group !== settingsHistory.group || (!historyGesture && now - settingsHistory.time > 600)) {
      settingsHistory.past.push(settingsHistory.current);
      if (settingsHistory.past.length > 60) settingsHistory.past.shift();
    }
    settingsHistory.current = next;
    settingsHistory.future.length = 0;
    settingsHistory.group = group;
    settingsHistory.time = now;
  }

  function restoreSettingsHistory(redo) {
    const from = redo ? settingsHistory.future : settingsHistory.past;
    const to = redo ? settingsHistory.past : settingsHistory.future;
    if (!from.length) return;
    to.push(settingsSnapshot());
    const next = from.pop();
    const positionChanged = state.overlayStyle !== next.settings.overlayStyle ||
      JSON.stringify(state.overlayPosition) !== JSON.stringify(next.settings.overlayPosition);
    settingsHistory.restoring = true;
    try {
      Object.keys(state).forEach((key) => { delete state[key]; });
      Object.assign(state, clone(next.settings));
      closeCombos();
      RKAppearance.restoreEditing(next.themeEdit);
      syncUi();
      if (window.RKOverlayPreview) {
        if (positionChanged) RKOverlayPreview.restorePosition();
        else RKOverlayPreview.refresh();
        // a step back to the place obs already holds has no save to wait for, so the preview follows obs again at once
        if (positionChanged && !saveInFlight && sameSetting(state.overlayPosition, originalState.overlayPosition) && state.overlayStyle === originalState.overlayStyle) RKOverlayPreview.positionApplied();
      }
      markDirty();
      settingsHistory.current = settingsSnapshot();
      settingsHistory.group = null;
    } finally {
      settingsHistory.restoring = false;
      updateHistoryButtons();
    }
  }

  // the in-page projector shows every overlay edit live, and the real obs source only takes it when the edit saves -- so no baseline snapshot is ever armed, and there is nothing for a crash or a closed window to leave half-applied.
  function queueOverlayPreview() {

  async function commitOverlayPreview() {
    if (!overlayPreviewTouched &&
        !settingValueChanged("overlayOpacity") &&
        !settingValueChanged("overlayScale") &&
        !settingValueChanged("overlayRotation") &&
        !settingValueChanged("overlayFlipH") &&
        !settingValueChanged("overlayHueShift") &&
        !settingValueChanged("overlayColorMultiply") &&
        !settingValueChanged("overlayColorAdd")) {
      return false;
    }
    const payload = {
      overlayOpacity: settingOr("overlayOpacity"),
      overlayScale: settingOr("overlayScale"),
      overlayRotation: settingOr("overlayRotation"),
      overlayFlipH: !!state.overlayFlipH,
      overlayHueShift: settingOr("overlayHueShift"),
      overlayColorMultiply: settingOr("overlayColorMultiply"),
      overlayColorAdd: settingOr("overlayColorAdd"),
    };
    const sent = clone(state);
    const data = await helperJson("settings/overlay-preview?mode=commit", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(payload),
    });
    ["overlayOpacity", "overlayScale", "overlayRotation", "overlayFlipH", "overlayHueShift", "overlayColorMultiply", "overlayColorAdd"].forEach((key) => {
      if (!data.settings || !Object.prototype.hasOwnProperty.call(data.settings, key)) return;
      // an edit made while this was on its way stays, and goes out with the next save
      if (sameSetting(state[key], sent[key])) state[key] = data.settings[key];
      originalState[key] = data.settings[key];
    });
    overlayPreviewTouched = false;
    markDirty(false);
    return true;
  }

  // nothing is previewed at the obs source any more, so closing without applying has nothing to undo -- kept as the single place that would need to change if live preview ever comes back.
  async function cancelOverlayPreview() {

  // a drag in the preview is stored per style, becuase the two overlays are nothing alike in size and one shared corner would put the other one off the canvas
  function setOverlayPosition(x, y) {
    const style = state.overlayStyle;
    if (style !== "input_overlay" && style !== "bongo_cat") return;
    state.overlayPosition = Object.assign({}, state.overlayPosition);
    state.overlayPosition[style] = { x, y };
  }

  function resetOverlayPosition(style) {
    if (style !== "input_overlay" && style !== "bongo_cat") return;
    state.overlayPosition = Object.assign({}, state.overlayPosition);
    delete state.overlayPosition[style];
  }

  function acceptSettings(nextSettings) {
    settingsHistory.restoring = true;
    RKAppearance.endEdit();
    Object.assign(state, nextSettings || {});
    state.screenshareGameOverrides = normalizeScreenshareGameOverrides(state.screenshareGameOverrides);
    originalState = clone(state);
    overlayPreviewTouched = false;
    saveNote = { text:"", bad:false };
    dirty = false;
    syncUi();
    readUi();
    originalState = clone(state);
    dirty = false;
    settingsHistory.restoring = false;
    resetSettingsHistory();

  function comboOptionHtml(option, selectedValue) {
    const selected = option.value === selectedValue ? " is-selected" : "";

  function updateComboNote(combo, value) {
    const options = comboOptions(combo);
    let note = document.getElementById(combo.id + "-note");
    const hasDescription = options.some((option) => !!option.blurb);
    if (!note && !hasDescription) return;
    if (!note) {
      note = document.createElement("span");
      note.id = combo.id + "-note";
      note.className = "setting-description combo-note";
      const row = combo.closest(".form-row");
      const label = row && row.querySelector(":scope > .label");
      (label || combo.parentElement).appendChild(note);
      combo.setAttribute("aria-describedby", [combo.getAttribute("aria-describedby"), note.id].filter(Boolean).join(" "));
    }
    const current = value === undefined ? (combo.dataset.noteValue === undefined ? comboValue(combo) : combo.dataset.noteValue) : value;
    const blurbs = options.filter((entry) => !!entry.blurb);
    const key = JSON.stringify(blurbs.map((entry) => [entry.value, entry.blurb]));
    if (note.dataset.blurbs !== key) {
      note.dataset.blurbs = key;
      note.replaceChildren(...blurbs.map((entry) => {
        const text = document.createElement("span");
        text.className = "combo-note-text";
        text.dataset.value = entry.value;
        text.textContent = entry.blurb;
        return text;
      }));
    }
    for (const text of note.children) text.classList.toggle("is-shown", text.dataset.value === current);
    note.hidden = !hasDescription;
  }

  function comboValue(combo) {
    return combo.dataset.value || "";
  }

  function comboOptions(combo) {
    try { return JSON.parse(combo.dataset.options || "[]"); }
    catch { return []; }
  }

  function selectedComboOption(combo) {
    const value = comboValue(combo);
    return comboOptions(combo).find((o) => o.value === value) || null;
  }

  function renderCombo(combo) {
    const options = comboOptions(combo);
    const value = comboValue(combo);
    const option = options.find((o) => o.value === value) || options[0] || { label:"" };
    const label = combo.querySelector(".combo-label");
    label.textContent = option.label || "";
    label.style.fontFamily = option.font ? '"' + option.font + '", sans-serif' : "";
    updateComboNote(combo);
    // rebuild the option list only when it actually changed. re-setting innerHTML recreates every .combo-option, which restarts the rk-option-in entrance animation -- refreshExternalSettings re-fills combos every 2s, so an open menu would visibly re-animate on a loop. value + options json fully determines the rendered markup.
    const menu = combo.querySelector(".combo-menu");
    const sig = value + "|" + (combo.dataset.options || "");
    if (menu.dataset.sig === sig) return;
    menu.dataset.sig = sig;
    menu.innerHTML = options.map((o) => comboOptionHtml(o, value)).join("");

  function setComboValue(combo, value, notify) {
    const options = comboOptions(combo);
    const selected = options.find((o) => o.value === value && !o.disabled) || options.find((o) => !o.disabled);
    combo.dataset.value = selected ? selected.value : "";
    renderCombo(combo);

  function fillCombo(combo, options) {

  function setComboDisabled(combo, disabled) {
    if (!combo) return;
    combo.classList.toggle("is-disabled", !!disabled);
    combo.setAttribute("aria-disabled", disabled ? "true" : "false");
    combo.tabIndex = disabled ? -1 : 0;
    const button = combo.querySelector(".combo-button");
    if (button) button.disabled = !!disabled;
    if (disabled) {
      combo.classList.remove("is-open");

  function closeCombos(except) {
    document.querySelectorAll(".combo.is-open").forEach((combo) => {
      if (combo !== except) {

  function openCombo(combo) {
    if (combo.classList.contains("is-disabled")) return;

    positionCombo(combo);

  function positionCombo(combo) {
    const menu = combo.querySelector(".combo-menu");
    const rect = combo.getBoundingClientRect();
    const bounds = combo.closest(".main").getBoundingClientRect();
    const width = rect.width;
    const left = Math.max(bounds.left + 12, Math.min(rect.right - width, bounds.right - width - 12));
    menu.style.width = width + "px";
    menu.style.left = (left - rect.left) + "px";
    menu.style.right = "auto";
    const below = bounds.bottom - rect.bottom - 8;
    const above = rect.top - bounds.top - 8;
    const height = Math.min(320, menu.scrollHeight + 2);
    const up = below < height && above > below;
    menu.style.top = up ? "auto" : "calc(100% + 2px)";
    menu.style.bottom = up ? "calc(100% + 2px)" : "auto";
    menu.style.maxHeight = Math.max(32, Math.min(height, up ? above : below)) + "px";
  }

    hotkeyCaptureReady = false;
    activeHotkeyField = fieldName;
    field.el.textContent = RK_M("settings.connecting");
    field.el.classList.add("is-empty");
    clearHotkeyCaptureTimer();
    setHotkeyCapture(true, false).then((ok) => {
      if (generation !== hotkeyCaptureGeneration || document.activeElement !== field.el) return;
      hotkeyCaptureReady = ok;
      if (!ok) {

      field.el.classList.add("is-empty");
      hotkeyCaptureTimer = setTimeout(() => {
        hotkeyCaptureTimer = null;
        if (activeHotkeyField === fieldName) field.el.blur();
      }, HOTKEY_CAPTURE_TIMEOUT_MS);
    });

  function readReplaySeconds() {
    const raw = String(els.replaySeconds.value || "").trim();
    const parts = raw.match(/^(?:(\d+)\s*m)?\s*(?:(\d+)\s*s?)?$/i);
    const total = (parts && (parts[1] !== undefined || parts[2] !== undefined))
      ? (parseInt(parts[1] || "0", 10) * 60) + parseInt(parts[2] || "0", 10)
      : parseInt(raw, 10);
    return Number.isFinite(total) ? Math.max(REPLAY_SECONDS_MIN, Math.min(REPLAY_SECONDS_MAX, total)) : 90;
  }

  function replaySecondsLabel(value) {
    const v = Math.max(0, Math.round(value));
    if (v < 60) return v + "s";
    const m = Math.floor(v / 60);
    const s = v % 60;
    return s === 0 ? (m + "m") : (m + "m " + s + "s");
  }

  function cleanGameOverrideText(value, maxLength) {
    const text = String(value || "").replace(/[\x00-\x1F]/g, " ").trim();
    return text.length > maxLength ? text.slice(0, maxLength) : text;
  }

  function decodeObsWindowTokenPart(value) {
    return String(value || "").replace(/#3A/g, ":").replace(/#22/g, "#");
  }

  function gameOverridePartsFromToken(token) {
    const parts = String(token || "").split(":", 3);
    if (parts.length < 3) return { title:"", className:"", exeName:"" };
    return {
      title:decodeObsWindowTokenPart(parts[0]),
      className:decodeObsWindowTokenPart(parts[1]),
      exeName:decodeObsWindowTokenPart(parts[2]),
    };
  }

  function normalizeScreenshareGameOverride(item) {
    if (!item) return null;
    const token = cleanGameOverrideText(item.token || item.value || "", 512);
    if (!token) return null;
    const parts = gameOverridePartsFromToken(token);
    const exeName = cleanGameOverrideText(item.exeName || parts.exeName, 96);
    if (!exeName) return null;
    const title = cleanGameOverrideText(item.title || parts.title, 160);
    const className = cleanGameOverrideText(item.className || parts.className, 120);
    const fallbackLabel = title ? "[" + exeName + "]: " + title : "[" + exeName + "]";
    return {
      token,
      label:cleanGameOverrideText(item.label || fallbackLabel, 256),
      exeName,
      title,
      className,
    };
  }

  function normalizeScreenshareGameOverrides(value) {
    const seen = new Set();
    const out = [];
    (Array.isArray(value) ? value : []).forEach((item) => {
      const normalized = normalizeScreenshareGameOverride(item);
      if (!normalized || seen.has(normalized.token)) return;
      seen.add(normalized.token);
      if (out.length < 32) out.push(normalized);
    });
    return out;
  }

    const oldText = btn.textContent;
    btn.textContent = busyText;
    setStatus(busyText, "");
    try {

      const warnings = Array.isArray(result && result.warnings) ? result.warnings : [];

      setStatus(RK_M("settings.projectorFailedError", { error: e.message || e }), "bad");

  const DEFAULT_BONGO_SPEED = SETTING_DEFAULTS.bongoSpeed;
  // the KeyboardEvent.code a bongo key can be bound to, the same list the helper takes; each with how it is shown
  const BONGO_KEY_LABELS = (() => {
    const labels = {
      Space:"Space", Tab:"Tab", Enter:"Enter", Backspace:RK_M("editor.backspace"), CapsLock:"Caps", Escape:RK_M("editor.esc"),
      ShiftLeft:RK_M("settings.lShift"), ShiftRight:RK_M("settings.rShift"), ControlLeft:RK_M("settings.lCtrl"), ControlRight:RK_M("settings.rCtrl"), AltLeft:RK_M("settings.lAlt"), AltRight:RK_M("settings.rAlt"),
      ArrowLeft:"Left", ArrowUp:"Up", ArrowRight:"Right", ArrowDown:"Down", Insert:"Insert", Delete:RK_M("keys.delete"), Home:RK_M("keys.home"), End:"End", PageUp:RK_M("settings.pageUp"), PageDown:RK_M("settings.pageDown"),
      Semicolon:";", Equal:"=", Comma:",", Minus:"-", Period:".", Slash:"/", Backquote:"`", BracketLeft:"[", Backslash:"\\", BracketRight:"]", Quote:"'",
      NumpadAdd:RK_M("settings.num"), NumpadSubtract:RK_M("settings.num2"), NumpadMultiply:RK_M("settings.num3"), NumpadDivide:RK_M("settings.num4"), NumpadDecimal:RK_M("settings.num5"), NumpadEnter:RK_M("settings.numEnter"),
    };
    for (let c = 65; c <= 90; c++) labels["Key" + String.fromCharCode(c)] = String.fromCharCode(c);
    for (let d = 0; d <= 9; d++) { labels["Digit" + d] = String(d); labels["Numpad" + d] = "Num " + d; }
    for (let f = 1; f <= 12; f++) labels["F" + f] = "F" + f;
    return labels;
  })();
  // how a key name of a mode config reads, by the key that really sets it off: the plugin hears the right arrow as left and the left arrow as right
  const BONGO_NAME_LABELS = { space:"Space", lshift:RK_M("settings.lShift"), lctrl:RK_M("settings.lCtrl"), rshift:RK_M("settings.rShift"), rctrl:RK_M("settings.rCtrl"), up:"Up", down:"Down", left:"Right", right:"Left", "<":",", ">":"." };
  function bongoNameLabel(name) { return BONGO_NAME_LABELS[name] || String(name || "").toUpperCase(); }

  // the rows of the picked overlay: the bongo cat settings, or the keyboard, its keys when custom, and the mouse of the wasd overlay
  function syncOverlayRows() {
    const bongo = state.overlayStyle === "bongo_cat", wasd = state.overlayStyle === "input_overlay";
    els.bongoModeRow.hidden = !bongo;

  function syncBongoSpeed() {
    const speed = Math.max(SETTING_LIMITS.bongoSpeed.min, Math.min(SETTING_LIMITS.bongoSpeed.max, Number(state.bongoSpeed ?? DEFAULT_BONGO_SPEED) || DEFAULT_BONGO_SPEED));

  function loadBongoManifest() {
    if (bongoManifest || bongoManifestLoading) return bongoManifestLoading;
    bongoManifestLoading = fetch(HELPER + "/bongo-cat/manifest", { cache:"no-store" }).then((r) => r.ok ? r.json() : null).then((data) => {
      bongoManifest = data && Array.isArray(data.modes) ? data : { modes: [] };
      if (state.overlayStyle === "bongo_cat") paintBongoKeys();
    }).catch(() => { bongoManifestLoading = null; });
    return bongoManifestLoading;
  }

  // the keys of the picked mode: one field per key the mode has, showing the key it was given or, quieter, its own
  function paintBongoKeys() {
    if (!bongoManifest) { loadBongoManifest(); return; }
    const mode = settingOr("bongoMode");
    const entry = bongoManifest.modes.find((m) => m.name === mode);
    const config = entry && entry.config || {};
    const own = (config.KeyUse || []).slice(0, Math.min((config.KeyUse || []).length, (config.KeysImageName || []).length));
    const given = (state.bongoKeys && state.bongoKeys[mode]) || [];
    bongoRepainting = true;
    els.bongoKeys.replaceChildren();
    bongoRepainting = false;
    own.forEach((name, slot) => {
      const code = given[slot] || "";
      const field = document.createElement("div");
      field.className = "hotkey-input" + (code ? "" : " is-default") + (bongoListening && bongoListening.mode === mode && bongoListening.slot === slot ? " is-listening" : "");
      field.tabIndex = 0;
      field.setAttribute("role", "button");
      field.setAttribute("translate", "no");
      field.setAttribute("aria-label", RK_M("settings.keyNumberOfModeKey", { number: slot + 1, mode, key: code ? BONGO_KEY_LABELS[code] || code : bongoNameLabel(name) }));
      field.textContent = field.classList.contains("is-listening") ? RK_M("settings.pressAKey") : code ? BONGO_KEY_LABELS[code] || code : bongoNameLabel(name);
      field.addEventListener("click", () => { bongoListening = { mode, slot }; paintBongoKeys(); els.bongoKeys.children[slot]?.focus(); });
      field.addEventListener("blur", () => { if (!bongoRepainting && bongoListening && bongoListening.slot === slot) { bongoListening = null; paintBongoKeys(); } });
      els.bongoKeys.appendChild(field);
    });
    document.getElementById("resetBongoKeys").classList.toggle("is-default", !given.some(Boolean));
  }

  function setBongoKey(mode, slot, code) {
    const keys = { ...(settingOr("bongoKeys")) };
    const list = (keys[mode] || []).slice();
    while (list.length <= slot) list.push("");
    list[slot] = code;
    while (list.length && !list[list.length - 1]) list.pop();
    if (list.length) keys[mode] = list; else delete keys[mode];
    state.bongoKeys = keys;
    markDirty();
    if (window.RKOverlayPreview) RKOverlayPreview.refresh();
  }

  // repaints the board when the window resizes it, since the keys are placed in pixels
  let customKeysWidth = 0;
  new ResizeObserver(() => {
    if (!els.inputOverlayKeysRow.hidden && els.inputOverlayKeys.clientWidth && els.inputOverlayKeys.clientWidth !== customKeysWidth) paintCustomKeys();
  }).observe(els.inputOverlayKeys);

  // the keys of the custom wasd keyboard, picked by clicking them where they sit on the keyboard
  function paintCustomKeys() {
    const table = (overlayLayouts && overlayLayouts.customKeys) || [];
    const picked = new Set(Array.isArray(state.inputOverlayCustomKeys) ? state.inputOverlayCustomKeys : DEFAULT_CUSTOM_KEYS);
    // keys sit on one square pitch so the gap is the same across and down -- the table numbers include the lean of the drawn keys, so a 1u key is 157 wide on a 137 column; below the smallest pitch the board scrolls instead of shrinking further
    const span = (key) => 1 + Math.round((key.w - 157) / 137);
    const cols = Math.max(1, ...table.map((key) => Math.round(key.x / 137) + span(key)));
    const rows = Math.max(1, ...table.map((key) => Math.round(key.y / 133) + 1));
    const edge = 3, gap = 3;
    const room = (els.inputOverlayKeys.clientWidth || 600) - edge * 2;
    const pitch = Math.max(20, Math.min(40, Math.floor((room + gap) / cols)));
    els.inputOverlayKeys.style.fontSize = Math.max(9, Math.min(11, Math.round(pitch * 0.3))) + "px";
    customKeysWidth = els.inputOverlayKeys.clientWidth;
    els.inputOverlayKeys.replaceChildren();
    table.forEach((key) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "ovk-key" + (picked.has(key.id) ? " is-on" : "");
      button.setAttribute("translate", "no");
      button.textContent = key.label;
      button.setAttribute("aria-pressed", picked.has(key.id) ? "true" : "false");
      button.style.left = (edge + Math.round(key.x / 137) * pitch) + "px";
      button.style.top = (edge + Math.round(key.y / 133) * pitch) + "px";
      button.style.width = (span(key) * pitch - gap) + "px";
      button.style.height = (pitch - gap) + "px";
      button.addEventListener("click", () => {
        const next = new Set(picked);
        if (next.has(key.id)) next.delete(key.id); else next.add(key.id);
        // the keyboard keeps at least one key
        if (!next.size) return;
        state.inputOverlayCustomKeys = table.map((k) => k.id).filter((id) => next.has(id));
        markDirty();
        paintCustomKeys();
        els.inputOverlayKeys.querySelector('.ovk-key:nth-child(' + (table.indexOf(key) + 1) + ')')?.focus();
        if (window.RKOverlayPreview) RKOverlayPreview.refresh();
      });
      els.inputOverlayKeys.appendChild(button);
    });
    els.inputOverlayKeys.style.height = (rows * pitch - gap + edge * 2) + "px";
    // a scrolling board also needs the height of its scrollbar
    const bar = els.inputOverlayKeys.offsetHeight - els.inputOverlayKeys.clientHeight;
    if (bar > 0) els.inputOverlayKeys.style.height = (rows * pitch - gap + edge * 2 + bar) + "px";
    const same = picked.size === DEFAULT_CUSTOM_KEYS.length && DEFAULT_CUSTOM_KEYS.every((id) => picked.has(id));
    document.getElementById("resetInputOverlayKeys").classList.toggle("is-default", same);
  }

  function wireOverlayLayouts() {
    // a bongo key field that waits takes the next key: escape stops waiting, backspace puts back the key of the mode
    document.addEventListener("keydown", (e) => {
      if (!bongoListening) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      const { mode, slot } = bongoListening;
      if (e.code === "Escape") { bongoListening = null; paintBongoKeys(); return; }
      if (e.code === "Backspace" || e.code === "Delete") { bongoListening = null; setBongoKey(mode, slot, ""); paintBongoKeys(); return; }
      if (!BONGO_KEY_LABELS[e.code]) return;
      bongoListening = null;
      setBongoKey(mode, slot, e.code);
      paintBongoKeys();
    }, true);
    document.getElementById("resetBongoKeys").addEventListener("click", () => {
      const mode = settingOr("bongoMode");
      if (!state.bongoKeys || !state.bongoKeys[mode]) return;
      const keys = { ...state.bongoKeys };
      delete keys[mode];
      state.bongoKeys = keys;
      markDirty();
      paintBongoKeys();
      if (window.RKOverlayPreview) RKOverlayPreview.refresh();
    });
    document.getElementById("resetInputOverlayKeys").addEventListener("click", () => {
      state.inputOverlayCustomKeys = DEFAULT_CUSTOM_KEYS.slice();

      paintCustomKeys();

      state.bongoSpeed = DEFAULT_BONGO_SPEED;
      syncBongoSpeed();
      markDirty();
    });
  }

    combo.addEventListener("keydown", (e) => {
      if (combo.classList.contains("is-disabled")) return;
      const options = comboOptions(combo).filter((o) => !o.disabled);
      if (!options.length) return;
      const current = Math.max(0, options.findIndex((o) => o.value === comboValue(combo)));
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (combo.classList.contains("is-open")) closeCombos();
        else openCombo(combo);
      } else if (e.key === "Escape") {
        e.preventDefault();

      } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        delete combo.dataset.noteValue;
        const delta = e.key === "ArrowDown" ? 1 : -1;
        const next = options[(current + delta + options.length) % options.length];
        setComboValue(combo, next.value, true);
      } else if (e.key.length === 1 && /\S/.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
        // a letter goes to the next option that starts with it, the way the dropdowns of the editor do; an option can carry a second name to match, like the english name of a language
        e.preventDefault();
        const letter = e.key.toLowerCase();
        for (let offset = 1; offset <= options.length; offset++) {

  function attachHotkeyField(fieldName) {
    const field = hotkeyFields[fieldName];
    field.el.addEventListener("focus", () => beginHotkeyCapture(fieldName));
    field.el.addEventListener("blur", () => {
      releaseHotkeyCapture(true);
      // an extra row that was opened and left without a key closes again
      if (/Extra$/.test(fieldName)) extraHotkeyOpen.delete(fieldName.replace(/Extra$/, ""));
      syncHotkeyField(fieldName);
    });
    field.el.addEventListener("keydown", (e) => {
      if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.metaKey) return;
      e.preventDefault();
      e.stopPropagation();
      if (typeof e.stopImmediatePropagation === "function") e.stopImmediatePropagation();
      if (activeHotkeyField !== fieldName || !hotkeyCaptureReady || e.repeat) return;
      const obsKey = obsKeyFromEvent(e);
      if (!obsKey) return;
      const combo = { key:obsKey };
      if (e.ctrlKey) combo.control = true;
      if (e.altKey) combo.alt = true;
      if (e.shiftKey) combo.shift = true;
      if (e.metaKey) combo.command = true;
      state[fieldName] = combo;
      syncHotkeyField(fieldName);
      markDirty();
    });
  }

  // edits save on their own a moment after the last one; the settings that restart obs keep their saved values in what is sent and wait for Restart OBS
  function autoSaveWanted() {
    return overlayPreviewTouched || Object.keys(state).some((key) => !isRestartKey(key) && settingValueChanged(key));
  }
  function scheduleAutoSave() {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = autoSaveWanted() ? setTimeout(autoSave, AUTO_SAVE_DELAY_MS) : 0;
  }
  // a drag, a hotkey being set or a field being typed in finishes first, so a number the helper would clamp is not rewritten halfway through
  function editInProgress() {
    return !!((typingIn && typingIn === document.activeElement) || historyGesture || activeHotkeyField);
  }
  function autoSave() {
    autoSaveTimer = 0;
    if (saveInFlight || editInProgress()) { scheduleAutoSave(); return; }
    if (autoSaveWanted()) saveSettings(false);
  }
  const TEXT_FIELD = 'input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), textarea';
  window.addEventListener("input", (event) => {
    if (event.target === document.activeElement && event.target instanceof Element && event.target.matches(TEXT_FIELD)) typingIn = event.target;
  }, true);
  ["change", "focusout"].forEach((name) => window.addEventListener(name, (event) => {
    if (event.target === typingIn) typingIn = null;
  }, true));

  // the save that is running, so a prompt asked for meanwhile can wait for its outcome instead of asking about edits that are being saved
  let saveRun = Promise.resolve(true);
  // counts saves, so an answer of the external poll that a save overtook is dropped
  let saveEpoch = 0;
  async function saveSettings(restart) {
    if (saveInFlight) return;
    clearTimeout(autoSaveTimer);
    autoSaveTimer = 0;
    saveInFlight = true;
    saveEpoch++;
    updateFooter();
    let ok = false;
    try {
      saveRun = runSaveSettings(restart);
      ok = await saveRun;
    } catch (e) {
      saveNote = { text:RK_M("settings.couldNotSaveTheSettingsError", { error: e.message || e }), bad:true };
    } finally {
      saveInFlight = false;
      markDirty(false);
      // edits made while it ran go out next; after a failure the next edit tries again
      if (ok) scheduleAutoSave();
    }
  }

  // the overlay edits go to the obs source first, then the rest to the helper; restart sends the settings that restart obs too
  async function runSaveSettings(restart) {
    readUi();
    try {
      await commitOverlayPreview();
    } catch (e) {
      saveNote = { text:RK_M("settings.couldNotSaveTheSettingsError", { error: e.message || e }), bad:true };
      return false;
    }
    if (restart) await RKAppearance.fileCustomTheme();
    const before = originalState;
    const body = clone(state);
    if (!restart) {
      Object.keys(body).forEach((key) => {
        if (!isRestartKey(key)) return;
        if (Object.prototype.hasOwnProperty.call(before, key)) body[key] = clone({ value:before[key] }).value;
        else delete body[key];
      });
    }
    const changes = Object.fromEntries(Object.entries(body).filter(([key, value]) => !sameSetting(value, before[key])));
    if (!Object.keys(changes).length) {
      saveNote = { text:"", bad:false };
      return true;
    }
    let data;
    try {
      await releaseHotkeyCapture(false);
      data = await helperJson("settings", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(changes),
      });
    } catch (e) {
      saveNote = { text:RK_M("settings.couldNotSaveTheSettingsError", { error: e.message || e }), bad:true };
      return false;
    }
    lastServerSettings = clone(data.settings);
    adoptSavedSettings(data.settings || {}, body);
    // the scene item now sits where the preview drew it, so let the poll follow obs again, unless the overlay moved while this was on its way
    if (window.RKOverlayPreview && sameSetting(state.overlayPosition, body.overlayPosition) && state.overlayStyle === body.overlayStyle) RKOverlayPreview.positionApplied();
    // a "custom" icon gets filed as a saved one server-side -- reflect the new tile + selection
    if (["appIcon", "appIconCustomPath", "theme", "themeCustom"].some((key) => !sameSetting(body[key], before[key]))) RKAppearance.refresh();
    const warnings = data.warnings || [];
    if (warnings.length) saveNote = { text:warnings.join(" "), bad:true };
    else saveNote = { text:restart ? RK_M("settings.settingsSavedObsIsRestarting") : "", bad:false };
    return true;
  }

  // the settings the helper holds now become originalState, and every key not changed here since base shows them, so normalizing and changes made elsewhere come through without dropping an edit made meanwhile; what the fields cannot show as saved is taken as they show it, the way a fresh load takes it
  function adoptSavedSettings(saved, base) {
    const kept = new Set(Object.keys(state).filter((key) => !sameSetting(state[key], base[key])));
    const fresh = clone(saved);
    let changed = false;
    Object.keys(fresh).forEach((key) => {
      if (kept.has(key) || sameSetting(state[key], fresh[key])) return;
      state[key] = fresh[key];
      changed = true;
    });
    originalState = clone(saved);
    if (!changed) return;
    settingsHistory.restoring = true;
    try {
      if (!kept.has("screenshareGameOverrides")) state.screenshareGameOverrides = normalizeScreenshareGameOverrides(state.screenshareGameOverrides);
      syncUi();
      readUi();
      if (window.RKOverlayPreview) RKOverlayPreview.refresh();
    } finally {
      settingsHistory.restoring = false;
    }
    Object.keys(state).forEach((key) => {
      if (!kept.has(key)) originalState[key] = clone({ value:state[key] }).value;
    });
  }

  // Leave without saving drops what is not saved yet (the changes that wait for Restart OBS, or a save that failed): state back to the last saved snapshot, repaint, clear dirty, and reset the in-page overlay preview (drag position + its undo history).
  function revertLocalEdits() {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = 0;
    settingsHistory.restoring = true;
    RKAppearance.endEdit();
    Object.keys(state).forEach((k) => { delete state[k]; });
    Object.assign(state, clone(originalState));
    overlayPreviewTouched = false;
    saveNote = { text:"", bad:false };
    dirty = false;
    closeCombos();
    syncUi();
    dirty = false;
    updateFooter();
    if (window.RKOverlayPreview) { RKOverlayPreview.resetPosition(); RKOverlayPreview.refresh(); }
    settingsHistory.restoring = false;
    resetSettingsHistory();
  }

  // the waiting save goes out now and a running one is waited for, before anything asks whether edits are left
  async function settleSettings() {
    if (saveInFlight) await saveRun.catch(() => false);
    if (autoSaveWanted()) await saveSettings(false);
  }

  // true while an edit or a save is under way -- the 2s external poll must not overwrite state then.
  function externalRefreshBusy() {
    return saveInFlight || !!autoSaveTimer || editInProgress() || !!document.querySelector(".combo.is-open");
  }

  let _externalRefreshInFlight = false;
  async function refreshExternalSettings() {
    // a hidden window keeps this page alive, so the poll waits until the window is showing again
    if (_externalRefreshInFlight || externalRefreshBusy() || !RKWindow.up()) return;
    _externalRefreshInFlight = true;
    const epoch = saveEpoch;
    try {
      let data;
      try { data = await helperJson("settings?t=" + Date.now()); } catch (e) { return; }
      // re-check: the user may have opened a dropdown or started editing during the fetch, and a save that ran meanwhile makes this answer older than what the page holds. clobbering their in-progress choice here is the "select native, it jumps back to downscale" race.
      if (externalRefreshBusy() || epoch !== saveEpoch) return;
      const next = data.settings || {};
      fillCombo(els.screenshareGameWindow, data.options.screenshareGameWindows || []);
      fillCombo(els.screenshareGameOverridePicker, data.options.screenshareGameWindows || []);
      // a display plugged in or out while the page is open shows up in the list
      fillCombo(els.captureDisplay, data.options.captureDisplays || [{ value:"primary", label:RK_M("common.primaryDisplay") }]);
      if (!sameSetting(next, lastServerSettings)) {
        lastServerSettings = clone(next);
        adoptSavedSettings(next, originalState);
        markDirty(false);
      }
    } finally { _externalRefreshInFlight = false; }
  }

  // there is deliberately no Install button here. this box used to POST /update/apply itself, which skipped the update window entirely -- so there was no download progress, no stage labels, and nothing watching for the verdict the installer writes. checking hands off to that window instead, so an update started from Settings behaves exactly like the one offered at launch. the helper spawns this window, not window.open: this page runs inside OBSs CEF, where window.open escapes to the users real browser and the update prompt lands as an ordinary tab there.
  async function openUpdatePrompt(version) {
    try {
      await helperJson("update/open-prompt?version=" + encodeURIComponent(version || ""), { method:"POST" });
      return true;
    } catch (e) {
      setUpdateStatus(RK_M("settings.errorUseTheGithubLinkBelow", { error: e.message || String(e) }), "bad");
      return false;
    }
  }

  async function checkForUpdates() {
    els.checkUpdateBtn.disabled = true;
    setUpdateStatus(RK_M("settings.checkingEllipsis"), "");
    setUpdateReleaseLink("", false);
    try {
      const data = await helperJson("update/check?manual=1&t=" + Date.now());
      if (!data.updateAvailable && !data.repairRequired) {
        setUpdateStatus(data.message || (data.installedVersion ? RK_M("settings.replaykitIsUpToDateVersion", { version: data.installedVersion }) : RK_M("common.replaykitIsUpToDate")), "good", 3000);
        return;
      }
      setUpdateReleaseLink(data.releaseUrl, true);
      // in the clean layout the check only looks: the helper puts what it found on the update button of the title bar, which opens the update window when it is clicked
      if (EMBEDDED) {
        setUpdateStatus(data.repairRequired ? RK_M("settings.replaykitNeedsRepairUseTheUpdate") : RK_M("settings.updateAvailableLatestInstalledInstalledUse", { latest: data.latestVersion, installed: data.installedVersion }), "good");
        return;
      }
      await settleSettings();
      if (dirty) {
        setUpdateStatus(data.repairRequired ? RK_M("settings.replaykitNeedsRepairRestartOrUndo") : RK_M("settings.updateAvailableLatestRestartOrUndo", { latest: data.latestVersion }), "bad");
        return;
      }
      if (await openUpdatePrompt(data.latestVersion)) {
        setUpdateStatus(data.repairRequired ? RK_M("settings.repairingTheReplaykitInstallation") : RK_M("settings.updateAvailableLatestInstalledInstalled", { latest: data.latestVersion, installed: data.installedVersion }), "good");
      }
    } catch (e) {
      setUpdateStatus(RK_M("settings.updateCheckFailedError", { error: e.message || e }), "bad");
      setUpdateReleaseLink(e.data && e.data.releaseUrl, true);
    } finally {
      els.checkUpdateBtn.disabled = false;
    }
  }

  async function toggleDiscordScreenshare() {

    const confirmed = await showDiscordScreenshareConfirmModal(installing);

    }
    const busy = installing ? RK_M("settings.installingDiscordScreenshareSupport") : RK_M("settings.removingDiscordScreenshareSupport");
    const failed = (error) => installing ? RK_M("settings.installFailedError", { error }) : RK_M("settings.removalFailedError", { error });
    els.installShareAudioBtn.disabled = true;
    setDiscordScreenshareUninstallStatus(installing ? RK_M("settings.startingInstall") : RK_M("settings.startingRemoval"), "");
    setStatus(busy, "");

      const done = data.message || (installing
        ? RK_M("common.installingDiscordScreenshareSupportObsWill")
        : RK_M("common.removingDiscordScreenshareSupportObsWill"));
      setDiscordScreenshareUninstallStatus(done, "good");
      setStatus(done, "good");
    } catch (e) {
      els.installShareAudioBtn.disabled = false;

      setStatus(failed(e.message || e), "bad");
