  async function uninstallReplayKit() {
    await settleSettings();
    if (dirty) {
      setUninstallStatus(RK_M("settings.someSettingsChangesAreNotSavedYet"), "bad");
      return;
    }
    const confirmed = await showUninstallConfirmModal();
    if (!confirmed) {
      setUninstallStatus("", "");
      return;
    }
    const target = document.querySelector('input[name="uninstallTarget"]:checked').value;
    if (target !== "replaykit" && target !== "audio") return;
    if (target === "audio" && shareAudioInstalled !== true) return;
    const options = { confirm:"confirm", keepUserSettings:!!els.uninstallKeepSettings.checked, removeObs:!!els.uninstallRemoveObs.checked };
    els.uninstallReplayKitBtn.disabled = true;
    setUninstallStatus(RK_M("settings.startingRemoval"), "");
    setStatus(target === "audio" ? RK_M("settings.removingSharePreviewAudio") : RK_M("settings.startingReplaykitUninstall"), "");
    try {
      const data = await withSetupProgress((text) => { setUninstallStatus(text, ""); setStatus(text, ""); }, () => helperJson(target === "audio" ? "uninstall-discord-screenshare" : "uninstall", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(target === "audio" ? { confirm:"confirm" } : options),
      }));
      setUninstallStatus(data.message || RK_M("settings.uninstallStartedObsWillClose"), "good");
      setStatus(data.message || RK_M("settings.uninstallStartedObsWillClose"), "good");
    } catch (e) {

    window.addEventListener("pointercancel", endDrag);
    window.addEventListener("blur", endDrag);
  })();

  // the obs settings live in this same window: the plugin brings the dialog up over this page and this page keeps whatever is still unsaved in it
  document.getElementById("openObsSettings").addEventListener("click", () => {
    helperJson("open-obs-settings", { method:"POST" }).catch((error) => setStatus(RK_M("settings.couldNotOpenTheObsSettings", { error: error.message || error }), "bad"));
  });

  // Each enabled button opens its OBS menu at the pointer.
  (function initObsMenu() {
    const buttons = document.getElementById("obsMenuButtons");
    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-obs-menu]");
      if (!button) return;
      helperJson("obs-menu?index=" + encodeURIComponent(button.dataset.obsMenu), { method:"POST" }).catch((error) => setStatus(RK_M("settings.couldNotOpenTheObsMenu", { error: error.message || error }), "bad"));
    });
  })();

  // streamable account: sign-in is cookie-based, the helper opens its own sign-in window and imports the session, and this box just follows /me
  const acct = { status: document.getElementById("streamableStatus"), signIn: document.getElementById("streamableSignIn"), signOut: document.getElementById("streamableSignOut"), force: document.getElementById("streamableForce") };
  let authState = { signedIn:false, username:"", plan:"", retentionDays:null, maxUploadBytes:null, maxDurationSec:null };
  let loginFlowActive = false;
  let loginPollTimer = null;
  let loginTimeoutTimer = null;
  const LOGIN_TIMEOUT_MS = 120000;
  const LOGIN_POLL_MS = 500;

  function planLabel(p) { return p ? p.charAt(0).toUpperCase() + p.slice(1) : RK_M("account.freePlan"); }
  function formatUploadSize(bytes) {
    if (bytes === null) return RK_M("settings.unavailable");
    if (bytes === 0) return RK_M("settings.unlimited");
    const units = ["B", "KB", "MB", "GB", "TB"];
    let unit = 0;
    while (bytes >= 1024 && unit < units.length - 1) { bytes /= 1024; unit++; }
    return bytes.toLocaleString(RK_I18N.lang(), { maximumFractionDigits:1 }) + " " + units[unit];
  }
  function renderAuth(busyText) {
    document.getElementById("streamableDetails").hidden = !!busyText;
    document.getElementById("streamableDetailsTitle").textContent = authState.signedIn ? RK_M("settings.accountDetails") : RK_M("settings.anonymousUploadDetails");
    document.getElementById("streamablePlan").textContent = authState.signedIn ? planLabel(authState.plan) : RK_M("common.anonymous");
    document.getElementById("streamableRetention").textContent = authState.retentionDays === null ? RK_M("settings.unavailable") : (authState.retentionDays === 1 ? RK_M("settings.n1Day") : RK_M("settings.countDays", { count: authState.retentionDays }));
    document.getElementById("streamableSize").textContent = formatUploadSize(authState.maxUploadBytes);
    document.getElementById("streamableDuration").textContent = authState.maxDurationSec === null ? RK_M("settings.unavailable") : authState.maxDurationSec === 0 ? RK_M("settings.unlimited") : RK_M("settings.countMinutes", { count: (authState.maxDurationSec / 60).toLocaleString(undefined, { maximumFractionDigits:1 }) });
    if (busyText) {
      acct.status.hidden = false;
      acct.status.textContent = busyText;
      acct.signIn.hidden = true; acct.signOut.hidden = true; acct.force.hidden = true;
      return;
    }
    // signed out the plan row of the upload details already says anonymous, so only a signed-in account names itself here
    acct.status.hidden = !authState.signedIn;
    if (authState.signedIn) {
      if (authState.username) acct.status.setAttribute("translate", "no"); else acct.status.removeAttribute("translate");
      acct.status.textContent = authState.username || RK_M("settings.connectedAccount");
    }
    document.getElementById("streamableHelp").textContent = authState.signedIn
      ? RK_M("settings.yourClipsAreSharedUsingThis")
      : RK_M("settings.noSignInIsNeededTo");
    acct.signIn.hidden = authState.signedIn;
    acct.signOut.hidden = !authState.signedIn;
    acct.force.hidden = !authState.signedIn;
  }
  // the picture the helper keeps for the account circle: its version, empty when there is none; the picker holds the request open until it closes, so a second one is not opened meanwhile
  const profile = { avatar: document.getElementById("profileAvatar"), change: document.getElementById("profilePictureChange"), remove: document.getElementById("profilePictureRemove"), error: document.getElementById("profilePictureError"), version:"", picking:false };
  const PERSON_SVG = '<svg class="profile-person" viewBox="0 0 48 48" aria-hidden="true">{{glyph:account-menu-1}}</svg>';
  // the same colour and letter the account menu and the title bar give a signed in account without a picture
  function accountHue(name) {
    let hash = 2166136261;
    for (const ch of String(name).toLowerCase()) hash = Math.imul(hash ^ ch.charCodeAt(0), 16777619) >>> 0;
    return hash % 360;
  }
  function renderProfilePicture() {
    const edit = profile.avatar.querySelector(".profile-edit");
    profile.avatar.replaceChildren();
    profile.avatar.style.background = "";
    if (profile.version) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = HELPER + "/profile-picture?v=" + encodeURIComponent(profile.version);
      profile.avatar.append(img);
    } else if (authState.signedIn) {
      const match = String(authState.username).match(/[A-Za-z0-9]/);
      const hue = accountHue(authState.username);
      profile.avatar.textContent = match ? match[0].toUpperCase() : "S";
      profile.avatar.style.background = "linear-gradient(135deg, hsl(" + hue + " 54% 50%), hsl(" + hue + " 52% 36%))";
    } else {
      profile.avatar.innerHTML = PERSON_SVG;
    }
    profile.avatar.append(edit);
    profile.avatar.disabled = profile.change.disabled = profile.remove.disabled = profile.picking;
    profile.avatar.setAttribute("aria-busy", String(profile.picking));
    profile.change.textContent = profile.picking ? RK_M("settings.choosing") : RK_M("common.changePicture");
    profile.remove.hidden = !profile.version;
  }
  async function changeProfilePicture(remove) {
    if (profile.picking) return;
    profile.picking = true;
    profile.error.hidden = true;
    renderProfilePicture();
    try {
      const data = await helperJson("profile-picture/" + (remove ? "clear" : "pick"), { method:"POST" });
      profile.version = typeof data.picture === "string" ? data.picture : "";
    } catch (e) {
      profile.error.textContent = e.message || RK_M("common.thatFileCouldNotBeUsed");
      profile.error.hidden = false;
    }
    profile.picking = false;
    renderProfilePicture();
  }
  profile.avatar.addEventListener("click", () => changeProfilePicture(false));
  profile.change.addEventListener("click", () => changeProfilePicture(false));
  profile.remove.addEventListener("click", () => changeProfilePicture(true));
  function applyAuthData(data) {
    authState = {
      signedIn: !!data.signedIn,
      username: data.maskedUsername || data.displayName || data.username || "",
      plan: data.plan || "",
      retentionDays: Number.isFinite(data.retentionDays) && data.retentionDays > 0 ? data.retentionDays : data.signedIn ? null : 1,
      maxUploadBytes: Number.isFinite(data.maxUploadBytes) && data.maxUploadBytes >= 0 ? data.maxUploadBytes : null,
      maxDurationSec: Number.isFinite(data.maxDurationSec) && data.maxDurationSec >= 0 ? data.maxDurationSec : null,
    };
    // the sign-in answers carry no picture, so only /me changes it
    if (typeof data.picture === "string") profile.version = data.picture;
    renderAuth();
    renderProfilePicture();
  }
  async function fetchMe() {
    try { applyAuthData(await helperJson("me?t=" + Date.now())); } catch (e) { /* helper offline, the box keeps its last state */ }
  }
  function clearLoginTimers() {
    if (loginPollTimer) { clearInterval(loginPollTimer); loginPollTimer = null; }
    if (loginTimeoutTimer) { clearTimeout(loginTimeoutTimer); loginTimeoutTimer = null; }
  }
  function finishLoginFlow() {
    clearLoginTimers();
    loginFlowActive = false;
    // any sign-in window still open (ours or one streamable spawned) is closed from the helper side, which js cannot do across origins
    fetch(HELPER + "/close-signin-windows", { method:"POST", cache:"no-store" }).catch(() => {});
    renderAuth();
  }
  // one poller drives the whole flow: the first call opens the window and every later one only reads its state, so a status read can never race ahead of the open and be mistaken for "closed without signing in"
  function startLoginFlow() {
    if (loginFlowActive) return;
    clearLoginTimers();
    loginFlowActive = true;
    let sawWindowOpen = false;
    renderAuth(RK_M("common.openingStreamable"));
    async function poll(isStart) {
      if (!loginFlowActive) return;
      let res, data;
      try {
        res = await fetch(HELPER + "/import-session?source=owned" + (isStart ? "&start=1" : ""), { method:"POST", cache:"no-store" });
        data = await res.json().catch(() => ({}));
      } catch (e) { return; }
      if (!loginFlowActive) return;
      if (!res.ok) {
        if (data.message) { finishLoginFlow(); setStatus(data.message, "bad"); }
        return;
      }
      if (data.signedIn) { applyAuthData(data); finishLoginFlow(); return; }
      if (data.pending === true) { sawWindowOpen = true; renderAuth(RK_M("common.signInInTheStreamableWindow")); return; }
      if (sawWindowOpen) { finishLoginFlow(); return; }
      renderAuth(RK_M("common.openingStreamable"));
    }
    poll(true);
    loginPollTimer = setInterval(() => poll(false), LOGIN_POLL_MS);
    loginTimeoutTimer = setTimeout(finishLoginFlow, LOGIN_TIMEOUT_MS);
  }
  acct.signIn.addEventListener("click", startLoginFlow);
  acct.signOut.addEventListener("click", async () => {
    renderAuth(RK_M("settings.signingOut"));
    try {
      await helperJson("logout", { method:"POST" });
      applyAuthData(await helperJson("me?t=" + Date.now()));
    } catch (error) { renderAuth(); setStatus(RK_M("settings.couldNotSignOutError", { error: error.message }), "bad"); }
  });
  // the plugin draws this confirm over the dimmed OBS window and runs the follow-up itself (restart obs, drop the streamable cookies, relaunch)
  acct.force.addEventListener("click", () => {
    helperJson("ui-confirm", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ kind:"streamable-relogin" }) }).catch((error) => setStatus(error.message, "bad"));
  });
  fetchMe();
  RKWindow.onChange((up) => { if (up && !loginFlowActive) fetchMe(); });

  // the clip button in the title bar opens this page on the tab that holds the clipping switch
  window.__rkGoToPage = (name) => {
    if (document.getElementById("page-" + name)) activatePage(name);
  };

  // the first load holds the pages under the shape kept from an earlier load of this page at this size, or under the plain ground when there is none yet, so no control shows a value before the real one is in
  const requestedSettingsPage = new URLSearchParams(location.search).get("page");
  if (requestedSettingsPage) window.__rkGoToPage(requestedSettingsPage);
  const settingsMain = document.querySelector("main.main");
  if (window.RKSkeleton) RKSkeleton.cover(settingsMain, { view: "settings", variant: document.body.dataset.skelPage, blankFirst: true });
  loadSettings().finally(() => { if (window.RKSkeleton) RKSkeleton.uncover(settingsMain); });
  setInterval(refreshExternalSettings, 2000);

  // hidden-not-destroyed window: a reopen just re-shows this page, so the waiting save goes out, settings are fetched again and what still waits for Restart OBS is dropped, to behave like a fresh open. mirrors clips.htmls re-show reset (visibilitychange, plus a focus fallback for CEF hosts that dont deliver visibilitychange on their own hide()/show()).
  let settingsWasHidden = false;
  function reinitSettingsOnShow() {
    settleSettings().catch(() => {}).then(loadSettings).then(() => {
      if (window.RKOverlayPreview) { RKOverlayPreview.resetPosition(); RKOverlayPreview.refresh(); }
    });
  }
  // embedded in the obs window this page is one view among several, not a window that was closed: going to another view and coming back keeps its edits, so none of the reset-on-show paths apply there
  document.addEventListener("visibilitychange", () => {
    if (window.RKEmbedded) return;
    if (document.hidden) { settingsWasHidden = true; settleSettings().catch(() => {}); return; }
    if (settingsWasHidden) { settingsWasHidden = false; reinitSettingsOnShow(); }
  });
  // in its own window the plugin hides and shows this page without cef ever sending visibilitychange or focus, so its own show / hide event drives the same reset
  RKWindow.onChange((up) => {
    if (window.RKEmbedded) return;
    if (!up) { settingsWasHidden = true; settleSettings().catch(() => {}); return; }
    if (settingsWasHidden) { settingsWasHidden = false; reinitSettingsOnShow(); }
  });
  window.addEventListener("focus", () => {
    if (!settingsWasHidden || document.hidden) return; // gated so an ordinary alt-tab back never wipes in-progress edits
    settingsWasHidden = false;
    reinitSettingsOnShow();
  });

  (async () => {
    try {
      const data = await helperJson("version?t=" + Date.now());
      if (data.version) document.getElementById("sidebarRkVersion").textContent = RK_M("common.replaykitVersion", { version: data.version });
      if (data.obsVersion) {
        document.getElementById("sidebarObsVersion").textContent = RK_M("settings.obsVersion", { version: data.obsVersion });
        document.getElementById("sidebarVersionDot").hidden = !data.version;
      }
    } catch (e) {}
  })();

  els.sidebarGithubLink.addEventListener("click", (e) => {
    e.preventDefault();
    fetch(HELPER + "/open-url?url=" + encodeURIComponent(els.sidebarGithubLink.href), { method:"POST" }).catch(() => {});
  });
</script>
</body>
</html>
