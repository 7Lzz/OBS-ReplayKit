<style>
  /* the popup is the screenshot viewer with a list in it: same frame, same head, the cards of the screenshots inside */
  /* one size whatever it holds, so the popup never grows or shrinks as items come and go; only its list scrolls, with the gutter and inset the clip list keeps */
  .deleted-dialog { width:min(1080px, calc(100vw - 48px)); height:min(720px, calc(100vh - 48px)); overflow:hidden; }
  .deleted-dialog[open] { display:flex; flex-direction:column; }
  .deleted-dialog .screenshot-dialog-head > svg { width:16px; height:16px; fill:currentColor; flex:none; }
  .deleted-dialog .screenshot-dialog-head h2 { flex:0 1 auto; }
  .deleted-note { flex:1; min-width:0; font-size:12px; font-weight:500; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deleted-dialog .deleted-empty-btn { flex:none; display:inline-flex; height:28px; padding:0 12px; font-size:12px; font-weight:600; }
  .deleted-empty-btn[hidden] { display:none; }
  .deleted-body { flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable; padding:16px 10px 16px 16px; margin-right:6px; --sb-start:8px; --sb-end:8px; }
  #deleted-grid { grid-template-columns:repeat(auto-fill, minmax(min(240px, 100%), 1fr)); }
  #deleted-grid:empty { display:none; }
  .deleted-card .preview { position:relative; overflow:clip; }
  .deleted-card .preview img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }
  .deleted-card .preview video { object-fit:contain; }
  .deleted-card:hover .preview-controls, .deleted-card:focus-within .preview-controls { opacity:1; pointer-events:auto; }
  .deleted-card .preview:focus-visible { outline:2px solid var(--selected-solid); outline-offset:-2px; }
  .deleted-card .preview:fullscreen, .deleted-card .preview:-webkit-full-screen { width:100vw; height:100vh; border-radius:0; }
  .deleted-card .meta .left.is-soon { color:var(--warning, var(--muted)); }
  .deleted-card .action-link-btn:disabled { opacity:.6; cursor:default; }
  /* the count of the trash button in the toolbar, so a delete shows where it went */
  .clip-deleted-btn { position:relative; }
  .clip-deleted-btn[hidden] { display:none; }
  .clip-deleted-count { position:absolute; top:1px; right:0; min-width:15px; height:15px; padding:0 4px; border-radius:8px; background:var(--grey4-solid,var(--grey4)); color:var(--text); font-size:10px; font-weight:600; line-height:15px; text-align:center; pointer-events:none; }
  .clip-deleted-count[hidden] { display:none; }
</style>
<dialog class="screenshot-dialog deleted-dialog" id="deleted-dialog" aria-labelledby="deleted-title" tabindex="-1">
  <div class="screenshot-dialog-head">
    <svg data-i="action/trash" viewBox="0 0 24 24" aria-hidden="true"></svg>
    <h2 id="deleted-title">Deleted history</h2>
    <span class="deleted-note" id="deleted-note"></span>
    <button class="btn danger-action deleted-empty-btn" type="button" id="deleted-empty-all" hidden>Empty</button>
    <button class="icon-mini-btn" type="button" id="deleted-close" aria-label="Close deleted history" data-tooltip="Close"><svg data-i="editor/close" viewBox="0 0 24 24" aria-hidden="true"></svg></button>
  </div>
  <div class="deleted-body">
    <div class="grid" id="deleted-grid"></div>
    <div class="empty" id="deleted-empty" role="status">Loading deleted clips...</div>
  </div>
</dialog>
<script>
window.RKDeleted = {
  create: function (options) {
    const dialog = document.getElementById("deleted-dialog");
    const button = document.getElementById("clip-deleted-btn");
    const badge = document.getElementById("clip-deleted-count");
    const grid = document.getElementById("deleted-grid");
    const empty = document.getElementById("deleted-empty");
    const note = document.getElementById("deleted-note");
    const emptyAll = document.getElementById("deleted-empty-all");
    let rows = [], days = 7, loaded = false, epoch = 0, signature = "", rowsSignature = "";
    const IDLE_REFRESH_MS = 30000;
    let refreshedAt = 0;
    const cards = new Map();
    let activeCard = null;
    const svg = (inner) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + inner + "</svg>";
    const baseName = (name) => name.replace(/\.[^.]+$/, "");
    function daysLeft(row) { return Math.max(0, Math.ceil((row.expiresAt * 1000 - Date.now()) / 86400000)); }
    function details(row, target) {
      target.replaceChildren();
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = options.formatSize(row.size);
      const kind = document.createElement("span");
      kind.textContent = row.kind === "screenshot" ? "Screenshot" : row.kind === "gif" ? "GIF" : "Clip";
      const left = document.createElement("span");
      const n = daysLeft(row);
      left.className = "left" + (n <= 1 ? " is-soon" : "");
      left.textContent = n <= 0 ? "Deleted for good soon" : n === 1 ? "1 day left" : n + " days left";
      const dot = () => { const d = document.createElement("span"); d.className = "dot"; return d; };
      target.append(size, dot(), kind, dot(), left);
      // a gif belongs to no game, as on its card in the GIFs section
      if (window.RKClipGames && row.kind !== "gif") RKClipGames.badge(target, row, {});
    }
    function stopPreviews() {
      cards.forEach(card => { if (card.stopPreview) card.stopPreview(true); });
    }
    function bindPreview(card, row, picture, thumb) {
      const url = options.helper + "/deleted/media?id=" + encodeURIComponent(row.id);
      if (row.kind === "gif") {
        card.addEventListener("mouseenter", () => { thumb.src = url; });
        card.stopPreview = () => { thumb.src = options.helper + "/deleted/thumb?id=" + encodeURIComponent(row.id); };
        card.addEventListener("mouseleave", card.stopPreview);
        return;
      }
      if (row.kind !== "clip") return;
      const media = document.createElement("div");
      media.className = "preview-media";
      media.appendChild(thumb);
      const video = document.createElement("video");
      video.preload = "none";
      video.muted = true;
      video.loop = true;
      video.setAttribute("playsinline", "");
      video.setAttribute("controlsList", "nodownload noplaybackrate noremoteplayback");
      video.disablePictureInPicture = true;
      media.appendChild(video);
      picture.appendChild(media);
      picture.insertAdjacentHTML("beforeend", '<div class="play-overlay"></div><div class="player-shade"></div>' + options.player.controls() + '<div class="progress-bar"><div class="progress-fill"><div class="progress-scrub-dot"></div></div></div>');
      picture.querySelectorAll(".settings-wrap, .snap-btn, .theater-btn").forEach(control => control.remove());
      picture.tabIndex = 0;
      picture.setAttribute("role", "group");
      picture.setAttribute("aria-label", "Playback preview: " + row.name);
      options.player.volume(card);
      const bar = picture.querySelector(".progress-bar");
      const fill = picture.querySelector(".progress-fill");
      const play = picture.querySelector(".play-toggle-btn");
      const fullscreen = picture.querySelector(".fullscreen-btn");
      let timer = 0, frame = 0, scrubbing = false, resume = false;
      const isFullscreen = () => (document.fullscreenElement || document.webkitFullscreenElement) === picture;
      const time = value => Math.floor(value / 60) + ":" + String(Math.floor(value % 60)).padStart(2, "0");
      function update() {
        const duration = video.duration;
        if (Number.isFinite(duration) && duration > 0) {
          fill.style.width = video.currentTime / duration * 100 + "%";
          picture.querySelector(".time-current").textContent = time(video.currentTime);
          picture.querySelector(".time-total").textContent = time(duration);
        }
        play.querySelector(".pt-play").style.display = video.paused ? "" : "none";
        play.querySelector(".pt-pause").style.display = video.paused ? "none" : "";
        play.dataset.tooltip = video.paused ? "Play" : "Pause";
      }
      function tick() { update(); frame = video.paused ? 0 : requestAnimationFrame(tick); }
      function start() {
        clearTimeout(timer);
        timer = 0;
        if (!dialog.open || document.hidden) return;
        if (activeCard && activeCard !== card) activeCard.stopPreview(true);
        activeCard = card;
        options.player.start(video);
        if (video.getAttribute("src") !== url) video.src = url;
        picture.classList.add("is-playing");
        if (video.readyState >= 2) picture.classList.add("is-video-ready");
        video.play().catch(() => { if (video.paused) picture.classList.remove("is-playing"); });
      }
      card.stopPreview = (force) => {
        clearTimeout(timer);
        timer = 0;
        if (!force && isFullscreen()) return;
        if (isFullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) { const result = exit.call(document); if (result && result.catch) result.catch(() => {}); }
        }
        scrubbing = resume = false;
        bar.classList.remove("is-scrubbing");
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        options.player.stop(video);
        picture.classList.remove("is-playing", "is-video-ready");
        fill.style.width = "0%";
        if (activeCard === card) activeCard = null;
      };
      card.addEventListener("mouseenter", () => {
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        clearTimeout(timer);
        timer = setTimeout(start, 120);
      });
      card.addEventListener("mouseleave", () => { if (!scrubbing) card.stopPreview(false); });
      video.addEventListener("loadeddata", () => { if (video.hasAttribute("src")) picture.classList.add("is-video-ready"); });
      video.addEventListener("loadedmetadata", update);
      video.addEventListener("timeupdate", update);
      video.addEventListener("seeked", update);
      video.addEventListener("play", () => { update(); if (!frame) frame = requestAnimationFrame(tick); });
      video.addEventListener("pause", () => { if (frame) cancelAnimationFrame(frame); frame = 0; update(); });
      video.addEventListener("error", () => { card.stopPreview(true); options.notify("This deleted clip could not be played."); });
      function toggle() { if (!video.hasAttribute("src") || video.paused) start(); else video.pause(); }
      play.addEventListener("click", event => { event.stopPropagation(); toggle(); });
      picture.addEventListener("click", event => {
        if (event.button === 0 && !event.target.closest("button, input, .progress-bar, .volume-slider-wrap")) toggle();
      });
      fullscreen.addEventListener("click", event => {
        event.stopPropagation();
        const operation = isFullscreen() ? document.exitFullscreen || document.webkitExitFullscreen : picture.requestFullscreen || picture.webkitRequestFullscreen;
        if (!operation) { options.notify("Fullscreen is unavailable."); return; }
        const entering = !isFullscreen();
        try {
          const result = operation.call(entering ? picture : document);
          if (result && result.catch) result.catch(() => options.notify("Fullscreen could not be changed."));
        } catch (error) { options.notify("Fullscreen could not be changed."); return; }
        fullscreen.blur();
        picture.focus({preventScroll:true});
        if (entering) start();
      });
      function updateFullscreen() {
        const active = isFullscreen();
        fullscreen.querySelector(".fs-enter-icon").style.display = active ? "none" : "";
        fullscreen.querySelector(".fs-exit-icon").style.display = active ? "" : "none";
        fullscreen.dataset.tooltip = active ? "Exit fullscreen (F)" : "Fullscreen (F)";
        fullscreen.setAttribute("aria-label", fullscreen.dataset.tooltip);
        if (!active && !card.matches(":hover")) card.stopPreview(false);
      }
      picture.addEventListener("fullscreenchange", updateFullscreen);
      picture.addEventListener("webkitfullscreenchange", updateFullscreen);
      function seek(event) {
        if (!(video.duration > 0) || !Number.isFinite(video.duration)) return;
        const rect = bar.getBoundingClientRect();
        if (rect.width <= 0) return;
        video.currentTime = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)) * video.duration;
        update();
      }
      bar.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        event.preventDefault(); event.stopPropagation();
        scrubbing = true; resume = !video.paused;
        video.pause();
        bar.classList.add("is-scrubbing");
        bar.setPointerCapture(event.pointerId);
        seek(event);
      });
      bar.addEventListener("pointermove", event => { if (scrubbing) seek(event); });
      function endScrub() {
        if (!scrubbing) return;
        scrubbing = false;
        bar.classList.remove("is-scrubbing");
        if (resume) start();
        resume = false;
        if (!card.matches(":hover") && !isFullscreen()) card.stopPreview(false);
      }
      bar.addEventListener("pointerup", endScrub);
      bar.addEventListener("pointercancel", endScrub);
      picture.addEventListener("keydown", event => {
        if (event.target.closest("button, input") || event.repeat) return;
        if (event.key === " " || event.key === "Enter") { event.preventDefault(); toggle(); }
        else if (event.key.toLowerCase() === "f") { event.preventDefault(); fullscreen.click(); }
        else if (event.key.toLowerCase() === "m") { event.preventDefault(); picture.querySelector(".volume-btn").click(); }
      });
    }
    async function act(kind, id) {
      const response = await fetch(options.helper + "/deleted/" + kind + (id ? "?id=" + encodeURIComponent(id) + "&t=" : "?t=") + Date.now(), {method:"POST", cache:"no-store"});
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || "That could not be done");
      return data;
    }
    async function restore(row, button) {
      const card = cards.get(row.id);
      if (card && card.stopPreview) card.stopPreview(true);
      if (button) button.disabled = true;
      try {
        const done = await act("restore", row.id);
        options.toast("Restored " + baseName(done.name || row.name));
        options.restored(done.kind || row.kind);
        refresh();
      } catch (error) { options.notify(error.message); }
      finally { if (button) button.disabled = false; }
    }
    function buildCard(row) {
      const icons = options.icons;
      const card = document.createElement("div");
      card.className = "screenshot-card deleted-card rk-hover-card";
      card.dataset.deleted = row.id;
      const picture = document.createElement("div");
      picture.className = "preview";
      const thumb = document.createElement("img");
      thumb.loading = "lazy";
      thumb.decoding = "async";
      thumb.alt = row.name;
      thumb.src = options.helper + "/deleted/thumb?id=" + encodeURIComponent(row.id);
      picture.appendChild(thumb);
      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML =
        '<div class="title-row"><span class="name"></span>' +
        '<div class="title-actions">' +
          '<button class="icon-mini-btn delete-btn" data-delete-label="Delete for good" data-tooltip="Delete for good" aria-label="Delete for good" type="button">' + svg(icons.TRASH) + '<span class="delete-confirm-text">Delete?</span></button>' +
          '<div class="menu-container"><button class="icon-mini-btn menu-btn" data-tooltip="More options" aria-label="More options" type="button">' + svg(icons.MORE) + "</button>" +
            '<div class="menu-dropdown">' +
              '<div class="menu-item" data-act="restore">' + svg(icons.RESTORE).replace("<svg", '<svg class="menu-item-icon"') + "<span>Restore</span></div>" +
              '<div class="menu-separator"></div>' +
              '<div class="menu-item delete-menu-item delete-btn" data-act="delete" data-delete-label="Delete for good" role="button" tabindex="0" aria-label="Delete for good">' + svg(icons.TRASH).replace("<svg", '<svg class="menu-item-icon"') + '<span class="menu-item-label">Delete</span></div>' +
            "</div></div>" +
        "</div></div>" +
        '<div class="meta"></div>';
      body.querySelector(".name").textContent = baseName(row.name);
      details(row, body.querySelector(".meta"));
      const actions = document.createElement("div");
      actions.className = "actions";
      const restoreButton = document.createElement("button");
      restoreButton.type = "button";
      restoreButton.className = "btn action-link-btn";
      restoreButton.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">' + icons.RESTORE + '</svg><span class="btn-label">Restore</span>';
      restoreButton.addEventListener("click", event => { event.stopPropagation(); restore(row, restoreButton); });
      actions.appendChild(restoreButton);
      card.append(picture, body, actions);
      bindPreview(card, row, picture, thumb);
      const menu = body.querySelector(".menu-dropdown");
      async function remove(trigger, inMenu) {
        // the same two clicks as every delete: the first arms the button, the second deletes for good
        options.resetDeletes(trigger);
        if (!trigger.classList.contains("is-armed")) {
          if (!inMenu) options.closeMenus();
          options.armDelete(trigger);
          if (inMenu) { menu.classList.add("is-open"); card.classList.add("menu-open"); }
          return;
        }
        options.resetDeletes();
        options.closeMenus();
        if (card.stopPreview) card.stopPreview(true);
        try { await act("remove", row.id); refresh(); }
        catch (error) { options.notify(error.message); }
      }
      body.addEventListener("click", event => {
        const button = event.target.closest("button, .menu-item");
        if (!button) return;
        event.stopPropagation();
        if (button.classList.contains("menu-btn")) { options.openMenu(card, menu, event); return; }
        if (button.matches(".title-actions > .delete-btn")) { remove(button, false); return; }
        if (button.dataset.act === "delete") { remove(button, true); return; }
        menu.classList.remove("is-open");
        card.classList.remove("menu-open");
        if (button.dataset.act === "restore") restore(row, restoreButton);
      });
      card.addEventListener("contextmenu", event => {
        event.preventDefault();
        event.stopPropagation();
        options.openMenu(card, menu, event);
      });
      options.hovers(card);
      return card;
    }
    function paintHeading() {
      note.textContent = days > 0 ? "Kept for " + days + (days === 1 ? " day" : " days") : "";
      emptyAll.hidden = !rows.length;
    }
    function paintButton() {
      if (!button) return;
      // with deleted history off a delete is final, so there is no bin to open; what it still holds goes when its time is up
      button.hidden = !loaded || days <= 0;
      badge.hidden = !rows.length;
      badge.textContent = rows.length > 99 ? "99+" : String(rows.length);
      const label = rows.length ? "Deleted history (" + rows.length + ")" : "Deleted history";
      button.dataset.tooltip = label;
      button.setAttribute("aria-label", label);
    }
    function paint() {
      paintHeading();
      paintButton();
      if (!dialog.open) return;
      const current = JSON.stringify(rows) + (window.RKClipGames && !RKClipGames.enabled ? "|games-off" : "");
      if (current !== signature) {
        signature = current;
        const keep = new Set();
        rows.forEach((row, index) => {
          keep.add(row.id);
          let card = cards.get(row.id);
          if (!card) { card = buildCard(row); cards.set(row.id, card); }
          else details(row, card.querySelector(".meta"));
          if (grid.children[index] !== card) grid.insertBefore(card, grid.children[index] || null);
        });
        cards.forEach((card, id) => { if (!keep.has(id)) { if (card.stopPreview) card.stopPreview(true); card.remove(); cards.delete(id); } });
      }
      empty.hidden = rows.length > 0;
      empty.textContent = !loaded ? "Loading deleted clips..."
        : "Nothing here. Clips, screenshots and GIFs you delete stay here for " + days + (days === 1 ? " day" : " days") + " before they're gone for good.";
    }
    // the page asks for the list from several places as it starts and as things change, so asks that come while a read is out are folded into one more read after it
    let reading = null, readAgain = false;
    async function refresh() {
      if (document.hidden) return;
      if (reading) { readAgain = true; return reading; }
      reading = read();
      try { await reading; } finally { reading = null; }
      if (readAgain) { readAgain = false; return refresh(); }
    }
    async function read() {
      refreshedAt = Date.now();
      const run = ++epoch;
      try {
        const response = await fetch(options.helper + "/deleted?t=" + Date.now(), {cache:"no-store"});
        const data = await response.json();
        if (!response.ok || !data.ok || !Array.isArray(data.items)) throw new Error("Could not load deleted items");
        if (run !== epoch) return;
        const next = data.items.filter(row => row && typeof row.id === "string" && typeof row.name === "string" && Number.isFinite(row.size) && Number.isFinite(row.deletedAt) && Number.isFinite(row.expiresAt));
        const listed = JSON.stringify(next) + "|" + data.days;
        if (loaded && listed === rowsSignature) return;
        rowsSignature = listed;
        rows = next;
        days = Number(data.days) || 0;
        if (options.history) options.history(days > 0);
        loaded = true;
        if (days <= 0 && dialog.open) dialog.close();
        paint();
      } catch (error) {
        if (run !== epoch) return;
        rows = []; loaded = false; signature = ""; rowsSignature = "";
        stopPreviews(); grid.replaceChildren(); cards.clear();
        paintButton();
        empty.hidden = false;
        empty.textContent = "The deleted items could not be loaded.";
      }
    }
    // emptying is the one action here that takes everything at once, so it asks twice like a delete does
    let emptyArmTimer = 0;
    function disarmEmpty() {
      clearTimeout(emptyArmTimer);
      emptyAll.classList.remove("is-armed");
      emptyAll.textContent = "Empty";
      emptyAll.dataset.tooltip = "Delete everything here for good";
    }
    emptyAll.addEventListener("click", async () => {
      if (!emptyAll.classList.contains("is-armed")) {
        emptyAll.classList.add("is-armed");
        emptyAll.textContent = "Empty?";
        emptyAll.dataset.tooltip = "Click again to delete everything here";
        emptyArmTimer = setTimeout(disarmEmpty, 3000);
        return;
      }
      disarmEmpty();
      stopPreviews();
      emptyAll.disabled = true;
      try { await act("empty"); refresh(); }
      catch (error) { options.notify(error.message); }
      finally { emptyAll.disabled = false; }
    });
    disarmEmpty();
    window.addEventListener("replaykit:deleted-changed", refresh);
    document.addEventListener("visibilitychange", () => { if (document.hidden) stopPreviews(); else refresh(); });
    dialog.querySelector(".deleted-body").addEventListener("scroll", () => {
      cards.forEach(card => { if (card.stopPreview) card.stopPreview(false); });
    }, {passive:true});
    function open() {
      if (loaded && days <= 0) return;
      if (!dialog.open) { dialog.showModal(); dialog.focus({preventScroll:true}); }
      signature = "";
      paint();
      refresh();
    }
    if (button) button.addEventListener("click", event => { event.stopPropagation(); open(); });
    document.getElementById("deleted-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => { if (event.target === dialog) dialog.close(); });
    dialog.addEventListener("close", () => { stopPreviews(); options.resetDeletes(); options.closeMenus(); disarmEmpty(); });
    dialog.addEventListener("keydown", event => event.stopPropagation());
    setInterval(() => { if (dialog.open || Date.now() - refreshedAt >= IDLE_REFRESH_MS) refresh(); }, 5000);
    return {
      refresh: refresh,
      open: open,
      reset: function () {
        stopPreviews(); ++epoch; rows = []; loaded = false; signature = ""; rowsSignature = ""; grid.replaceChildren(); cards.clear();
        if (dialog.open) dialog.close();
        paint(); refresh();
      },
    };
  },
};
</script>
