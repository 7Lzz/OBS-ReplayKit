<div class="modal-veil" id="compress-veil">
    <div class="modal" id="compress-modal">
      <h2 data-i18n="clips.clipIsTooBigForStreamable"></h2>
      <div class="body" id="compress-body"></div>
      <div class="row">
        <button class="btn"         type="button" id="compress-cancel" data-i18n="common.cancel"></button>
        <button class="btn primary" type="button" id="compress-go" data-i18n="common.compress"></button>
      </div>
    </div>
  </div>

  <div class="modal-veil" id="compress-all-veil">
    <div class="modal" id="compress-all-modal">
      <h2 data-i18n="clips.compressAllClips"></h2>
      <div class="body" id="compress-all-body"></div>
      <div class="row">
        <button class="btn"         type="button" id="compress-all-cancel" data-i18n="common.cancel"></button>
        <button class="btn primary" type="button" id="compress-all-go" data-i18n="clips.compressAll"></button>
      </div>
    </div>
  </div>

  <div class="modal-veil" id="compress-mode-veil">
    <div class="modal compress-mode-modal" id="compress-mode-modal">
      <h2 data-i18n="clips.compressClip"></h2>
      <div class="clip-name" id="compress-mode-clip-name" translate="no"></div>
      <div class="compress-mode-warning" role="note">
        <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/warning-outline}}</svg>
        <span data-i18n="clips.replacesTheOriginalFileOnDisk"></span>
      </div>
      <div class="compress-mode-locked" role="note" id="compress-mode-locked-note"></div>
      <script>
        // one translatable sentence, since the bold part would otherwise split it into pieces that are translated apart
        document.getElementById("compress-mode-locked-note").innerHTML = RK_MH("clips.thisClipIsAlreadyAtMaximum");
      </script>
      <div class="compress-mode-list">
        <button type="button" class="compress-mode-card" data-mode="fast">
          <span class="title" data-i18n="common.fast"></span>
          <span class="blurb" data-i18n="clips.quickCompressionUsingYourGpuWhen"></span>
          <span class="reason" data-i18n="clips.alreadyCompressedInFastModeChoose"></span>
        </button>
        <button type="button" class="compress-mode-card" data-mode="smaller">
          <span class="title" data-i18n="common.smaller"></span>
          <span class="blurb" data-i18n="clips.usesMoreTimeToReduceThe"></span>
          <span class="reason" data-i18n="clips.alreadyAtMaximumCompression"></span>
        </button>
      </div>
      <div class="compress-downsample-row" id="compress-downsample-row" hidden>
        <input type="checkbox" class="rk-switch" id="compress-downsample-toggle" aria-label="Also lower the resolution" data-i18n-aria-label="clips.alsoLowerTheResolution">
        <span data-i18n="clips.alsoLowerTheResolution"></span>
      </div>
      <div class="compress-downsample-detail" id="compress-downsample-detail" hidden>
        <div class="combo" id="compress-downsample-select" tabindex="0" role="combobox" aria-expanded="false" aria-label="Resolution for compressed clip" data-i18n-aria-label="clips.resolutionForCompressedClip">
          <button class="combo-button" type="button" aria-haspopup="listbox"><span class="combo-label"></span><span class="combo-arrow"><svg viewBox="0 0 16 16" aria-hidden="true">{{glyph:nav/combo-arrow}}</svg></span></button>
          <div class="combo-menu" role="listbox" aria-label="Resolution for compressed clip" data-i18n-aria-label="clips.resolutionForCompressedClip"></div>
        </div>
        <span class="compress-downsample-note" data-i18n="clips.shrinksTheClipToThisSize"></span>
      </div>
      <div class="row">
        <button class="btn" type="button" id="compress-mode-cancel" data-i18n="common.cancel"></button>
      </div>
    </div>
  </div>

  <div class="modal-veil" id="trim-processing-veil">
    <div class="trim-processing-bones" id="trim-processing-bones" aria-hidden="true"></div>
    <div class="modal trim-processing-modal" id="trim-processing-modal">
      <div class="trim-processing-spinner"></div>
      <div class="trim-processing-label" data-i18n="clips.processingClip"></div>
      <div class="trim-processing-stage" id="trim-processing-stage"></div>
      <button type="button" class="btn" id="trim-processing-cancel" data-i18n="common.cancel"></button>
    </div>
  </div>

  <div class="modal-veil" id="trim-veil"></div>
  <div class="modal-veil" id="save-veil"></div>
