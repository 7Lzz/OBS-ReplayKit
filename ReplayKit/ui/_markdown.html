<!-- shared partial (helper #include target: markdown). the github-flavored markdown subset our release notes actually use -- headers, bullets, numbered lists, rules, fenced code, **bold**, `code`, [text](url), bare urls. escapes first, then transforms, so note text can never inject markup. exposes window.RKMarkdown.render(raw) -> html string. -->
<script>
(function () {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  // order matters: bold, then code, then [text](url), then bare urls
  function applyInline(text) {
    text = text.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return text;
  }
  function render(raw) {
    if (!raw) return "";
    var lines = String(raw).replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var listType = null;
    var inCode = false;
    var codeBuf = [];
    function closeList() { if (listType) { out.push("</" + listType + ">"); listType = null; } }
    function openList(type) { if (listType !== type) { closeList(); out.push("<" + type + ">"); listType = type; } }
    for (var i = 0; i < lines.length; i++) {
      var rawLine = lines[i];
      var line = rawLine.replace(/\s+$/, "");
      if (/^```/.test(line)) {
        if (inCode) {
          out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
          codeBuf.length = 0;
          inCode = false;
        } else { closeList(); inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(rawLine); continue; }
      if (/^(-{3,}|\*{3,})$/.test(line)) { closeList(); out.push("<hr/>"); continue; }
      var ordered = line.match(/^\d+[.)]\s+(.*)$/);
      if (ordered) { openList("ol"); out.push("<li>" + applyInline(escapeHtml(ordered[1])) + "</li>"); continue; }
      var bullet = line.match(/^[-*]\s+(.*)$/);
      if (bullet) { openList("ul"); out.push("<li>" + applyInline(escapeHtml(bullet[1])) + "</li>"); continue; }
      closeList();
      var header = line.match(/^(#{1,3})\s+(.*)$/);
      if (header) {
        var level = header[1].length + 2; // h3..h5
        out.push("<h" + level + ">" + applyInline(escapeHtml(header[2])) + "</h" + level + ">");
        continue;
      }
      if (!line) { out.push(""); continue; }
      out.push("<p>" + applyInline(escapeHtml(line)) + "</p>");
    }
    // file ended mid-codeblock: flush what we have so content isnt lost
    if (inCode && codeBuf.length) out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
    closeList();
    return out.join("\n");
  }
  window.RKMarkdown = { render: render, escapeHtml: escapeHtml };
})();
</script>
