<style>
  /* when this partial is dropped inside a host that already uses .box as a scroll container (the setup wizard), neutralise the nesting */
  .box .box { height:auto; overflow:visible; background:transparent; padding:0; margin:0 8px 12px 0; }
  .box .box + .box { border-top:1px solid var(--line); padding-top:10px; }
  /* setup.html has no stacked-field rules, so the theme grid + its buttons collapse onto one line there */
  .field-wrap.is-stacked { flex-direction:column; align-items:stretch; }
  .form-row:has(> .field-wrap.is-stacked) { align-items:start; }
  .form-row:has(> .field-wrap.is-stacked) > .label { line-height:32px; }
  /* the [hidden] attribute otherwise loses to .form-row display:grid (author sheet beats the ua one), which left the custom-theme + custom-icon rows permanently on screen in setup. settings.html carries this rule already */
  .form-row[hidden] { display:none; }
  .volume-control {
    width:100%;
    display:grid;
    grid-template-columns:72px minmax(180px,1fr);
    align-items:center;
    gap:8px;
  }
  .volume-value {
    background:transparent;
    border-color:var(--field-solid,var(--field));
    text-align:center;
    padding:0 8px;
  }
  .volume-slider-wrap {
    position:relative;
    height:32px;
    min-width:0;
  }
  /* the look of the slider is the shared one of the slider partial */
  .volume-slider { position:relative; z-index:1; width:100%; height:32px; }
  .color-control {
    width:100%;
    display:grid;
    grid-template-columns:42px minmax(120px, 180px);
    align-items:center;
    gap:8px;
  }
  .color-picker {
    width:42px;
    height:32px;
    border:1px solid var(--field-solid,var(--field));
    border-radius:4px;
    background:var(--color, var(--field));
    padding:3px;
    cursor:pointer;
    box-shadow:inset 0 0 0 3px var(--field-dark);
  }
  .color-picker:hover { border-color:var(--line2); }
  .color-value {
    width:100%;
    text-transform:lowercase;
  }
  .theme-section { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:transparent; }
  .theme-section + .theme-section { margin-top:9px; }
  .theme-section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-size:12px; font-weight:600; }
  .theme-section-hint { color:var(--muted); font-size:10px; font-weight:400; }
  .theme-editor { display:flex; flex-wrap:wrap; gap:8px; }
  .theme-preview-row { margin-top:8px; }
  .theme-preview-row .btn { height:26px; padding:0 10px; font-size:12px; }
  .theme-pick { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:var(--muted); cursor:pointer; }
  .theme-pick .color-picker { width:38px; height:30px; border-color:var(--line); border-radius:6px; }
  .gradient-editor { width:100%; margin-top:9px; }
  .gradient-editor[hidden] { display:none; }
  .gradient-top { display:grid; grid-template-columns:130px 1fr; gap:8px; align-items:center; }
  .gradient-preview { height:34px; border:1px solid var(--line2); border-radius:5px; background:var(--gradient-preview,var(--field)); }
  .gradient-control { display:grid; grid-template-columns:88px minmax(120px,1fr) 58px; align-items:center; gap:8px; margin-top:8px; }
  .gradient-control .label { font-size:11px; }
  .gradient-number { width:58px; text-align:right; }
  .gradient-stops-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; }
  .gradient-stop-list { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .gradient-stop-row { display:grid; grid-template-columns:42px minmax(120px,1fr) 58px 28px; align-items:center; gap:7px; }
  .gradient-stop-remove { min-width:28px; width:28px; padding:0; }
  .gradient-stop-remove svg { width:10px; height:10px; fill:currentColor; }
  .grad-targets { display:flex; gap:4px; flex-wrap:wrap; }
  .grad-target {
    display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; cursor:pointer;
    border:1px solid var(--line); border-radius:4px; background:var(--field); color:var(--text);
    font:inherit; font-size:12px;
  }
  .grad-target:hover { background:var(--line2); }
  .grad-target.is-active { border-color:var(--selected2); background:var(--selected); color:var(--on-accent,#fff); }
  /* filled only while that surface actually has a gradient, so the row doubles as an at-a-glance summary */
  .grad-target-dot { width:7px; height:7px; border-radius:50%; background:transparent; box-shadow:inset 0 0 0 1px currentColor; }
  .grad-target.has-gradient .grad-target-dot { background:currentColor; }

  /* gradient stop ramp -- stops are dragged directly on the ramp that shows them, rather than edited as a list of number fields. --ramp is the left-to-right colour run, set from js. */
  .grad-ramp {
    position:relative; height:38px; margin:2px 0 0; border:1px solid var(--line2); border-radius:5px;
    background-image:var(--ramp,none); background-color:var(--field-dark); cursor:copy;
  }
  /* handles borrow the trim bar's endcap language from clips.html -- same 12px full-height cap, 5px radius and
     shadow. the white body becomes an inset ring instead, so the stop's colour reads through the middle; the
     trim grip stroke is dropped rather than layered under the colour, where it would only show on pale stops. */
  .grad-ramp-handle {
    position:absolute; top:-1px; bottom:-1px; left:0; width:12px; margin-left:-6px; padding:0;
    border:0; border-radius:5px; cursor:grab; background:var(--color,#000);
    box-shadow:inset 0 0 0 2px var(--text), 0 0 0 1px rgba(0,0,0,.35), 0 1px 6px rgba(0,0,0,.45);
  }
  .grad-ramp-handle.is-selected { box-shadow:inset 0 0 0 2px var(--text), 0 0 0 2px var(--selected2), 0 1px 6px rgba(0,0,0,.45); z-index:2; }
  .grad-ramp-handle.is-dragging { cursor:grabbing; }
  .grad-ramp-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:7px; }
  .grad-ramp-foot .btn { flex:none; height:26px; padding:0 10px; font-size:12px; }

  /* the floating colour picker lives in the shared _color-picker partial now */

  .theme-preview-row { margin-top:8px; }
  .theme-preview-row .btn { height:26px; padding:0 10px; font-size:12px; }
  .theme-section-hint { color:var(--muted); font-size:10px; font-weight:400; }
  /* Appearance tab app-icon picker */
  .icon-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .icon-tile {
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:78px; padding:9px 4px 7px;
    background:var(--field-dark); border:1px solid var(--line); border-radius:7px;
    color:var(--text); cursor:pointer; font-size:11px; line-height:1;
    transition:background var(--anim_press) var(--ease_pop), border-color var(--anim_press) var(--ease_pop);
  }
  .icon-tile:hover { background:var(--button-hover); }
  .icon-tile.is-selected { border-color:var(--selected2); background:var(--selected); color:var(--on-accent); }
  .icon-tile img, .icon-tile .icon-tile-swatch { width:40px; height:40px; }
  .icon-tile img { object-fit:contain; image-rendering:auto; }
  .icon-tile .icon-tile-swatch {
    display:flex; align-items:center; justify-content:center;
    background:var(--field); border-radius:6px; color:var(--muted); font-size:9px; text-align:center;
  }
  /* line-height 1.4 (not the tile's inherited 1) so descenders -- g j y p -- arent clipped by overflow:hidden */
  .icon-tile-label { max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.4; }
  .icon-tile-del {
    position:absolute; top:3px; right:3px;
    display:flex; align-items:center; justify-content:center;
    width:16px; height:16px; padding:0; border:0; border-radius:4px;
    background:var(--field); color:var(--muted); cursor:pointer; opacity:0;
    transition:opacity var(--anim_press) var(--ease_pop), color 80ms ease-out, background 80ms ease-out;
  }
  .icon-tile:hover .icon-tile-del, .icon-tile-del:focus-visible { opacity:1; }
  .icon-tile-del:hover { background:var(--field-dark); color:var(--danger); }
  .icon-tile-edit {
    position:absolute; top:3px; left:3px;
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; padding:0; border:0; border-radius:4px;
    background:var(--field); color:var(--muted); cursor:pointer; opacity:0;
    transition:opacity var(--anim_press) var(--ease_pop), color 80ms ease-out, background 80ms ease-out;
  }
  .icon-tile:hover .icon-tile-edit, .icon-tile-edit:focus-visible { opacity:1; }
  .icon-tile-edit:hover { background:var(--field-dark); color:var(--text); }
  .icon-tile-edit svg { width:10px; height:10px; fill:currentColor; }
  .icon-tile-del svg { width:8px; height:8px; fill:currentColor; }
  /* theme tile swatch */
  .theme-sw { width:40px; height:40px; border-radius:6px; overflow:hidden; position:relative; border:1px solid var(--line); }
  .theme-sw i { position:absolute; left:0; right:0; bottom:0; height:42%; display:block; }
  .theme-sw b { position:absolute; top:5px; right:5px; width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 1.5px rgba(0,0,0,.25); }
</style>

<script>
(function () {
  var HELPER = location.origin;
  var state = {};
  // previewChrome: the theme preview reaches the native title bar and menus too; clipsPreview: offer to open the Clips window; savedState: the settings as last saved, so deleting the picked theme or icon there is not seen as an edit; iconsRendered: told the icon list after every load
  var host = { state: null, onChange: function () {}, setStatus: function () {}, savedState: null, previewChrome: false, clipsPreview: false, iconsRendered: null };
  function markDirty() { try { host.onChange(); } catch (_) {} }
  function setStatus(t, k) { try { host.setStatus(t, k); } catch (_) {} }
  async function helperJson(pathIn, options) {
    var res = await fetch(HELPER + "/" + pathIn, { cache: "no-store", ...(options || {}) });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok || body.ok === false) throw new Error(body.message || body.error || ("HTTP " + res.status));
    return body;
  }
  function clone(v) { return JSON.parse(JSON.stringify(v || {})); }
  function setSliderFill(slider, value, min, max) {
    var span = Math.max(1, max - min);
    var pct = Math.max(0, Math.min(100, ((value - min) / span) * 100));
    slider.style.setProperty("--fill", pct + "%");
  }
  // filled in by init, since a host may include the colour picker after this panel
  var cleanHexColor, setColorButton, rgbToHex, hexToRgb, rgbToHsv, hsvToHex, openColorDialog;
  function settingOr(key) {
    var value = state[key];
    return value === undefined || value === null || value === "" ? (window.RK_SETTING_DEFAULTS || {})[key] : value;
  }

  function comboValue(c) { return c.dataset.value || ""; }
  function renderCombo(c) {
    var opts = c._opts || [];
    var v = c.dataset.value;
    var cur = opts.find(function (o) { return o.value === v; }) || opts[0] || { label: "" };
    var lbl = c.querySelector(".combo-label"); if (lbl) lbl.textContent = cur.label || "";
    var menu = c.querySelector(".combo-menu");
    if (!menu) return;
    menu.textContent = "";
    opts.forEach(function (o) {
      var item = document.createElement("div");
      item.className = "combo-option" + (o.value === v ? " is-selected" : "");
      item.dataset.value = o.value;
      item.textContent = o.label;
      menu.appendChild(item);
    });
  }
  function fillCombo(c, opts) {
    c._opts = opts || [];
    if (!c.dataset.value && opts && opts[0]) c.dataset.value = opts[0].value;
    renderCombo(c);
  }
  function setComboValue(c, v, notify) {
    c.dataset.value = v; renderCombo(c);
    if (notify) c.dispatchEvent(new CustomEvent("combochange", { bubbles: true }));
  }
  function wireCombo(c) {
    c.querySelector(".combo-button").addEventListener("click", function (e) {
      e.stopPropagation();
      var open = !c.classList.contains("is-open");
      // the host owns other combos and cannot see this click (stopPropagation keeps our own document listener from closing us), so shut them here to keep one menu open at a time
      if (open) document.querySelectorAll(".combo.is-open").forEach(function (o) { if (o !== c) { o.classList.remove("is-open"); o.setAttribute("aria-expanded", "false"); } });
      c.classList.toggle("is-open", open);
      c.setAttribute("aria-expanded", open ? "true" : "false");
    });
    c.addEventListener("click", function (e) {
      var o = e.target.closest(".combo-option"); if (!o) return;
      setComboValue(c, o.dataset.value, true); c.classList.remove("is-open");
    });
    document.addEventListener("click", function () { c.classList.remove("is-open"); });
  }

  var els = {};
  ["themeGrid", "themeCustomRow", "themeEditor", "themeGradientTargets", "themeGradientEnabled", "themeGradientEnabledLabel",
   "themeGradientEditor", "themeGradientType", "themeGradientPreview", "themeGradientLinearControls", "themeGradientRadialControls",
   "themeGradientAngle", "themeGradientAngleValue", "themeGradientCenterX", "themeGradientCenterXValue", "themeGradientCenterY",
   "themeGradientCenterYValue", "themeGradientRamp", "removeGradientStopBtn", "themeCustomDark", "themeName", "cancelThemeEditBtn",
   "saveThemeBtn", "openThemeClipsBtn", "appIconGrid", "appIconCustomRow", "appIconCustomPath", "browseAppIcon", "appIconRecordingDot"
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  function unquote(s) {
    s = String(s || "").trim();
    return s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"' ? s.slice(1, -1).trim() : s;
  }
  async function browsePathHelper(route, initial) {
    try {
      var data = await helperJson(route + "?initial=" + encodeURIComponent(initial || "") + "&t=" + Date.now());
      return data && data.ok ? data.path : "";
    } catch (e) { return ""; }
  }

  // -- Appearance tab: theme picker -- ReplayKit surfaces preview live here; OBS gets it on the restart that saving a theme needs.
  // the shared close x, cropped to its drawing so the remove button keeps the size of the x it had
  const APPICON_X_SVG = ((window.RK_ICONS || {})["editor/close"] || "").replace(/viewBox="[^"]*"/, 'viewBox="5 5 14 14"');
  const THEME_EDIT_SVG = (window.RK_ICONS || {})["action/edit"] || "";
  // last /appearance/themes payload -- lets selectTheme seed the custom editor from whatever preset the user was on
  let themesCache = [];
  let editingThemeId = "";
  let gradientStops = [];
  let latestThemePreviewCss = "";
  let themePreviewChannel = null;
  try { themePreviewChannel = new BroadcastChannel("replaykit-theme-preview"); } catch (_) {}
  let themeLiveStyle = document.getElementById("rk-theme-live");
  if (!themeLiveStyle) {
    themeLiveStyle = document.createElement("style");
    themeLiveStyle.id = "rk-theme-live";
    document.head.appendChild(themeLiveStyle);
  }

  els.saveThemeBtn.addEventListener("click", async () => {
    const name = (els.themeName.value || "").trim();
    if (!name) { setStatus(RK_M("settings.nameTheThemeFirst"), "bad"); els.themeName.focus(); return; }
    els.saveThemeBtn.disabled = true;
    let data;
    let failure = "";
    try {
      let url = "appearance/save-theme?label=" + encodeURIComponent(name);
      if (editingThemeId) url += "&id=" + encodeURIComponent(editingThemeId);
      data = await helperJson(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(themeCustomState()),
      });
    } catch (e) { data = null; failure = e.message || String(e); }
    els.saveThemeBtn.disabled = false;
    if (!data || !data.ok) { setStatus(failure || (data && data.message) || RK_M("settings.couldNotSaveTheme"), "bad"); return; }
    const updated = !!editingThemeId;
    state.themeCustom = themeCustomState();
    state.theme = data.id;
    endThemeEdit();
    await renderThemeGrid();
    paintThemeSelection();
    applyThemePreview();
    markDirty();
    setStatus(updated ? RK_M("settings.presetUpdated") : RK_M("settings.presetSaved"), "good");
  });
  /* renderThemeGrid -> boot() */

  // -- Appearance tab: app-icon picker -- applies through the normal save flow (state.appIcon / state.appIconCustomPath)
  function paintAppIconSelection() {
    const sel = settingOr("appIcon");
    els.appIconGrid.querySelectorAll(".icon-tile").forEach((t) => t.classList.toggle("is-selected", t.dataset.id === sel));
    els.appIconCustomRow.hidden = sel !== "custom";
  }
  function selectAppIcon(id) {
    state.appIcon = id;
    paintAppIconSelection();
    if (id === "custom") els.appIconCustomPath.focus();
    markDirty();
  }
  function appIconTile(id, label, url, glyph, deletable) {
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "icon-tile";
    tile.dataset.id = id;
    let swatch;
    if (url) { swatch = document.createElement("img"); swatch.src = HELPER + url; swatch.alt = ""; }
    else { swatch = document.createElement("span"); swatch.className = "icon-tile-swatch"; swatch.textContent = glyph || ""; }
    const lab = document.createElement("span");
    lab.className = "icon-tile-label";
    if (deletable) lab.setAttribute("translate", "no");
    lab.textContent = label;
    tile.append(swatch, lab);
    tile.addEventListener("click", () => selectAppIcon(id));
    if (deletable) {
      const del = document.createElement("span");
      del.className = "icon-tile-del";
      del.setAttribute("role", "button");
      del.setAttribute("aria-label", RK_M("settings.removeName", { name: label }));
      del.title = RK_M("common.remove");
      del.innerHTML = APPICON_X_SVG;
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteUserIcon(id); });
      tile.appendChild(del);
    }
    return tile;
  }
  async function deleteUserIcon(id) {
    let data;
    try { data = await helperJson("appearance/delete-icon?file=" + encodeURIComponent(id), { method: "POST" }); }
    catch (e) { setStatus(RK_M("settings.couldNotRemoveIcon"), "bad"); return; }
    if (!data || !data.ok) { setStatus((data && data.message) || RK_M("settings.couldNotRemoveIcon"), "bad"); return; }
    if (state.appIcon === id) {
      state.appIcon = "default";
      const saved = host.savedState && host.savedState();
      if (saved) saved.appIcon = "default";
    }
    await renderAppIconGrid();
  }
  async function renderAppIconGrid() {
    let data;
    try { data = await helperJson("appearance/icons"); } catch (e) { return; }
    els.appIconGrid.innerHTML = "";
    for (const ic of (data.icons || []))
      els.appIconGrid.appendChild(appIconTile(ic.id, ic.label || ic.id, ic.url || "", ic.id === "default" ? "OBS" : "", !!ic.deletable));
    els.appIconGrid.appendChild(appIconTile("custom", RK_M("settings.custom"), "", "＋", false));
    paintAppIconSelection();
    if (host.iconsRendered) host.iconsRendered(data);
  }
  /* renderAppIconGrid -> boot() */
  els.appIconCustomPath.addEventListener("input", () => {
    state.appIconCustomPath = unquote(els.appIconCustomPath.value);
    if (state.appIconCustomPath && state.appIcon !== "custom") { state.appIcon = "custom"; paintAppIconSelection(); }
    markDirty();
  });

  function boot() {
    fillCombo(els.themeGradientType, [{ value: "linear", label: RK_M("settings.linear") }, { value: "radial", label: RK_M("settings.radial") }]);
    wireCombo(els.themeGradientType);
    renderThemeGrid();
    renderAppIconGrid();
    if (els.appIconRecordingDot) {
      els.appIconRecordingDot.checked = !!settingOr("appIconRecordingDot");
      els.appIconRecordingDot.addEventListener("change", function () { state.appIconRecordingDot = els.appIconRecordingDot.checked; markDirty(); });
    }
    if (els.browseAppIcon) {
      els.browseAppIcon.addEventListener("click", async function () {
        els.browseAppIcon.disabled = true;
        var p = await browsePathHelper("browse-file", els.appIconCustomPath.value.trim());
        els.browseAppIcon.disabled = false;
        if (p) { els.appIconCustomPath.value = p; els.appIconCustomPath.dispatchEvent(new Event("input")); }
      });
    }
  }

  // a custom palette is filed as a real preset before it is applied, preset_1, preset_2, ... taking the next free number, so the next custom edit cannot overwrite it; a failure leaves it applied as an unnamed custom theme
  async function fileCustomTheme() {
    if (state.theme !== "custom") return;
    let highest = 0;
    themesCache.forEach((theme) => {
      const match = /^preset_(\d+)$/i.exec((theme.label || "").trim());
      if (match) highest = Math.max(highest, parseInt(match[1], 10) || 0);
    });
    try {
      const data = await helperJson("appearance/save-theme?label=" + encodeURIComponent("preset_" + (highest + 1)), {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body:JSON.stringify(themeCustomState()),
      });
      if (!data || !data.ok || !data.id) return;
      state.theme = data.id;
      state.themeCustom = themeCustomState();
      endThemeEdit();
      await renderThemeGrid();
      paintThemeSelection();
    } catch (e) {
      setStatus(RK_M("settings.couldNotAutoSaveTheCustom", { error: e.message || e }), "bad");
    }
  }

  window.RKAppearance = {
    init: function (h) {
      host = Object.assign(host, h);
      state = host.state;
      cleanHexColor = window.RKColor.cleanHexColor; setColorButton = window.RKColor.setColorButton;
      rgbToHex = window.RKColor.rgbToHex; hexToRgb = window.RKColor.hexToRgb; rgbToHsv = window.RKColor.rgbToHsv; hsvToHex = window.RKColor.hsvToHex;
      openColorDialog = window.openColorDialog;
      if (els.openThemeClipsBtn) els.openThemeClipsBtn.parentElement.hidden = !host.clipsPreview;
      boot();
    },
    // paints every control of the panel from the state, after the host loaded or restored it
    sync: function () {
      els.appIconCustomPath.value = settingOr("appIconCustomPath");
      els.appIconRecordingDot.checked = !!settingOr("appIconRecordingDot");
      paintAppIconSelection();
      if (state.themeCustom) fillThemeEditor(state.themeCustom);
      paintThemeSelection();
      applyThemePreview();
    },
    // reads the fields of the panel back into the state
    read: function () {
      state.appIconCustomPath = unquote(els.appIconCustomPath.value);
      state.appIconRecordingDot = els.appIconRecordingDot.checked;
      if (state.appIcon === "custom" && !state.appIconCustomPath) state.appIcon = "default";
      if (state.theme === "custom") state.themeCustom = themeCustomState();
    },
    // the preset being edited, kept in the undo history of the host and put back by restoreEditing
    editing: function () { return editingThemeId ? { id: editingThemeId, name: els.themeName.value } : null; },
    restoreEditing: function (edit) {
      endThemeEdit();
      if (!edit) return;
      editingThemeId = edit.id;
      els.themeName.value = edit.name;
      els.saveThemeBtn.textContent = RK_M("settings.updatePreset");
      els.cancelThemeEditBtn.hidden = false;
    },
    endEdit: endThemeEdit,
    fileCustomTheme: fileCustomTheme,
    // after the helper saved: a custom pick may be a preset and the icon list may hold a new file
    refresh: function () {
      renderAppIconGrid();
      renderThemeGrid();
      applyThemePreview();
    },
    collect: function () {
      return {
        theme: settingOr("theme"),
        themeCustom: state.theme === "custom" ? themeCustomState() : (state.themeCustom || undefined),
        appIcon: settingOr("appIcon"),
        appIconCustomPath: state.appIconCustomPath || "",
        appIconRecordingDot: state.appIconRecordingDot !== false,
      };
    },
  };
})();
</script>
