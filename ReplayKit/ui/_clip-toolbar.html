  <div class="tabs" id="clip-tabs" role="toolbar" aria-label="Clip filters" data-i18n-aria-label="clips.clipFilters">
    <div class="bulk-actions" id="bulk-actions" hidden>
      <button class="bulk-icon-btn" type="button" id="bulk-upload" data-tooltip="Upload" aria-label="Upload selected clips" data-i18n-aria-label="clips.uploadSelectedClips" data-i18n-data-tooltip="clips.upload">
        <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/link}}</svg>
      </button>
      <button class="bulk-icon-btn" type="button" id="bulk-compress" data-tooltip="Compress" aria-label="Compress selected clips" data-i18n-aria-label="clips.compressSelectedClips" data-i18n-data-tooltip="common.compress">
        <svg viewBox="0 0 24 24" id="bulk-compress-icon" aria-hidden="true"></svg>
      </button>
      <button class="bulk-icon-btn bulk-delete" type="button" id="bulk-delete" data-tooltip="Delete" aria-label="Delete selected clips" data-i18n-aria-label="clips.deleteSelectedClips" data-i18n-data-tooltip="common.delete">
        <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/trash}}</svg>
      </button>
    </div>
    <div class="clip-filters"><span class="clip-filter-caption" data-i18n="clips.filters"></span>
      <div class="combo clip-filter" id="clip-game-filter" role="combobox" aria-label="Games" aria-expanded="false" data-i18n-aria-label="clips.games"><button class="combo-button" type="button" aria-haspopup="listbox"><svg data-i="nav/all-games" viewBox="0 0 24 24" aria-hidden="true"></svg><span class="combo-label" data-i18n="clips.allGames"></span><span class="combo-arrow"><svg data-i="nav/combo-arrow" viewBox="0 0 16 16" aria-hidden="true"></svg></span></button><div class="combo-menu" role="listbox" data-skel="skip"></div></div>
      <div class="combo clip-filter" id="clip-type-filter" role="combobox" aria-label="Types" aria-expanded="false" data-i18n-aria-label="clips.types"><button class="combo-button" type="button" aria-haspopup="listbox"><svg data-i="toggle/grid" viewBox="0 0 24 24" aria-hidden="true"></svg><span class="combo-label" data-i18n="clips.allTypes"></span><span class="combo-arrow"><svg data-i="nav/combo-arrow" viewBox="0 0 16 16" aria-hidden="true"></svg></span></button><div class="combo-menu" role="listbox" data-skel="skip"></div></div>
    </div>
    <div class="tab-actions">
      <div class="bulk-summary" id="bulk-summary" hidden>
        <span class="bulk-summary-count" id="bulk-count" data-i18n="clips.n0Selected"></span>
        <span class="bulk-summary-size" id="bulk-size"></span>
      </div>
      <button class="bulk-clear" type="button" id="bulk-clear" hidden data-i18n="common.clear"></button>
      <button class="bulk-clear bulk-stop" type="button" id="bulk-upload-stop" hidden data-i18n="clips.stopUploads"></button>
      <div class="clip-folders-status" id="clip-folders-status" role="status" hidden><span class="clip-folders-spinner" aria-hidden="true"></span><span id="clip-folders-text" data-i18n="clips.sortingClipsIntoFolders"></span></div>
      <button class="clip-sort-trigger clip-folder-btn clip-deleted-btn" type="button" id="clip-deleted-btn" data-tooltip="Deleted history" aria-label="Deleted history" aria-haspopup="dialog" hidden data-i18n-aria-label="common.deletedHistory" data-i18n-data-tooltip="common.deletedHistory">
        <svg data-i="action/trash" viewBox="0 0 24 24" aria-hidden="true"></svg><span class="clip-deleted-count" id="clip-deleted-count" hidden></span>
      </button>
      <button class="clip-sort-trigger clip-folder-btn" type="button" id="clip-folder-btn" data-tooltip="Open clips folder" aria-label="Open clips folder" data-i18n-aria-label="common.openClipsFolder" data-i18n-data-tooltip="common.openClipsFolder">
        <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/folder-open}}</svg>
      </button>
      <div class="clip-sort-wrap" id="clip-sort">
      <button class="clip-sort-trigger" type="button" id="clip-sort-button"
              aria-haspopup="menu" aria-expanded="false" aria-label="Sort by" data-tooltip="Sort by" data-i18n-aria-label="common.sortBy" data-i18n-data-tooltip="common.sortBy">
        <svg class="clip-sort-icon" viewBox="0 0 24 24" aria-hidden="true">{{glyph:clip-toolbar-clip-sort-icon}}</svg>
        <svg class="clip-sort-chevron" viewBox="0 0 24 24" aria-hidden="true">{{glyph:nav/caret-down}}</svg>
        <span class="clip-sort-spinner" aria-hidden="true"></span>
      </button>
      <div class="clip-sort-menu" id="clip-sort-menu" role="menu" aria-label="Sort clips" data-skel="skip" data-i18n-aria-label="common.sortClips">
        <div class="clip-sort-heading" data-i18n="common.sortBy"></div>
        <button class="clip-sort-item" type="button" data-sort="newest" role="menuitemradio" aria-checked="false">
          <span class="clip-sort-label" data-i18n="clips.newest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
        </button>
        <button class="clip-sort-item" type="button" data-sort="oldest" role="menuitemradio" aria-checked="false">
          <span class="clip-sort-label" data-i18n="clips.oldest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
        </button>
        <div class="clip-sort-group" data-group="length">
          <button class="clip-sort-item clip-sort-grouprow" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="clip-sort-label" data-i18n="common.length"></span><svg class="clip-sort-caret" viewBox="0 0 24 24" aria-hidden="true">{{glyph:nav/caret-down}}</svg>
          </button>
          <div class="clip-sort-sub" role="group">
            <button class="clip-sort-item clip-sort-subitem" type="button" data-sort="longest" role="menuitemradio" aria-checked="false">
              <span class="clip-sort-label" data-i18n="clips.longest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
            </button>
            <button class="clip-sort-item clip-sort-subitem" type="button" data-sort="shortest" role="menuitemradio" aria-checked="false">
              <span class="clip-sort-label" data-i18n="clips.shortest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
            </button>
          </div>
        </div>
        <div class="clip-sort-group" data-group="filesize">
          <button class="clip-sort-item clip-sort-grouprow" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="clip-sort-label" data-i18n="common.fileSize"></span><svg class="clip-sort-caret" viewBox="0 0 24 24" aria-hidden="true">{{glyph:nav/caret-down}}</svg>
          </button>
          <div class="clip-sort-sub" role="group">
            <button class="clip-sort-item clip-sort-subitem" type="button" data-sort="biggest" role="menuitemradio" aria-checked="false">
              <span class="clip-sort-label" data-i18n="clips.biggest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
            </button>
            <button class="clip-sort-item clip-sort-subitem" type="button" data-sort="smallest" role="menuitemradio" aria-checked="false">
              <span class="clip-sort-label" data-i18n="clips.smallest"></span><svg class="clip-sort-check" viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/check}}</svg>
            </button>
          </div>
        </div>
       </div>
       </div>
       <label class="clip-search" for="clip-search-input">
         <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:action/search}}</svg>
         <input class="clip-search-input" id="clip-search-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search clips" data-i18n-placeholder="common.search" data-i18n-aria-label="common.searchClips">
       </label>
       <button class="tab-action" type="button" id="compress-all-btn" hidden
              title="Fast-compress every clip that isn't already compressed." data-i18n-title="clips.fastCompressEveryClipThatIsn">
        <svg viewBox="0 0 24 24" aria-hidden="true">{{glyph:clip-toolbar-7}}</svg>
        <span id="compress-all-label" data-i18n="clips.compressAll2"></span>
      </button>
    </div>
  </div>
