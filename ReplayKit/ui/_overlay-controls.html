<!-- shared partial (helper #include target: overlay-controls). the input-overlay control set (style, flip, opacity, size, hue, colour multiply/add + resets) for the setup wizard. uses settings.html's OWN component classes and markup -- .combo, .check-row, .volume-control, .color-control, .field-reset -- so the wizard and Settings are the same controls, not lookalikes; the css those need is carried here because setup.html does not define it. host: RKOverlay.init({ get, set, onChange }); RKOverlay.collect() returns the overlay* fields. depends on _color-picker being on the page. -->
<style>
  #ovcModeRow[hidden] { display:none; }
  /* lifted verbatim from settings.html so the sliders and the colour boxes match it */
  .volume-control { width:100%; display:grid; grid-template-columns:72px minmax(180px,1fr); align-items:center; gap:8px; }
  .volume-value { background:transparent; border-color:var(--field-solid,var(--field)); text-align:center; padding:0 8px; }
  .volume-slider-wrap { position:relative; height:32px; min-width:0; }
  /* the look of the slider is the shared one of the slider partial */
  .volume-slider { position:relative; z-index:1; width:100%; height:32px; }
  .color-control { width:100%; display:grid; grid-template-columns:42px minmax(120px, 180px); align-items:center; gap:8px; }
  .color-picker {
    width:42px; height:32px; border:1px solid var(--field-solid,var(--field)); border-radius:4px;
    background:var(--color, var(--field)); padding:3px; cursor:pointer; box-shadow:inset 0 0 0 3px var(--field-dark);
  }
  .color-picker:hover { border-color:var(--line2); }
  .color-value { width:100%; text-transform:lowercase; }
  .field-wrap:has(> .field-reset) > .volume-control,
  .field-wrap:has(> .field-reset) > .color-control { width:auto; flex:1; }
  .field-reset { flex:none; }
  .field-reset.is-default { opacity:.4; }
  .field-reset.is-default:hover { opacity:1; }
  .form-row.tight { min-height:30px; }
</style>
<div class="form-row tight">
  <div></div>
  <div class="check-row"><input type="checkbox" id="ovcFlip" aria-label="Flip horizontally" data-i18n-aria-label="settings.flipHorizontally"><span data-i18n="settings.flipHorizontally"></span></div>
</div>
<div class="form-row">
  <div class="label" data-i18n="common.overlay"></div>
  <div class="field-wrap">
    <div class="combo" data-self-wired id="ovcStyle" tabindex="0" role="combobox" aria-expanded="false">
      <button class="combo-button" type="button"><span class="combo-label"></span><span class="combo-arrow"><svg data-i="nav/combo-arrow" viewBox="0 0 16 16" aria-hidden="true"></svg></span></button>
      <div class="combo-menu" role="listbox"></div>
    </div>
  </div>
</div>
<div class="form-row" id="ovcModeRow" hidden>
  <div class="label" data-i18n="settings.bongoCatMode"></div>
  <div class="field-wrap">
    <div class="combo" data-self-wired id="ovcMode" tabindex="0" role="combobox" aria-expanded="false">
      <button class="combo-button" type="button"><span class="combo-label"></span><span class="combo-arrow"><svg data-i="nav/combo-arrow" viewBox="0 0 16 16" aria-hidden="true"></svg></span></button>
      <div class="combo-menu" role="listbox"></div>
    </div>
  </div>
</div>
<div class="form-row">
  <div class="label" data-i18n="common.opacity"></div>
  <div class="field-wrap">
    <div class="volume-control">
      <input class="text-input volume-value" id="ovcOpacityValue" type="text" inputmode="numeric" autocomplete="off" aria-label="Overlay opacity" data-i18n-aria-label="settings.overlayOpacity">
      <div class="volume-slider-wrap"><input class="volume-slider rk-range" id="ovcOpacity" type="range" data-limit="overlayOpacity" step="1" aria-label="Overlay opacity slider" data-i18n-aria-label="settings.overlayOpacitySlider"></div>
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayOpacity" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<div class="form-row">
  <div class="label" data-i18n="common.size"></div>
  <div class="field-wrap">
    <div class="volume-control">
      <input class="text-input volume-value" id="ovcScaleValue" type="text" inputmode="numeric" autocomplete="off" aria-label="Overlay size" data-i18n-aria-label="settings.overlaySize">
      <div class="volume-slider-wrap"><input class="volume-slider rk-range" id="ovcScale" type="range" data-limit="overlayScale" step="1" aria-label="Overlay size slider" data-i18n-aria-label="settings.overlaySizeSlider"></div>
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayScale" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<div class="form-row">
  <div class="label" data-i18n="common.rotation"></div>
  <div class="field-wrap">
    <div class="volume-control">
      <input class="text-input volume-value" id="ovcRotationValue" type="text" inputmode="numeric" autocomplete="off" aria-label="Overlay rotation in degrees" data-i18n-aria-label="settings.overlayRotationInDegrees">
      <div class="volume-slider-wrap"><input class="volume-slider rk-range" id="ovcRotation" type="range" data-limit="overlayRotation" step="1" aria-label="Overlay rotation slider" data-i18n-aria-label="settings.overlayRotationSlider"></div>
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayRotation" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<div class="form-row">
  <div class="label" data-i18n="settings.hueShift"></div>
  <div class="field-wrap">
    <div class="volume-control">
      <input class="text-input volume-value" id="ovcHueValue" type="text" inputmode="numeric" autocomplete="off" aria-label="Overlay hue shift" data-i18n-aria-label="settings.overlayHueShift">
      <div class="volume-slider-wrap"><input class="volume-slider rk-range" id="ovcHue" type="range" data-limit="overlayHueShift" step="1" aria-label="Overlay hue shift slider" data-i18n-aria-label="settings.overlayHueShiftSlider"></div>
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayHueShift" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<div class="form-row">
  <div class="label"><span data-i18n="settings.colorMultiply"></span><span class="control-note" data-i18n="settings.darkensAndTintsTheOverlayWhite"></span></div>
  <div class="field-wrap">
    <div class="color-control">
      <button class="color-picker" id="ovcMul" type="button" aria-label="Overlay color multiply" data-i18n-aria-label="settings.overlayColorMultiply"></button>
      <input class="text-input color-value" id="ovcMulValue" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Overlay color multiply hex" data-i18n-aria-label="settings.overlayColorMultiplyHex">
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayColorMultiply" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<div class="form-row">
  <div class="label"><span data-i18n="settings.colorAdd"></span><span class="control-note" data-i18n="settings.brightensAndTintsTheOverlayBlack"></span></div>
  <div class="field-wrap">
    <div class="color-control">
      <button class="color-picker" id="ovcAdd" type="button" aria-label="Overlay color add" data-i18n-aria-label="settings.overlayColorAdd"></button>
      <input class="text-input color-value" id="ovcAddValue" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Overlay color add hex" data-i18n-aria-label="settings.overlayColorAddHex">
    </div>
    <button class="icon-btn field-reset" type="button" data-reset="overlayColorAdd" title="Reset to default" data-i18n-title="common.resetToDefault"><svg data-i="action/reset" viewBox="0 0 16 16" aria-hidden="true"></svg></button>
  </div>
</div>
<script>
(function () {
  var SCHEMA = window.RK_SETTING_DEFAULTS, LIMITS = window.RK_SETTING_LIMITS; if (!SCHEMA || !LIMITS) throw new Error(RK_M("settings.theSettingsDefaultsAndLimitsWere")); var DEF = {}; ["overlayStyle","bongoMode","overlayFlipH","overlayOpacity","overlayScale","overlayRotation","overlayHueShift","overlayColorMultiply","overlayColorAdd"].forEach(function (k) { DEF[k] = SCHEMA[k]; });
  // the overlay styles and the bongo cat modes come from the helper options the host page loaded, the same lists the settings page shows
  var STYLES = [], MODES = [];
  var host = { get:function(k){ return DEF[k]; }, set:function(){}, onChange:function(){} };
  var st = Object.assign({}, DEF);

  var flip = document.getElementById("ovcFlip");
  var modeRow = document.getElementById("ovcModeRow");
  var sliders = {
    overlayOpacity:{ r:document.getElementById("ovcOpacity"), n:document.getElementById("ovcOpacityValue"), min:LIMITS.overlayOpacity.min, max:LIMITS.overlayOpacity.max },
    overlayScale:{ r:document.getElementById("ovcScale"), n:document.getElementById("ovcScaleValue"), min:LIMITS.overlayScale.min, max:LIMITS.overlayScale.max },
    overlayRotation:{ r:document.getElementById("ovcRotation"), n:document.getElementById("ovcRotationValue"), min:LIMITS.overlayRotation.min, max:LIMITS.overlayRotation.max },
    overlayHueShift:{ r:document.getElementById("ovcHue"), n:document.getElementById("ovcHueValue"), min:LIMITS.overlayHueShift.min, max:LIMITS.overlayHueShift.max },
  };
  var colors = {
    overlayColorMultiply:{ b:document.getElementById("ovcMul"), n:document.getElementById("ovcMulValue") },
    overlayColorAdd:{ b:document.getElementById("ovcAdd"), n:document.getElementById("ovcAddValue") },
  };
  var resets = {};
  document.querySelectorAll("[data-reset]").forEach(function (b) { resets[b.dataset.reset] = b; });

  function clamp(v, lo, hi, dflt) { v = Number(v); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, Math.round(v))) : dflt; }
  function normHex(v, dflt) { v = String(v || "").trim().toLowerCase(); return /^#[0-9a-f]{6}$/.test(v) ? v : dflt; }
  function fire() { host.onChange(); }
  function resetOverlayPosition(style) {
    if (style !== "input_overlay" && style !== "bongo_cat") return;
    var saved = host.get("overlayPosition");
    var next = saved && typeof saved === "object" && !Array.isArray(saved) ? Object.assign({}, saved) : {};
    delete next[style];
    host.set("overlayPosition", next);
  }
  function setFill(el, value, min, max) {
    el.style.setProperty("--fill", Math.max(0, Math.min(100, ((value - min) / Math.max(1, max - min)) * 100)) + "%");
  }

  // a self-wired combo over one of the lists above; picked runs after the new value is in st
  function wireCombo(id, key, options, fallback, picked) {
    var combo = document.getElementById(id);
    var label = combo.querySelector(".combo-label"), menu = combo.querySelector(".combo-menu");
    function close() { combo.classList.remove("is-open"); combo.setAttribute("aria-expanded", "false"); }
    combo.querySelector(".combo-button").addEventListener("click", function (e) {
      e.stopPropagation();
      var open = !combo.classList.contains("is-open");
      // the host page owns other combos and cannot see this click (stopPropagation keeps our own document listener from closing us), so shut them here to keep one menu open at a time
      if (open) document.querySelectorAll(".combo.is-open").forEach(function (c) {
        if (c === combo) return;
        c.classList.remove("is-open");
        c.setAttribute("aria-expanded", "false");
      });
      combo.classList.toggle("is-open", open);
      combo.setAttribute("aria-expanded", open ? "true" : "false");
    });
    menu.addEventListener("click", function (e) {
      var o = e.target.closest(".combo-option");
      if (!o) return;
      st[key] = o.dataset.v;
      renderCombos(); close();
      host.set(key, st[key]);
      picked();
    });
    document.addEventListener("click", close);
    return function render() {
      var cur = options.find(function (o) { return o.value === st[key]; }) || options[fallback] || options[0];
      if (!cur) { label.textContent = ""; menu.innerHTML = ""; return; }
      label.textContent = cur.label;
      menu.innerHTML = options.map(function (o) {
        var blurb = o.blurb ? '<span class="option-blurb">- ' + o.blurb + '</span>' : "";
        return '<div class="combo-option' + (o.value === cur.value ? " is-selected" : "") + '" role="option" data-v="' + o.value + '"><span>' + o.label + '</span>' + blurb + "</div>";
      }).join("");
    };
  }
  var renderStyle = wireCombo("ovcStyle", "overlayStyle", STYLES, 2, function () {
    resetOverlayPosition(st.overlayStyle);
    fire();
    if (window.RKOverlayPreview) RKOverlayPreview.resetPosition();
  });
  var renderMode = wireCombo("ovcMode", "bongoMode", MODES, 0, function () {
    fire();
    if (window.RKOverlayPreview) RKOverlayPreview.refresh();
  });
  function renderCombos() {
    modeRow.hidden = st.overlayStyle !== "bongo_cat";
    renderStyle();
    renderMode();
  }

  flip.addEventListener("change", function () {
    st.overlayFlipH = flip.checked;
    host.set("overlayFlipH", st.overlayFlipH); refreshResets(); fire();
  });

  Object.keys(sliders).forEach(function (key) {
    var c = sliders[key];
    c.commit = function (val, keepText) {
      st[key] = clamp(val, c.min, c.max, DEF[key]);
      c.r.value = String(st[key]);
      if (!keepText) c.n.value = String(st[key]);
      setFill(c.r, st[key], c.min, c.max);
      host.set(key, st[key]); refreshResets(); fire();
    };
    c.r.addEventListener("input", function () { c.commit(c.r.value); });
    if (key === "overlayRotation") c.n.addEventListener("input", function () { c.commit(c.n.value, true); });
    c.n.addEventListener("change", function () { c.commit(c.n.value); });
  });

  Object.keys(colors).forEach(function (key) {
    var c = colors[key];
    c.commit = function (v) {
      st[key] = normHex(v, DEF[key]);
      c.b.style.setProperty("--color", st[key]); c.n.value = st[key];
      host.set(key, st[key]); refreshResets(); fire();
    };
    c.b.addEventListener("click", function () {
      if (!window.openColorDialog) return;
      window.openColorDialog(st[key], c.b.getAttribute("aria-label"), function (color) { c.commit(color); });
    });
    c.n.addEventListener("change", function () { c.commit(c.n.value); });
  });

  Object.keys(resets).forEach(function (key) {
    resets[key].addEventListener("click", function () {
      if (colors[key]) colors[key].commit(DEF[key]);
      else if (sliders[key]) sliders[key].commit(DEF[key]);
    });
  });
  function refreshResets() {
    Object.keys(resets).forEach(function (key) {
      resets[key].classList.toggle("is-default", String(st[key]) === String(DEF[key]));
    });
  }

  function paint() {
    renderCombos();
    flip.checked = !!st.overlayFlipH;
    Object.keys(sliders).forEach(function (key) {
      var c = sliders[key];
      c.r.value = String(st[key]); c.n.value = String(st[key]);
      setFill(c.r, st[key], c.min, c.max);
    });
    Object.keys(colors).forEach(function (key) {
      colors[key].b.style.setProperty("--color", st[key]);
      colors[key].n.value = st[key];
    });
    refreshResets();
  }

  var KEYS = ["overlayStyle","bongoMode","overlayFlipH","overlayOpacity","overlayScale","overlayRotation","overlayHueShift","overlayColorMultiply","overlayColorAdd"];
  function pull() {
    KEYS.forEach(function (k) {
      var v = host.get(k);
      if (v !== undefined && v !== null) st[k] = v;
    });
    st.overlayOpacity = clamp(st.overlayOpacity, sliders.overlayOpacity.min, sliders.overlayOpacity.max, DEF.overlayOpacity);
    st.overlayScale = clamp(st.overlayScale, sliders.overlayScale.min, sliders.overlayScale.max, DEF.overlayScale);
    st.overlayRotation = clamp(st.overlayRotation, sliders.overlayRotation.min, sliders.overlayRotation.max, DEF.overlayRotation);
    st.overlayHueShift = clamp(st.overlayHueShift, sliders.overlayHueShift.min, sliders.overlayHueShift.max, DEF.overlayHueShift);
    st.overlayColorMultiply = normHex(st.overlayColorMultiply, "#ffffff");
    st.overlayColorAdd = normHex(st.overlayColorAdd, "#000000");
  }

  window.RKOverlay = {
    init: function (h) {
      if (h) host = Object.assign(host, h);
      if (h && h.styles) STYLES.splice.apply(STYLES, [0, STYLES.length].concat(h.styles));
      if (h && h.modes) MODES.splice.apply(MODES, [0, MODES.length].concat(h.modes));
      pull();
      paint();
    },
    collect: function () { return Object.assign({}, st); },
    refresh: function () { pull(); paint(); },
  };
})();
</script>
