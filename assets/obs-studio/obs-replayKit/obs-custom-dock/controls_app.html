<!DOCTYPE html>
<html lang="en" style="background:#272A33;color:#FFFFFF">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>Custom Controls</title>
<link rel="icon" type="image/x-icon" href="http://127.0.0.1:8767/obs-icon.ico?v=2" />
<style>
  :root {
    --input_height: 32px;
    --padding_wide: 16px;
    --spacing_outer: 4px;
    --spacing_sides: 6px;
    --spacing_top: 6px;
    --border_radius: 4px;
    --font_size: 13px;
    --font_family: "Segoe UI", system-ui, sans-serif;
    --grey1: #5B6273;
    --grey3: #464B59;
    --grey4: #3C404D;
    --grey6: #272A33;
    --grey7: #1D1F26;
    --grey8: #13141A;
    --blue2: #476BD7;
    --blue3: #284CB8;
    --green: #37D247;
    --red: #E33B57;
    --white1: #FFFFFF;
    --white5: #969696;
    --bg_dock: var(--grey6);
    --bg_window: var(--grey7);
    --text: var(--white1);
    --text_muted: var(--white5);
    --button_bg: var(--grey4);
    --button_bg_hover: var(--grey3);
    --button_bg_down: var(--grey7);
    --button_border: var(--button_bg-solid,var(--button_bg));
    --button_border_hover: var(--grey1);
    --primary: var(--blue3);
    --primary_light: var(--blue2);
    --input_bg: var(--grey8);
    --input_border: var(--grey4-solid,var(--grey4));
    --on-accent: #ffffff;
    --on-accent-rgb: 255, 255, 255;
    --text-rgb: 255, 255, 255;
    --bg-rgb: 29, 31, 38;
    --accent-rgb: 40, 76, 184;
    --hairline: rgba(var(--text-rgb),.08);
    --overlay-soft: rgba(var(--text-rgb),.06);
    --overlay-strong: rgba(var(--text-rgb),.14);
    --shadow: rgba(0,0,0,.45);
    --shadow-weak: rgba(0,0,0,.28);
    /* shared motion language -- kept in step with clips.html / settings.html. */
    --ease_pop: cubic-bezier(.2, .7, .3, 1);
    --ease_smooth: cubic-bezier(.16, 1, .3, 1);
    --anim_press: 130ms;
    --anim_menu: 200ms;
    --hover_grow: 1.03;
    --press_shrink: .96;
  }

  * { box-sizing: border-box; }
  html {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg_window);
    /* rk-theme.css / the helper's injected style overrides this per theme */
    color-scheme: dark;
  }
  body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg_dock);
    color: var(--text);
    font-family: var(--font_family);
    font-size: var(--font_size);
    user-select: none;
    overflow: hidden;
  }
  #controlsFrame {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg_dock);
    border: 1px solid var(--grey4-solid,var(--grey4));
    border-top: none;
    border-bottom-left-radius: var(--border_radius);
    border-bottom-right-radius: var(--border_radius);
    padding: var(--spacing_top) var(--spacing_sides) var(--spacing_outer);
    gap: var(--spacing_outer);
    overflow-y: auto;
  }
  /* obs yami-style pill scrollbar -- same rules as clips.html so the dock matches the sources / mixer panels. the thumb is narrower than the track becuase the border is transparent + the background is clipped to padding-box, giving the floating-capsule look. */
  *::-webkit-scrollbar        { width: 14px; height: 14px; background: transparent; }
  *::-webkit-scrollbar-track  { background: transparent; }
  *::-webkit-scrollbar-corner { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: var(--grey3);
    border-radius: 7px;
    border: 4px solid transparent;
    background-clip: padding-box;
    min-height: 30px;
  }
  *::-webkit-scrollbar-thumb:hover  { background-color: var(--grey1); }
  *::-webkit-scrollbar-thumb:active { background-color: var(--white5); }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--button_bg);
    color: var(--text);
    border: 1px solid var(--button_border);
    border-radius: var(--border_radius);
    height: var(--input_height);
    min-height: var(--input_height);
    padding: 0 var(--padding_wide);
    font: inherit;
    cursor: pointer;
    outline: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform var(--anim_press) var(--ease_pop), background-color 90ms linear, border-color 90ms linear;
  }
  .btn:hover {
    background-color: var(--button_bg_hover);
    border-color: var(--button_border_hover);
    transform: scale(var(--hover_grow));
  }
  .btn:focus-visible { border-color: var(--button_border_hover); }
  .btn:active { background-color: var(--button_bg_down); transform: scale(var(--press_shrink)); }
  .btn:disabled {
    opacity: 0.65;
    cursor: progress;
    transform: none;
  }
  .btn.is-disconnected,
  .btn.is-busy,
  .btn.is-signing-in { transform: none; }
  .btn.is-disconnected {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }
  .btn.is-busy {
    opacity: 0.65;
    cursor: progress;
  }
  /* brief success/error flash on the upload button. we no longer have a seperate url textbox -- status is conveyed by the button itself (e.g. "link copied!" / "upload failed"), then it returns to its defualt label. */
  .btn.is-flash-success {
    background-color: var(--primary);
    border-color: var(--primary_light);
    color: var(--on-accent);
  }
  .btn.is-flash-error {
    background-color: var(--red);
    border-color: var(--red);
    color: #fff;
  }
  .btn.primary {
    background-color: var(--primary);
    border-color: var(--primary_light);
    color: var(--on-accent);
  }
  .btn.primary:hover { background-color: var(--primary_light); }

  /* share preview toggle. highlighted when the Discord/application-share preview is enabled. */
  .btn.projector-mode {
    background-color: var(--blue3);
    border-color: var(--blue3-solid,var(--blue3));
    color: var(--on-accent);
  }
  .btn.projector-mode:hover {
    background-color: var(--blue2);
    border-color: var(--blue2);
  }
  .btn.projector-mode:focus-visible {
    border-color: var(--blue3-solid,var(--blue3));
  }
  .btn.projector-mode:hover:focus-visible {
    border-color: var(--blue2);
  }

  /* auth row: third button stacks under view clips; "sign in" when out, "signed in" with a green dot when in. click signed-in opens a tiny dropdown menu (with sign out); click signed-out opens the login modal. */
  .auth-wrap { position: relative; }
  .auth-wrap .btn {
    width: 100%;
    justify-content: center;
  }
  .auth-wrap .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text_muted);
    margin-right: 7px;
    flex-shrink: 0;
  }
  .auth-wrap .btn.is-signed-in .dot { background: var(--green); }

  /* "signing in..." state while the popup is open. pulses the dot blue and disables the button so the user has clear feedback that somethings happening between popup-open and import-success. */
  .auth-wrap .btn.is-signing-in {
    opacity: 0.85;
    cursor: progress;
    pointer-events: none;
  }
  .auth-wrap .btn.is-signing-in .dot {
    background: var(--blue2);
    animation: auth-pulse 1.1s ease-in-out infinite;
  }
  @keyframes auth-pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50%      { opacity: 1;    transform: scale(1.15); }
  }

  /* opens down by defualt; openmenu() flips to .is-up if the menu would extend past #controlsframe and force a scrollbar. direction sets top/bottom + shadow side so the soft edge always points away from the button. */
  .auth-menu {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 5;
    background: var(--grey6);
    border: 1px solid var(--grey4-solid,var(--grey4));
    border-radius: var(--border_radius);
    /* collapses to a clipped zero-height box instead of display:none so it can slide open and shut. overflow:hidden + max-height:0 also means a closed menu adds no height to #controlsFrame, so it never forces the scrollbar the up/down flip is there to avoid. openMenu() still measures offsetHeight correctly -- max-height caps height, it doesnt force it. */
    max-height: 0;
    padding: 0;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-5px) scale(.98);
    transform-origin: top center;
    transition: max-height var(--anim_menu) var(--ease_smooth), opacity 150ms ease, transform var(--anim_menu) var(--ease_smooth), visibility 0s linear var(--anim_menu);
  }
  .auth-menu.is-open {
    max-height: 240px;
    padding: 4px 0;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition: max-height var(--anim_menu) var(--ease_smooth), opacity 130ms ease, transform var(--anim_menu) var(--ease_smooth);
  }
  .auth-menu.is-up { transform-origin: bottom center; }
  .auth-menu.is-down {
    top: calc(100% + 3px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
  }
  .auth-menu.is-up {
    bottom: calc(100% + 3px);
    box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.5);
  }
  .auth-menu .info {
    padding: 7px 10px 5px;
    font-size: 11px;
    color: var(--text_muted);
    line-height: 1.45;
    border-bottom: 1px solid var(--grey4-solid,var(--grey4));
    margin-bottom: 3px;
  }
  .auth-menu .info b { color: var(--text); font-weight: 500; }
  .auth-menu .spoiler {
    display: inline-block;
    max-width: 100%;
    padding: 0 4px;
    border-radius: 3px;
    background: var(--grey1);
    color: transparent;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .auth-menu .spoiler:hover,
  .auth-menu .spoiler:focus {
    background: transparent;
    color: var(--text);
    outline: 1px solid var(--grey1);
  }
  .auth-menu .item {
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    user-select: none;
    transition: transform var(--anim_press) var(--ease_pop), background-color 90ms linear;
  }
  .auth-menu .item:hover { background: var(--button_bg_hover); transform: translateX(3px); }
  .auth-menu .item:active { transform: translateX(3px) scale(var(--press_shrink)); }

  /* one-time cascade as the dock view loads. backwards fill so the rows sit hidden through their
     stagger delay, then settle -- and dont keep a transform that would fight the :hover pop. */
  @keyframes rk-dock-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  #controlsFrame > * { animation: rk-dock-in 300ms var(--ease_smooth) backwards; }
  #controlsFrame > *:nth-child(2) { animation-delay: 35ms; }
  #controlsFrame > *:nth-child(3) { animation-delay: 70ms; }
  #controlsFrame > *:nth-child(4) { animation-delay: 105ms; }
  #controlsFrame > *:nth-child(5) { animation-delay: 140ms; }
  #controlsFrame > *:nth-child(6) { animation-delay: 175ms; }
</style>
<!-- theme override -- written by the helper (Themes.WriteDockThemeCss); empty on the default theme. this dock is loaded from a file:// url so the helper's http-time style injection never reaches it. -->
<link rel="stylesheet" href="rk-theme.css" id="rk-theme-link" />
</head>
<body style="background:#272A33;color:#FFFFFF">
  <div id="controlsFrame">
    <button class="btn" id="save-replay-btn">Save Clip</button>
    <button class="btn" id="mode-btn">Enable Share Preview</button>
    <button class="btn" id="view-clips-btn">View Clips</button>
    <button class="btn" id="open-folder-btn">Open Folder</button>
    <div class="auth-wrap" id="auth-wrap">
      <button class="btn" id="auth-btn" type="button">
        <span class="dot"></span>
        <span id="auth-label">Sign in to Streamable</span>
      </button>
      <div class="auth-menu" id="auth-menu">
        <div class="info" id="auth-info"></div>
        <div class="item" id="auth-logout">Sign out</div>
        <div class="item" id="auth-force-signout" title="Wipes Streamable cookies from OBS so you can sign in as a different account. Requires an OBS restart.">Force re-login</div>
      </div>
    </div>
    <button class="btn" id="settings-btn">ReplayKit Settings</button>
  </div>

<script>
  // rk-theme.css is written by the helper; if the dock loaded before the helper got to it (first launch race), re-pull it once a few seconds in. real theme changes restart OBS -> full dock reload anyway.
  setTimeout(function () {
    var l = document.getElementById("rk-theme-link");
    if (l) l.href = "rk-theme.css?t=" + Date.now();
  }, 2500);

  // dock lockdown: stop accidental right-click menu / zoom shortcuts. cef treats the dock like a regular web page, so users can right-click and hit zoom in / refresh / back / inspect / etc. -- all of which are surprises in a dock context. mirrored in controls.html and clips.html.
  (function lockdown() {
    const blockedCommandKeys = new Set(["+", "=", "-", "_", "0", "r", "R", "f", "F", "l", "L", "o", "O", "p", "P", "s", "S", "u", "U"]);
    const blockedCommandCodes = new Set(["Equal", "Minus", "Digit0", "NumpadAdd", "NumpadSubtract", "Numpad0"]);
    const blockedDevToolsCodes = new Set(["KeyI", "KeyJ", "KeyC"]);
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
    document.addEventListener("wheel", function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false, capture: true });
    document.addEventListener("keydown", function (e) {
      const command = e.ctrlKey || e.metaKey;
      if (command && (blockedCommandKeys.has(e.key) || blockedCommandCodes.has(e.code) || (e.shiftKey && blockedDevToolsCodes.has(e.code)))) {
        e.preventDefault();
        return;
      }
      if (e.key === "F5" || e.code === "F5" || e.key === "F12" || e.code === "F12") {
        e.preventDefault();
        return;
      }
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.code === "ArrowLeft" || e.code === "ArrowRight")) {
        e.preventDefault();
      }
      if (e.key === "BrowserBack" || e.key === "BrowserForward" || e.code === "BrowserBack" || e.code === "BrowserForward") {
        e.preventDefault();
      }
    }, true);
  })();

  const HELPER_HTTP_URL = location.protocol === "http:"
    ? location.origin + "/"
    : "http://127.0.0.1:8767/";

  const POLL_IDLE_MS = 5000;
  const UPDATE_STARTUP_CHECK_DELAY_MS = 8000;
  const modeBtn = document.getElementById("mode-btn");
  const viewClipsBtn = document.getElementById("view-clips-btn");
  const saveReplayBtn = document.getElementById("save-replay-btn");
  const openFolderBtn = document.getElementById("open-folder-btn");
  const settingsBtn = document.getElementById("settings-btn");

  let pollTimerId = null;
  let helperConnected = false;
  let sharePreviewActionInFlight = false;
  let sharePreviewEnabled = false;
  let sharePreviewAvailable = true;

  function setConnected(yes) {
    helperConnected = yes;
    modeBtn.classList.toggle("is-disconnected", !yes);
    viewClipsBtn.classList.toggle("is-disconnected", !yes);
    saveReplayBtn.classList.toggle("is-disconnected", !yes);
    openFolderBtn.classList.toggle("is-disconnected", !yes);
    settingsBtn.classList.toggle("is-disconnected", !yes);
  }

  function flashButton(btn, text, cls, ms, fallbackText) {
    btn.textContent = text;
    btn.classList.remove("is-flash-success", "is-flash-error");
    if (cls) btn.classList.add(cls);
    setTimeout(() => {
      btn.classList.remove("is-flash-success", "is-flash-error");
      btn.textContent = fallbackText;
      btn.disabled = btn === modeBtn && !sharePreviewAvailable;
    }, ms);
  }

  async function helperJson(path, options) {
    const res = await fetch(HELPER_HTTP_URL + path, {
      cache: "no-store",
      ...(options || {}),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(body.message || body.error || ("HTTP " + res.status));
    }
    return body;
  }

  function sharePreviewLabel(enabled, available) {
    if (available === false) return "Share Preview Disabled";
    return enabled ? "Disable Share Preview" : "Enable Share Preview";
  }

  function renderSharePreview(enabled, available) {
    sharePreviewAvailable = available !== false;
    sharePreviewEnabled = sharePreviewAvailable && !!enabled;
    modeBtn.classList.toggle("projector-mode", sharePreviewEnabled);
    modeBtn.textContent = sharePreviewLabel(sharePreviewEnabled, sharePreviewAvailable);
    modeBtn.disabled = sharePreviewActionInFlight || !sharePreviewAvailable;
    modeBtn.title = !sharePreviewAvailable
      ? "Discord screenshare support is not available."
      : sharePreviewEnabled
      ? "Stop letting Discord or other apps capture your OBS scene (Application screen share)."
      : "Let Discord or other apps capture your OBS scene (use Application screen share).";
  }

  async function refreshSharePreviewState() {
    const result = await helperJson("share-preview?t=" + Date.now());
    renderSharePreview(!!(result && result.enabled), !(result && result.available === false));
  }

  async function saveReplay() {
    return await helperJson("save-replay", { method: "POST" });
  }

  async function openClipFolder() {
    try {
      return await helperJson("open-clip-folder", { method: "POST" });
    } catch {
      const data = await helperJson("clips?offset=0&limit=1&t=" + Date.now());
      const clips = Array.isArray(data) ? data : (Array.isArray(data.clips) ? data.clips : []);
      if (!clips.length || !clips[0].name) throw new Error("No clips found");
      return await helperJson("open-folder?file=" + encodeURIComponent(clips[0].name), { method: "POST" });
    }
  }

  // helper liveness check -- without the per-second upload-state polling the dock used to do, this just keeps the disconnected styling in sync with whether the helper is responding.
  async function pollStatus() {
    try {
      await helperJson("status?t=" + Date.now());
      setConnected(true);
      await refreshSharePreviewState();
    } catch {
      setConnected(false);
    }
  }

  function schedulePoll() {
    if (pollTimerId) clearTimeout(pollTimerId);
    pollTimerId = setTimeout(async () => {
      await pollStatus();
      schedulePoll();
    }, POLL_IDLE_MS);
  }

  let settingsWindow = null;
  let updateWindow = null;

  function styleSettingsTaskbarWindow() {
    fetch(HELPER_HTTP_URL + "style-window?title=ReplayKit%20Settings&taskbar=1&t=" + Date.now(),
          { cache: "no-store" }).catch(() => {});
  }

  function focusSettingsWindowNative() {
    fetch(HELPER_HTTP_URL + "focus-window?title=ReplayKit%20Settings&t=" + Date.now(),
          { cache: "no-store" }).catch(() => {});
  }

  function styleUpdatePromptWindow() {
    fetch(HELPER_HTTP_URL + "style-window?title=ReplayKit%20Update&taskbar=1&t=" + Date.now(),
          { cache: "no-store" }).catch(() => {});
  }

  function focusUpdatePromptWindowNative() {
    fetch(HELPER_HTTP_URL + "focus-window?title=ReplayKit%20Update&t=" + Date.now(),
          { cache: "no-store" }).catch(() => {});
  }

  // returns true when the popup is up (or already up); false means cef declined window.open (either popup-blocked or document hidden) and the caller should retry later.
  function openUpdatePrompt(data) {
    if (updateWindow && !updateWindow.closed) {
      try { updateWindow.focus(); } catch (_) {}
      focusUpdatePromptWindowNative();
      return true;
    }
    const version = data && data.latestVersion ? encodeURIComponent(data.latestVersion) : "";
    const w = window.open(
      HELPER_HTTP_URL + "update-prompt" + (version ? "?version=" + version : ""),
      "replaykit_update_prompt",
      "popup=yes,width=520,height=300"
    );
    if (!w) {
      focusUpdatePromptWindowNative();
      return false;
    }
    updateWindow = w;
    try { updateWindow.focus(); } catch (_) {}
    [80, 250, 750, 1500, 3000].forEach((delay) => {
      setTimeout(styleUpdatePromptWindow, delay);
    });
    return true;
  }

  // hold the startup-check result until obs is actually on screen -- opening the popup while the dock is hidden (obs minimized / not foregrounded yet) makes cef silently drop the window.open, which is why the popup never appeared when the user launched obs into the background.
  let pendingUpdateData = null;
  let updatePopupAttempted = false;

  function tryOpenPendingUpdate() {
    if (updatePopupAttempted || !pendingUpdateData) return;
    if (document.visibilityState !== "visible") return;
    if (openUpdatePrompt(pendingUpdateData)) {
      updatePopupAttempted = true;
    }
  }

  async function runStartupUpdateCheck() {
    try {
      const data = await helperJson("update/startup-check?t=" + Date.now());
      if (data && data.ok && data.prompt) {
        pendingUpdateData = data;
        tryOpenPendingUpdate();
      }
    } catch (_) {}
  }

  function scheduleStartupUpdateCheck() {
    setTimeout(() => {
      runStartupUpdateCheck();
    }, UPDATE_STARTUP_CHECK_DELAY_MS);
  }

  // re-attempt the pending popup whenever the dock becomes visible/focused -- handles the "obs started in the background" case: the check runs immediately, the data sits in pendingUpdateData, and the popup opens the first time the user brings obs to the foreground.
  document.addEventListener("visibilitychange", tryOpenPendingUpdate);
  window.addEventListener("focus", tryOpenPendingUpdate);

  settingsBtn.addEventListener("click", () => {
    if (settingsWindow && !settingsWindow.closed) {
      try { settingsWindow.focus(); } catch (_) {}
      focusSettingsWindowNative();
      return;
    }
    settingsWindow = window.open(
      HELPER_HTTP_URL + "settings-view",
      "replaykit_settings",
      "popup=yes,width=980,height=760"
    );
    if (!settingsWindow) {
      focusSettingsWindowNative();
      return;
    }
    try { settingsWindow.focus(); } catch (_) {}
    [80, 250, 750, 1500, 3000].forEach((delay) => {
      setTimeout(styleSettingsTaskbarWindow, delay);
    });
  });

  viewClipsBtn.addEventListener("click", () => {
    // the tray plugin owns the reusable Clips host; sending the same command here keeps the dock button and tray row on one open/focus/reset path.
    helperJson("open-clips-window", { method:"POST" }).catch(() => {});
  });

  saveReplayBtn.addEventListener("click", async () => {
    if (saveReplayBtn.disabled) return;
    saveReplayBtn.disabled = true;
    saveReplayBtn.textContent = "Saving...";
    try {
      await saveReplay();
      flashButton(saveReplayBtn, "Clip saved", "is-flash-success", 1800, "Save Clip");
    } catch (e) {
      flashButton(saveReplayBtn, ("Save failed: " + (e.message || e)).slice(0, 42),
                  "is-flash-error", 3000, "Save Clip");
    }
  });

  openFolderBtn.addEventListener("click", async () => {
    if (openFolderBtn.disabled) return;
    openFolderBtn.disabled = true;
    openFolderBtn.textContent = "Opening...";
    try {
      await openClipFolder();
      flashButton(openFolderBtn, "Folder opened", "is-flash-success", 1200, "Open Folder");
    } catch (e) {
      flashButton(openFolderBtn, ("Open failed: " + (e.message || e)).slice(0, 42),
                  "is-flash-error", 3000, "Open Folder");
    }
  });

  async function toggleSharePreview() {
    if (sharePreviewActionInFlight || modeBtn.disabled || !sharePreviewAvailable) return;
    const nextEnabled = !sharePreviewEnabled;
    sharePreviewActionInFlight = true;
    modeBtn.disabled = true;
    modeBtn.classList.add("is-busy");
    modeBtn.textContent = nextEnabled ? "Enabling..." : "Disabling...";
    try {
      const result = await helperJson("share-preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: nextEnabled }),
      });
      const enabled = !!(result && result.enabled);
      const available = !(result && result.available === false);
      renderSharePreview(enabled, available);
      const warnings = Array.isArray(result && result.warnings) ? result.warnings : [];
      flashButton(modeBtn, !available ? "Preview disabled" : warnings.length ? "Preview warning" : (enabled ? "Preview enabled" : "Preview disabled"),
                  warnings.length ? "is-flash-error" : "is-flash-success",
                  warnings.length ? 3000 : 1400,
                  sharePreviewLabel(enabled, available));
    } catch (e) {
      flashButton(modeBtn, ("Preview failed: " + (e.message || e)).slice(0, 42),
                  "is-flash-error", 3000, sharePreviewLabel(sharePreviewEnabled, sharePreviewAvailable));
    } finally {
      modeBtn.classList.remove("is-busy");
      sharePreviewActionInFlight = false;
      modeBtn.disabled = !sharePreviewAvailable;
    }
  }

  renderSharePreview(false);
  modeBtn.addEventListener("click", toggleSharePreview);

  pollStatus().then(schedulePoll);
  scheduleStartupUpdateCheck();

  // streamable account ui (third button + dropdown + login popup). sign-in is cookie-based: the popup goes to streamable.com, the helper imports cookies via /import-session, and we reflect state thru /me and /logout.
  const authBtn    = document.getElementById("auth-btn");
  const authLabel  = document.getElementById("auth-label");
  const authMenu   = document.getElementById("auth-menu");
  const authInfo   = document.getElementById("auth-info");
  const authLogout = document.getElementById("auth-logout");
  const authForce  = document.getElementById("auth-force-signout");

  let authState   = { signedIn: false, username: "", plan: "", sizeCap: 0, retentionDays: 2 };
  let loginPopup  = null;

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function planLabel(p) { return p ? p.charAt(0).toUpperCase() + p.slice(1) : "Free"; }

  function applyAuthData(data) {
    authState = {
      signedIn:      !!data.signedIn,
      username:      data.maskedUsername || data.displayName || data.username || "",
      plan:          data.plan || "",
      sizeCap:       Number(data.sizeCap) || 0,
      retentionDays: Number(data.retentionDays) || 2,
    };
    renderAuth();
  }

  function renderAuth() {
    if (authState.signedIn) {
      authBtn.classList.add("is-signed-in");
      authLabel.textContent = "Signed in";
      authInfo.innerHTML =
        '<b class="spoiler" tabindex="0">' +
        escapeHtml(authState.username || "(signed in)") + "</b><br>" +
        escapeHtml(planLabel(authState.plan)) + " &middot; " +
        authState.retentionDays + "d retention";
    } else {
      authBtn.classList.remove("is-signed-in");
      authLabel.textContent = "Sign in to Streamable";
      authInfo.innerHTML = "Not signed in";
    }
  }
  renderAuth();

  async function fetchMe() {
    try {
      const data = await helperJson("me?t=" + Date.now());
      applyAuthData(data);
    } catch { /* helper offline -- setConnected(false) already runs via pollStatus */ }
  }
  fetchMe();

  // open downward when theres room below the auth button inside the dock; otherwise flip upward so the menu doesnt force a scrollbar. we add is-down before measuring, then swap to is-up if it wont fit. both class changes happen in the same tick so the browser never paints the intermediate state. scrollHeight (not offsetHeight) is read on purpose -- the menu now slides open from max-height:0, and scrollHeight reports the full content height regardless of where that animation currently sits, where offsetHeight would read ~0 on the first frame.
  const authWrap = document.getElementById("auth-wrap");
  const controlsFrame = document.getElementById("controlsFrame");
  function openMenu() {
    authMenu.classList.remove("is-up");
    authMenu.classList.add("is-down", "is-open");
    const menuH = authMenu.scrollHeight;
    const spaceBelow =
      controlsFrame.getBoundingClientRect().bottom -
      authWrap.getBoundingClientRect().bottom;
    // 3px gap from css + a couple pixels of breathing room.
    if (menuH + 6 > spaceBelow) {
      authMenu.classList.remove("is-down");
      authMenu.classList.add("is-up");
    }
  }
  function closeMenu() { authMenu.classList.remove("is-open"); }

  // Sign-in is hosted in ReplayKit's own persistent WebView2 profile. It never reads
  // cookies or encryption keys from Chrome, Edge, OBS CEF, or any other browser.
  let importPollTimer = null;
  let popupCloseTimer = null;
  let loginTimeoutTimer = null;
  let loginFlowActive = false;
  let loginWindowsCloseRequested = false;
  let loginLastCloseRequestAt = 0;
  const LOGIN_TIMEOUT_MS = 120000;
  const LOGIN_IMPORT_POLL_MS = 500;

  function setSigningIn(on, label) {
    if (on) {
      authBtn.classList.add("is-signing-in");
      authLabel.textContent = label || "Signing in…";
    } else {
      authBtn.classList.remove("is-signing-in");
      // renderauth() will set the right label based on current state.
      renderAuth();
    }
  }
  function clearLoginTimers() {
    if (importPollTimer)   { clearInterval(importPollTimer);   importPollTimer = null; }
    if (popupCloseTimer)   { clearInterval(popupCloseTimer);   popupCloseTimer = null; }
    if (loginTimeoutTimer) { clearTimeout(loginTimeoutTimer);  loginTimeoutTimer = null; }
  }
  function cleanupLoginFlow() {
    clearLoginTimers();
    loginFlowActive = false;
    setSigningIn(false);
    // tier 1: try window.close() from js. cef refuses this for cross-origin popups so it usually does nothing, but its free.
    if (loginPopup && !loginPopup.closed) {
      try { loginPopup.close(); } catch {}
    }
    // tier 2: ask the helper to win32 wm_close the stuck popups. this bypasses cefs same-origin policy entirely by going thru the os message queue. handles our own popup and the streamable / google oauth windows streamables js spawned that we dont have handles for.
    fetch(HELPER_HTTP_URL + "close-signin-windows", { method: "POST", cache: "no-store" }).catch(() => {});
    loginPopup = null;
    loginWindowsCloseRequested = false;
    loginLastCloseRequestAt = 0;
  }
  function requestSigninWindowClose(label) {
    if (label) setSigningIn(true, label);
    const now = Date.now();
    if (loginWindowsCloseRequested && (now - loginLastCloseRequestAt) < 250) return;
    loginWindowsCloseRequested = true;
    loginLastCloseRequestAt = now;
    if (loginPopup && !loginPopup.closed) {
      try { loginPopup.close(); } catch {}
    }
    fetch(HELPER_HTTP_URL + "close-signin-windows", { method: "POST", cache: "no-store" }).catch(() => {});
  }

  // one sequenced poller drives the whole flow -- there used to be two independent, uncoordinated fetches (a
  // fire-and-forget "&start=1" call and a separate immediate status check racing right behind it). the status
  // check could reach the helper and see pending:false *before* the start=1 call had actually flipped it true
  // server-side, which the close-detection added for the stuck-button fix then misread as "closed without
  // signing in" and reset the button within a fraction of a second of the very click that opened it -- looking
  // like the button "let you press it again" when the window was, in fact, still opening. sawWindowOpen is what
  // tells a real close (seen pending:true, now false) apart from that startup race (never confirmed open yet).
  function openLoginPopup() {
    clearLoginTimers(); // wipe any stale timers from a previous attempt
    loginFlowActive = true;
    loginWindowsCloseRequested = false;
    loginLastCloseRequestAt = 0;
    let sawWindowOpen = false;
    setSigningIn(true, "Opening Streamable…");

    async function pollStatus(isStartCall) {
      if (!loginFlowActive) return;
      let res, data;
      try {
        res = await fetch(HELPER_HTTP_URL + "import-session?source=owned" + (isStartCall ? "&start=1" : ""), {
          method: "POST", cache: "no-store",
        });
        data = await res.json().catch(() => ({}));
      } catch { return; } // helper unreachable this tick -- leave the label as-is rather than flipping it off a transient blip
      if (!loginFlowActive || !res.ok) return; // cleanup may have already fired while this request was in flight
      if (data.signedIn) {
        applyAuthData(data);
        setSigningIn(true, "Signed in! Cleaning up…");
        cleanupLoginFlow();
        return;
      }
      if (data.pending === true) { sawWindowOpen = true; setSigningIn(true, "Sign in in the Streamable window…"); return; }
      if (sawWindowOpen) { cleanupLoginFlow(); return; } // really did close without finishing
      setSigningIn(true, "Opening Streamable…"); // pending:false before weve ever seen it open -- still starting up
    }

    pollStatus(true); // opens the window (or focuses the existing one) and seeds status in the same call
    importPollTimer = setInterval(() => pollStatus(false), LOGIN_IMPORT_POLL_MS);

    // Hard timeout: leave the user a usable sign-in button if the window was closed.
    loginTimeoutTimer = setTimeout(() => {
      cleanupLoginFlow();
    }, LOGIN_TIMEOUT_MS);
  }

  authBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (authState.signedIn) {
      if (authMenu.classList.contains("is-open")) closeMenu();
      else openMenu();
    } else {
      openLoginPopup();
    }
  });

  authForce.addEventListener("click", async (e) => {
    e.stopPropagation();
    closeMenu();
    if (!confirm(
      "Force re-login will:\n" +
      "  1. Close OBS\n" +
      "  2. Wipe the Streamable cookies in OBS\n" +
      "  3. Re-launch OBS as admin\n\n" +
      "Save any unsaved scene work first. Continue?"
    )) return;
    // the helper kills obs, waits for the cookies file to unlock, deletes streamable.com rows, then re-launches obs. we get killed shortly after this fetch returns -- the helper survives becuase its admin and the parent-watcher exempts admin helpers.
    try {
      await fetch(HELPER_HTTP_URL + "restart-obs-clean", { method: "POST", cache: "no-store" });
    } catch { /* expected -- OBS dies before the response sometimes */ }
    authState = { signedIn: false, username: "", plan: "", sizeCap: 0, retentionDays: 2 };
    renderAuth();
  });

  authLogout.addEventListener("click", async (e) => {
    e.stopPropagation();
    closeMenu();
    authState = { signedIn: false, username: "", plan: "", sizeCap: 0, retentionDays: 2 };
    renderAuth();
    fetch(HELPER_HTTP_URL + "logout", { method: "POST", cache: "no-store" }).catch(() => {});
  });

  // outside-click / mouseleave / blur all close the auth menu.
  document.addEventListener("mousedown", (e) => {
    if (e.target.closest("#auth-wrap")) return;
    closeMenu();
  });
  document.documentElement.addEventListener("mouseleave", closeMenu);
  window.addEventListener("blur", closeMenu);

</script>
</body>
</html>
