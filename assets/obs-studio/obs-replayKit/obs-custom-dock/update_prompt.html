<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit Update</title>
<link rel="icon" type="image/x-icon" href="http://127.0.0.1:8767/obs-icon.ico?v=2" />
<style>
  :root {
    --window:#1D1F26;
    --panel:#272A33;
    --field:#3C404D;
    --line:#5B6273;
    --selected:#284CB8;
    --selected2:#476BD7;
    --text:#ffffff;
    --muted:#969696;
    --bad:#ff8da0;
    --good:#9bd88f;
    --font:"Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body {
    width:100%;
    height:100%;
    min-width:420px;
    min-height:240px;
    margin:0;
    overflow:hidden;
    background:var(--window);
    color:var(--text);
    font:13px var(--font);
    user-select:none;
  }
  button { font:inherit; }
  .shell {
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-rows:1fr auto;
    background:var(--window);
    padding:14px;
    position:relative;
  }
  .resize-grip {
    position:absolute;
    right:2px;
    bottom:2px;
    width:18px;
    height:18px;
    opacity:.95;
    cursor:nwse-resize;
    pointer-events:auto;
  }
  .resize-grip span {
    position:absolute;
    width:2px;
    height:2px;
    background:#ffffff;
    border-radius:50%;
  }
  .resize-grip span:nth-child(1) { right:0; bottom:0; }
  .resize-grip span:nth-child(2) { right:3px; bottom:0; }
  .resize-grip span:nth-child(3) { right:6px; bottom:0; }
  .resize-grip span:nth-child(4) { right:0; bottom:3px; }
  .resize-grip span:nth-child(5) { right:3px; bottom:3px; }
  .resize-grip span:nth-child(6) { right:0; bottom:6px; }
  .content {
    background:var(--panel);
    border-radius:4px;
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
  }
  .title {
    font-size:18px;
    font-weight:700;
    line-height:1.25;
  }
  .body {
    color:var(--text);
    line-height:1.45;
  }
  .meta {
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .status {
    min-height:18px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }
  .status.good { color:var(--good); }
  .status.bad { color:var(--bad); }
  .footer {
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding-top:12px;
  }
  .btn {
    min-width:82px;
    height:30px;
    border:1px solid var(--field);
    border-radius:4px;
    background:var(--field);
    color:var(--text);
    padding:0 13px;
    cursor:pointer;
  }
  .btn:hover { background:#464B59; border-color:var(--line); }
  .btn.primary {
    background:var(--selected);
    border-color:#5c78df;
  }
  .btn.primary:hover { background:var(--selected2); }
  .btn:disabled {
    color:#8b91a0;
    cursor:default;
    background:#272A33;
    border-color:#3C404D;
  }
  /* release notes panel. github markdown lands here -- the popups js does the rendering + html escaping, so the helper just passes the raw body through. fixed height + scroll so a long changelog doesnt blow out the popup. */
  .notes {
    display:none;
    margin-top:4px;
    padding:10px 12px;
    background:var(--window);
    border:1px solid var(--field);
    border-radius:3px;
    flex:1 1 auto;
    min-height:80px;
    overflow:auto;
    font-size:12px;
    line-height:1.5;
    color:var(--text);
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .notes.is-visible { display:block; }
  /* h1->h3, h2->h4, h3->h5 (the renderer offsets levels by +2 so the popups dom hierarchy stays under the page title). distinct sizes so multi-section changelogs read clearly. */
  .notes h3 { margin:10px 0 4px; font-size:15px; font-weight:600; color:var(--text); }
  .notes h4 { margin:10px 0 4px; font-size:13px; font-weight:600; color:var(--text); }
  .notes h5 { margin:8px 0 4px;  font-size:12px; font-weight:600; color:var(--text); }
  .notes h3:first-child, .notes h4:first-child, .notes h5:first-child { margin-top:0; }
  .notes p  { margin:6px 0; }
  .notes ul, .notes ol { margin:6px 0 6px 20px; padding:0; }
  .notes li { margin:2px 0; }
  .notes hr {
    border:none;
    border-top:1px solid var(--field);
    margin:10px 0;
  }
  .notes code {
    background:var(--field);
    padding:0 4px;
    border-radius:2px;
    font-family:Consolas, "Liberation Mono", monospace;
    font-size:11px;
  }
  .notes pre {
    background:var(--field);
    padding:8px 10px;
    border-radius:3px;
    margin:6px 0;
    overflow:auto;
    font-family:Consolas, "Liberation Mono", monospace;
    font-size:11px;
    line-height:1.4;
  }
  .notes pre code {
    background:transparent;
    padding:0;
    border-radius:0;
    font-size:inherit;
  }
  .notes a {
    color:var(--selected2);
    text-decoration:none;
  }
  .notes a:hover { text-decoration:underline; }
  .notes-label {
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    margin-bottom:2px;
    display:none;
  }
  .notes-label.is-visible { display:block; }

  /* install progress: revealed once the user clicks download. matches the obs settings-apply look: thin track, accent fill, status line underneath. stage transitions are time-anchored to the /update/apply call so we dont need to expose a polling endpoint from a single-threaded helper. */
  .progress {
    display:none;
    margin-top:4px;
  }
  .progress.is-visible { display:block; }
  .progress-track {
    width:100%;
    height:6px;
    background:var(--field);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-bar {
    height:100%;
    width:0%;
    background:var(--selected2);
    transition:width 320ms ease-out, background-color 200ms linear;
  }
  .progress-bar.is-failed { background:var(--bad); }
  .progress-bar.is-done   { background:var(--good); }
  .progress-stage {
    margin-top:6px;
    font-size:12px;
    color:var(--text);
    line-height:1.4;
  }
  .progress-stage.is-failed { color:var(--bad); }
  .progress-stage.is-done   { color:var(--good); }
</style>
</head>
<body>
<div class="shell">
  <main class="content">
    <div class="title" id="title">Checking for ReplayKit update...</div>
    <div class="body" id="body">ReplayKit is checking the latest GitHub release.</div>
    <div class="meta" id="meta"></div>
    <div class="notes-label" id="notesLabel">Description:</div>
    <div class="notes" id="notes"></div>
    <div class="status" id="status"></div>
    <div class="progress" id="progress">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-stage" id="progressStage"></div>
    </div>
  </main>
  <footer class="footer">
    <button class="btn" type="button" id="laterBtn">Later</button>
    <button class="btn primary" type="button" id="downloadBtn" disabled>Download?</button>
  </footer>
  <div class="resize-grip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
<script>
  (function lockdown() {
    const blockedCommandKeys = new Set(["+", "=", "-", "_", "0", "r", "R", "f", "F", "l", "L", "o", "O", "p", "P", "s", "S", "u", "U"]);
    const blockedCommandCodes = new Set(["Equal", "Minus", "Digit0", "NumpadAdd", "NumpadSubtract", "Numpad0"]);
    const blockedDevToolsCodes = new Set(["KeyI", "KeyJ", "KeyC"]);
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
    document.addEventListener("wheel", function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive:false, capture:true });
    document.addEventListener("keydown", function (e) {
      const command = e.ctrlKey || e.metaKey;
      if (command && (blockedCommandKeys.has(e.key) || blockedCommandCodes.has(e.code) || (e.shiftKey && blockedDevToolsCodes.has(e.code)))) {
        e.preventDefault();
        return;
      }
      if (e.key === "F5" || e.code === "F5" || e.key === "F12" || e.code === "F12") {
        e.preventDefault();
        return;
      }
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.code === "ArrowLeft" || e.code === "ArrowRight")) {
        e.preventDefault();
      }
      if (e.key === "BrowserBack" || e.key === "BrowserForward" || e.code === "BrowserBack" || e.code === "BrowserForward") {
        e.preventDefault();
      }
    }, true);
  })();

  const HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";
  const params = new URLSearchParams(location.search);
  const requestedVersion = params.get("version") || "";
  const els = {
    title: document.getElementById("title"),
    body: document.getElementById("body"),
    meta: document.getElementById("meta"),
    status: document.getElementById("status"),
    laterBtn: document.getElementById("laterBtn"),
    downloadBtn: document.getElementById("downloadBtn"),
    progress: document.getElementById("progress"),
    progressBar: document.getElementById("progressBar"),
    progressStage: document.getElementById("progressStage"),
    notes: document.getElementById("notes"),
    notesLabel: document.getElementById("notesLabel"),
    resizeGrip: document.querySelector(".resize-grip"),
  };
  let latest = null;
  let restartWatchTimer = null;

  // tiny github-flavored markdown subset -- escape first, then transform inline patterns; handles what we typically see in replaykit release notes: headers, bullets, **bold**, `code`, [text](url), and bare https urls, anything else falls thru as plain text.
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function applyInlineMd(text) {
    // order matters: bold, then code, then [text](url), then bare urls.
    text = text.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // bare urls -- skip ones already inside an href (cheap check via no preceding =")
    text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return text;
  }
  function renderMarkdown(raw) {
    if (!raw) return "";
    const lines = String(raw).replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let listType = null;          // null | "ul" | "ol"
    let inCodeBlock = false;
    const codeBuf = [];
    const closeList = () => {
      if (listType) { out.push("</" + listType + ">"); listType = null; }
    };
    const openList = (type) => {
      if (listType !== type) { closeList(); out.push("<" + type + ">"); listType = type; }
    };
    for (const rawLine of lines) {
      const line = rawLine.replace(/\s+$/, "");
      // fenced code block: ``` opens / closes. inside the block, content is literal and HTML-escaped only.
      if (/^```/.test(line)) {
        if (inCodeBlock) {
          out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
          codeBuf.length = 0;
          inCodeBlock = false;
        } else {
          closeList();
          inCodeBlock = true;
        }
        continue;
      }
      if (inCodeBlock) { codeBuf.push(rawLine); continue; }
      // horizontal rule: --- or *** on its own line
      if (/^(-{3,}|\*{3,})$/.test(line)) {
        closeList();
        out.push("<hr/>");
        continue;
      }
      // numbered list item: "1. content" / "12) content"
      const ordered = line.match(/^\d+[.)]\s+(.*)$/);
      if (ordered) {
        openList("ol");
        out.push("<li>" + applyInlineMd(escapeHtml(ordered[1])) + "</li>");
        continue;
      }
      // bullet list item: - or *
      const bullet = line.match(/^[-*]\s+(.*)$/);
      if (bullet) {
        openList("ul");
        out.push("<li>" + applyInlineMd(escapeHtml(bullet[1])) + "</li>");
        continue;
      }
      closeList();
      // header (# / ## / ###)
      const header = line.match(/^(#{1,3})\s+(.*)$/);
      if (header) {
        const level = header[1].length + 2; // h3..h5
        out.push("<h" + level + ">" + applyInlineMd(escapeHtml(header[2])) + "</h" + level + ">");
        continue;
      }
      // blank line -- paragraph break
      if (!line) { out.push(""); continue; }
      out.push("<p>" + applyInlineMd(escapeHtml(line)) + "</p>");
    }
    // file ended mid-codeblock: flush what we have so content isnt lost.
    if (inCodeBlock && codeBuf.length) {
      out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
    }
    closeList();
    return out.join("\n");
  }
  function showReleaseNotes(raw) {
    const trimmed = (raw || "").trim();
    if (!trimmed) {
      els.notes.classList.remove("is-visible");
      els.notesLabel.classList.remove("is-visible");
      return;
    }
    els.notes.innerHTML = renderMarkdown(trimmed);
    els.notes.classList.add("is-visible");
    els.notesLabel.classList.add("is-visible");
  }

  function styleNativeChrome() {
    fetch(HELPER + "/style-window?title=ReplayKit%20Update&taskbar=1&t=" + Date.now(), { cache:"no-store" }).catch(() => {});
  }
  styleNativeChrome();
  [400, 900, 1800, 3500].forEach((d) => setTimeout(styleNativeChrome, d));

  // one-shot only, not on the retry schedule above -- chromes own --window-size flag on spawn gets silently ignored whenever chrome already had a running instance, so this corrects it for real once the window exists. deliberately not repeated like styleNativeChrome, so it does not fight a user who drags the resize-grip afterward.
  fetch(HELPER + "/window/set-size?title=ReplayKit%20Update&w=700&h=580&t=" + Date.now(), { method:"POST", cache:"no-store" }).catch(() => {});

  function setStatus(text, kind) {
    els.status.textContent = text || "";
    els.status.classList.toggle("good", kind === "good");
    els.status.classList.toggle("bad", kind === "bad");
  }

  async function helperJson(path, options) {
    const res = await fetch(HELPER + "/" + path, {
      cache:"no-store",
      ...(options || {}),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) {
      throw new Error(body.message || body.error || ("HTTP " + res.status));
    }
    return body;
  }

  function closeWindow() {
    fetch(HELPER + "/close-window?title=ReplayKit%20Update&t=" + Date.now(), {
      method:"POST",
      cache:"no-store",
    }).catch(() => {});
    window.close();
    setTimeout(() => {
      try { window.open("", "_self"); } catch (_) {}
      try { window.close(); } catch (_) {}
    }, 25);
  }

  async function loadUpdate() {
    els.downloadBtn.disabled = true;
    setStatus("Checking...", "");
    try {
      const data = await helperJson("update/check?t=" + Date.now());
      latest = data;
      if (!data.updateAvailable) {
        els.title.textContent = "ReplayKit is up to date";
        els.body.textContent = data.message || "No ReplayKit update is available right now.";
        els.meta.textContent = data.installedVersion ? "Installed version: " + data.installedVersion : "";
        setStatus("", "");
        showReleaseNotes("");
        return;
      }
      // prefer the github release name when present (e.g. "ReplayKit 1.0.1 - hotfix"), fall back to the version-only string.
      els.title.textContent = data.releaseName ? data.releaseName : ("ReplayKit " + data.latestVersion + " available");
      els.body.textContent = "ReplayKit " + data.latestVersion + " is ready to install.";
      els.meta.textContent = "Installed: " + data.installedVersion + "  |  Latest: " + data.latestVersion;
      els.downloadBtn.disabled = false;
      setStatus("OBS will restart after the download is verified.", "");
      showReleaseNotes(data.releaseNotes || "");
    } catch (e) {
      els.title.textContent = "Update check failed";
      els.body.textContent = "ReplayKit could not check for updates.";
      els.meta.textContent = "";
      setStatus(e.message || String(e), "bad");
      showReleaseNotes("");
    }
  }

  function setProgress(percent, message, kind) {
    els.progress.classList.add("is-visible");
    els.progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
    els.progressBar.classList.toggle("is-done",   kind === "done");
    els.progressBar.classList.toggle("is-failed", kind === "failed");
    els.progressStage.textContent = message || "";
    els.progressStage.classList.toggle("is-done",   kind === "done");
    els.progressStage.classList.toggle("is-failed", kind === "failed");
  }

  // after the helper spawns the detached installer it has only seconds to live: the installer taskkills obs, obs death triggers the helpers parent-watchdog and the helper exits. we poll /update/check on a short interval -- a connection error means the install window is in flight, a successful response from a fresh helper means the new obs is back up and we can close; capped so a stuck install eventually surfaces in the ui.
  function watchForRestart(onComplete) {
    let seenHelperDown = false;
    const started = Date.now();
    restartWatchTimer = setInterval(async () => {
      try {
        const r = await fetch(HELPER + "/update/check?t=" + Date.now(), { cache:"no-store" });
        if (!r.ok) return;
        const body = await r.json().catch(() => ({}));
        if (seenHelperDown && body && body.ok) {
          // helper went away and came back -- obs has restarted from the installer.
          clearInterval(restartWatchTimer);
          restartWatchTimer = null;
          onComplete();
        }
      } catch (_) {
        // connection refused: helper is dead while the installer kills obs and copies files.
        seenHelperDown = true;
      }
      if (Date.now() - started > 180000) {
        // 3 minute safety net -- if obs hasnt come back by now, stop polling and leave the popup open so the user can see the last status.
        clearInterval(restartWatchTimer);
        restartWatchTimer = null;
      }
    }, 1500);
  }

  async function downloadUpdate() {
    els.downloadBtn.disabled = true;
    els.laterBtn.disabled = true;
    setStatus("", "");
    setProgress(8, "Preparing download...");

    // crawl the bar from ~8% to ~70% while /update/apply is in-flight (download is the slow part and we cant get a real byte count from a single-threaded ps5 helper without restructuring it) -- step is gentle so it doesnt hit 70% before the download actually finishes on a fast network.
    let pulsePercent = 8;
    const pulseTimer = setInterval(() => {
      pulsePercent = Math.min(pulsePercent + 1.5, 68);
      setProgress(pulsePercent, "Downloading installer from GitHub...");
    }, 400);

    try {
      const data = await helperJson("update/apply", { method:"POST" });
      clearInterval(pulseTimer);
      if (data.updateAvailable === false) {
        setProgress(100, "ReplayKit is already up to date.", "done");
        els.laterBtn.disabled = false;
        return;
      }
      // /update/apply has returned -- download done, hash verified, installer spawned (detached).
      setProgress(80, "Installing update...");
      setTimeout(() => setProgress(92, "Closing OBS to apply files..."), 1500);
      setTimeout(() => setProgress(96, "Copying ReplayKit files..."),    3500);
      // wait for the installer to kill obs, copy files, and relaunch obs -- when the new helper is up, finish the bar and close the popup so the user is back in obs cleanly.
      watchForRestart(() => {
        setProgress(100, "OBS is back up -- update complete.", "done");
        setTimeout(closeWindow, 1500);
      });
    } catch (e) {
      clearInterval(pulseTimer);
      setProgress(0, "Update failed: " + (e.message || e), "failed");
      setStatus("", "");
      els.downloadBtn.disabled = !latest || !latest.updateAvailable;
      els.laterBtn.disabled = false;
    }
  }

  async function later() {
    const version = (latest && latest.latestVersion) || requestedVersion;
    els.laterBtn.disabled = true;
    els.downloadBtn.disabled = true;
    try {
      if (version) {
        await helperJson("update/later", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ version }),
        });
      }
      closeWindow();
    } catch (e) {
      setStatus("Could not dismiss update: " + (e.message || e), "bad");
      els.laterBtn.disabled = false;
      els.downloadBtn.disabled = !latest || !latest.updateAvailable;
    }
  }

  function beginResizeWindow(e) {
    e.preventDefault();
    fetch(HELPER + "/window/resize?title=ReplayKit%20Update&t=" + Date.now(), {
      method:"POST",
      cache:"no-store",
    }).catch(() => {});
  }

  els.downloadBtn.addEventListener("click", downloadUpdate);
  els.laterBtn.addEventListener("click", later);
  els.resizeGrip.addEventListener("pointerdown", beginResizeWindow);
  loadUpdate();
</script>
</body>
</html>
