<!DOCTYPE html>
<html lang="en" style="background:#1D1F26;color:#ffffff;color-scheme:dark">
<head>
<meta charset="UTF-8" />
<meta name="theme-color" content="#1D1F26" />
<meta name="color-scheme" content="dark" />
<title>ReplayKit Update</title>
<link rel="icon" type="image/x-icon" href="http://127.0.0.1:8767/obs-icon.ico?v=2" />
<style>
  :root {
    --window:#1D1F26;
    --side:#272A33;
    --panel:#272A33;
    --field:#3C404D;
    --field2:#323540;
    --field-dark:#1D1F26;
    --line:#5B6273;
    --line2:#5B6273;
    --selected:#284CB8;
    --selected2:#476BD7;
    --text:#ffffff;
    --muted:#969696;
    --disabled:#969696;
    --danger:#e33b57;
    --danger-deep:#7f2232;
    --success:#37D247;
    --warning:#E2A33B;
    --link:#5c78df;
    --button:#3C404D;
    --button-hover:#464B59;
    --bad:var(--danger);
    --good:var(--success);
    --on-accent:#ffffff;
    --on-accent-rgb:255, 255, 255;
    --text-rgb:255, 255, 255;
    --bg-rgb:29, 31, 38;
    --accent-rgb:40, 76, 184;
    --danger-rgb:227, 59, 87;
    --hairline:rgba(var(--text-rgb),.08);
    --overlay-soft:rgba(var(--text-rgb),.06);
    --overlay-strong:rgba(var(--text-rgb),.14);
    --shadow:rgba(0,0,0,.45);
    --shadow-weak:rgba(0,0,0,.28);
    --font:"Segoe UI",system-ui,sans-serif;
    --ease_pop:cubic-bezier(.2, .7, .3, 1);
    --ease_smooth:cubic-bezier(.16, 1, .3, 1);
    --anim_press:130ms;
    --hover_grow:1.03;
    --press_shrink:.96;
  }
  @keyframes rk-reveal { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
  * { box-sizing:border-box; }
  html,body {
    width:100%;
    height:100%;
    min-width:420px;
    min-height:240px;
    margin:0;
    overflow:hidden;
    background:var(--window);
    color:var(--text);
    font:13px var(--font);
    user-select:none;
  }
  button { font:inherit; }
  .shell {
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-rows:1fr auto;
    background:var(--window);
    padding:14px;
    position:relative;
  }
  .resize-grip {
    position:absolute;
    right:2px;
    bottom:2px;
    width:18px;
    height:18px;
    opacity:.95;
    cursor:nwse-resize;
    pointer-events:auto;
  }
  .resize-grip span {
    position:absolute;
    width:2px;
    height:2px;
    background:var(--text);
    border-radius:50%;
  }
  .resize-grip span:nth-child(1) { right:0; bottom:0; }
  .resize-grip span:nth-child(2) { right:3px; bottom:0; }
  .resize-grip span:nth-child(3) { right:6px; bottom:0; }
  .resize-grip span:nth-child(4) { right:0; bottom:3px; }
  .resize-grip span:nth-child(5) { right:3px; bottom:3px; }
  .resize-grip span:nth-child(6) { right:0; bottom:6px; }
  .content {
    background:var(--panel);
    border-radius:4px;
    padding:18px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
    animation:rk-reveal 260ms var(--ease_smooth) backwards;
  }
  .title {
    font-size:18px;
    font-weight:700;
    line-height:1.25;
  }
  .body {
    color:var(--text);
    line-height:1.45;
  }
  .meta {
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .status {
    min-height:18px;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }
  .status.good { color:var(--good); }
  .status.bad { color:var(--bad); }
  .release-link { color:var(--link); font-size:12px; text-decoration:none; align-self:flex-start; }
  .release-link:hover { text-decoration:underline; }
  .footer {
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding-top:12px;
  }
  .btn {
    min-width:82px;
    height:30px;
    border:1px solid var(--field);
    border-radius:4px;
    background:var(--field);
    color:var(--text);
    padding:0 13px;
    cursor:pointer;
    transition:transform var(--anim_press) var(--ease_pop), background-color 90ms linear, border-color 90ms linear;
  }
  .btn:hover { background:var(--button-hover); border-color:var(--line); transform:scale(var(--hover_grow)); }
  .btn:active { transform:scale(var(--press_shrink)); }
  .btn.primary {
    background:var(--selected);
    border-color:var(--selected2);
  }
  .btn.primary:hover { background:var(--selected2); }
  .btn:disabled {
    color:var(--muted);
    cursor:default;
    background:var(--panel);
    border-color:var(--field);
    transform:none;
  }
  /* release notes panel. github markdown lands here -- the popups js does the rendering + html escaping, so the helper just passes the raw body through. fixed height + scroll so a long changelog doesnt blow out the popup. */
  .notes {
    display:none;
    margin-top:4px;
    padding:10px 12px;
    background:var(--window);
    border:1px solid var(--field);
    border-radius:3px;
    flex:1 1 auto;
    min-height:80px;
    overflow:auto;
    font-size:12px;
    line-height:1.5;
    color:var(--text);
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .notes.is-visible { display:block; animation:rk-reveal 240ms var(--ease_smooth) backwards; }
  /* h1->h3, h2->h4, h3->h5 (the renderer offsets levels by +2 so the popups dom hierarchy stays under the page title). distinct sizes so multi-section changelogs read clearly. */
  .notes h3 { margin:10px 0 4px; font-size:15px; font-weight:600; color:var(--text); }
  .notes h4 { margin:10px 0 4px; font-size:13px; font-weight:600; color:var(--text); }
  .notes h5 { margin:8px 0 4px;  font-size:12px; font-weight:600; color:var(--text); }
  .notes h3:first-child, .notes h4:first-child, .notes h5:first-child { margin-top:0; }
  .notes p  { margin:6px 0; }
  .notes ul, .notes ol { margin:6px 0 6px 20px; padding:0; }
  .notes li { margin:2px 0; }
  .notes hr {
    border:none;
    border-top:1px solid var(--field);
    margin:10px 0;
  }
  .notes code {
    background:var(--field);
    padding:0 4px;
    border-radius:2px;
    font-family:Consolas, "Liberation Mono", monospace;
    font-size:11px;
  }
  .notes pre {
    background:var(--field);
    padding:8px 10px;
    border-radius:3px;
    margin:6px 0;
    overflow:auto;
    font-family:Consolas, "Liberation Mono", monospace;
    font-size:11px;
    line-height:1.4;
  }
  .notes pre code {
    background:transparent;
    padding:0;
    border-radius:0;
    font-size:inherit;
  }
  .notes a {
    color:var(--selected2);
    text-decoration:none;
  }
  .notes a:hover { text-decoration:underline; }
  .notes-label {
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
    margin-bottom:2px;
    display:none;
  }
  .notes-label.is-visible { display:block; animation:rk-reveal 220ms var(--ease_smooth) backwards; }

  /* install progress: revealed once the user clicks download. matches the obs settings-apply look: thin track, accent fill, status line underneath. stage transitions are time-anchored to the /update/apply call so we dont need to expose a polling endpoint from a single-threaded helper. */
  .progress {
    display:none;
    margin-top:4px;
  }
  .progress.is-visible { display:block; animation:rk-reveal 220ms var(--ease_smooth) backwards; }
  .progress-track {
    width:100%;
    height:6px;
    background:var(--field);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-bar {
    height:100%;
    width:0%;
    background:var(--selected2);
    transition:width 320ms ease-out, background-color 200ms linear;
  }
  .progress-bar.is-failed { background:var(--bad); }
  .progress-bar.is-done   { background:var(--good); }
  .progress-stage {
    margin-top:6px;
    font-size:12px;
    color:var(--text);
    line-height:1.4;
  }
  .progress-stage.is-failed { color:var(--bad); }
  .progress-stage.is-done   { color:var(--good); }
</style>
<link rel="stylesheet" href="rk-theme.css" />
</head>
<body>
<div class="shell">
  <main class="content">
    <div class="title" id="title">Checking for ReplayKit update...</div>
    <div class="body" id="body">ReplayKit is checking the latest GitHub release.</div>
    <div class="meta" id="meta"></div>
    <div class="notes-label" id="notesLabel">Description:</div>
    <div class="notes" id="notes"></div>
    <div class="status" id="status"></div>
    <a class="release-link" id="releaseLink" href="https://github.com/7Lzz/OBS-ReplayKit/releases/latest" target="_blank" rel="noopener noreferrer">View release or download manually from GitHub</a>
    <div class="progress" id="progress">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-stage" id="progressStage"></div>
    </div>
  </main>
  <footer class="footer">
    <button class="btn" type="button" id="laterBtn">Later</button>
    <button class="btn primary" type="button" id="downloadBtn" disabled>Download?</button>
  </footer>
  <div class="resize-grip" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
<script>
  (function lockdown() {
    const blockedCommandKeys = new Set(["+", "=", "-", "_", "0", "r", "R", "f", "F", "l", "L", "o", "O", "p", "P", "s", "S", "u", "U"]);
    const blockedCommandCodes = new Set(["Equal", "Minus", "Digit0", "NumpadAdd", "NumpadSubtract", "Numpad0"]);
    const blockedDevToolsCodes = new Set(["KeyI", "KeyJ", "KeyC"]);
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
    document.addEventListener("wheel", function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive:false, capture:true });
    document.addEventListener("keydown", function (e) {
      const command = e.ctrlKey || e.metaKey;
      if (command && (blockedCommandKeys.has(e.key) || blockedCommandCodes.has(e.code) || (e.shiftKey && blockedDevToolsCodes.has(e.code)))) {
        e.preventDefault();
        return;
      }
      if (e.key === "F5" || e.code === "F5" || e.key === "F12" || e.code === "F12") {
        e.preventDefault();
        return;
      }
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.code === "ArrowLeft" || e.code === "ArrowRight")) {
        e.preventDefault();
      }
      if (e.key === "BrowserBack" || e.key === "BrowserForward" || e.code === "BrowserBack" || e.code === "BrowserForward") {
        e.preventDefault();
      }
    }, true);
  })();

  const HELPER = location.protocol === "http:" ? location.origin : "http://127.0.0.1:8767";
  const params = new URLSearchParams(location.search);
  const requestedVersion = params.get("version") || "";
  // dismissed: a button already settled this window, so pagehide must not post a second /update/later.
  // installStarted: an install is running -- closing the window then is not a dismissal of the update.
  let dismissed = false;
  let installStarted = false;
  const els = {
    title: document.getElementById("title"),
    body: document.getElementById("body"),
    meta: document.getElementById("meta"),
    status: document.getElementById("status"),
    releaseLink: document.getElementById("releaseLink"),
    laterBtn: document.getElementById("laterBtn"),
    downloadBtn: document.getElementById("downloadBtn"),
    progress: document.getElementById("progress"),
    progressBar: document.getElementById("progressBar"),
    progressStage: document.getElementById("progressStage"),
    notes: document.getElementById("notes"),
    notesLabel: document.getElementById("notesLabel"),
    resizeGrip: document.querySelector(".resize-grip"),
  };
  let latest = null;
  let restartWatchTimer = null;

  // tiny github-flavored markdown subset -- escape first, then transform inline patterns; handles what we typically see in replaykit release notes: headers, bullets, **bold**, `code`, [text](url), and bare https urls, anything else falls thru as plain text.
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function applyInlineMd(text) {
    // order matters: bold, then code, then [text](url), then bare urls.
    text = text.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    // bare urls -- skip ones already inside an href (cheap check via no preceding =")
    text = text.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return text;
  }
  function renderMarkdown(raw) {
    if (!raw) return "";
    const lines = String(raw).replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let listType = null;          // null | "ul" | "ol"
    let inCodeBlock = false;
    const codeBuf = [];
    const closeList = () => {
      if (listType) { out.push("</" + listType + ">"); listType = null; }
    };
    const openList = (type) => {
      if (listType !== type) { closeList(); out.push("<" + type + ">"); listType = type; }
    };
    for (const rawLine of lines) {
      const line = rawLine.replace(/\s+$/, "");
      // fenced code block: ``` opens / closes. inside the block, content is literal and HTML-escaped only.
      if (/^```/.test(line)) {
        if (inCodeBlock) {
          out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
          codeBuf.length = 0;
          inCodeBlock = false;
        } else {
          closeList();
          inCodeBlock = true;
        }
        continue;
      }
      if (inCodeBlock) { codeBuf.push(rawLine); continue; }
      // horizontal rule: --- or *** on its own line
      if (/^(-{3,}|\*{3,})$/.test(line)) {
        closeList();
        out.push("<hr/>");
        continue;
      }
      // numbered list item: "1. content" / "12) content"
      const ordered = line.match(/^\d+[.)]\s+(.*)$/);
      if (ordered) {
        openList("ol");
        out.push("<li>" + applyInlineMd(escapeHtml(ordered[1])) + "</li>");
        continue;
      }
      // bullet list item: - or *
      const bullet = line.match(/^[-*]\s+(.*)$/);
      if (bullet) {
        openList("ul");
        out.push("<li>" + applyInlineMd(escapeHtml(bullet[1])) + "</li>");
        continue;
      }
      closeList();
      // header (# / ## / ###)
      const header = line.match(/^(#{1,3})\s+(.*)$/);
      if (header) {
        const level = header[1].length + 2; // h3..h5
        out.push("<h" + level + ">" + applyInlineMd(escapeHtml(header[2])) + "</h" + level + ">");
        continue;
      }
      // blank line -- paragraph break
      if (!line) { out.push(""); continue; }
      out.push("<p>" + applyInlineMd(escapeHtml(line)) + "</p>");
    }
    // file ended mid-codeblock: flush what we have so content isnt lost.
    if (inCodeBlock && codeBuf.length) {
      out.push("<pre><code>" + escapeHtml(codeBuf.join("\n")) + "</code></pre>");
    }
    closeList();
    return out.join("\n");
  }
  function showReleaseNotes(raw) {
    const trimmed = (raw || "").trim();
    if (!trimmed) {
      els.notes.classList.remove("is-visible");
      els.notesLabel.classList.remove("is-visible");
      return;
    }
    els.notes.innerHTML = renderMarkdown(trimmed);
    els.notes.classList.add("is-visible");
    els.notesLabel.classList.add("is-visible");
  }

  function styleNativeChrome() {
    fetch(HELPER + "/style-window?title=ReplayKit%20Update&taskbar=1&t=" + Date.now(), { cache:"no-store" }).catch(() => {});
  }
  styleNativeChrome();
  [400, 900, 1800, 3500].forEach((d) => setTimeout(styleNativeChrome, d));

  // one-shot only, not on the retry schedule above -- chromes own --window-size flag on spawn gets silently ignored whenever chrome already had a running instance, so this corrects it for real once the window exists. deliberately not repeated like styleNativeChrome, so it does not fight a user who drags the resize-grip afterward.
  fetch(HELPER + "/window/set-size?title=ReplayKit%20Update&w=700&h=580&t=" + Date.now(), { method:"POST", cache:"no-store" }).catch(() => {});

  function setStatus(text, kind) {
    els.status.textContent = text || "";
    els.status.classList.toggle("good", kind === "good");
    els.status.classList.toggle("bad", kind === "bad");
  }

  function setReleaseLink(value) {
    const fallback = "https://github.com/7Lzz/OBS-ReplayKit/releases/latest";
    let url = fallback;
    try {
      const parsed = new URL(value || fallback);
      if (parsed.protocol === "https:" && parsed.hostname === "github.com" && parsed.pathname.startsWith("/7Lzz/OBS-ReplayKit/releases/")) url = parsed.href;
    } catch (_) {}
    els.releaseLink.href = url;
  }

  async function helperJson(path, options) {
    const res = await fetch(HELPER + "/" + path, {
      cache:"no-store",
      ...(options || {}),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || body.ok === false) {
      const error = new Error(body.message || body.error || ("HTTP " + res.status));
      error.data = body;
      throw error;
    }
    return body;
  }

  function closeWindow() {
    fetch(HELPER + "/close-window?title=ReplayKit%20Update&t=" + Date.now(), {
      method:"POST",
      cache:"no-store",
    }).catch(() => {});
    window.close();
    setTimeout(() => {
      try { window.open("", "_self"); } catch (_) {}
      try { window.close(); } catch (_) {}
    }, 25);
  }

  // keepNotice: a previous attempt's failure is already on screen, so the headline and status stay put and only
  // the version details and the enabled Download button are filled in underneath it.
  async function loadUpdate(keepNotice) {
    els.downloadBtn.disabled = true;
    if (!keepNotice) setStatus("Checking...", "");
    try {
      const data = await helperJson("update/check?t=" + Date.now());
      latest = data;
      setReleaseLink(data.releaseUrl);
      if (!data.updateAvailable) {
        els.title.textContent = "ReplayKit is up to date";
        els.body.textContent = data.message || "No ReplayKit update is available right now.";
        els.meta.textContent = data.installedVersion ? "Installed version: " + data.installedVersion : "";
        setStatus("", "");
        showReleaseNotes("");
        return;
      }
      // prefer the github release name when present (e.g. "ReplayKit 1.0.1 - hotfix"), fall back to the version-only string.
      if (!keepNotice) {
        els.title.textContent = data.releaseName ? data.releaseName : ("ReplayKit " + data.latestVersion + " available");
        els.body.textContent = "ReplayKit " + data.latestVersion + " is ready to install.";
      }
      els.meta.textContent = "Installed: " + data.installedVersion + "  |  Latest: " + data.latestVersion;
      els.downloadBtn.disabled = false;
      if (!keepNotice) setStatus("OBS will restart after the download is verified.", "");
      showReleaseNotes(data.releaseNotes || "");
    } catch (e) {
      els.title.textContent = "Update check failed";
      els.body.textContent = "ReplayKit could not check for updates.";
      els.meta.textContent = "";
      setStatus(e.message || String(e), "bad");
      setReleaseLink(e.data && e.data.releaseUrl);
      showReleaseNotes("");
    }
  }

  function setProgress(percent, message, kind) {
    els.progress.classList.add("is-visible");
    els.progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
    els.progressBar.classList.toggle("is-done",   kind === "done");
    els.progressBar.classList.toggle("is-failed", kind === "failed");
    els.progressStage.textContent = message || "";
    els.progressStage.classList.toggle("is-done",   kind === "done");
    els.progressStage.classList.toggle("is-failed", kind === "failed");
  }

  // after the helper spawns the detached installer it has only seconds to live: the installer taskkills obs, obs death triggers the helpers parent-watchdog and the helper exits. /update/install-result is the installers own verdict, written to disk on its way out and served by whichever helper is up, so it survives that restart -- a connection error just means the install window is in flight. the stage labels below are driven by that, not by timers: the old fixed setTimeout chain would sit on "Copying ReplayKit files..." forever whenever the install died, since it had no way to hear about a failure.
  function watchInstall(onComplete, onFail) {
    let seenHelperDown = false;
    let percent = 80;
    const started = Date.now();
    restartWatchTimer = setInterval(async () => {
      const stop = () => { clearInterval(restartWatchTimer); restartWatchTimer = null; };
      try {
        const r = await fetch(HELPER + "/update/install-result?t=" + Date.now(), { cache:"no-store" });
        if (!r.ok) return;
        const body = await r.json().catch(() => ({}));
        if (body && body.present) {
          setReleaseLink(body.releaseUrl);
          stop();
          if (body.installOk) onComplete();
          else onFail(body.message || "The installer reported a failure.");
          return;
        }
        // helper is answering and has no verdict yet -- the installer is still working, or died before it could write one.
        percent = Math.min(percent + 1, seenHelperDown ? 97 : 88);
        setProgress(percent, seenHelperDown ? "Copying ReplayKit files..." : "Installing update...");
      } catch (_) {
        // connection refused: the helper went down with obs while the installer copies files.
        seenHelperDown = true;
        percent = Math.min(percent + 1, 97);
        setProgress(percent, "Closing OBS to apply files...");
      }
      if (Date.now() - started > 180000) {
        stop();
        onFail("The installer did not finish within 3 minutes. See %TEMP%\\OBSReplayKitUpdate.log");
      }
    }, 1500);
  }

  // every failure path lands here so the bar always ends in a visible failed state with a reason, and the buttons come back for a retry -- a stuck-looking bar is never the end state.
  function failUpdate(message) {
    setProgress(0, "Update failed: " + message, "failed");
    setStatus("", "");
    els.downloadBtn.disabled = !latest || !latest.updateAvailable;
    els.laterBtn.disabled = false;
  }

  async function downloadUpdate() {
    installStarted = true;
    els.downloadBtn.disabled = true;
    els.laterBtn.disabled = true;
    setStatus("", "");
    setProgress(8, "Preparing download...");

    // crawl the bar from ~8% to ~70% while /update/apply is in-flight (download is the slow part and we cant get a real byte count from a single-threaded ps5 helper without restructuring it) -- step is gentle so it doesnt hit 70% before the download actually finishes on a fast network.
    let pulsePercent = 8;
    const pulseTimer = setInterval(() => {
      pulsePercent = Math.min(pulsePercent + 1.5, 68);
      setProgress(pulsePercent, "Downloading installer from GitHub...");
    }, 400);

    try {
      const data = await helperJson("update/apply", { method:"POST" });
      setReleaseLink(data.releaseUrl);
      clearInterval(pulseTimer);
      if (data.updateAvailable === false) {
        setProgress(100, "ReplayKit is already up to date.", "done");
        els.laterBtn.disabled = false;
        return;
      }
      // /update/apply has returned -- download done, hash verified, installer spawned (detached).
      setProgress(80, "Installing update...");
      // wait for the installer to kill obs, copy files, and relaunch obs -- when the new helper is up, finish the bar and close the popup so the user is back in obs cleanly.
      watchInstall(() => {
        setProgress(100, "OBS is back up -- update complete.", "done");
        setTimeout(closeWindow, 1500);
      }, failUpdate);
    } catch (e) {
      clearInterval(pulseTimer);
      setReleaseLink(e.data && e.data.releaseUrl);
      failUpdate(e.message || String(e));
    }
  }

  async function later() {
    const version = (latest && latest.latestVersion) || requestedVersion;
    dismissed = true;
    els.laterBtn.disabled = true;
    els.downloadBtn.disabled = true;
    try {
      if (version) {
        await helperJson("update/later", {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body:JSON.stringify({ version }),
        });
      }
      closeWindow();
    } catch (e) {
      setStatus("Could not dismiss update: " + (e.message || e), "bad");
      els.laterBtn.disabled = false;
      els.downloadBtn.disabled = !latest || !latest.updateAvailable;
    }
  }

  function beginResizeWindow(e) {
    e.preventDefault();
    fetch(HELPER + "/window/resize?title=ReplayKit%20Update&t=" + Date.now(), {
      method:"POST",
      cache:"no-store",
    }).catch(() => {});
  }

  // closing with the title-bar X runs no script, so "Later" and X used to mean different things: Later recorded the
  // dismissal, X left no trace. this makes them equivalent. skipped once an install is under way (dismissing an
  // update you are actually installing is meaningless) and once a button has already settled the outcome.
  window.addEventListener("pagehide", () => {
    if (dismissed || installStarted) return;
    const version = (latest && latest.latestVersion) || requestedVersion;
    if (!version) return;
    dismissed = true;
    // keepalive so the request survives the window going away -- a plain fetch is cancelled on unload.
    try {
      fetch(HELPER + "/update/later", {
        method:"POST", keepalive:true, cache:"no-store",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ version }),
      }).catch(() => {});
    } catch (_) {}
  });

  // a verdict written while no window was open (X'd out mid-install, or the watchdog reported an abort) would
  // otherwise never be seen by anyone. show it, then mark it seen so it is reported exactly once.
  async function showUnseenResult() {
    try {
      const data = await helperJson("update/install-result?t=" + Date.now());
      if (!data.present || data.seen) return false;
      await helperJson("update/install-result/ack", { method:"POST" }).catch(() => {});
      if (data.installOk) {
        els.title.textContent = "Update complete";
        els.body.textContent = data.message || "ReplayKit was updated.";
        setStatus("", "");
        return false;
      }
      els.title.textContent = "The last update did not finish";
      els.body.textContent = data.message || "The update stopped before it was applied.";
      setStatus("You can try again below.", "bad");
      return true;
    } catch (_) { return false; }
  }

  els.downloadBtn.addEventListener("click", downloadUpdate);
  els.laterBtn.addEventListener("click", later);
  els.resizeGrip.addEventListener("pointerdown", beginResizeWindow);
  showUnseenResult().then((failed) => loadUpdate(failed));
</script>
</body>
</html>
